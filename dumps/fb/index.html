<!DOCTYPE html>
<html lang="en">
<head><script src="/js/admin-fetch.js"></script>
<script type="module" src="/features/admin/auth/admin-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tester Feedback - SayBon Business Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Manrope",sans-serif;background:linear-gradient(165deg,#0c1016 0%,#151b26 50%,#1b2230 100%);color:#e6e1d3;min-height:100vh;padding:60px 24px;}
.w{max-width:900px;margin:0 auto;}
.ic{position:fixed;top:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.05);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(212,175,106,.32);display:flex;align-items:center;justify-content:center;color:#d4af6a;cursor:pointer;z-index:5}
.ic svg{width:18px;height:18px}.ic.l{left:16px}.ic.r{right:16px}
.eb{font-size:.76rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#d4af6a;margin-bottom:12px}
h1{font-family:"Fraunces",serif;font-weight:600;font-size:clamp(1.9rem,5vw,2.6rem);color:#f6f1e4;margin-bottom:8px}
.sub{color:#8b92a3;font-size:.92rem;margin-bottom:28px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.st{background:rgba(255,255,255,.025);border:1px solid rgba(212,175,106,.16);border-radius:16px;padding:16px}
.st b{display:block;font-family:"Fraunces",serif;font-size:1.6rem;color:#d4af6a}.st span{font-size:.78rem;color:#8b92a3}
.bar{display:flex;gap:8px;margin-bottom:16px}
.bar button{background:none;border:1px solid rgba(212,175,106,.3);color:#ddd;border-radius:999px;padding:8px 16px;font:700 .78rem Manrope;cursor:pointer}
.bar button.on{background:linear-gradient(180deg,#e8c98a,#d4af6a);color:#1c1408;border-color:transparent}
.c{background:rgba(255,255,255,.025);border:1px solid rgba(212,175,106,.16);border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 14px 30px rgba(0,0,0,.25)}
.c.rev{opacity:.5}
.h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.h b{font-family:"Fraunces",serif;font-size:1.1rem;color:#f6f1e4}.h small{color:#8b92a3}
.r{font-size:.86rem;line-height:1.55;margin:5px 0}.r em{color:#8b92a3;font-style:normal}
.a{margin-top:12px;display:flex;gap:8px}
.a button{background:none;border:1px solid rgba(212,175,106,.28);color:#d9d3c2;border-radius:10px;padding:6px 13px;font:700 .76rem Manrope;cursor:pointer}
</style></head><body>
<button class="ic l" onclick="location.href='../'" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
<button class="ic r" onclick="location.href='/dashboard/'" aria-label="Dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
<div class="w"><p class="eb">SayBon</p>
<h1>Tester Feedback</h1><p class="sub">What testers said, page by page.</p>
<div class="stats" id="st"></div>
<div class="bar"><button id="f0" class="on">New</button><button id="f1">All</button></div>
<div id="list"><p class="sub">Loading…</p></div></div>
<script type="module">
import { auth } from "/js/firebase-init.js";
var API="https://saybonapp-server.onrender.com";var rows=[],filt=0;
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
async function tok(){return await auth.currentUser.getIdToken()}
async function load(){
 try{var r=await fetch(API+"/api/adminTesterFeedback",{headers:{Authorization:"Bearer "+await tok()}});var d=await r.json();rows=d.items||[];draw()}
 catch(e){document.getElementById("list").innerHTML='<p class="sub">Could not load. Render may be waking up; refresh in a moment.</p>'}
}
function avg(k){var v=rows.map(function(x){return +(x.answers||{})[k]}).filter(Boolean);return v.length?(v.reduce(function(a,b){return a+b},0)/v.length).toFixed(1):"–"}
function cnt(f){return rows.filter(f).length}
var L=[["found","Heard via"],["start_r","Start pages"],["start_clear","Clear next step"],["start_n","Start improve"],["start_t","Start notes"],["pl_done","How the test ended"],["pl_r","Placement"],["pl_len","Test length"],["pl_q","Questions felt"],["pl_aud","Listening/picture"],["pl_mic","Speaking question"],["pl_feel","Teacher message"],["pl_n","Placement improve"],["pl_t","Placement notes"],["lv_fit","Level fit"],["lv_r","Level page"],["lv_n","Level improve"],["lv_t","Level notes"],["ls_tried","Tried"],["ls_r","Lesson"],["ls_what","Worked"],["ls_voice","Voice"],["ls_mic","Microphone"],["ls_diff","Difficulty"],["ls_n","Lesson improve"],["ls_t","Lesson notes"],["tk_r","Talkletics"],["lib_r","Library"],["pg_n","Needs most work"],["bug","Problems"],["bug_t","Problem details"],["mo","Wanted to continue"],["stop","Held back by"],["first","Change first"],["mo_n","In their words"],["french","French level"],["device","Device"]];
function draw(){
 document.getElementById("st").innerHTML=[["Responses",rows.length],["Lesson ★",avg("ls_r")],["Placement ★",avg("pl_r")],["Wanted more",cnt(function(x){return (x.answers||{}).mo=="I want more, it was interesting"})],["Stopped early",cnt(function(x){return (x.answers||{}).mo=="I wanted to stop"})]].map(function(s){return '<div class="st"><b>'+s[1]+'</b><span>'+s[0]+'</span></div>'}).join("");
 var v=rows.filter(function(x){return filt?true:!x.reviewed});
 document.getElementById("list").innerHTML=v.length?v.map(function(x){var a=x.answers||{};
  var h='<div class="c'+(x.reviewed?' rev':'')+'"><div class="h"><b>'+esc(a.name||"Anonymous")+'</b><small>'+esc(x.created||"")+' · '+esc(a.device||"")+'</small></div>';
  L.forEach(function(p){var val=a[p[0]];if(Array.isArray(val))val=val.join(", ");if(val&&val!==0){if(/_r$/.test(p[0]))val=val+" / 5";h+='<div class="r"><em>'+p[1]+':</em> '+esc(val)+'</div>'}});
  h+='<div class="a"><button data-r="'+x.id+'">'+(x.reviewed?'Mark new':'Mark reviewed')+'</button><button data-d="'+x.id+'">Delete</button></div></div>';return h}).join(""):'<p class="sub">Nothing here yet.</p>';
 document.querySelectorAll("[data-r]").forEach(function(b){b.onclick=async function(){var it=rows.find(function(z){return z.id==b.dataset.r});it.reviewed=!it.reviewed;draw();await fetch(API+"/api/adminTesterFeedbackUpdate",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+await tok()},body:JSON.stringify({id:it.id,reviewed:it.reviewed})})}});
 document.querySelectorAll("[data-d]").forEach(function(b){b.onclick=async function(){if(!confirm("Delete this response?"))return;rows=rows.filter(function(z){return z.id!=b.dataset.d});draw();await fetch(API+"/api/adminTesterFeedbackDelete",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+await tok()},body:JSON.stringify({id:b.dataset.d})})}});
}
document.getElementById("f0").onclick=function(){filt=0;this.className="on";document.getElementById("f1").className="";draw()};
document.getElementById("f1").onclick=function(){filt=1;this.className="on";document.getElementById("f0").className="";draw()};
window.addEventListener("adminAuthorized",load);
</script>
</body>
</html>
