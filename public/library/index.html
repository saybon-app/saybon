<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SayBon Library</title>
<style>
:root{--ink:#0B3D2A;--em:#138A43;--em2:#0F6E37;--gold:#C9A24A;--mint:#E3F5EB;--mut:#45695A;--line:rgba(11,61,42,.14);--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);overflow:hidden;background:#cfe7d9}
.bg{position:fixed;inset:0;background:#cfe7d9 url(/library/bg.jpg) center/cover no-repeat;transform:scale(1.04);animation:bgIn 1.6s var(--ease) both}
.veil{position:fixed;inset:0;background:linear-gradient(100deg,rgba(227,245,235,.9) 0%,rgba(227,245,235,.62) 36%,rgba(227,245,235,.06) 70%),linear-gradient(0deg,rgba(224,244,233,.96) 0%,rgba(224,244,233,.78) 34%,rgba(224,244,233,0) 58%)}
@keyframes bgIn{from{opacity:0;transform:scale(1.1)}to{opacity:1;transform:scale(1.04)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.app{position:relative;z-index:2;height:100vh;height:100dvh;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr)}
.top{display:flex;align-items:center;gap:16px;padding:16px 4vw;animation:rise .8s var(--ease) both}
.logo{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit}
.sb{position:relative;line-height:1}.sb b{font-size:27px;font-weight:900;letter-spacing:-.02em;color:#111}
.sb small{display:block;font-size:11px;font-weight:700;font-style:italic;margin-top:2px;color:#2b3a33}
.sb svg{position:absolute;right:-13px;top:-7px;width:16px;height:16px}
.dv{width:1.5px;height:34px;background:rgba(11,61,42,.4)}
.lb{display:flex;align-items:center;gap:8px;font-weight:900;font-size:22px;color:var(--ink)}.lb svg{width:30px;height:26px}
.tr{margin-left:auto;display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:8px;font:inherit;font-weight:800;font-size:14px;color:var(--ink);background:rgba(255,255,255,.55);border:1.5px solid rgba(255,255,255,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:9px 16px;cursor:pointer;text-decoration:none;transition:all .2s var(--ease)}
.pill:hover{background:#fff;transform:translateY(-1px)}
.pill.on{background:var(--em);color:#fff;border-color:var(--em)}
.pill svg{width:18px;height:18px}
#adm{display:none}
.mid{min-width:0;display:flex;flex-direction:column;justify-content:center;padding:0 4vw;min-height:0}
.eb{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--em2);animation:rise .8s .08s var(--ease) both}
.eb i{display:block;width:34px;height:2px;background:var(--gold)}
h1{font-family:Georgia,"Palatino Linotype","Times New Roman",serif;font-weight:600;font-size:clamp(34px,4.6vw,64px);line-height:1.04;letter-spacing:-.02em;margin:12px 0 10px;animation:rise .9s .14s var(--ease) both}
h1 em{font-style:italic;color:var(--em)}
.sub{font-size:clamp(14px,1.25vw,17px);font-weight:600;color:var(--mut);max-width:460px;line-height:1.5;animation:rise .9s .2s var(--ease) both}
.tools{display:flex;flex-wrap:wrap;gap:10px 12px;margin-top:20px;align-items:center;animation:rise .9s .26s var(--ease) both}
.find{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.82);border:1.5px solid rgba(255,255,255,.95);border-radius:999px;padding:3px 16px;box-shadow:0 8px 22px rgba(11,61,42,.12);min-width:min(300px,100%)}
.find svg{width:18px;height:18px;flex:0 0 auto}
.find input{border:0;outline:0;background:none;font:inherit;font-weight:700;font-size:14.5px;color:var(--ink);padding:10px 0;width:100%}
.find input::placeholder{color:#7a9a8a}
.seg{display:inline-flex;background:rgba(255,255,255,.55);border:1.5px solid rgba(255,255,255,.85);border-radius:999px;padding:3px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.seg button{font:inherit;font-weight:800;font-size:13px;color:var(--ink);background:none;border:0;border-radius:999px;padding:7px 12px;cursor:pointer;transition:all .2s var(--ease);white-space:nowrap}
.seg button:hover{background:rgba(255,255,255,.8)}
.seg button.on{background:var(--ink);color:#fff}
select.pill{appearance:none;-webkit-appearance:none;padding-right:14px}
.band{padding:6px 0 22px;position:relative;animation:rise 1s .32s var(--ease) both}
.bh{display:flex;align-items:baseline;gap:12px;padding:0 4vw 10px}
.bh b{font-size:14px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--em2)}
.bh span{font-size:13px;font-weight:700;color:var(--mut)}
.rail{display:flex;gap:calc(var(--cw)*.14);overflow-x:auto;scroll-snap-type:x proximity;padding:14px 4vw 14px;scrollbar-width:none;-ms-overflow-style:none;scroll-behavior:smooth;scroll-padding-left:4vw}
.rail::-webkit-scrollbar{display:none}
:root{--cw:clamp(104px,17vh,164px)}
.bk{flex:0 0 var(--cw);width:var(--cw);scroll-snap-align:start;text-decoration:none;color:inherit;animation:rise .8s var(--ease) both;transform-origin:left center}
.cv{position:relative;aspect-ratio:2/3;border-radius:3px 9px 9px 3px;overflow:hidden;box-shadow:0 18px 28px -10px rgba(11,61,42,.5),0 4px 8px rgba(11,61,42,.2);transition:transform .45s var(--ease),box-shadow .45s var(--ease)}
.bk:hover .cv{transform:perspective(700px) rotateY(-14deg) translateY(-8px) translateX(4px);box-shadow:22px 26px 34px -12px rgba(11,61,42,.55)}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv:before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:linear-gradient(90deg,rgba(0,0,0,.4),rgba(255,255,255,.14) 55%,transparent);z-index:2}
.cv:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.22),transparent 40%);z-index:2;pointer-events:none}
.gn{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:14px 12px 14px 18px;font-family:Georgia,serif;color:#f6efd8}
.gn b{font-size:calc(var(--cw)*.115);line-height:1.2;font-weight:600}.gn i{display:block;width:26px;height:1.5px;background:var(--gold);margin:9px 0}.gn span{font-size:calc(var(--cw)*.07);opacity:.82;letter-spacing:.06em;text-transform:uppercase;font-family:"Nunito",sans-serif;font-weight:700}
.tg{position:absolute;right:5px;top:5px;display:flex;flex-direction:column;gap:3px;z-index:3;align-items:flex-end}
.tg span{background:rgba(255,255,255,.93);color:var(--ink);font-size:10px;font-weight:900;border-radius:6px;padding:2px 6px;letter-spacing:.03em}
.tg span.lv{background:var(--em);color:#fff}
.cont{position:absolute;left:0;right:0;bottom:0;z-index:3;background:linear-gradient(0deg,rgba(11,61,42,.92),rgba(11,61,42,0));color:#fff;font-size:10.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:18px 8px 7px;text-align:center}
.tt{font-weight:800;font-size:13.5px;margin-top:11px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.au{font-size:12px;font-weight:700;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar{position:absolute;top:50%;z-index:5;width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(255,255,255,.9);background:rgba(255,255,255,.8);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;display:grid;place-items:center;box-shadow:0 8px 20px rgba(11,61,42,.2);transition:all .2s var(--ease)}
.ar:hover{background:#fff;transform:scale(1.07)}.ar svg{width:20px;height:20px}
.ar.l{left:1.4vw}.ar.r{right:1.4vw}.ar[hidden]{display:none}
.empty{padding:6px 4vw 10px;display:flex;gap:18px;align-items:center}
.ghost{flex:0 0 var(--cw);aspect-ratio:2/3;border-radius:3px 9px 9px 3px;border:2px dashed rgba(11,61,42,.22);background:rgba(255,255,255,.35)}
.em{font-weight:700;color:var(--mut);max-width:380px;line-height:1.5}.em b{display:block;font-family:Georgia,serif;font-size:22px;color:var(--ink);font-weight:600;margin-bottom:4px}
@media(max-width:760px){
 .top{padding:12px 16px;gap:8px}.logo{gap:9px}.sb small{white-space:nowrap;font-size:9px}.sb b{font-size:22px}.sb small{font-size:9.5px}.dv{height:28px}.lb{font-size:18px}.lb svg{width:24px;height:20px}
 .pill span{display:none}.pill{padding:9px 11px}
 .mid{padding:0 16px;justify-content:flex-start;padding-top:6px}.sub{display:none}.tools{margin-top:12px;gap:8px}
 .find{min-width:100%}.seg{max-width:100%;overflow-x:auto}.seg button{padding:7px 10px;font-size:12.5px}
 .bh{padding:0 16px 6px}.rail{padding:10px 16px 12px}.ar{display:none}
 :root{--cw:clamp(96px,15vh,130px)}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg"></div><div class="veil"></div>
<div class="app">
<header class="top">
<a class="logo" href="/dashboard/" title="Back to the dashboard">
<span class="sb"><b>SayBon</b><svg viewBox="0 0 24 24" fill="none" stroke="#C9A24A" stroke-width="2.8" stroke-linecap="round"><path d="M12 2v5M4 6l3.2 3.2M21 5l-3.4 3.6M22 12h-4"/></svg><small>your easy French buddy</small></span>
<span class="dv"></span>
<span class="lb"><svg viewBox="0 0 44 36" fill="none"><path d="M22 7C17 3 9 3 3 5v26c6-2 14-2 19 2 5-4 13-4 19-2V5c-6-2-14-2-19 2z" fill="#138A43" stroke="#0B3D2A" stroke-width="2.4" stroke-linejoin="round"/><path d="M22 7v26" stroke="#0B3D2A" stroke-width="2.4"/></svg>Library</span>
</a>
<div class="tr">
<a class="pill" id="adm" href="/library/admin.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span>Manage books</span></a>
<button class="pill" id="my" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20.5S3 15 3 8.8C3 6 5.2 4 7.8 4c1.7 0 3.3.9 4.2 2.4C12.9 4.9 14.5 4 16.2 4 18.8 4 21 6 21 8.8c0 6.2-9 11.7-9 11.7z"/></svg><span>My Library</span></button>
<a class="pill" href="/dashboard/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg><span>Dashboard</span></a>
</div>
</header>

<main class="mid">
<div class="eb"><i></i>Read in French</div>
<h1>The SayBon <em>Library</em></h1>
<p class="sub">Original stories and books, from your very first words to fluent reading. Choose your level and turn the page.</p>
<div class="tools">
<label class="find"><svg viewBox="0 0 24 24" fill="none" stroke="#138A43" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg><input id="q" type="search" placeholder="Search title or author" autocomplete="off"></label>
<div class="seg" id="lv"><button type="button" class="on" data-v="">All levels</button><button type="button" data-v="A0">A0</button><button type="button" data-v="A1">A1</button><button type="button" data-v="A2">A2</button><button type="button" data-v="B1">B1</button><button type="button" data-v="B2">B2</button><button type="button" data-v="C1">C1</button><button type="button" data-v="C2">C2</button></div>
<div class="seg" id="fm"><button type="button" class="on" data-v="">All</button><button type="button" data-v="bilingual">Bilingual</button><button type="button" data-v="french">French only</button></div>
<select class="pill" id="gn" aria-label="Genre"><option value="">All genres</option></select>
</div>
</main>

<section class="band">
<div class="bh"><b id="bt">On the shelf</b><span id="bc"></span></div>
<button class="ar l" id="al" type="button" aria-label="Scroll left" hidden><svg viewBox="0 0 24 24" fill="none" stroke="#0B3D2A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
<button class="ar r" id="ar" type="button" aria-label="Scroll right" hidden><svg viewBox="0 0 24 24" fill="none" stroke="#0B3D2A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
<div class="rail" id="rail"></div>
</section>
</div>

<script type="module">
import { auth } from "/js/firebase-init.js";
import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
const db = getFirestore(auth.app), $ = x => document.getElementById(x);
const ADMINS = ["adlaideduah@gmail.com","saybon.fr@gmail.com"];
onAuthStateChanged(auth, u => { if (u && u.email && ADMINS.indexOf(u.email) > -1) $("adm").style.display = "inline-flex"; });
const LV = ["A0","A1","A2","B1","B2","C1","C2"];
const TONES = [["#1d5c45","#0f3a2c"],["#1f6f78","#12444b"],["#7a2a3c","#481a25"],["#26396b","#16213f"],["#8a6a1f","#55400f"],["#5a2f6b","#35193f"]];
let books = [], st = { lv: "", fm: "", gn: "", q: "", mine: false };
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const started = b => LS("sbLib:" + b.id) !== null && LS("sbLib:" + b.id + ":done") !== "1";
const tone = t => { let h = 0; for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) >>> 0; return TONES[h % TONES.length]; };
function card(b, i){
  const tn = tone(b.title || "");
  const cov = b.cover ? '<img src="'+esc(b.cover)+'" alt="">' : '<div class="gn" style="background:linear-gradient(150deg,'+tn[0]+','+tn[1]+')"><b>'+esc(b.title)+'</b><i></i><span>'+esc(b.author||"")+'</span></div>';
  return '<a class="bk" style="animation-delay:'+(0.38+i*0.06)+'s" href="/library/read.html?b='+encodeURIComponent(b.id)+'"><div class="cv">'+cov+'<div class="tg"><span class="lv">'+esc(b.level||"")+'</span><span>'+(b.format==="bilingual"?"FR + EN":"FR")+'</span></div>'+(started(b)?'<div class="cont">Continue</div>':'')+'</div><div class="tt">'+esc(b.title)+'</div><div class="au">'+esc(b.author||"")+(b.genre?" \u00b7 "+esc(b.genre):"")+'</div></a>';
}
function arrows(){
  const r = $("rail"), more = r.scrollWidth > r.clientWidth + 8;
  $("al").hidden = !more || r.scrollLeft < 10;
  $("ar").hidden = !more || r.scrollLeft + r.clientWidth > r.scrollWidth - 10;
}
function render(){
  const q = st.q.trim().toLowerCase();
  const list = books.filter(b => (!st.mine || started(b) || LS("sbLib:" + b.id) !== null) && (!st.gn || b.genre === st.gn) && (!st.lv || b.level === st.lv) && (!st.fm || b.format === st.fm) && (!q || (b.title + " " + (b.author || "")).toLowerCase().indexOf(q) > -1));
  list.sort((a, b) => (started(b) ? 1 : 0) - (started(a) ? 1 : 0));
  $("bt").textContent = st.mine ? "My Library" : "On the shelf";
  $("bc").textContent = books.length ? list.length + (list.length === 1 ? " book" : " books") : "";
  const rail = $("rail");
  rail.style.scrollBehavior = "auto"; rail.scrollLeft = 0; rail.style.scrollBehavior = "";
  if (!books.length) {
    rail.innerHTML = '<div class="empty"><div class="ghost"></div><div class="ghost"></div><div class="ghost"></div><div class="em"><b>The first stories are on their way</b>New original books will appear on this shelf. Check back soon.</div></div>';
  } else if (!list.length) {
    rail.innerHTML = '<div class="empty"><div class="em"><b>' + (st.mine ? "Nothing here yet" : "No books match") + '</b>' + (st.mine ? "Books you start reading will be kept here." : "Try another level, format or genre.") + '</div></div>';
  } else rail.innerHTML = list.map(card).join("");
  setTimeout(arrows, 60);
}
function seg(id, key){ $(id).addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; st[key] = b.getAttribute("data-v"); Array.from($(id).children).forEach(x => x.classList.toggle("on", x === b)); render(); }); }
seg("lv", "lv"); seg("fm", "fm");
$("q").addEventListener("input", e => { st.q = e.target.value; render(); });
$("gn").addEventListener("change", e => { st.gn = e.target.value; render(); });
$("my").addEventListener("click", () => { st.mine = !st.mine; $("my").classList.toggle("on", st.mine); render(); });
$("al").onclick = () => $("rail").scrollBy({ left: -$("rail").clientWidth * .8, behavior: "smooth" });
$("ar").onclick = () => $("rail").scrollBy({ left: $("rail").clientWidth * .8, behavior: "smooth" });
$("rail").addEventListener("scroll", arrows, { passive: true });
window.addEventListener("resize", arrows);
$("rail").addEventListener("wheel", e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { $("rail").scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });
(async function(){
  try {
    const snap = await getDocs(query(collection(db, "libraryBooks"), where("published", "==", true)));
    books = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    books.sort((a, b) => LV.indexOf(a.level) - LV.indexOf(b.level) || (b.createdAt || 0) - (a.createdAt || 0));
    const gs = Array.from(new Set(books.map(b => b.genre).filter(Boolean))).sort();
    $("gn").innerHTML = '<option value="">All genres</option>' + gs.map(g => '<option value="'+esc(g)+'">'+esc(g)+'</option>').join("");
  } catch (e) { $("rail").innerHTML = '<div class="empty"><div class="em"><b>Could not load the library</b>Please refresh the page.</div></div>'; return; }
  render();
})();
</script>
</body>
</html>
