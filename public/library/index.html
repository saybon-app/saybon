<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SayBon Library</title>
<style>
:root{--ink:#F4F1E6;--gold:#E3B54B;--mut:#A9C9B8;--deep:#01301f;--ease:cubic-bezier(.22,1,.36,1);--soft:cubic-bezier(.33,.0,.2,1);--edge:max(6vw,calc((100vw - 1000px)/2))}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);overflow:hidden;background:var(--deep)}
.bg{position:fixed;left:0;bottom:0;width:100vw;height:56.28vw;background:url(/library/bg-desktop.webp) center/100% 100% no-repeat;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 14%);mask-image:linear-gradient(180deg,transparent 0,#000 14%);animation:bgIn 2.2s var(--soft) both}
@keyframes bgIn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.app{position:relative;z-index:2;height:100vh;height:100dvh;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);transition:opacity .7s var(--soft),transform .7s var(--soft)}
.app.leaving{opacity:0;transform:scale(1.025)}
.top{padding:3.2vh var(--edge) 0;display:flex;align-items:center;justify-content:space-between;gap:14px;animation:rise 1.1s var(--ease) both}
.tr{display:flex;align-items:center;gap:clamp(18px,2.6vw,38px)}
.nl{display:inline-flex;align-items:center;gap:10px;font:inherit;font-weight:600;font-size:clamp(14px,1.15vw,17px);color:#fff;background:none;border:0;cursor:pointer;text-decoration:none;padding:6px 0;transition:color .5s var(--soft),transform .7s var(--ease)}
.nl svg{width:26px;height:26px;flex:0 0 auto}.nl:hover{transform:translateY(-2px)}.nl.on{color:var(--gold)}
.logo{display:inline-block;line-height:0}
.logo img{height:clamp(38px,6.2vh,56px);width:auto;display:block}
.mid{min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 5vw;min-height:0}
.hd{display:block;height:clamp(66px,15vh,134px);width:auto;max-width:92vw;animation:rise 1.2s .12s var(--ease) both}
.tools{display:flex;align-items:center;gap:12px;background:#F5F1E4;border-radius:999px;padding:8px 10px 8px 26px;width:min(1000px,100%);margin-top:clamp(14px,3.2vh,30px);box-shadow:0 18px 40px rgba(0,0,0,.26);animation:rise 1.2s .3s var(--ease) both}
.find{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.find svg{width:22px;height:22px;flex:0 0 auto}
.find input{border:0;outline:0;background:none;font:inherit;font-weight:600;font-size:16px;color:#17372b;padding:12px 0;width:100%;min-width:0}
.find input::placeholder{color:#7d8f85}
.sep{width:1.5px;height:30px;background:rgba(23,55,43,.18)}
.clr{display:none}
.chip{position:relative;display:inline-flex;align-items:center;gap:8px;border:1.5px solid rgba(23,55,43,.34);border-radius:999px;padding:0 12px 0 14px;color:#17372b;background:rgba(255,255,255,.35);height:46px;flex:0 0 auto;transition:background .5s var(--soft),border-color .5s var(--soft)}
.chip:hover{background:#fff}.chip svg{width:19px;height:19px;flex:0 0 auto;pointer-events:none}
.chip select{appearance:none;-webkit-appearance:none;border:0;outline:0;background:none;font:inherit;font-weight:700;font-size:15px;color:#17372b;padding:0 18px 0 0;cursor:pointer;height:100%;min-width:0}
.chip:after{content:"";position:absolute;right:13px;top:50%;width:6px;height:6px;border-right:2px solid #17372b;border-bottom:2px solid #17372b;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.band{padding:0 0 3.4vh;position:relative;animation:rise 1.3s .42s var(--ease) both}
.bh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 var(--edge)}
.bh b{font-size:clamp(20px,2.2vw,30px);font-weight:800;color:#fff;padding-left:14px;border-left:4px solid var(--gold);line-height:1.1}
.sv{display:inline-flex;align-items:center;gap:8px;font:inherit;font-weight:700;font-size:clamp(14px,1.2vw,17px);color:#fff;background:none;border:0;cursor:pointer;padding:6px 0;transition:color .5s var(--soft)}
.sv svg{width:18px;height:18px;transition:transform .6s var(--ease)}.sv:hover svg{transform:translateX(4px)}.sv.on{color:var(--gold)}
.rail{display:flex;gap:calc(var(--cw)*.13);overflow-x:auto;scroll-snap-type:x proximity;padding:clamp(12px,2.2vh,22px) var(--edge) 10px;scrollbar-width:none;-ms-overflow-style:none;scroll-behavior:smooth;scroll-padding-left:var(--edge)}
.rail::-webkit-scrollbar{display:none}
:root{--cw:clamp(110px,27vh,260px)}
.bk{flex:0 0 var(--cw);width:var(--cw);scroll-snap-align:start;text-decoration:none;color:inherit;animation:rise 1.1s var(--ease) both;-webkit-tap-highlight-color:transparent}
.cv{position:relative;aspect-ratio:3/4;border-radius:18px;overflow:hidden;border:1.5px solid rgba(255,255,255,.55);background:#0b3a29;box-shadow:0 16px 34px -10px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06);transition:transform .9s var(--ease),box-shadow .9s var(--ease),border-color .9s var(--soft)}
.cv img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.1s var(--ease)}
.cv:after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,0) 38%,rgba(255,255,255,0) 70%,rgba(255,255,255,.07));pointer-events:none}
.bk:hover .cv{transform:translateY(-8px);border-color:rgba(255,255,255,.85);box-shadow:0 30px 46px -14px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.1)}
.bk:hover .cv img{transform:scale(1.035)}
.bk:active .cv{transform:translateY(-3px) scale(.985);transition-duration:.5s}
.bk.pick .cv{transform:translateY(-14px) scale(1.06);box-shadow:0 40px 60px -16px rgba(0,0,0,.75);transition-duration:.9s}
.lvl{margin-top:11px;text-align:center;font-size:13px;font-weight:800;letter-spacing:.14em;color:var(--mut)}
.gn{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:14px;font-family:Georgia,serif;color:#f6efd8}
.gn b{font-size:calc(var(--cw)*.115);line-height:1.2;font-weight:600}.gn i{display:block;width:26px;height:1.5px;background:var(--gold);margin:9px 0}.gn span{font-size:calc(var(--cw)*.07);opacity:.82;letter-spacing:.06em;text-transform:uppercase;font-family:"Nunito",sans-serif;font-weight:700}
.ar{position:absolute;top:50%;z-index:5;width:46px;height:46px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);background:rgba(6,40,28,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;display:grid;place-items:center;transition:all .5s var(--soft)}
.ar:hover{background:rgba(6,40,28,.95);transform:scale(1.07)}.ar svg{width:20px;height:20px}
.ar.l{left:1.6vw}.ar.r{right:1.6vw}.ar[hidden]{display:none}
.empty{padding:6px 0 10px;display:flex;gap:18px;align-items:center}
.ghost{flex:0 0 var(--cw);aspect-ratio:3/4;border-radius:18px;border:1.5px dashed rgba(255,255,255,.28);background:rgba(255,255,255,.06)}
.em{font-weight:700;color:var(--mut);max-width:380px;line-height:1.5}.em b{display:block;font-family:Georgia,serif;font-size:22px;color:#fff;font-weight:600;margin-bottom:4px}
@media(max-width:760px){
 .bg{inset:0;width:auto;height:auto;background:url(/library/bg-mobile.webp) center/cover no-repeat;-webkit-mask-image:none;mask-image:none}
 .top{padding:3.4vh 20px 0}
 .tr{gap:10px}.nl{width:46px;height:46px;border-radius:50%;background:#F5F1E4;color:#0b3d2a;justify-content:center;padding:0;box-shadow:0 8px 18px rgba(0,0,0,.25)}.nl span{display:none}.nl svg{width:24px;height:24px}.nl.on{background:var(--gold);color:#2b1f00}.logo img{height:auto;width:min(200px,54vw)}
 .mid{align-items:flex-start;text-align:left;padding:0 20px;justify-content:flex-start;padding-top:3.4vh}
 .hd{height:auto;width:min(300px,76vw)}
 .tools{flex-wrap:wrap;background:none;box-shadow:none;padding:0;gap:10px;margin-top:2.4vh}
 .find{flex:1 0 100%;background:#F5F1E4;border-radius:999px;padding:0 8px 0 18px;box-shadow:0 14px 30px rgba(0,0,0,.28)}
 .sep{display:none}
 .clr{display:grid;place-items:center;width:40px;height:40px;border:0;background:none;border-left:1.5px solid rgba(23,55,43,.18);border-radius:0;cursor:pointer;margin-left:6px;padding-left:4px}.clr svg{width:24px;height:24px}
 .chip{height:42px;flex:1 1 0;min-width:0;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.42);color:#fff;padding:0 8px 0 10px;gap:6px}
 .chip select{color:#fff;font-size:13.5px;width:100%;padding-right:12px}.chip select option{color:#17372b}.chip:after{border-color:#fff;right:9px;width:5px;height:5px}
 .chip svg{width:16px;height:16px}
 .bh{padding:0 20px}.rail{padding:12px 20px 10px;scroll-padding-left:20px}.ar{display:none}
 :root{--cw:clamp(104px,21vh,170px)}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="app" id="app">
<header class="top">
<a class="logo" href="/dashboard/" title="Dashboard"><picture><source media="(max-width:760px)" srcset="/library/lock-mobile.webp"><img src="/library/lock-desktop.webp" alt="SayBon Library"></picture></a>
<nav class="tr"><a class="nl" href="/dashboard/" aria-label="Dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.2L12 3.5l9 7.7"/><path d="M5.3 9.6V20.5h13.4V9.6"/><path d="M10 20.5v-6h4v6"/></svg><span>Dashboard</span></a><button class="nl" id="hsv" type="button" aria-label="Saved Books"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M6 3.5h12v17.2l-6-4.6-6 4.6z"/></svg><span>Saved Books</span></button></nav>
</header>

<main class="mid">
<picture><source media="(max-width:760px)" srcset="/library/head-mobile.webp"><img class="hd" src="/library/head-desktop.webp" alt="The SayBon Library - read in French"></picture>
<div class="tools">
<label class="find"><svg viewBox="0 0 24 24" fill="none" stroke="#17372b" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg><input id="q" type="search" placeholder="Search books..." autocomplete="off"><button class="clr" id="clr" type="button" aria-label="Clear filters"><svg viewBox="0 0 24 24" fill="none" stroke="#17372b" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button></label>
<span class="sep"></span>
<label class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 3l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5M3 16.5L12 21l9-4.5"/></svg><select id="lv" aria-label="Level"><option value="">Level</option><option>A0</option><option>A1</option><option>A2</option><option>B1</option><option>B2</option><option>C1</option><option>C2</option></select></label>
<label class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.2"/></svg><select id="gn" aria-label="Genre"><option value="">Genre</option></select></label>
<label class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 6C9.5 4 6 4 3 5v14c3-1 6.5-1 9 1 2.5-2 6-2 9-1V5c-3-1-6.5-1-9 1z"/><path d="M12 6v14"/></svg><select id="fm" aria-label="Format"><option value="">Format</option><option value="bilingual">Bilingual</option><option value="french">French only</option></select></label>
</div>
</main>

<section class="band">
<div class="bh"><b>My Library</b><button class="sv" id="my" type="button"><span id="svt">Saved Books</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button></div>
<button class="ar l" id="al" type="button" aria-label="Scroll left" hidden><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
<button class="ar r" id="ar" type="button" aria-label="Scroll right" hidden><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
<div class="rail" id="rail"></div>
</section>
</div>
<script src="/library/books.js"></script>
<script type="module">
import { auth } from "/js/firebase-init.js";
import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const db = getFirestore(auth.app), $ = x => document.getElementById(x);
const LV = ["A0","A1","A2","B1","B2","C1","C2"];
const TONES = [["#1d5c45","#0f3a2c"],["#1f6f78","#12444b"],["#7a2a3c","#481a25"],["#26396b","#16213f"],["#8a6a1f","#55400f"],["#5a2f6b","#35193f"]];
let books = [], st = { lv: "", fm: "", gn: "", q: "", mine: false };
const CODE = (window.SB_BOOKS || []).filter(b => b && b.id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const started = b => LS("sbLib:" + b.id) !== null && LS("sbLib:" + b.id + ":done") !== "1";
const tone = t => { let h = 0; for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) >>> 0; return TONES[h % TONES.length]; };
function card(b, i){
  const tn = tone(b.title || "");
  const cov = b.cover ? '<img src="'+esc(b.cover)+'" alt="'+esc(b.title)+'">' : '<div class="gn" style="background:linear-gradient(150deg,'+tn[0]+','+tn[1]+')"><b>'+esc(b.title)+'</b><i></i><span>'+esc(b.author||"")+'</span></div>';
  return '<a class="bk" aria-label="'+esc(b.title)+'" style="animation-delay:'+(0.5+i*0.09)+'s" href="/library/read.html?b='+encodeURIComponent(b.id)+'"><div class="cv">'+cov+'</div><div class="lvl">'+esc(b.level||"")+'</div></a>';
}
function arrows(){
  const r = $("rail"), more = r.scrollWidth > r.clientWidth + 8;
  $("al").hidden = !more || r.scrollLeft < 10;
  $("ar").hidden = !more || r.scrollLeft + r.clientWidth > r.scrollWidth - 10;
}
function render(){
  const q = st.q.trim().toLowerCase();
  const list = books.filter(b => (!st.mine || started(b) || LS("sbLib:" + b.id) !== null) && (!st.gn || b.genre === st.gn) && (!st.lv || b.level === st.lv) && (!st.fm || b.format === st.fm) && (!q || (b.title + " " + (b.author || "")).toLowerCase().indexOf(q) > -1));
  list.sort((a, b) => (started(b) ? 1 : 0) - (started(a) ? 1 : 0));
  $("svt").textContent = st.mine ? "All Books" : "Saved Books";
  const rail = $("rail");
  rail.style.scrollBehavior = "auto"; rail.scrollLeft = 0; rail.style.scrollBehavior = "";
  if (!books.length) {
    rail.innerHTML = '<div class="empty"><div class="ghost"></div><div class="ghost"></div><div class="ghost"></div><div class="em"><b>The first stories are on their way</b>New original books will appear on this shelf. Check back soon.</div></div>';
  } else if (!list.length) {
    rail.innerHTML = '<div class="empty"><div class="em"><b>' + (st.mine ? "Nothing saved yet" : "No books match") + '</b>' + (st.mine ? "Books you start reading will be kept here." : "Try another level, format or genre.") + '</div></div>';
  } else rail.innerHTML = list.map(card).join("");
  setTimeout(arrows, 60);
}
$("lv").addEventListener("change", e => { st.lv = e.target.value; render(); });
$("fm").addEventListener("change", e => { st.fm = e.target.value; render(); });
$("q").addEventListener("input", e => { st.q = e.target.value; render(); });
$("gn").addEventListener("change", e => { st.gn = e.target.value; render(); });
const togSaved = () => { st.mine = !st.mine; $("my").classList.toggle("on", st.mine); $("hsv").classList.toggle("on", st.mine); render(); };
$("my").addEventListener("click", togSaved); $("hsv").addEventListener("click", togSaved);
$("clr").addEventListener("click", () => { st = { lv: "", fm: "", gn: "", q: "", mine: false }; $("q").value = ""; $("lv").value = ""; $("gn").value = ""; $("fm").value = ""; $("my").classList.remove("on"); $("hsv").classList.remove("on"); render(); });
$("rail").addEventListener("click", e => { const a = e.target.closest("a.bk"); if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return; e.preventDefault(); a.classList.add("pick"); $("app").classList.add("leaving"); setTimeout(() => { location.href = a.getAttribute("href"); }, 760); });
window.addEventListener("pageshow", ev => { if (ev.persisted) { $("app").classList.remove("leaving"); document.querySelectorAll(".bk.pick").forEach(x => x.classList.remove("pick")); } });
$("al").onclick = () => $("rail").scrollBy({ left: -$("rail").clientWidth * .8, behavior: "smooth" });
$("ar").onclick = () => $("rail").scrollBy({ left: $("rail").clientWidth * .8, behavior: "smooth" });
$("rail").addEventListener("scroll", arrows, { passive: true });
window.addEventListener("resize", arrows);
$("rail").addEventListener("wheel", e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { $("rail").scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });
(async function(){
  let remote = [];
  try {
    const snap = await getDocs(query(collection(db, "libraryBooks"), where("published", "==", true)));
    remote = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
  } catch (e) {}
  const have = {}; CODE.forEach(b => { have[b.id] = 1; });
  books = CODE.concat(remote.filter(b => !have[b.id]));
  books.sort((a, b) => LV.indexOf(a.level) - LV.indexOf(b.level) || (b.createdAt || 0) - (a.createdAt || 0));
  const gs = Array.from(new Set(books.map(b => b.genre).filter(Boolean))).sort();
  $("gn").innerHTML = '<option value="">Genre</option>' + gs.map(g => '<option value="'+esc(g)+'">'+esc(g)+'</option>').join("");
  render();
})();
</script>
</body>
</html>
