<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SayBon Library</title>
<style>
:root{--ink:#F4F1E6;--gold:#E3B54B;--gold2:#C9A24A;--mut:#A9C9B8;--deep:#06281C;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);overflow:hidden;background:var(--deep)}
.bg{position:fixed;inset:0;background:var(--deep) url(/library/bg-desktop.webp) center/cover no-repeat;animation:bgIn 1.6s var(--ease) both}
.veil{position:fixed;inset:0;background:linear-gradient(0deg,rgba(4,30,20,.55) 0%,rgba(4,30,20,0) 45%)}
@keyframes bgIn{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.app{position:relative;z-index:2;height:100vh;height:100dvh;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr)}
.top{display:flex;align-items:center;gap:18px;padding:20px 6vw 8px;animation:rise .8s var(--ease) both}
.logo{display:flex;align-items:center;gap:18px;text-decoration:none;color:inherit}
.sb{line-height:1;position:relative}.sb b{font-size:30px;font-weight:900;letter-spacing:-.02em;color:#fff}
.sb svg{display:block;width:62px;height:9px;margin:-2px 0 0 14px}
.dv{width:1.5px;height:36px;background:rgba(255,255,255,.35)}
.lb{display:flex;align-items:center;gap:10px;font-weight:800;font-size:24px;color:#fff}.lb svg{width:34px;height:28px}
.tr{margin-left:auto;display:flex;align-items:center;gap:26px}
.nl{display:inline-flex;align-items:center;gap:9px;font:inherit;font-weight:700;font-size:16px;color:#fff;background:none;border:0;cursor:pointer;text-decoration:none;padding:6px 0;opacity:.92;transition:opacity .2s,transform .2s var(--ease)}
.nl:hover{opacity:1;transform:translateY(-1px)}.nl svg{width:24px;height:24px}.nl.on{color:var(--gold)}
#adm{display:none}
.mid{min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 5vw;min-height:0}
.eb{display:flex;align-items:center;gap:14px;font-size:13px;font-weight:800;letter-spacing:.34em;text-transform:uppercase;color:#fff;animation:rise .8s .08s var(--ease) both}
.eb i{display:block;width:70px;height:1.5px;background:var(--gold)}
h1{font-family:Georgia,"Palatino Linotype","Times New Roman",serif;font-weight:700;font-size:clamp(34px,5.4vw,78px);line-height:1.04;letter-spacing:-.02em;margin:14px 0 22px;color:#fff;animation:rise .9s .14s var(--ease) both}
h1 em{font-style:italic;background:linear-gradient(180deg,#F6D77A,#C9922E);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;padding-right:.08em}
.tools{display:flex;align-items:center;gap:12px;background:#F5F1E4;border-radius:999px;padding:8px 10px 8px 24px;width:min(1020px,100%);box-shadow:0 18px 40px rgba(0,0,0,.28);animation:rise .9s .26s var(--ease) both}
.find{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.find svg{width:22px;height:22px;flex:0 0 auto}
.find input{border:0;outline:0;background:none;font:inherit;font-weight:700;font-size:16px;color:#17372b;padding:12px 0;width:100%;min-width:0}
.find input::placeholder{color:#7d8f85}
.sep{width:1.5px;height:30px;background:rgba(23,55,43,.18)}
.chip{position:relative;display:inline-flex;align-items:center;gap:8px;border:1.5px solid rgba(23,55,43,.32);border-radius:999px;padding:0 12px 0 14px;color:#17372b;background:rgba(255,255,255,.4);height:46px;flex:0 0 auto;transition:background .2s}
.chip:hover{background:#fff}.chip svg{width:19px;height:19px;flex:0 0 auto;pointer-events:none}
.chip select{appearance:none;-webkit-appearance:none;border:0;outline:0;background:none;font:inherit;font-weight:700;font-size:15px;color:#17372b;padding:0 18px 0 0;cursor:pointer;height:100%;min-width:0}
.chip:after{content:"";position:absolute;right:13px;top:50%;width:6px;height:6px;border-right:2px solid #17372b;border-bottom:2px solid #17372b;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.band{padding:6px 0 3vh;position:relative;animation:rise 1s .32s var(--ease) both}
.bh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 6vw 4px}
.bh b{font-size:clamp(20px,2.1vw,28px);font-weight:800;color:#fff;padding-left:14px;border-left:4px solid var(--gold);line-height:1.1}
.bh span{font-size:13px;font-weight:700;color:var(--mut);margin-left:12px}
.bh .nl{font-size:15px}
.rail{display:flex;gap:calc(var(--cw)*.16);overflow-x:auto;scroll-snap-type:x proximity;padding:16px 6vw 12px;scrollbar-width:none;-ms-overflow-style:none;scroll-behavior:smooth;scroll-padding-left:6vw;justify-content:flex-start}
.rail::-webkit-scrollbar{display:none}
:root{--cw:clamp(110px,25vh,230px)}
.bk{flex:0 0 var(--cw);width:var(--cw);scroll-snap-align:start;text-decoration:none;color:inherit;animation:rise .8s var(--ease) both;transform-origin:left center}
.cv{position:relative;aspect-ratio:3/4;border-radius:3px 9px 9px 3px;overflow:hidden;box-shadow:4px 0 0 #f1e8d0,5px 0 0 #cfc2a0,7px 3px 0 #f1e8d0,8px 4px 0 #cfc2a0,0 20px 32px -8px rgba(0,0,0,.65);transition:transform .45s var(--ease),box-shadow .45s var(--ease)}
.bk:hover .cv{transform:perspective(700px) rotateY(-14deg) translateY(-8px) translateX(4px);box-shadow:22px 26px 36px -12px rgba(0,0,0,.7)}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv:before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:linear-gradient(90deg,rgba(0,0,0,.4),rgba(255,255,255,.14) 55%,transparent);z-index:2}
.cv:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.2),transparent 40%);z-index:2;pointer-events:none}
.gn{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:14px 12px 14px 18px;font-family:Georgia,serif;color:#f6efd8}
.gn b{font-size:calc(var(--cw)*.115);line-height:1.2;font-weight:600}.gn i{display:block;width:26px;height:1.5px;background:var(--gold);margin:9px 0}.gn span{font-size:calc(var(--cw)*.07);opacity:.82;letter-spacing:.06em;text-transform:uppercase;font-family:"Nunito",sans-serif;font-weight:700}
.tg{position:absolute;right:5px;top:5px;display:flex;flex-direction:column;gap:3px;z-index:3;align-items:flex-end}
.tg span{background:rgba(255,255,255,.93);color:#0B3D2A;font-size:10px;font-weight:900;border-radius:6px;padding:2px 6px;letter-spacing:.03em}
.tg span.lv{background:var(--gold);color:#2b1f00}
.cont{position:absolute;left:0;right:0;bottom:0;z-index:3;background:linear-gradient(0deg,rgba(4,30,20,.95),rgba(4,30,20,0));color:#fff;font-size:10.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:18px 8px 7px;text-align:center}
.tt{font-weight:800;font-size:14px;margin-top:12px;line-height:1.25;color:#fff;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.au{font-size:12px;font-weight:700;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar{position:absolute;top:50%;z-index:5;width:46px;height:46px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);background:rgba(6,40,28,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;display:grid;place-items:center;transition:all .2s var(--ease)}
.ar:hover{background:rgba(6,40,28,.95);transform:scale(1.07)}.ar svg{width:20px;height:20px}
.ar.l{left:1.6vw}.ar.r{right:1.6vw}.ar[hidden]{display:none}
.empty{padding:6px 0 10px;display:flex;gap:18px;align-items:center}
.ghost{flex:0 0 var(--cw);aspect-ratio:3/4;border-radius:3px 9px 9px 3px;border:2px dashed rgba(255,255,255,.25);background:rgba(255,255,255,.06)}
.em{font-weight:700;color:var(--mut);max-width:380px;line-height:1.5}.em b{display:block;font-family:Georgia,serif;font-size:22px;color:#fff;font-weight:600;margin-bottom:4px}
@media(max-width:760px){
 .top{padding:14px 16px 4px;gap:6px}.logo{gap:9px}.sb b{font-size:22px}.sb svg{width:42px;margin-left:8px}.dv{height:26px}.lb{font-size:17px;gap:6px}.lb svg{width:23px;height:20px}
 .tr{gap:6px}.nl{width:40px;height:40px;flex:0 0 auto;border-radius:50%;background:#F5F1E4;color:#0B3D2A;justify-content:center;padding:0;opacity:1}.nl span{display:none}.nl svg{width:22px;height:22px}.nl.on{background:var(--gold);color:#2b1f00}
 .bh .nl{width:auto;height:auto;background:none;color:#fff;border-radius:0}.bh .nl span{display:inline}
 .bg{background-image:url(/library/bg-mobile.webp)}
 .mid{align-items:flex-start;text-align:left;padding:0 20px;justify-content:flex-start;padding-top:3vh}
 .eb{font-size:11.5px;letter-spacing:.3em}.eb i{width:50px}
 h1{font-size:clamp(34px,10.4vw,46px);margin:10px 0 16px}
 .tools{flex-wrap:wrap;border-radius:28px;padding:6px 8px 10px 18px;gap:8px;background:none;box-shadow:none;padding:0}
 .find{flex:1 0 100%;background:#F5F1E4;border-radius:999px;padding:0 18px;box-shadow:0 14px 30px rgba(0,0,0,.28)}
 .sep{display:none}
 .chip{height:42px;flex:1 1 0;min-width:0;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.4);color:#fff;padding:0 10px}
 .chip select{color:#fff;font-size:14px;width:100%}.chip select option{color:#17372b}.chip:after{border-color:#fff;right:10px}
 .chip svg{display:none}
 .bh{padding:0 20px 2px}.rail{padding:12px 20px 12px;scroll-padding-left:20px}.ar{display:none}
 :root{--cw:clamp(96px,14vh,126px)}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg"></div><div class="veil"></div>
<div class="app">
<header class="top">
<a class="logo" href="/dashboard/" title="Back to the dashboard">
<span class="sb"><b>SayBon</b><svg viewBox="0 0 62 9" fill="none"><path d="M2 6c14-5 34-6 58-3" stroke="#E3B54B" stroke-width="3" stroke-linecap="round"/></svg></span>
<span class="dv"></span>
<span class="lb"><svg viewBox="0 0 44 36" fill="none"><path d="M22 7C17 3 9 3 3 5v26c6-2 14-2 19 2 5-4 13-4 19-2V5c-6-2-14-2-19 2z" fill="#E3B54B" stroke="#B8872A" stroke-width="2" stroke-linejoin="round"/><path d="M22 7v26" stroke="#B8872A" stroke-width="2"/></svg>Library</span>
</a>
<div class="tr">
<a class="nl" id="adm" href="/library/admin.html" title="Manage books"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span>Manage</span></a>
<a class="nl" href="/dashboard/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7.5 9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-6h4v6"/></svg><span>Dashboard</span></a>
<button class="nl" id="my" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg><span>Saved Books</span></button>
</div>
</header>

<main class="mid">
<div class="eb">Read in French<i></i></div>
<h1>The SayBon <em>Library</em></h1>
<div class="tools">
<label class="find"><svg viewBox="0 0 24 24" fill="none" stroke="#17372b" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg><input id="q" type="search" placeholder="Search books..." autocomplete="off"></label>
<span class="sep"></span>
<label class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 3l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5M3 16.5L12 21l9-4.5"/></svg><select id="lv" aria-label="Level"><option value="">Level</option><option>A0</option><option>A1</option><option>A2</option><option>B1</option><option>B2</option><option>C1</option><option>C2</option></select></label>
<label class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.2"/></svg><select id="gn" aria-label="Genre"><option value="">Genre</option></select></label>
<label class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 6C9.5 4 6 4 3 5v14c3-1 6.5-1 9 1 2.5-2 6-2 9-1V5c-3-1-6.5-1-9 1z"/><path d="M12 6v14"/></svg><select id="fm" aria-label="Format"><option value="">Format</option><option value="bilingual">Bilingual</option><option value="french">French only</option></select></label>
</div>
</main>

<section class="band">
<div class="bh"><div style="display:flex;align-items:baseline"><b id="bt">On the shelf</b><span id="bc"></span></div></div>
<button class="ar l" id="al" type="button" aria-label="Scroll left" hidden><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
<button class="ar r" id="ar" type="button" aria-label="Scroll right" hidden><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
<div class="rail" id="rail"></div>
</section>
</div>
<script src="/library/books.js"></script>
<script type="module">
import { auth } from "/js/firebase-init.js";
import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
const db = getFirestore(auth.app), $ = x => document.getElementById(x);
const ADMINS = ["adlaideduah@gmail.com","saybon.fr@gmail.com"];
onAuthStateChanged(auth, u => { if (u && u.email && ADMINS.indexOf(u.email) > -1) $("adm").style.display = "inline-flex"; });
const LV = ["A0","A1","A2","B1","B2","C1","C2"];
const TONES = [["#1d5c45","#0f3a2c"],["#1f6f78","#12444b"],["#7a2a3c","#481a25"],["#26396b","#16213f"],["#8a6a1f","#55400f"],["#5a2f6b","#35193f"]];
let books = [], st = { lv: "", fm: "", gn: "", q: "", mine: false };
const CODE = (window.SB_BOOKS || []).filter(b => b && b.id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const started = b => LS("sbLib:" + b.id) !== null && LS("sbLib:" + b.id + ":done") !== "1";
const tone = t => { let h = 0; for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) >>> 0; return TONES[h % TONES.length]; };
function card(b, i){
  const tn = tone(b.title || "");
  const cov = b.cover ? '<img src="'+esc(b.cover)+'" alt="">' : '<div class="gn" style="background:linear-gradient(150deg,'+tn[0]+','+tn[1]+')"><b>'+esc(b.title)+'</b><i></i><span>'+esc(b.author||"")+'</span></div>';
  return '<a class="bk" style="animation-delay:'+(0.38+i*0.06)+'s" href="/library/read.html?b='+encodeURIComponent(b.id)+'"><div class="cv">'+cov+'<div class="tg"><span class="lv">'+esc(b.level||"")+'</span><span>'+(b.format==="bilingual"?"FR + EN":"FR")+'</span></div>'+(started(b)?'<div class="cont">Continue</div>':'')+'</div><div class="tt">'+esc(b.title)+'</div><div class="au">'+esc(b.author||"")+(b.genre?" \u00b7 "+esc(b.genre):"")+'</div></a>';
}
function arrows(){
  const r = $("rail"), more = r.scrollWidth > r.clientWidth + 8;
  $("al").hidden = !more || r.scrollLeft < 10;
  $("ar").hidden = !more || r.scrollLeft + r.clientWidth > r.scrollWidth - 10;
}
function render(){
  const q = st.q.trim().toLowerCase();
  const list = books.filter(b => (!st.mine || started(b) || LS("sbLib:" + b.id) !== null) && (!st.gn || b.genre === st.gn) && (!st.lv || b.level === st.lv) && (!st.fm || b.format === st.fm) && (!q || (b.title + " " + (b.author || "")).toLowerCase().indexOf(q) > -1));
  list.sort((a, b) => (started(b) ? 1 : 0) - (started(a) ? 1 : 0));
  $("bt").textContent = st.mine ? "My Library" : "On the shelf";
  $("bc").textContent = books.length ? list.length + (list.length === 1 ? " book" : " books") : "";
  const rail = $("rail");
  rail.style.scrollBehavior = "auto"; rail.scrollLeft = 0; rail.style.scrollBehavior = "";
  if (!books.length) {
    rail.innerHTML = '<div class="empty"><div class="ghost"></div><div class="ghost"></div><div class="ghost"></div><div class="em"><b>The first stories are on their way</b>New original books will appear on this shelf. Check back soon.</div></div>';
  } else if (!list.length) {
    rail.innerHTML = '<div class="empty"><div class="em"><b>' + (st.mine ? "Nothing saved yet" : "No books match") + '</b>' + (st.mine ? "Books you start reading will be kept here." : "Try another level, format or genre.") + '</div></div>';
  } else rail.innerHTML = list.map(card).join("");
  setTimeout(arrows, 60);
}
$("lv").addEventListener("change", e => { st.lv = e.target.value; render(); });
$("fm").addEventListener("change", e => { st.fm = e.target.value; render(); });
$("q").addEventListener("input", e => { st.q = e.target.value; render(); });
$("gn").addEventListener("change", e => { st.gn = e.target.value; render(); });
$("my").addEventListener("click", () => { st.mine = !st.mine; $("my").classList.toggle("on", st.mine); render(); });
$("al").onclick = () => $("rail").scrollBy({ left: -$("rail").clientWidth * .8, behavior: "smooth" });
$("ar").onclick = () => $("rail").scrollBy({ left: $("rail").clientWidth * .8, behavior: "smooth" });
$("rail").addEventListener("scroll", arrows, { passive: true });
window.addEventListener("resize", arrows);
$("rail").addEventListener("wheel", e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { $("rail").scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });
(async function(){
  let remote = [];
  try {
    const snap = await getDocs(query(collection(db, "libraryBooks"), where("published", "==", true)));
    remote = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
  } catch (e) {}
  const have = {}; CODE.forEach(b => { have[b.id] = 1; });
  books = CODE.concat(remote.filter(b => !have[b.id]));
  books.sort((a, b) => LV.indexOf(a.level) - LV.indexOf(b.level) || (b.createdAt || 0) - (a.createdAt || 0));
  const gs = Array.from(new Set(books.map(b => b.genre).filter(Boolean))).sort();
  $("gn").innerHTML = '<option value="">Genre</option>' + gs.map(g => '<option value="'+esc(g)+'">'+esc(g)+'</option>').join("");
  render();
})();
</script>
</body>
</html>
