<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SayBon Library</title>
<style>
:root{--ink:#F4F1E6;--gold:#E3B54B;--mut:#A9C9B8;--deep:#01301f;--ease:cubic-bezier(.22,1,.36,1);--soft:cubic-bezier(.33,.0,.2,1);--edge:max(6vw,calc((100vw - 1000px)/2))}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);overflow:hidden;background:var(--deep)}
body:before{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 80% 60% at 50% 40%,rgba(1,20,13,.24),rgba(1,20,13,.55) 100%),linear-gradient(180deg,rgba(1,22,14,.45),rgba(1,22,14,.32) 50%,rgba(1,22,14,.5))}
.bg{position:fixed;left:0;bottom:0;width:100vw;height:56.28vw;background:url(/library/bg-desktop.webp) center/100% 100% no-repeat;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 14%);mask-image:linear-gradient(180deg,transparent 0,#000 14%);animation:bgIn 2.2s var(--soft) both}
@keyframes bgIn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.app{position:relative;z-index:2;height:100vh;height:100dvh;display:grid;grid-template-rows:auto 1fr auto auto;grid-template-columns:minmax(0,1fr);transition:opacity .7s var(--soft),transform .7s var(--soft)}
.app.leaving{opacity:0;transform:scale(1.025)}
.top{padding:3.2vh var(--edge) 0;display:flex;align-items:center;justify-content:space-between;gap:14px;animation:rise 1.1s var(--ease) both}
.tr{display:flex;align-items:center;gap:clamp(18px,2.6vw,38px)}
.nl{display:inline-flex;align-items:center;gap:10px;font:inherit;font-weight:600;font-size:clamp(14px,1.15vw,17px);color:#fff;background:none;border:0;cursor:pointer;text-decoration:none;padding:6px 0;transition:color .5s var(--soft),transform .7s var(--ease)}
.nl svg{width:26px;height:26px;flex:0 0 auto}.nl:hover{transform:translateY(-2px)}.nl.on{color:var(--gold)}
.logo{display:inline-block;line-height:0}
.logo img{height:clamp(30px,4.6vh,42px);width:auto;display:block}
.mid{position:relative;z-index:20;min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 5vw;min-height:0}
.hd{display:block;height:clamp(54px,11vh,100px);width:auto;max-width:92vw;animation:rise 1.2s .12s var(--ease) both}
.tools{display:flex;align-items:center;gap:12px;background:rgba(196,222,208,.16);border:1px solid rgba(196,222,208,.3);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:999px;padding:3px 8px 3px 20px;width:min(720px,100%);margin-top:clamp(8px,1.6vh,14px);box-shadow:0 14px 34px -12px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1);animation:rise 1.2s .3s var(--ease) backwards}
.find{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.find svg{width:18px;height:18px;flex:0 0 auto}
.find input{border:0;outline:0;background:none;font:inherit;font-weight:600;font-size:15px;color:#EAF4EE;padding:6px 0;width:100%;min-width:0}
.find input::placeholder{color:rgba(214,234,224,.62)}.find svg,.clr svg{stroke:#CFE6D8}.chip svg{width:16px!important;height:16px!important}
.sep{width:1.5px;height:30px;background:rgba(196,222,208,.25)}
.clr{display:none}
.dd{position:relative;flex:0 0 auto}
.chip{position:relative;display:inline-flex;align-items:center;gap:9px;border:1.5px solid rgba(196,222,208,.34);border-radius:999px;padding:0 14px 0 15px;color:#E6F2EA;background:rgba(255,255,255,.06);height:30px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;transition:background .5s var(--soft),border-color .5s var(--soft),color .5s var(--soft),box-shadow .5s var(--soft)}

.chip svg{width:19px;height:19px;flex:0 0 auto}
.chip .chev{width:17px;height:17px;margin-left:2px;transition:transform .55s var(--ease)}
.dd.open .chip{background:rgba(255,255,255,.16);border-color:#CFE6D8;box-shadow:0 0 0 4px rgba(227,181,75,.22)}
.dd.open .chev{transform:rotate(180deg)}
.dd.set .chip{background:#0f4a35;border-color:#0f4a35;color:#F7F1DC}

.pop{position:absolute;top:calc(100% + 12px);left:0;z-index:60;min-width:312px;max-height:min(430px,58vh);overflow:auto;padding:8px;border-radius:22px;background:linear-gradient(180deg,rgba(10,58,41,.985),rgba(4,38,26,.99));-webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3);border:1px solid rgba(255,255,255,.16);box-shadow:0 34px 70px -10px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.12);opacity:0;visibility:hidden;transform:translateY(-10px) scale(.97);transform-origin:top left;transition:opacity .45s var(--ease),transform .6s var(--ease),visibility 0s .6s;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent}
.dd:last-of-type .pop{left:auto;right:0;transform-origin:top right}
.dd.open .pop{opacity:1;visibility:visible;transform:none;transition:opacity .45s var(--ease),transform .6s var(--ease),visibility 0s}

.it{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:#F4F1E6;background:none;border:0;border-radius:14px;padding:11px 14px;cursor:pointer;transition:background .4s var(--soft),transform .5s var(--ease)}

.it .tx{flex:1;min-width:0}.it b{display:block;font-weight:800;font-size:15.5px;letter-spacing:.01em}.it small{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin-top:1px}
.it .ck{width:20px;height:20px;flex:0 0 auto;color:var(--gold);opacity:0;transform:scale(.6);transition:opacity .4s var(--soft),transform .5s var(--ease)}
.it.on{background:rgba(227,181,75,.13)}.it.on b{color:#F6DC8C}.it.on .ck{opacity:1;transform:none}
.it .bdg{flex:0 0 auto;min-width:34px;height:26px;display:grid;place-items:center;padding:0 8px;border-radius:9px;background:rgba(255,255,255,.1);font-weight:900;font-size:12.5px;letter-spacing:.06em;color:#fff}
.it.on .bdg{background:var(--gold);color:#2b1f00}
.scrim{position:fixed;inset:0;z-index:15;background:rgba(0,12,8,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .5s var(--soft),visibility 0s .5s}
.scrim.on{opacity:1;visibility:visible;transition:opacity .5s var(--soft)}
.band{padding:0 0 3.4vh;position:relative;animation:rise 1.3s .42s var(--ease) both}
.bh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 var(--edge)}
.bh b{display:flex;flex-direction:column;gap:7px;font-family:Georgia,"Palatino Linotype","Times New Roman",serif;font-weight:600;font-size:clamp(24px,2.5vw,34px);letter-spacing:.005em;color:#F7F1DC;line-height:1;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.bh b small{display:none;font-family:"Nunito","Segoe UI",system-ui,sans-serif;font-weight:600;font-size:clamp(14px,1.25vw,17px);line-height:1.35;color:#C9DDD2;letter-spacing:0;text-shadow:none;max-width:60ch}
.bh.wel b small{display:block}
.top{order:0}.mid{order:1}.app>.bh{order:2}.band{order:3}
body.mine .app>.bh{order:1;padding-top:2.4vh}body.mine .mid{order:2}
body.mine .app{grid-template-rows:auto auto auto 1fr!important}
@media(min-width:761px){.mid{align-items:center;text-align:center}.tools{width:min(600px,100%)}.app>.bh{width:min(600px,100%);margin-left:auto;margin-right:auto;padding:0}.shelf .fd{padding-left:max(var(--edge),calc((100vw - 600px)/2))}}
body.mine .mid{justify-content:flex-start;align-items:center;text-align:center}
.bh.wel{flex-direction:column;flex-wrap:nowrap;align-items:center;justify-content:center;text-align:center;gap:16px}.bh.wel b{align-items:center;text-align:center}.bh.wel b small{max-width:46ch}
@media(max-width:760px){body.mine .mid{padding:0 20px}.bh.wel{align-items:center}.bh.wel b{flex:0 0 auto}}body.mine .tools{margin-top:clamp(14px,2.4vh,24px)}
.app>.bh{margin-top:clamp(6px,1.2vh,14px)}
body:not(.mine) .app>.bh{display:none}
@media(min-width:761px){body:not(.mine) .band{margin-top:-7vh}}
body.mine .logo,body.mine .mid picture{display:none}
body.mine .tr{margin-left:auto}

body.mine .clr{display:grid;place-items:center;width:28px;height:28px;border:0;background:none;cursor:pointer;margin-left:6px}
body.mine .mid{padding-top:2.6vh}
.bh.wel b{gap:14px;font-size:clamp(24px,2.4vw,32px)}.bh.wel b:after{display:none}
.bh.wel b small{color:rgba(201,221,210,.62);font-weight:500;font-size:clamp(13px,1.15vw,15px);line-height:1.65}
.bh.wel .sv,.bh.wel .sv.on{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16);color:rgba(247,241,220,.85);box-shadow:none}
.bh.wel .sv .n,.bh.wel .sv.on .n{background:rgba(227,181,75,.85);color:#2b1f00}.bh b em{font-style:italic;color:var(--gold)}
.bh b:after{content:"";width:44px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--gold),rgba(227,181,75,0))}
.sv{display:inline-flex;align-items:center;gap:9px;font:inherit;font-weight:800;font-size:13px;letter-spacing:.06em;color:#F7F1DC;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:999px;height:40px;padding:0 8px 0 15px;cursor:pointer;box-shadow:0 10px 24px -10px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12);transition:background .5s var(--soft),color .5s var(--soft),border-color .5s var(--soft),transform .6s var(--ease)}

.sv .n{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:var(--gold);color:#2b1f00;font-size:12px;letter-spacing:0}
.sv.on{background:linear-gradient(180deg,#F6DE9A,#E3B54B);border-color:#E3B54B;color:#3a2705}.sv.on .n{background:#3a2705;color:#F6DE9A}
.cv{position:relative;aspect-ratio:3/4;border-radius:18px;overflow:hidden;border:1.5px solid rgba(255,255,255,.55);background:#0b3a29;box-shadow:0 16px 34px -10px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06);transition:transform .9s var(--ease),box-shadow .9s var(--ease),border-color .9s var(--soft)}
.cv img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.1s var(--ease)}
.cv:after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,0) 38%,rgba(255,255,255,0) 70%,rgba(255,255,255,.07));pointer-events:none}
.bk:hover .cv{transform:translateY(-8px);border-color:rgba(255,255,255,.85);box-shadow:0 30px 46px -14px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.1)}
.bk:hover .cv img{transform:scale(1.035)}
.bk:active .cv{transform:translateY(-3px) scale(.985);transition-duration:.5s}
.bk.pick .cv{transform:translateY(-14px) scale(1.06);box-shadow:0 40px 60px -16px rgba(0,0,0,.75);transition-duration:.9s}
.lvl{margin-top:11px;text-align:center;font-size:13px;font-weight:800;letter-spacing:.14em;color:var(--mut)}
.gn{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:14px;font-family:Georgia,serif;color:#f6efd8}
.gn b{font-size:calc(var(--cw)*.115);line-height:1.2;font-weight:600}.gn i{display:block;width:26px;height:1.5px;background:var(--gold);margin:9px 0}.gn span{font-size:calc(var(--cw)*.07);opacity:.82;letter-spacing:.06em;text-transform:uppercase;font-family:"Nunito",sans-serif;font-weight:700}
.shelf{--sh:min(50vh,560px);position:relative;display:flex;flex-direction:column;gap:clamp(10px,1.9vh,20px);max-height:var(--sh);overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:14px 0 22px;margin-top:2px;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 12px,#000 calc(100% - 20px),transparent);mask-image:linear-gradient(180deg,transparent 0,#000 12px,#000 calc(100% - 20px),transparent);overscroll-behavior:contain}
.shelf::-webkit-scrollbar{display:none}
.fd{--R:clamp(112px,17.5vh,170px);--wf:calc(var(--R)*1.66);--cw:calc((var(--R) - 30px)*.75);position:relative;flex:0 0 auto;display:flex;align-items:stretch;height:var(--R);padding-left:var(--edge);animation:rise 1.1s var(--ease) both}
.fd:after{content:"";position:absolute;right:0;top:12%;bottom:12%;width:3px;border-radius:3px;background:linear-gradient(180deg,transparent,rgba(227,181,75,.65),transparent);opacity:0;transition:opacity .8s var(--soft)}
.fd.open:after{opacity:1}
.fold{position:relative;z-index:3;flex:0 0 var(--wf);width:var(--wf);height:100%;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:0}
.fold>*{pointer-events:none}
.fb,.ft,.ff{position:absolute;transition:transform .9s var(--ease),background .7s var(--soft),border-color .7s var(--soft),box-shadow .9s var(--ease)}
.fb{left:0;right:0;top:15%;bottom:0;border-radius:0 20px 20px 20px;background:linear-gradient(165deg,#1d6a51 0%,#0c4130 55%,#08301f 100%);border:1.5px solid rgba(227,181,75,.5);box-shadow:0 22px 40px -16px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.18)}
.ft{left:0;top:3.5%;width:40%;height:15%;border-radius:13px 16px 0 0;background:linear-gradient(180deg,#25785c,#1a6149);border:1.5px solid rgba(227,181,75,.5);border-bottom:0;display:flex;align-items:center;padding-left:clamp(10px,calc(var(--R)*.1),18px);font-weight:900;font-size:calc(var(--R)*.092);letter-spacing:.14em;color:#F6DC8C}

.pk{position:absolute;z-index:1;bottom:19%;width:30.5%;aspect-ratio:3/4;border-radius:calc(var(--R)*.07);overflow:hidden;border:1.5px solid rgba(255,255,255,.55);box-shadow:0 10px 22px -8px rgba(0,0,0,.65);background:#0b3a29;transition:transform 1s var(--ease),opacity .8s var(--soft)}
.pk img{width:100%;height:100%;object-fit:cover;display:block}
.pk.p0{left:10%;transform:rotate(-8deg);transform-origin:bottom center}

.pk.p2{left:59%;transform:rotate(9deg);transform-origin:bottom center}
.ff{z-index:3;left:0;right:0;top:45%;bottom:0;border-radius:15px 15px 20px 20px;background:linear-gradient(180deg,rgba(38,122,94,.97),rgba(9,54,39,.99));border:1.5px solid rgba(227,181,75,.62);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.28),0 -8px 22px -12px rgba(0,0,0,.5);padding:calc(var(--R)*.085) calc(var(--R)*.11);display:flex;flex-direction:column;justify-content:center;overflow:hidden}

.nm{font-family:Georgia,"Iowan Old Style",serif;font-weight:600;font-size:calc(var(--R)*.135);line-height:1.12;color:#F7F1DC;padding-right:calc(var(--R)*.2)}
.ct{margin-top:calc(var(--R)*.03);font-size:calc(var(--R)*.07);font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#A9D3BD}
.go{position:absolute;right:calc(var(--R)*.1);bottom:calc(var(--R)*.1);width:calc(var(--R)*.2);height:calc(var(--R)*.2);border-radius:50%;display:grid;place-items:center;background:rgba(227,181,75,.18);border:1.2px solid rgba(227,181,75,.7);color:#F6DC8C;transition:transform .9s var(--ease),background .6s var(--soft)}
.go svg{width:55%;height:55%}
@media(hover:hover){.fd:not(.open) .fold:hover .pk.p0{transform:translateY(-5%) rotate(-10deg)}.fd:not(.open) .fold:hover .pk.p1{transform:translateY(-9%) rotate(1deg)}.fd:not(.open) .fold:hover .pk.p2{transform:translateY(-5%) rotate(11deg)}.fd:not(.open) .fold:hover .ff{transform:translateY(2px)}}
.fd.open .ft{background:linear-gradient(180deg,#F6DE9A,#E3B54B);border-color:#F6DE9A;color:#2b1f00}
.fd.open .ft:after{background:#E3B54B}
.fd.open .fb{border-color:rgba(246,222,154,.85);box-shadow:0 22px 46px -14px rgba(0,0,0,.8),0 0 0 4px rgba(227,181,75,.14),inset 0 1px 0 rgba(255,255,255,.2)}

 .app{grid-template-rows:auto auto auto 1fr}.band{min-height:0;align-self:start;margin-top:12px}.app>.bh{margin-top:18px}

}

<script type="module">
import { auth } from "/js/firebase-init.js";
import { getFirestore, collection, getDocs, query, where, doc as fsDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const db = getFirestore(auth.app), $ = x => document.getElementById(x);
const LV = ["A0","A1","A2","B1","B2","C1","C2"];
const TONES = [["#1d5c45","#0f3a2c"],["#1f6f78","#12444b"],["#7a2a3c","#481a25"],["#26396b","#16213f"],["#8a6a1f","#55400f"],["#5a2f6b","#35193f"]];
let books = [], st = { lv: "", fm: "", gn: "", q: "", mine: false };
const CODE = (window.SB_BOOKS || []).filter(b => b && b.id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const SVK = "sbLibSaved";
const savedIds = () => { try { const a = JSON.parse(localStorage.getItem(SVK) || "[]"); return Array.isArray(a) ? a : []; } catch (e) { return []; } };
const started = b => LS("sbLib:" + b.id) !== null && LS("sbLib:" + b.id + ":done") !== "1";

const CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
function card(b, i){
  const tn = tone(b.title || "");
  const cov = b.cover ? '<img src="'+esc(b.cover)+'" alt="'+esc(b.title)+'">' : '<div class="gn" style="background:linear-gradient(150deg,'+tn[0]+','+tn[1]+')"><b>'+esc(b.title)+'</b><i></i><span>'+esc(b.author||"")+'</span></div>';
  return '<a class="bk" aria-label="'+esc(b.title)+'" style="--i:'+i+'" href="/library/read.html?b='+encodeURIComponent(b.id)+'"><div class="cv">'+cov+'</div></a>';
}
function peek(b, k){ const t = tone(b.title || ""); return '<div class="pk p'+k+'">'+(b.cover ? '<img src="'+esc(b.cover)+'" alt="">' : '<div class="gn" style="background:linear-gradient(150deg,'+t[0]+','+t[1]+')"></div>')+'</div>'; }
function folder(lv, arr, idx){
  const nm = LVN[lv] || "Other";
  return '<div class="fd" data-lv="'+esc(lv)+'" style="animation-delay:'+(0.45+idx*0.12)+'s"><button class="fold" type="button" aria-expanded="false" aria-label="'+esc((lv||"")+" "+nm+", "+arr.length+" books")+'"><span class="fb"></span>'+arr.slice(0,3).map(peek).join("")+'<span class="ft">'+esc(lv||"-")+'</span><span class="ff"><span class="nm">'+esc(nm)+'</span><span class="ct">'+arr.length+(arr.length === 1 ? " book" : " books")+'</span><span class="go">'+CHEV+'</span></span></button><div class="trk">'+arr.map(card).join("")+'</div><button class="nx" type="button" aria-label="Next books">'+CHEV+'</button></div>';
}
function closeFolders(except){ document.querySelectorAll(".fd.open").forEach(x => { if (x !== except) { x.classList.remove("open"); x.querySelector(".fold").setAttribute("aria-expanded", "false"); } }); }
function nxUpd(fd){ const t = fd.querySelector(".trk"), n = fd.querySelector(".nx"); n.classList.toggle("show", t.scrollWidth > t.clientWidth + 8 && t.scrollLeft + t.clientWidth < t.scrollWidth - 12); }
function openFolder(fd){
  closeFolders(fd); fd.classList.add("open"); fd.querySelector(".fold").setAttribute("aria-expanded", "true");
  setTimeout(() => nxUpd(fd), 80);
  const sh = $("rail"), r = fd.getBoundingClientRect(), sr = sh.getBoundingClientRect();
  if (r.top < sr.top + 6 || r.bottom > sr.bottom - 10) sh.scrollTo({ top: Math.max(0, fd.offsetTop - 16), behavior: "smooth" });
}
let uname = "";
const QS = {
  go: ["{t} is right where you left it. Shall we finish it?", "Ready to find out how {t} ends?", "A few more pages of {t}? It is waiting for you."],
  new: ["{t} is saved and waiting. Ready to dive in?", "A new story is one page away. Start {t}?", "Your next adventure is {t}. Let's see what happens!"],
  none: ["Tap the bookmark while you read and your books will wait for you here.", "Nothing saved yet. Pick a story, and let it be your first."]

const pick = a => a[Math.floor(Math.random() * a.length)];
function head(){
  const bh = $("bh"), bt = $("bt"), bq = $("bq");
  bh.classList.toggle("wel", !!st.mine); document.body.classList.toggle("mine", !!st.mine); if (!st.mine) document.body.classList.remove("filt");

  if (uname) { const e = document.createElement("em"); e.textContent = uname; bt.appendChild(e); }
  const ids = savedIds(), mine = books.filter(b => ids.indexOf(b.id) > -1);
  const cur = mine.filter(started)[0], nxt = mine.filter(b => LS("sbLib:" + b.id) === null)[0];
  const b = cur || nxt, k = cur ? "go" : nxt ? "new" : "none";
  bq.textContent = pick(QS[k]).replace("{t}", b ? "\u201C" + b.title + "\u201D" : "");
}
function gcard(b, i){
  const tn = tone(b.title || "");
  const cov = b.cover ? '<img src="'+esc(b.cover)+'" alt="">' : '<div class="gn" style="background:linear-gradient(150deg,'+tn[0]+','+tn[1]+')"><b>'+esc(b.title)+'</b></div>';
  return '<a class="gc" style="--i:'+i+'" href="/library/read.html?b='+encodeURIComponent(b.id)+'"><span class="gcv">'+cov+'</span><span class="gt">'+esc(b.title)+'</span></a>';
}
const GE = '<span class="gc ge" aria-hidden="true"><span class="gcv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M6 3.5h12v17.2l-6-4.6-6 4.6z"/></svg></span></span>';

  const cols = matchMedia("(max-width:760px)").matches ? 3 : 6, min = cols * (cols === 3 ? 3 : 2);

}
window.addEventListener("resize", () => { if (st.mine) { clearTimeout(window.__gr); window.__gr = setTimeout(render, 150); } });
function render(){
  const q = st.q.trim().toLowerCase();
  const list = books.filter(b => (!st.mine || savedIds().indexOf(b.id) > -1) && (!st.gn || b.genre === st.gn) && (!st.lv || b.level === st.lv) && (!st.fm || b.format === st.fm) && (!q || (b.title + " " + (b.author || "")).toLowerCase().indexOf(q) > -1));
  list.sort((a, b) => (started(b) ? 1 : 0) - (started(a) ? 1 : 0));
  $("svt").textContent = st.mine ? "All Books" : "Saved Books"; head(); $("svn").textContent = savedIds().length;

  if (!books.length) {
    rail.innerHTML = '<div class="empty"><div class="ghost"></div><div class="ghost"></div><div class="ghost"></div><div class="em"><b>The first stories are on their way</b>New original books will appear on this shelf. Check back soon.</div></div>';
  } else if (!list.length) {
    rail.innerHTML = '<div class="empty"><div class="em"><b>' + (st.mine ? "Nothing saved yet" : "No books match") + '</b>' + (st.mine ? "Tap the bookmark while you read to keep a book here." : "Try another level, format or genre.") + '</div></div>';
  } else {
    const g = {}; list.forEach(b => { (g[b.level || ""] = g[b.level || ""] || []).push(b); });
    const keys = Object.keys(g).sort((a, b) => (LV.indexOf(a) < 0 ? 99 : LV.indexOf(a)) - (LV.indexOf(b) < 0 ? 99 : LV.indexOf(b)));
    rail.innerHTML = keys.map((k, i) => folder(k, g[k], i)).join("");

  }

}
$("q").addEventListener("input", e => { st.q = e.target.value; render(); });
const CK = '<svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const OPT = {
  lv: [["", "All levels", "Every book on the shelf"], ["A0", "A0", "Absolute beginner"], ["A1", "A1", "Beginner"], ["A2", "A2", "Elementary"], ["B1", "B1", "Intermediate"], ["B2", "B2", "Upper intermediate"], ["C1", "C1", "Advanced"], ["C2", "C2", "Mastery"]],
  fm: [["", "All formats", "Bilingual and French only"], ["bilingual", "Bilingual", "French first, then English"], ["french", "French only", "Read it entirely in French"]],
  gn: [["", "All genres", "Every kind of story"]]

const DEF = { lv: "Level", gn: "Genre", fm: "Format" };
function labelFor(k){ const o = OPT[k].filter(x => x[0] === st[k])[0]; return st[k] && o ? o[1] : DEF[k]; }
function paint(k){
  const box = $("dd_" + k);

  box.querySelector(".lab").textContent = labelFor(k);
  box.querySelector(".opts").innerHTML = OPT[k].map(o => '<button class="it' + (o[0] === st[k] ? " on" : "") + '" type="button" role="option" data-v="' + esc(o[0]) + '">' + (k === "lv" && o[0] ? '<span class="bdg">' + esc(o[0]) + '</span>' : "") + '<span class="tx"><b>' + esc(k === "lv" && o[0] ? o[2] : o[1]) + '</b>' + (k === "lv" && o[0] ? "" : (o[2] ? "<small>" + esc(o[2]) + "</small>" : "")) + '</span>' + CK + '</button>').join("");
}
function closeAll(){ document.querySelectorAll(".dd.open").forEach(x => { x.classList.remove("open"); x.querySelector(".chip").setAttribute("aria-expanded", "false"); }); $("scrim").classList.remove("on"); }
["lv", "gn", "fm"].forEach(k => {
  const box = $("dd_" + k);
  box.querySelector(".chip").addEventListener("click", e => { e.stopPropagation(); const was = box.classList.contains("open"); closeAll(); if (!was) { box.classList.add("open"); box.querySelector(".chip").setAttribute("aria-expanded", "true"); if (matchMedia("(max-width:760px)").matches) $("scrim").classList.add("on"); } });
  box.querySelector(".opts").addEventListener("click", e => { const b = e.target.closest(".it"); if (!b) return; st[k] = b.getAttribute("data-v"); paint(k); closeAll(); render(); });
  paint(k);
});
$("scrim").addEventListener("click", closeAll);
document.addEventListener("click", e => { if (!e.target.closest(".dd")) closeAll(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeAll(); });
const first = n => String(n || "").trim().split(/\s+/)[0];
async function loadName(u){
  if (!u) { uname = ""; head(); return; }
  let n = u.displayName;
  if (!n) { try { const sn = await getDoc(fsDoc(db, "users", u.uid)); const d = sn.exists() ? sn.data() : {}; n = d.firstName || d.firstname || d.name || d.displayName || d.fullName || ""; } catch (e) {} }
  uname = first(n); head();
}
try { if (auth && auth.onAuthStateChanged) auth.onAuthStateChanged(loadName); } catch (e) {}
const urlSaved = () => { try { history.replaceState(null, "", st.mine ? "?saved=1" : location.pathname); } catch (e) {} };

$("my").addEventListener("click", togSaved); $("hsv").addEventListener("click", togSaved);

let lastPT = "mouse", hoverT = 0, dn = null;

window.addEventListener("pageshow", ev => { if (ev.persisted) { $("app").classList.remove("leaving"); document.querySelectorAll(".bk.pick").forEach(x => x.classList.remove("pick")); } });
document.addEventListener("pointerdown", e => { lastPT = e.pointerType || "mouse"; dn = { x: e.clientX, y: e.clientY }; }, true);
$("rail").addEventListener("pointerover", e => {
  if (e.pointerType !== "mouse") return;
  const f = e.target.closest(".fold"); if (!f || (e.relatedTarget && f.contains(e.relatedTarget))) return;
  const fd = f.parentNode; clearTimeout(hoverT);
  if (!fd.classList.contains("open")) hoverT = setTimeout(() => openFolder(fd), 160);
});
$("rail").addEventListener("pointerout", e => { if (e.pointerType !== "mouse") return; const f = e.target.closest(".fold"); if (f && !(e.relatedTarget && f.contains(e.relatedTarget))) clearTimeout(hoverT); });
$("rail").addEventListener("click", e => {
  const f = e.target.closest(".fold");
  if (f) { const fd = f.parentNode; if (fd.classList.contains("open") && (lastPT !== "mouse" || e.detail === 0)) { fd.classList.remove("open"); f.setAttribute("aria-expanded", "false"); } else openFolder(fd); return; }
  const n = e.target.closest(".nx"); if (n) { const t = n.parentNode.querySelector(".trk"); t.scrollBy({ left: t.clientWidth * .75, behavior: "smooth" }); }
});
document.addEventListener("click", e => {
  if (dn && Math.hypot(e.clientX - dn.x, e.clientY - dn.y) > 8) return;
  if (e.target.closest(".fold,.trk,.nx,.dd,.pop,.scrim,.find,.chip,a,button,input,label")) return;
  closeFolders();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeFolders(); });
$("rail").addEventListener("scroll", e => { const t = e.target; if (t.classList && t.classList.contains("trk")) nxUpd(t.parentNode); }, true);
$("rail").addEventListener("wheel", e => {
  const t = e.target.closest(".trk"); if (!t || !t.parentNode.classList.contains("open")) return;
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && t.scrollWidth > t.clientWidth + 4) { const max = t.scrollWidth - t.clientWidth; if ((e.deltaY > 0 && t.scrollLeft < max - 2) || (e.deltaY < 0 && t.scrollLeft > 2)) { t.style.scrollBehavior = "auto"; t.scrollLeft += e.deltaY; t.style.scrollBehavior = ""; e.preventDefault(); } }
}, { passive: false });
window.addEventListener("resize", () => document.querySelectorAll(".fd.open").forEach(nxUpd));
(async function(){
  let remote = [];
  try {
    const snap = await getDocs(query(collection(db, "libraryBooks"), where("published", "==", true)));
    remote = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
  } catch (e) {}
  const have = {}; CODE.forEach(b => { have[b.id] = 1; });
  books = CODE.concat(remote.filter(b => !have[b.id]));
  books.sort((a, b) => LV.indexOf(a.level) - LV.indexOf(b.level) || (b.createdAt || 0) - (a.createdAt || 0));
  const gs = Array.from(new Set(books.map(b => b.genre).filter(Boolean))).sort();
  OPT.gn = [OPT.gn[0]].concat(gs.map(g => [g, g, ""])); paint("gn");
  if (/[?&]saved=1/.test(location.search)) { st.mine = true; $("my").classList.add("on"); $("hsv").classList.add("on"); }
  render();
})();
</script>
</body>
