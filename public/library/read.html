<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SayBon Library - Reader</title>
<style>
:root{--gold:#E3B54B;--gold2:#C9A24A;--txt:#F2EEDC;--mut:#A9C9B8;--paper:#f3ead6;--ink:#2a2118;--pw:420px;--ph:600px;--fs:17px;--padx:36px;--padt:36px;--padb:46px;--ease:cubic-bezier(.22,1,.36,1);--soft:cubic-bezier(.33,0,.2,1)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:#021c13;color:var(--txt);font-family:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;overflow:hidden;display:flex;flex-direction:column;position:relative}
.bgl{position:fixed;inset:0;background:#021c13 url(/library/bg-desktop.webp) center bottom/cover no-repeat;filter:saturate(.9) brightness(.6);transform:scale(1.04)}
.veil{position:fixed;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 46%,rgba(8,70,48,0) 0%,rgba(2,24,16,.35) 60%,rgba(1,16,11,.82) 100%),linear-gradient(180deg,rgba(1,18,12,.55),rgba(1,18,12,0) 22%,rgba(1,18,12,0) 70%,rgba(1,18,12,.6))}
.bar,.stage,.dock{position:relative;z-index:2}
.bar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) clamp(14px,3vw,36px) 6px}
.glass{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 10px 26px -10px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12)}
.bar a.back{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px 0 12px;border-radius:999px;color:var(--txt);text-decoration:none;font-weight:800;font-size:14px;letter-spacing:.02em;transition:background .5s var(--soft),transform .6s var(--ease)}
.bar a.back svg{width:20px;height:20px}
.bar a.back:hover{background:rgba(255,255,255,.17);transform:translateX(-2px)}
.bar .spacer{display:none}
.ttl{flex:1;min-width:0;text-align:center;line-height:1.15}
.ttl small{display:block;font-size:11px;font-weight:800;letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
.ttl b{display:block;margin-top:3px;font-family:Georgia,"Palatino Linotype",serif;font-weight:600;font-size:clamp(16px,1.7vw,22px);color:#F7F1DC;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;align-items:center;gap:10px}
.pillg{display:inline-flex;align-items:center;height:42px;padding:3px;border-radius:999px}
.pillg button{font:inherit;color:var(--txt);background:none;border:0;border-radius:999px;height:36px;min-width:38px;padding:0 13px;cursor:pointer;font-weight:800;font-size:13px;letter-spacing:.08em;display:inline-grid;place-items:center;transition:background .5s var(--soft),color .5s var(--soft)}
.pillg button:hover{background:rgba(255,255,255,.12)}
.pillg button.on{background:linear-gradient(180deg,#F6DE9A,#E3B54B);color:#3a2705}
.pillg button[disabled]{opacity:.35;cursor:default}
.pillg .sA{font-family:Georgia,serif;font-weight:700;font-size:14px}.pillg .lA{font-family:Georgia,serif;font-weight:700;font-size:20px}
#vw{display:none}
@media (max-width:899px){#vw{display:inline-grid}}
.spread:not(.single) .in{text-align:left}
@media (min-width:900px){.spread:not(.single) .in{text-align:justify}}
.ibtn{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:999px;border:1px solid rgba(255,255,255,.16);color:var(--txt);cursor:pointer;transition:background .5s var(--soft),transform .6s var(--ease)}
.ibtn svg{width:20px;height:20px}
#sv.on{background:linear-gradient(180deg,#F6DE9A,#E3B54B);border-color:#E3B54B;color:#3a2705}#sv.on svg{fill:currentColor}
#ml{text-decoration:none}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,16px);z-index:50;background:rgba(10,45,32,.94);color:#F7F1DC;border:1px solid rgba(227,181,75,.5);border-radius:999px;padding:11px 20px;font-weight:800;font-size:13px;letter-spacing:.03em;opacity:0;pointer-events:none;transition:opacity .5s,transform .6s cubic-bezier(.22,1,.36,1);box-shadow:0 14px 30px -10px rgba(0,0,0,.6);white-space:nowrap}.toast.on{opacity:1;transform:translate(-50%,0)}.ibtn:hover{background:rgba(255,255,255,.17);transform:translateY(-1px)}.ibtn[disabled]{opacity:.35;cursor:default;transform:none}
.stage{flex:1 1 auto;display:flex;align-items:center;justify-content:center;perspective:2600px;min-height:0;user-select:none;-webkit-user-select:none}
.stage:before{content:"";position:absolute;left:50%;top:50%;width:min(1100px,96vw);height:70%;transform:translate(-50%,-52%);background:radial-gradient(ellipse at center,rgba(255,214,130,.20),rgba(255,214,130,.06) 45%,transparent 70%);pointer-events:none}
.spread{position:relative;height:var(--ph);width:calc(var(--pw) * 2);filter:drop-shadow(0 34px 46px rgba(0,0,0,.7));transition:transform 1.5s var(--ease)}
.spread.single{width:var(--pw)}
.spread.closed:not(.single){transform:translateX(calc(var(--pw) * -.5))}
.slot{position:absolute;top:0;width:var(--pw);height:var(--ph)}
.slot.L{left:0}.slot.R{left:var(--pw)}
.spread.single .slot.R{display:none}
.pg{position:absolute;inset:0;background:var(--paper);color:var(--ink);padding:var(--padt) var(--padx) 0;overflow:hidden;
 background-image:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.4),transparent 60%),repeating-linear-gradient(0deg,rgba(120,90,40,.03) 0 1px,transparent 1px 3px)}
.pg.left{border-radius:12px 3px 3px 12px / 16px 3px 3px 16px;box-shadow:inset -30px 0 32px -18px rgba(70,45,15,.55),inset 3px 0 0 rgba(255,255,255,.5)}
.pg.right{border-radius:3px 12px 12px 3px / 3px 16px 16px 3px;box-shadow:inset 30px 0 32px -18px rgba(70,45,15,.55),inset -3px 0 0 rgba(255,255,255,.5)}
.spread.single .pg.left,.spread.single .pg.right{border-radius:6px;box-shadow:inset 22px 0 26px -18px rgba(70,45,15,.5)}
.in{height:calc(var(--ph) - var(--padt) - var(--padb));overflow:hidden;font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-size:var(--fs);line-height:1.64;hyphens:auto;-webkit-hyphens:auto;text-align:justify;transition:opacity .55s ease}
.in p.fr{text-indent:1.5em}
.in p.fr.c,.in h2+p.fr,.in figure+p.fr{text-indent:0}
.in p.fr.epi{font-style:italic;text-indent:0;font-size:.92em;opacity:.78;border-left:2px solid rgba(160,120,50,.55);padding-left:.8em;margin:0 0 .7em}
.in p.fr.sep{text-align:center;text-indent:0;letter-spacing:.5em;opacity:.55;margin:.4em 0}
.in h2{font-weight:600;font-size:1.55em;text-align:center;margin:.3em 0 .9em;line-height:1.2;color:#3a2a14}
.in h2 small.lang{display:block;font-size:.42em;font-family:"Nunito",sans-serif;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:.7em}
.in figure.fig{margin:.5em 0 .9em;width:100%;aspect-ratio:3/2;max-height:calc(var(--ph) * .33);overflow:hidden}
.in figure.fig img{pointer-events:none;-webkit-user-drag:none;user-select:none;display:block;width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply;filter:saturate(.94) contrast(.98);-webkit-mask-image:linear-gradient(to right,transparent,#000 10%,#000 90%,transparent),linear-gradient(to bottom,transparent,#000 13%,#000 87%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent,#000 10%,#000 90%,transparent),linear-gradient(to bottom,transparent,#000 13%,#000 87%,transparent);mask-composite:intersect}
.in .end{text-align:center;margin-top:28%;font-style:italic;color:#6a5a45}
.in .end.fin{margin-top:34%;font-size:1.25em;letter-spacing:.04em}
.rdEn{display:block;margin:1.6em auto 0;font:inherit;font-style:normal;font-weight:700;font-size:.7em;letter-spacing:.08em;color:#6b4d12;background:linear-gradient(180deg,#F6DE9A,#E3B54B);border:0;border-radius:999px;padding:.8em 1.6em;cursor:pointer;box-shadow:0 8px 18px -6px rgba(120,80,10,.55);transition:transform .7s cubic-bezier(.22,1,.36,1),box-shadow .7s cubic-bezier(.22,1,.36,1)}
.rdEn:hover{transform:translateY(-3px);box-shadow:0 14px 24px -8px rgba(120,80,10,.6)}
.in.tp{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;height:calc(var(--ph) - var(--padt) - 36px)}
.tp .org{font-family:"Nunito",sans-serif;font-size:.62em;font-weight:900;letter-spacing:.3em;text-transform:uppercase;color:#9a7a2e}
.tp .rule{width:64px;height:1.5px;background:var(--gold);margin:1.1em auto}
.tp .tt{font-size:2em;line-height:1.12;font-weight:600;color:#3a2a14}
.tp .au{margin-top:1em;font-style:italic;color:#6a5a45}
.tp .orn{margin-top:1.6em;width:120px;height:14px}
.pg.covpg{padding:0;background:#10261d}.pg.covpg img{display:block;width:100%;height:100%;object-fit:cover}
.pg.inner{background:#16543f;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.045) 0 1px,transparent 1px 14px),repeating-linear-gradient(-45deg,rgba(255,255,255,.045) 0 1px,transparent 1px 14px);box-shadow:inset -30px 0 36px -14px rgba(0,0,0,.55);color:#e7cf8f}
.pg.inner .fr{position:absolute;inset:26px;border:1.5px solid rgba(201,162,74,.65);border-radius:6px;display:grid;place-items:center;text-align:center;font-family:Georgia,serif;font-style:italic;font-size:15px;letter-spacing:.06em}
.pn{position:absolute;bottom:15px;left:0;right:0;text-align:center;font-family:Georgia,serif;font-size:12px;color:#8a7a62;transition:opacity .55s ease}
.spread.fade .in,.spread.fade .pn{opacity:0}
.cover{position:absolute;inset:0;border-radius:4px 12px 12px 4px;overflow:hidden;background:#143f50;box-shadow:inset 8px 0 14px -6px rgba(0,0,0,.55)}
.cover img{pointer-events:none;width:100%;height:100%;object-fit:cover;display:block}
.cover:before{content:"";position:absolute;left:0;top:0;bottom:0;width:16px;z-index:2;background:linear-gradient(90deg,rgba(0,0,0,.5),rgba(255,255,255,.18) 40%,rgba(0,0,0,.18) 70%,transparent)}
.cover:after{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(115deg,rgba(255,255,255,.2),transparent 38%);pointer-events:none}
.cover .gen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 28px 30px 38px;font-family:Georgia,serif;color:#f6efd8}
.cover .gen b{font-size:calc(var(--pw) * .1);line-height:1.18;font-weight:600}.cover .gen i{display:block;width:44px;height:2px;background:var(--gold);margin:16px 0}.cover .gen span{font-size:calc(var(--pw)*.045);letter-spacing:.14em;text-transform:uppercase;opacity:.85;font-family:"Nunito",sans-serif;font-weight:800}
.closedwrap{position:absolute;inset:0;cursor:pointer;border-radius:4px 12px 12px 4px;box-shadow:7px 0 0 #efe5cc,8px 0 0 #cfc2a0,11px 4px 0 #efe5cc,12px 5px 0 #cfc2a0,0 22px 40px rgba(0,0,0,.6);transition:transform .9s var(--ease)}
.closedwrap:hover{transform:translateY(-8px) rotateY(-4deg)}
.closedwrap .cover{animation:bob 6s ease-in-out infinite}
.closedwrap .hint{position:absolute;left:50%;bottom:-22px;z-index:6;transform:translateX(-50%);display:inline-flex;align-items:center;gap:9px;white-space:nowrap;height:42px;padding:0 20px;border-radius:999px;font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#3a2705;background:linear-gradient(180deg,#F6DE9A,#E3B54B);box-shadow:0 14px 28px -10px rgba(0,0,0,.6),0 0 0 6px rgba(227,181,75,.16);animation:pulse 2.8s ease-in-out infinite}
.closedwrap .hint svg{width:18px;height:18px}
@keyframes pulse{0%,100%{box-shadow:0 14px 28px -10px rgba(0,0,0,.6),0 0 0 6px rgba(227,181,75,.14)}50%{box-shadow:0 14px 28px -10px rgba(0,0,0,.6),0 0 0 12px rgba(227,181,75,.05)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.leaf{position:absolute;top:0;width:var(--pw);height:var(--ph);transform-style:preserve-3d;z-index:5;will-change:transform}
.leaf.fromR{left:var(--pw);transform-origin:left center}
.leaf.fromL{left:0;transform-origin:right center}
.spread.single .leaf.fromR{left:0}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.45),transparent 70%);opacity:0;z-index:2}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;color:var(--txt);cursor:pointer;z-index:10;display:grid;place-items:center;transition:background .5s var(--soft),transform .7s var(--ease),opacity .5s}
.nav svg{width:24px;height:24px}
.nav:hover{background:rgba(255,255,255,.2);transform:translateY(-50%) scale(1.07)}.nav:disabled{opacity:.18;cursor:default;transform:translateY(-50%)}
.nav.p{left:clamp(10px,2.6vw,40px)}.nav.n{right:clamp(10px,2.6vw,40px)}
.dock{flex:0 0 auto;display:flex;justify-content:center;padding:6px 16px calc(16px + env(safe-area-inset-bottom))}
.dk{display:flex;align-items:center;gap:14px;min-width:min(420px,92vw);padding:8px 10px;border-radius:999px}
.dk .pb{display:none;background:rgba(255,255,255,.12)}
.pl{flex:1;min-width:0;text-align:center}
.foot{color:#F2EEDC;font-size:13px;font-weight:700;letter-spacing:.06em;min-height:18px}
.bar2{height:3px;border-radius:3px;background:rgba(255,255,255,.14);margin:7px 6px 3px;overflow:hidden}
.bar2 i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,#F6DE9A,#E3B54B);transition:width 1.2s var(--ease)}
.msg{position:absolute;inset:0;z-index:3;display:grid;place-items:center;color:var(--mut);text-align:center;padding:20px}
.meas{position:absolute;left:-9999px;top:0;visibility:hidden}
.meas .pg{position:relative;inset:auto;width:var(--pw);height:var(--ph)}
@media (max-width:899px){.nav{display:none}.dk .pb{display:inline-grid}}
@media (max-width:760px){.bgl{background-image:url(/library/bg-mobile.webp)}}
@media (max-width:640px){#cv{display:none}.ibtn{width:36px;height:36px}.ibtn svg{width:18px;height:18px}.pillg{height:36px}.pillg button{height:30px}.bar a.back{height:36px;width:36px!important}.bar{gap:6px;padding-left:12px;padding-right:12px}.bar a.back{padding:0;width:42px;justify-content:center}.bar a.back span{display:none}.ttl{display:none}.bar .spacer{display:block;flex:1}.ctl{gap:8px}.pillg button{padding:0 10px;min-width:34px}}
</style>
</head>
<body>
<div class="bgl" id="bgl"></div><div class="veil"></div>
<header class="bar">
<a class="back glass" href="/library/" title="Back to the library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg><span>Library</span></a>
<div class="ttl"><small id="eb">SayBon Original</small><b id="ttl">&nbsp;</b></div>
<div class="spacer"></div>
<div class="ctl">
<div class="pillg glass" id="lang" hidden><button id="lfr" type="button" class="on">FR</button><button id="len" type="button">EN</button></div>
<div class="pillg glass"><button id="fm" type="button" title="Smaller text" aria-label="Smaller text"><span class="sA">A</span></button><button id="fp" type="button" title="Larger text" aria-label="Larger text"><span class="lA">A</span></button></div>
<button class="ibtn glass" id="vw" type="button" title="Switch between one page and two pages" aria-label="Switch between one page and two pages"></button>
<button class="ibtn glass" id="sv" type="button" title="Save this book" aria-label="Save this book" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M6 3.5h12v17.2l-6-4.6-6 4.6z"/></svg></button>
<a class="ibtn glass" id="ml" href="/library/?saved=1" title="My Library: your saved books" aria-label="My Library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="4.5" height="16" rx="1"/><rect x="10" y="4" width="4.5" height="16" rx="1"/><path d="M16.2 5.3l3.9 1.1-3.6 13.3-3.9-1"/></svg></a>
<button class="ibtn glass" id="cv" type="button" title="Close the book" aria-label="Close the book" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5h11a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg></button>
</div>
</header>
<div class="stage" id="stage">
<button class="nav p glass" id="prev" type="button" aria-label="Previous page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
<div class="spread closed" id="spread"><div class="slot L" id="sL"></div><div class="slot R" id="sR"></div></div>
<button class="nav n glass" id="next" type="button" aria-label="Next page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
<div class="msg" id="msg">Opening the book&hellip;</div>
</div>
<div class="dock"><div class="dk glass">
<button class="pb ibtn" id="pprev" type="button" aria-label="Previous page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
<div class="pl"><div class="foot" id="foot">&nbsp;</div><div class="bar2"><i id="prog"></i></div></div>
<button class="pb ibtn" id="pnext" type="button" aria-label="Next page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
</div></div>
<div class="meas" id="meas"><div class="pg"><div class="in" id="minner"></div></div></div>
<script src="/library/books.js"></script>
<script type="module">
import { auth } from "/js/firebase-init.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const db = getFirestore(auth.app);
const id = new URLSearchParams(location.search).get("b");
const $ = x => document.getElementById(x);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
const wait = ms => new Promise(r => setTimeout(r, ms));
const TONES = [["#1d5c45","#0f3a2c"],["#1f6f78","#12444b"],["#7a2a3c","#481a25"],["#26396b","#16213f"],["#8a6a1f","#55400f"],["#5a2f6b","#35193f"]];
let enPage = -1, bil = false, PW = 0, PH = 0;
let meta = null, blocks = [], imgs = {}, content = [], Q = [], two = true, cur = 0, busy = false, closed = true;
let fsD = parseFloat(LS.get("sbLibFsKD") || "1") || 1, fsM = parseFloat(LS.get("sbLibFsKM") || "1") || 1, fsS = parseFloat(LS.get("sbLibFsKS") || "1") || 1, view = LS.get("sbLibView") || "one", fs = fsD, compact = false, savedBlk = 0;

function parse(t){
  return String(t || "").replace(/\r/g, "").split(/\n\s*\n/).map(s => s.trim()).filter(Boolean).map(s => {
    const m = /^\[img:(\d+)(:p2)?\]$/i.exec(s);
    if (m) return { img: parseInt(m[1], 10), p2: !!m[2] };
    const h = /^#\s+/.test(s);
    return { h: h, t: s.replace(/^#\s+/, "").replace(/\s*\n\s*/g, " ") };
  });
}
function chapters(arr){ const out = []; let c = []; arr.forEach(b => { if (b.h && c.length) { out.push(c); c = []; } c.push(b); }); if (c.length) out.push(c); return out; }
function P(text, cont, en){ return '<p lang="' + (en ? "en" : "fr") + '" class="fr' + (cont ? " c" : "") + (text === "* * *" ? " sep" : (text.charAt(0) === "[" ? " epi" : "")) + '">' + esc(text) + "</p>"; }
function H(b){ return '<h2 lang="' + (b.en ? "en" : "fr") + '">' + (b.en ? '<small class="lang">English</small>' : "") + esc(b.t) + "</h2>"; }
function F(b){ return imgs[b.img] ? '<figure class="fig"><img alt="" src="' + imgs[b.img] + '"></figure>' : ""; }

function layout(){
  const w = window.innerWidth, st = $("stage").clientHeight || (window.innerHeight - 160);
  compact = w < 900;
  two = !(compact && view === "one");
  const h = st - 54;
  let pw, ph;
