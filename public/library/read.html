<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SayBon Library - Reader</title>
<style>
:root{--bg:#0d0c10;--gold:#C9A24A;--txt:#ECEDF1;--mut:#9aa0ad;--paper:#f3ead6;--ink:#2a2118;--pw:420px;--ph:600px;--fs:17px;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 28%,#0f4a35 0%,#05261b 74%);color:var(--txt);font-family:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;overflow:hidden;display:flex;flex-direction:column}
.bar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.07)}
.bar a,.bar button{background:rgba(255,255,255,.08);border:0;color:var(--txt);border-radius:999px;height:34px;min-width:34px;padding:0 13px;display:inline-grid;place-items:center;text-decoration:none;cursor:pointer;font:inherit;font-weight:700;font-size:13px;transition:background .45s}
.bar a:hover,.bar button:hover{background:rgba(255,255,255,.17)}
.bar button[disabled]{opacity:.35;cursor:default}
.bar .ttl{flex:1;min-width:0;text-align:center;font-family:Georgia,serif;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#e4dfd0}
.stage{flex:1 1 auto;display:flex;align-items:center;justify-content:center;perspective:2600px;min-height:0;position:relative;user-select:none;-webkit-user-select:none}
.spread{position:relative;height:var(--ph);width:calc(var(--pw) * 2);filter:drop-shadow(0 30px 44px rgba(0,0,0,.65));transition:transform 1.5s var(--ease)}
.spread.single{width:var(--pw)}
.spread.closed:not(.single){transform:translateX(calc(var(--pw) * -.5))}
.slot{position:absolute;top:0;width:var(--pw);height:var(--ph)}
.slot.L{left:0}.slot.R{left:var(--pw)}
.spread.single .slot.R{display:none}
.pg{position:absolute;inset:0;background:var(--paper);color:var(--ink);padding:36px 36px 0;overflow:hidden;
 background-image:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.4),transparent 60%),repeating-linear-gradient(0deg,rgba(120,90,40,.03) 0 1px,transparent 1px 3px)}
.pg.left{border-radius:12px 3px 3px 12px / 16px 3px 3px 16px;box-shadow:inset -30px 0 32px -18px rgba(70,45,15,.55),inset 3px 0 0 rgba(255,255,255,.5)}
.pg.right{border-radius:3px 12px 12px 3px / 3px 16px 16px 3px;box-shadow:inset 30px 0 32px -18px rgba(70,45,15,.55),inset -3px 0 0 rgba(255,255,255,.5)}
.spread.single .pg.left,.spread.single .pg.right{border-radius:6px;box-shadow:inset 22px 0 26px -18px rgba(70,45,15,.5)}
.in{height:calc(var(--ph) - 36px - 46px);overflow:hidden;font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-size:var(--fs);line-height:1.64;hyphens:auto;-webkit-hyphens:auto;text-align:justify;transition:opacity .55s ease}
.in p.fr{text-indent:1.5em}
.in p.fr.c,.in h2+p.fr,.in figure+p.fr{text-indent:0}
.in h2{font-weight:600;font-size:1.55em;text-align:center;margin:.3em 0 .9em;line-height:1.2;color:#3a2a14}
.in h2 small.lang{display:block;font-size:.42em;font-family:"Nunito",sans-serif;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:.7em}
.in figure.fig{margin:.5em 0 .9em;width:100%;aspect-ratio:3/2;max-height:calc(var(--ph) * .33);overflow:hidden}
.in figure.fig img{display:block;width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply;filter:saturate(.94) contrast(.98);-webkit-mask-image:linear-gradient(to right,transparent,#000 10%,#000 90%,transparent),linear-gradient(to bottom,transparent,#000 13%,#000 87%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent,#000 10%,#000 90%,transparent),linear-gradient(to bottom,transparent,#000 13%,#000 87%,transparent);mask-composite:intersect}
.in .end{text-align:center;margin-top:28%;font-style:italic;color:#6a5a45}
.in .end.fin{margin-top:34%;font-size:1.25em;letter-spacing:.04em}
.rdEn{display:block;margin:1.6em auto 0;font:inherit;font-style:normal;font-weight:700;font-size:.7em;letter-spacing:.08em;color:#6b4d12;background:linear-gradient(180deg,#F6DE9A,#E3B54B);border:0;border-radius:999px;padding:.8em 1.6em;cursor:pointer;box-shadow:0 8px 18px -6px rgba(120,80,10,.55);transition:transform .7s cubic-bezier(.22,1,.36,1),box-shadow .7s cubic-bezier(.22,1,.36,1)}
.rdEn:hover{transform:translateY(-3px);box-shadow:0 14px 24px -8px rgba(120,80,10,.6)}
.in.tp{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;height:calc(var(--ph) - 72px)}
.tp .org{font-family:"Nunito",sans-serif;font-size:.62em;font-weight:900;letter-spacing:.3em;text-transform:uppercase;color:#9a7a2e}
.tp .rule{width:64px;height:1.5px;background:var(--gold);margin:1.1em auto}
.tp .tt{font-size:2em;line-height:1.12;font-weight:600;color:#3a2a14}
.tp .au{margin-top:1em;font-style:italic;color:#6a5a45}
.tp .orn{margin-top:1.6em;width:120px;height:14px}
.pg.inner{background:#16543f;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.045) 0 1px,transparent 1px 14px),repeating-linear-gradient(-45deg,rgba(255,255,255,.045) 0 1px,transparent 1px 14px);box-shadow:inset -30px 0 36px -14px rgba(0,0,0,.55);color:#e7cf8f}
.pg.inner .fr{position:absolute;inset:26px;border:1.5px solid rgba(201,162,74,.65);border-radius:6px;display:grid;place-items:center;text-align:center;font-family:Georgia,serif;font-style:italic;font-size:15px;letter-spacing:.06em}
.pn{position:absolute;bottom:15px;left:0;right:0;text-align:center;font-family:Georgia,serif;font-size:12px;color:#8a7a62;transition:opacity .55s ease}
.spread.fade .in,.spread.fade .pn{opacity:0}
.cover{position:absolute;inset:0;border-radius:4px 12px 12px 4px;overflow:hidden;background:#143f50;box-shadow:inset 8px 0 14px -6px rgba(0,0,0,.55)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover:before{content:"";position:absolute;left:0;top:0;bottom:0;width:16px;z-index:2;background:linear-gradient(90deg,rgba(0,0,0,.5),rgba(255,255,255,.18) 40%,rgba(0,0,0,.18) 70%,transparent)}
.cover:after{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(115deg,rgba(255,255,255,.2),transparent 38%);pointer-events:none}
.cover .gen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 28px 30px 38px;font-family:Georgia,serif;color:#f6efd8}
.cover .gen b{font-size:calc(var(--pw) * .1);line-height:1.18;font-weight:600}.cover .gen i{display:block;width:44px;height:2px;background:var(--gold);margin:16px 0}.cover .gen span{font-size:calc(var(--pw)*.045);letter-spacing:.14em;text-transform:uppercase;opacity:.85;font-family:"Nunito",sans-serif;font-weight:800}
.closedwrap{position:absolute;inset:0;cursor:pointer;border-radius:4px 12px 12px 4px;box-shadow:7px 0 0 #efe5cc,8px 0 0 #cfc2a0,11px 4px 0 #efe5cc,12px 5px 0 #cfc2a0,0 22px 40px rgba(0,0,0,.6);transition:transform .9s var(--ease)}
.closedwrap:hover{transform:translateY(-8px) rotateY(-4deg)}
.closedwrap .hint{position:absolute;left:0;right:0;bottom:-44px;text-align:center;font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.leaf{position:absolute;top:0;width:var(--pw);height:var(--ph);transform-style:preserve-3d;z-index:5;will-change:transform}
.leaf.fromR{left:var(--pw);transform-origin:left center}
.leaf.fromL{left:0;transform-origin:right center}
.spread.single .leaf.fromR{left:0}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.45),transparent 70%);opacity:0;z-index:2}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:0;border-radius:12px;background:rgba(255,255,255,.07);color:var(--txt);font-size:26px;cursor:pointer;z-index:10}
.nav:hover{background:rgba(255,255,255,.15)}.nav:disabled{opacity:.15;cursor:default}
.nav.p{left:12px}.nav.n{right:12px}
.foot{flex:0 0 auto;text-align:center;color:var(--mut);font-size:12.5px;padding:8px 0 12px;min-height:34px}
.msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);text-align:center;padding:20px}
.meas{position:absolute;left:-9999px;top:0;visibility:hidden}
.meas .pg{position:relative;inset:auto;width:var(--pw);height:var(--ph)}
@media (max-width:899px){.nav{display:none}}
</style>
</head>
<body>
<div class="bar">
<a href="/library/" title="Back to the library">&#8249; Library</a>
<div class="ttl" id="ttl">&nbsp;</div>
<button id="cv" type="button" title="Close the book" disabled>Cover</button>
<button id="fm" type="button" title="Smaller text">A&minus;</button>
<button id="fp" type="button" title="Larger text">A+</button>
</div>
<div class="stage" id="stage">
<button class="nav p" id="prev" type="button" aria-label="Previous page">&#8249;</button>
<div class="spread closed" id="spread"><div class="slot L" id="sL"></div><div class="slot R" id="sR"></div></div>
<button class="nav n" id="next" type="button" aria-label="Next page">&#8250;</button>
<div class="msg" id="msg">Opening the book&hellip;</div>
</div>
<div class="foot" id="foot">&nbsp;</div>
<div class="meas" id="meas"><div class="pg"><div class="in" id="minner"></div></div></div>
<script src="/library/books.js"></script>
<script type="module">
import { auth } from "/js/firebase-init.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const db = getFirestore(auth.app);
const id = new URLSearchParams(location.search).get("b");
const $ = x => document.getElementById(x);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
const wait = ms => new Promise(r => setTimeout(r, ms));
const TONES = [["#1d5c45","#0f3a2c"],["#1f6f78","#12444b"],["#7a2a3c","#481a25"],["#26396b","#16213f"],["#8a6a1f","#55400f"],["#5a2f6b","#35193f"]];
let enPage = -1, bil = false;
let meta = null, blocks = [], imgs = {}, content = [], Q = [], two = true, cur = 0, busy = false, closed = true;
let fs = parseInt(LS.get("sbLibFs") || "17", 10) || 17, savedBlk = 0;

function parse(t){
  return String(t || "").replace(/\r/g, "").split(/\n\s*\n/).map(s => s.trim()).filter(Boolean).map(s => {
    const m = /^\[img:(\d+)\]$/i.exec(s);
    if (m) return { img: parseInt(m[1], 10) };
    const h = /^#\s+/.test(s);
    return { h: h, t: s.replace(/^#\s+/, "").replace(/\s*\n\s*/g, " ") };
  });
}
function chapters(arr){ const out = []; let c = []; arr.forEach(b => { if (b.h && c.length) { out.push(c); c = []; } c.push(b); }); if (c.length) out.push(c); return out; }
function P(text, cont){ return '<p class="fr' + (cont ? " c" : "") + '">' + esc(text) + "</p>"; }
function H(b){ return "<h2>" + (b.en ? '<small class="lang">English</small>' : "") + esc(b.t) + "</h2>"; }
function F(b){ return imgs[b.img] ? '<figure class="fig"><img alt="" src="' + imgs[b.img] + '"></figure>' : ""; }

function layout(){
  const w = window.innerWidth, h = window.innerHeight - 110;
  two = w >= 900;
  let ph = Math.min(h, 780), pw = ph * 0.72;
  const maxW = two ? (w - 150) / 2 : (w - 24);
  if (pw > maxW) { pw = maxW; ph = pw / 0.72; }
  const r = document.documentElement.style;
  r.setProperty("--pw", Math.floor(pw) + "px"); r.setProperty("--ph", Math.floor(ph) + "px"); r.setProperty("--fs", fs + "px");
  $("spread").classList.toggle("single", !two);
}
function paginate(){
  const inner = $("minner"), items = [];
  content = [];
  let startBlk = 0;
  const html = () => items.map(x => x.h).join("");
  const fits = cand => { inner.innerHTML = html() + cand; return inner.scrollHeight <= inner.clientHeight + 1; };
  function flush(nextBlk){
    const carry = [];
    while (items.length > 1 && items[items.length - 1].head) carry.unshift(items.pop());
    content.push({ html: html(), blk: startBlk });
    items.length = 0; startBlk = nextBlk;
    carry.forEach(x => items.push(x));
    if (carry.length) startBlk = Math.max(0, nextBlk - 1);
  }
  for (let bi = 0; bi < blocks.length; bi++) {
    const b = blocks[bi];
    if (!items.length) startBlk = bi;
    if (b.fin) { if (items.length) flush(bi); startBlk = bi; items.push({ h: '<div class="end fin">&mdash; Fin &mdash;<button class="rdEn" type="button">Read the English version</button></div>' }); continue; }
    if (b.enStart) { if (items.length) flush(bi); if (two && content.length % 2 === 1) content.push({ html: "", blk: bi, blank: true }); enPage = content.length; startBlk = bi; }
    if (b.img) { const f = F(b); if (!f) continue; if (!fits(f) && items.length) { flush(bi); startBlk = bi; } items.push({ h: f }); continue; }
    if (b.h) { if (items.length) { flush(bi); startBlk = bi; } items.push({ h: H(b), head: true }); continue; }
    let rest = b.t.split(/\s+/), cont = false, guard = 0;
    while (rest.length && guard++ < 5000) {
      if (fits(P(rest.join(" "), cont))) { items.push({ h: P(rest.join(" "), cont) }); rest = []; break; }
      let lo = 0, hi = rest.length - 1;
      while (lo < hi) { const mid = Math.ceil((lo + hi + 1) / 2); if (fits(P(rest.slice(0, mid).join(" "), cont))) lo = mid; else hi = mid - 1; }
      let k = lo;
      if (k === 0) { if (items.length) { flush(bi); continue; } k = 1; }
      items.push({ h: P(rest.slice(0, k).join(" "), cont) });
      rest = rest.slice(k); cont = true; flush(bi);
    }
  }
  const endH = bil ? '<div class="end">&mdash; The End &mdash;</div>' : '<div class="end">&mdash; Fin &mdash;<br>The End</div>';
  if (items.length && fits(endH)) items.push({ h: endH }); else { if (items.length) flush(blocks.length); items.push({ h: endH }); }
  flush(blocks.length);
  if (!content.length) content.push({ html: "", blk: 0 });
}
function buildQ(){
  Q = (two ? [{ kind: "inner" }] : []).concat([{ kind: "title" }], content.map((p, i) => ({ kind: "c", html: p.html, blk: p.blk, no: i + 1, blank: !!p.blank })));
}
const ORN = '<svg class="orn" viewBox="0 0 120 14" fill="none" stroke="#C9A24A" stroke-width="1.3"><path d="M2 7h46M72 7h46"/><path d="M60 1l6 6-6 6-6-6z" fill="#C9A24A" stroke="none"/></svg>';
function pageEl(i, side){
  const d = document.createElement("div");
  d.className = "pg " + side;
  const q = i >= 0 ? Q[i] : null;
  if (!q) return d;
  if (q.kind === "inner") { d.className += " inner"; d.innerHTML = '<div class="fr">SayBon Library</div>'; return d; }
  if (q.kind === "title") { d.innerHTML = '<div class="in tp"><div class="org">' + (meta.original === false ? "" : "SayBon Original") + '</div><div class="rule"></div><div class="tt">' + esc(meta.title) + '</div>' + (meta.author ? '<div class="au">' + esc(meta.author) + "</div>" : "") + ORN + "</div>"; return d; }
  if (q.blank) return d;
  d.innerHTML = '<div class="in">' + q.html + '</div><div class="pn">' + q.no + "</div>";
  return d;
}
function blank(side){ return pageEl(-1, side); }
function coverEl(){
  const d = document.createElement("div");
  d.className = "cover";
  if (meta.cover) d.innerHTML = '<img alt="" src="' + meta.cover + '">';
  else { let h = 0; const t = meta.title || ""; for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) >>> 0; const tn = TONES[h % TONES.length]; d.style.background = "linear-gradient(150deg," + tn[0] + "," + tn[1] + ")"; d.innerHTML = '<div class="gen"><b>' + esc(t) + "</b><i></i><span>" + esc(meta.author || "") + "</span></div>"; }
  return d;
}
function setSlot(slot, i, side){ const s = $(slot); s.innerHTML = ""; s.appendChild(pageEl(i, side)); }
function renderClosed(){
  const sp = $("spread"); sp.classList.add("closed"); sp.classList.remove("fade");
  $("sL").innerHTML = ""; const r = $("sR"); r.innerHTML = "";
  const w = document.createElement("div"); w.className = "closedwrap"; w.appendChild(coverEl());
  const hnt = document.createElement("div"); hnt.className = "hint"; hnt.textContent = "Tap to open";
  w.appendChild(hnt); w.addEventListener("click", ev => { ev.stopPropagation(); openBook(); });
  if (!two) { r.style.display = "none"; $("sL").appendChild(w); } else { r.appendChild(w); }
  $("prev").disabled = true; $("next").disabled = true; $("cv").disabled = true;
  $("foot").textContent = "";
}
const lastQ = () => Q.length - 1;
function firstIdx(){ return two ? cur * 2 : cur; }
function show(){
  const sp = $("spread"); sp.classList.remove("closed");
  $("sR").style.display = "";
  if (two) { setSlot("sL", cur * 2, "left"); setSlot("sR", cur * 2 + 1, "right"); }
  else { setSlot("sL", cur, "left"); }
  const f = firstIdx(), vis = two ? [f, f + 1] : [f];
  $("prev").disabled = cur <= 0;
  const lastVis = vis[vis.length - 1];
  $("next").disabled = lastVis >= lastQ();
  $("cv").disabled = false;
  const nums = vis.map(i => Q[i] && Q[i].kind === "c" ? Q[i].no : null).filter(x => x);
  $("foot").textContent = nums.length ? "Page " + nums.join("\u2013") + " of " + content.length : (meta.title || "");
  const c = vis.map(i => Q[i]).filter(q => q && q.kind === "c")[0];
  savedBlk = c ? c.blk : 0;
  LS.set("sbLib:" + id, String(savedBlk));
  if (lastVis >= lastQ()) LS.set("sbLib:" + id + ":done", "1");
}
function maxCur(){ return two ? Math.ceil(Q.length / 2) - 1 : Q.length - 1; }
function mkLeaf(cls, front, back){
  const leaf = document.createElement("div"), fr = document.createElement("div"), bk = document.createElement("div");
  leaf.className = "leaf " + cls; fr.className = "face"; bk.className = "face back";
  fr.appendChild(front); bk.appendChild(back); leaf.appendChild(fr); leaf.appendChild(bk);
  return leaf;
}
const FLIP = { duration: 1600, easing: "cubic-bezier(.45,.05,.2,1)", fill: "forwards" };
async function flip(dir, target){
  if (busy || closed) return;
  const mx = maxCur();
  if (target == null && ((dir > 0 && cur >= mx) || (dir < 0 && cur <= 0))) return;
  busy = true;
  const sp = $("spread");
  sp.classList.add("fade");
  await wait(560);
  let leaf, frames, base;
  if (two) {
    if (dir > 0) { leaf = mkLeaf("fromR", blank("right"), blank("left")); frames = [{ transform: "rotateY(0deg)" }, { transform: "rotateY(-180deg)" }]; base = $("sR"); }
    else { leaf = mkLeaf("fromL", blank("left"), blank("right")); frames = [{ transform: "rotateY(0deg)" }, { transform: "rotateY(180deg)" }]; base = $("sL"); }
  } else {
    leaf = mkLeaf("fromR", blank("left"), blank("right")); base = $("sL");
    frames = dir > 0 ? [{ transform: "rotateY(0deg)" }, { transform: "rotateY(-180deg)" }] : [{ transform: "rotateY(-180deg)" }, { transform: "rotateY(0deg)" }];
  }
  const shade = document.createElement("div"); shade.className = "shade"; base.appendChild(shade);
  sp.appendChild(leaf);
  shade.animate([{ opacity: 0 }, { opacity: .5 }, { opacity: 0 }], { duration: FLIP.duration, easing: "ease-in-out" });
  const a = leaf.animate(frames, FLIP);
  try { await a.finished; } catch (e) {}
  cur = target == null ? cur + dir : target; show(); leaf.remove();
  await wait(80);
  sp.classList.remove("fade");
  busy = false;
}
async function openBook(){
  if (!closed || busy) return;
  busy = true; closed = false;
  const sp = $("spread");
  sp.classList.add("fade");
  cur = 0;
  let leaf;
  if (two) {
    $("sR").innerHTML = ""; $("sR").appendChild(pageEl(1, "right"));
    $("sL").innerHTML = "";
    leaf = mkLeaf("fromR", coverEl(), pageEl(0, "left"));
    $("sR").style.display = "";
  } else {
    $("sL").innerHTML = ""; $("sL").appendChild(pageEl(0, "left"));
    leaf = mkLeaf("fromR", coverEl(), blank("right"));
  }
  sp.appendChild(leaf);
  void sp.offsetWidth;
  sp.classList.remove("closed");
  const a = leaf.animate([{ transform: "rotateY(0deg)" }, { transform: "rotateY(-180deg)" }], { duration: 1800, easing: "cubic-bezier(.45,.05,.2,1)", fill: "forwards" });
  try { await a.finished; } catch (e) {}
  show(); leaf.remove();
  await wait(120);
  sp.classList.remove("fade");
  busy = false;
}
async function closeBook(){
  if (closed || busy) return;
  busy = true;
  const sp = $("spread");
  sp.classList.add("fade");
  await wait(560);
  let leaf;
  if (two) leaf = mkLeaf("fromR", coverEl(), pageEl(0, "left")); else leaf = mkLeaf("fromR", coverEl(), blank("right"));
  sp.appendChild(leaf);
  const a = leaf.animate([{ transform: "rotateY(-180deg)" }, { transform: "rotateY(0deg)" }], { duration: 1500, easing: "cubic-bezier(.45,.05,.2,1)", fill: "forwards" });
  sp.classList.add("closed");
  try { await a.finished; } catch (e) {}
  closed = true; renderClosed(); leaf.remove();
  sp.classList.remove("fade");
  busy = false;
}
function rebuild(keepBlk){
  layout(); paginate(); buildQ();
  if (closed) { renderClosed(); return; }
  let f = two ? 1 : 0;
  for (let i = 0; i < Q.length; i++) if (Q[i].kind === "c" && Q[i].blk <= keepBlk) f = i;
  cur = two ? Math.floor(f / 2) : f;
  show();
}
function gotoEnglish(){
  if (enPage < 0 || busy || closed) return;
  const qi = (two ? 2 : 1) + enPage, t = two ? Math.floor(qi / 2) : qi;
  if (t !== cur) flip(t > cur ? 1 : -1, t);
}
$("next").onclick = () => flip(1);
$("prev").onclick = () => flip(-1);
$("cv").onclick = () => closeBook();
$("stage").addEventListener("click", e => {
  if (e.target.closest(".rdEn")) { gotoEnglish(); return; }
  if (closed || e.target.closest(".nav")) return;
  const r = $("spread").getBoundingClientRect();
  if (e.clientX < r.left || e.clientX > r.right) return;
  const x = (e.clientX - r.left) / r.width;
  if (two) flip(x > .5 ? 1 : -1); else flip(x > .35 ? 1 : -1);
});
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown" || e.key === "Enter") { e.preventDefault(); if (closed) openBook(); else flip(1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") flip(-1);
});
let tx = 0, ty = 0;
$("stage").addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
$("stage").addEventListener("touchend", e => { const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; if (!closed && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { e.preventDefault(); flip(dx < 0 ? 1 : -1); } });
function fsBtn(d){ fs = Math.max(13, Math.min(26, fs + d)); LS.set("sbLibFs", String(fs)); if (!busy) rebuild(savedBlk); }
$("fm").onclick = () => fsBtn(-1);
$("fp").onclick = () => fsBtn(1);
let rt = 0;
window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (!busy && blocks.length) rebuild(savedBlk); }, 200); });

(async function(){
  if (!id) { $("msg").textContent = "No book selected."; return; }
  try {
    const CB = (window.SB_BOOKS || []).filter(x => x && x.id === id)[0];
    let td;
    if (CB) { meta = CB; td = { fr: CB.fr, en: CB.en }; }
    else {
      const m = await getDoc(doc(db, "libraryBooks", id));
      if (!m.exists()) { $("msg").textContent = "This book could not be found."; return; }
      meta = m.data();
      const t = await getDoc(doc(db, "libraryTexts", id));
      td = t.exists() ? t.data() : {};
    }
    $("ttl").textContent = meta.title + (meta.author ? " \u2014 " + meta.author : "");
    document.title = meta.title + " | SayBon Library";
    bil = meta.format === "bilingual";
    const fr = parse(td.fr), en = bil ? parse(td.en) : [];
    if (bil && en.length) {
      blocks = fr.concat([{ fin: true }], en.map((x, i) => Object.assign({}, x, { en: true, enStart: i === 0 })));
    } else { bil = false; blocks = fr; }
    if (!blocks.length) { $("msg").textContent = "This book has no text yet."; return; }
    const need = Array.from(new Set(blocks.filter(b => b.img).map(b => b.img)));
    if (CB && CB.imgs) need.forEach(n => { if (CB.imgs[n]) imgs[n] = CB.imgs[n]; });
    else await Promise.all(need.map(async n => { try { const d = await getDoc(doc(db, "libraryImages", id + "_" + n)); if (d.exists()) imgs[n] = d.data().data; } catch (e) {} }));
    const key = LS.get("sbLib:" + id);
    savedBlk = key === null ? 0 : (parseInt(key, 10) || 0);
    closed = key === null;
    $("msg").style.display = "none";
    rebuild(savedBlk);
    window.__lib = { pages: () => content.length, cur: () => cur, closed: () => closed, open: openBook };
  } catch (e) { $("msg").textContent = "Could not open the book. Please refresh."; }
})();
</script>
