<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Talkletics</title>
<link rel="stylesheet" href="./talkletics.css?v=99">
</head>
<body>

<div class="background"></div>

<div class="logo-card">
    <img
        id="talkleticsLogo"
        src="/assets/talkletics/logo.png?v=99"
        alt="Talkletics"
    >
</div>

<div id="guideStack">

    <img id="guideIdle"
         class="guide-layer active"
         src="/assets/talkletics/guide.png">

    <img id="guideBlink"
         class="guide-layer"
         src="/assets/talkletics/guide-blink.png">

    <img id="guideWave"
         class="guide-layer"
         src="/assets/talkletics/guide-wave.png">

    <img id="guideWink"
         class="guide-layer"
         src="/assets/talkletics/guide-wink.png">

    <img id="guideSalute"
         class="guide-layer"
         src="/assets/talkletics/guide-salute.png">

</div>

    <script src="./guide-animation.js"></script>
</body>
</html>
