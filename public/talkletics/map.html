<!DOCTYPE html>
<html lang="fr">
<head>
<script type="module" src="/js/auth-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Talkletics — World Map</title>
<link rel="stylesheet" href="map.css?v=10">
</head>
<body>
<div class="tkm-stage">

  <div class="tkm-glass-sheen"></div>

  <button class="tkm-corner-icon tkm-corner-back" onclick="location.href='index.html'" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>

  <div class="tkm-corner-icon-group">
    <button class="tkm-corner-icon" onclick="location.href='/'" aria-label="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 11.5 12 4l9 7.5"></path>
        <path d="M5.5 10v9a1 1 0 0 0 1 1H9v-6h6v6h2.5a1 1 0 0 0 1-1v-9"></path>
      </svg>
    </button>
    <button class="tkm-corner-icon" onclick="location.href='/dashboard/'" aria-label="Dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
        <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
        <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
        <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
      </svg>
    </button>
  </div>

  <div class="tkm-title-card">
    <h1 class="tkm-title">It's a SayBon World</h1>
  </div>

  <svg id="tkmPathDesktop" class="tkm-path-svg tkm-path-desktop" preserveAspectRatio="xMidYMid meet">
    <path id="tkmPathBgDesktop" fill="none" stroke="#7a828a" stroke-width="38" stroke-linecap="round"/>
    <path id="tkmPathLineDesktop" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-dasharray="16 16"/>
  </svg>

  <svg id="tkmPathMobile" class="tkm-path-svg tkm-path-mobile" preserveAspectRatio="xMidYMid meet">
    <path id="tkmPathBgMobile" fill="none" stroke="#7a828a" stroke-width="34" stroke-linecap="round"/>
    <path id="tkmPathLineMobile" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 14"/>
  </svg>

  <div class="tkm-nodes" id="tkmNodes"></div>

</div>
<script src="map.js?v=4"></script>
</body>
</html>
