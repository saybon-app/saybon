<!DOCTYPE html>
<html lang="en">
<head>
<script type='module' src='/js/auth-guard.js'></script>
  <meta charset="UTF-8" />
  <title>Chat — SayBon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/chat/chat.css?v=20260811c" />
</head>
<body>

<button class="global-home-btn" id="homeBtn" aria-label="Home">
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 10.5L12 3l9 7.5"/>
    <path d="M5 9.5V21h14V9.5"/>
  </svg>
</button>
<button class="global-dashboard-btn" id="dashboardBtn" aria-label="Dashboard">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
    <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
  </svg>
</button>

<div class="chatroom-shell">

  <aside class="sidebar">

    <div class="sidebar-brand">
      <span class="sidebar-brand-mark">S</span>
      <span class="sidebar-brand-name">SayBon Chat</span>
    </div>

    <button class="new-chat-btn" id="toggleBtn">+ Browse Rooms</button>

    <div class="conversations-label">Rooms</div>

    <div class="conversation-list">

      <button class="room-btn conversation-item" data-room="General" data-room-id="general">
        <span class="conversation-avatar">💬</span>
        <span class="conversation-body">
          <span class="conversation-top-row">
            <span class="conversation-name">General</span>
            <span class="conversation-time" id="time-general"></span>
          </span>
          <span class="conversation-preview" id="preview-general">No messages yet</span>
        </span>
      </button>

      <button class="room-btn conversation-item" data-room="Grammar &amp; Vocab" data-room-id="grammar-vocab">
        <span class="conversation-avatar">📖</span>
        <span class="conversation-body">
          <span class="conversation-top-row">
            <span class="conversation-name">Grammar &amp; Vocab</span>
            <span class="conversation-time" id="time-grammar-vocab"></span>
          </span>
          <span class="conversation-preview" id="preview-grammar-vocab">No messages yet</span>
        </span>
      </button>

      <button class="room-btn conversation-item" data-room="Practice Partners" data-room-id="practice-partners">
        <span class="conversation-avatar">🗣️</span>
        <span class="conversation-body">
          <span class="conversation-top-row">
            <span class="conversation-name">Practice Partners</span>
            <span class="conversation-time" id="time-practice-partners"></span>
          </span>
          <span class="conversation-preview" id="preview-practice-partners">No messages yet</span>
        </span>
      </button>

      <button class="room-btn conversation-item" data-room="Culture Corner" data-room-id="culture-corner">
        <span class="conversation-avatar">🎭</span>
        <span class="conversation-body">
          <span class="conversation-top-row">
            <span class="conversation-name">Culture Corner</span>
            <span class="conversation-time" id="time-culture-corner"></span>
          </span>
          <span class="conversation-preview" id="preview-culture-corner">No messages yet</span>
        </span>
      </button>

    </div>

    <div class="promo-card">
      <div class="promo-icon">💎</div>
      <div class="promo-title">New here?</div>
      <div class="promo-sub">Say bonjour and introduce yourself!</div>
      <button class="promo-btn" id="promoBtn">Say Hello →</button>
    </div>

    <div class="sidebar-profile">
      <img class="sidebar-profile-avatar" id="sidebarProfileAvatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23163c3f'/%3E%3Ccircle cx='32' cy='24' r='12' fill='%232f9e91'/%3E%3Cellipse cx='32' cy='54' rx='20' ry='16' fill='%232f9e91'/%3E%3C/svg%3E" alt="" />
      <div class="sidebar-profile-text">
        <div class="sidebar-profile-name" id="sidebarProfileName">Learner</div>
        <div class="sidebar-profile-email" id="sidebarProfileEmail"></div>
      </div>
    </div>

  </aside>

  <div class="workspace">

    <div class="welcome-workspace" id="welcomeWorkspace">
      <div class="welcome-inner">
        <div class="welcome-overline">Welcome to the</div>
        <h1 class="welcome-title">Community</h1>
        <div class="welcome-divider">
          <span class="divider-line"></span>
          <span class="divider-leaf">✨</span>
          <span class="divider-line"></span>
        </div>
      </div>
    </div>

    <div class="chat-workspace hidden" id="chatWorkspace">

      <div class="chat-header">
        <div class="chat-header-left">
          <button class="mobile-back-btn" id="mobileBackBtn" aria-label="Back to chats">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          </button>
          <span class="room-avatar" id="roomAvatar">💬</span>
          <div>
            <h2 class="room-title" id="roomTitle">General</h2>
            <div class="room-subtitle">Chat with other SayBon learners</div>
          </div>
        </div>

        <div class="chat-header-actions">
          <button class="header-icon-btn" id="searchToggle" title="Search (coming soon)">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          </button>
          <button class="header-icon-btn" id="menuToggle" title="More">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="#fff"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
          </button>
        </div>
      </div>

      <div class="search-row hidden" id="searchRow">
        <input class="search-input" id="searchInput" placeholder="Search messages... (coming soon)" disabled />
      </div>

      <div class="messages-container" id="messagesContainer"></div>

      <div class="media-preview hidden" id="mediaPreview"></div>

      <div class="composer" id="composer">
        <button class="composer-icon" id="mediaBtn">📎</button>
        <input type="file" id="mediaInput" multiple hidden />
        <input class="composer-input" id="composerInput" placeholder="Type your message..." />
        <button class="composer-icon" id="voiceBtn">🎤</button>
        <button class="send-btn" id="sendBtn" aria-label="Send">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
        </button>
      </div>

      <div class="composer-footer">Messages are visible to everyone in this room</div>

      <div class="recording-panel hidden" id="recordingPanel">
        <span id="recordingTimer">0:00</span>
        <button id="cancelRecording">Cancel</button>
        <button id="sendRecording">Done</button>
      </div>

    </div>

  </div>

</div>

<img id="avatarPreview" hidden />
<button id="avatarCamera" hidden></button>
<input type="file" id="avatarInput" accept="image/*" hidden />
<div id="userEmail" hidden></div>

<script type="module" src="/chat/chat.js?v=20260811c"></script>
</body>
</html>
