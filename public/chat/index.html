<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8"/>

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>SayBon Chatroom</title>

<link
rel="preconnect"
href="https://fonts.googleapis.com"
/>

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin
/>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
rel="stylesheet"
/>

<link
rel="stylesheet"
href="./chat.css"
/>

</head>

<body>

<div class="chatroom-shell">

<!-- SIDEBAR -->
<aside class="sidebar">

<button
class="sidebar-btn active"
id="toggleBtn"
title="Welcome"
>
☰
</button>

<button
class="sidebar-btn room-btn"
data-room="Lessons"
title="Lessons"
>
📚
</button>

<button
class="sidebar-btn room-btn"
data-room="DELF"
title="DELF"
>
🎓
</button>

<button
class="sidebar-btn room-btn"
data-room="Music"
title="Music"
>
🎧
</button>

<button
class="sidebar-btn room-btn"
data-room="Translation Services"
title="Translation Services"
>
🌐
</button>

<button
class="sidebar-btn room-btn"
data-room="Feedback"
title="Feedback"
>
📝
</button>

<button
class="sidebar-btn room-btn"
data-room="Support"
title="Support"
>
💚
</button>

<button
class="sidebar-btn"
id="dashboardBtn"
title="Dashboard"
>
🎲
</button>

<button
class="sidebar-btn"
id="homeBtn"
title="Home"
>
🏠
</button>

</aside>

<!-- WORKSPACE -->
<main class="workspace">

<!-- WELCOME -->
<section
class="welcome-workspace"
id="welcomeWorkspace"
>

<div class="welcome-inner">

<div class="welcome-overline">
Welcome to the
</div>

<h1 class="welcome-title">
SayBon Community
</h1>

<div class="welcome-divider">

<span class="divider-line"></span>

<span class="divider-leaf">❦</span>

<span class="divider-line"></span>

</div>

</div>

</section>

<!-- LIVE CHAT -->
<section
class="chat-workspace hidden"
id="chatWorkspace"
>

<!-- HEADER -->
<div class="chat-header">

<div class="chat-header-left">

<h2
class="room-title"
id="roomTitle"
>
Lessons
</h2>

<p class="room-subtitle">
Live community discussion
</p>

</div>

<div class="chat-header-right">

<div class="avatar-shell">

<img
id="avatarPreview"
class="avatar-preview"
src="https://i.pravatar.cc/150?img=32"
/>

<label
for="avatarInput"
class="avatar-camera"
>
📷
</label>

<input
type="file"
id="avatarInput"
hidden
accept="image/*"
/>

</div>

<div class="user-email">
learner@saybonapp.com
</div>

</div>

</div>

<!-- SEARCH -->
<div class="search-row">

<input
type="text"
placeholder="Search messages..."
class="search-input"
/>

</div>

<!-- MESSAGES -->
<div
class="messages-container"
id="messagesContainer"
>

<!-- INCOMING -->
<div class="message-row incoming">

<div class="message-avatar">
A
</div>

<div class="message-bubble incoming-bubble">

<div class="message-user">
Ama
</div>

<div class="message-text">
Has anyone found a good way to improve French listening comprehension quickly?
</div>

</div>

</div>

<!-- OUTGOING -->
<div class="message-row outgoing">

<div class="message-bubble outgoing-bubble">

<div class="message-user">
You
</div>

<div class="message-text">
Shadowing exercises helped me a lot with pronunciation and listening together.
</div>

</div>

</div>

<!-- VOICE -->
<div class="voice-note incoming">

<button class="voice-play">
▶
</button>

<div class="voice-bars">

<span></span>
<span></span>
<span></span>
<span></span>
<span></span>

</div>

<div class="voice-time">
0:18
</div>

</div>

</div>

<!-- MEDIA PREVIEW -->
<div
class="media-preview hidden"
id="mediaPreview"
>
</div>

<!-- COMPOSER -->
<div
class="composer"
id="composer"
>

<button
class="composer-icon"
id="mediaBtn"
>
📎
</button>

<input
type="file"
id="mediaInput"
hidden
multiple
/>

<input
type="text"
placeholder="Type a message..."
class="composer-input"
id="composerInput"
/>

<button
class="composer-icon"
id="voiceBtn"
>
🎙️
</button>

<button
class="send-btn"
id="sendBtn"
>
Send
</button>

</div>

<!-- RECORDING MODE -->
<div
class="recording-panel hidden"
id="recordingPanel"
>

<button
class="recording-cancel"
id="cancelRecording"
>
✕
</button>

<div class="recording-wave">

<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>

</div>

<div
class="recording-timer"
id="recordingTimer"
>
0:00
</div>

<button
class="recording-send"
id="sendRecording"
>
Send
</button>

</div>

</section>

</main>

</div>

<script src="./chat.js"></script>

</body>
</html>
