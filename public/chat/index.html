<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8"/>

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>SayBon Chatroom</title>

<link
rel="preconnect"
href="https://fonts.googleapis.com"
/>

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin
/>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
rel="stylesheet"
/>

<link
rel="stylesheet"
href="./chat.css"
/>

</head>

<body>

<div class="chat-shell">

<!-- SIDEBAR -->
<aside class="sidebar">

<button
class="sidebar-btn active"
id="toggleBtn"
>
☰
</button>

<button
class="sidebar-btn room-btn"
data-room="Lessons"
>
📚
</button>

<button
class="sidebar-btn room-btn"
data-room="DELF"
>
🎓
</button>

<button
class="sidebar-btn room-btn"
data-room="Music"
>
🎧
</button>

<button
class="sidebar-btn room-btn"
data-room="Translation Services"
>
🌐
</button>

<button
class="sidebar-btn room-btn"
data-room="Feedback"
>
📝
</button>

<button
class="sidebar-btn room-btn"
data-room="Support"
>
💚
</button>

<button
class="sidebar-btn"
id="dashboardBtn"
>
🎲
</button>

<button
class="sidebar-btn"
id="homeBtn"
>
🏠
</button>

</aside>

<!-- WORKSPACE -->
<main class="workspace">

<!-- WELCOME -->
<section
class="welcome-view"
id="welcomeView"
>

<div class="welcome-content">

<div class="welcome-badge">
SAYBON COMMUNITY
</div>

<h1 class="welcome-title">
SayBon Chatroom
</h1>

<p class="welcome-subtitle">

A premium live community space for learners,
music lovers, translators, DELF students,
and the global SayBon ecosystem.

</p>

</div>

</section>

<!-- LIVE CHAT -->
<section
class="chat-view hidden"
id="chatView"
>

<!-- HEADER -->
<div class="chat-header">

<div class="chat-room-info">

<h2
class="chat-room-title"
id="chatRoomTitle"
>
Lessons
</h2>

<p class="chat-room-subtitle">
Live community discussion
</p>

</div>

<div class="chat-user-panel">

<div class="avatar-wrapper">

<img
id="profileAvatar"
class="profile-avatar"
src="https://i.pravatar.cc/120?img=32"
/>

<label
for="avatarInput"
class="avatar-camera"
>
📷
</label>

<input
type="file"
id="avatarInput"
hidden
accept="image/*"
/>

</div>

<div class="user-email">
learner@saybonapp.com
</div>

</div>

</div>

<!-- SEARCH -->
<div class="search-wrap">

<input
type="text"
placeholder="Search messages..."
class="search-input"
/>

</div>

<!-- MESSAGES -->
<div
class="messages-area"
id="messagesArea"
>

<div class="message incoming">

<div class="message-avatar">
A
</div>

<div class="message-bubble">

<div class="message-name">
Ama
</div>

<div class="message-text">
Welcome to the discussion room.
</div>

</div>

</div>

<div class="message outgoing">

<div class="message-bubble">

<div class="message-name">
You
</div>

<div class="message-text">
Glad to be here.
</div>

</div>

</div>

<div class="voice-message incoming">

<button class="voice-play">
▶
</button>

<div class="voice-wave">

<span></span>
<span></span>
<span></span>
<span></span>
<span></span>

</div>

<div class="voice-duration">
0:18
</div>

</div>

</div>

<!-- MEDIA PREVIEW -->
<div
class="media-preview hidden"
id="mediaPreview"
>
</div>

<!-- COMPOSER -->
<div
class="composer"
id="composer"
>

<button
class="composer-btn"
id="mediaBtn"
>
📎
</button>

<input
type="file"
id="mediaInput"
hidden
multiple
/>

<input
type="text"
placeholder="Type a message..."
class="composer-input"
id="composerInput"
/>

<button
class="composer-btn"
id="voiceBtn"
>
🎙️
</button>

<button
class="send-btn"
id="sendBtn"
>
Send
</button>

</div>

<!-- RECORDING MODE -->
<div
class="recording-mode hidden"
id="recordingMode"
>

<button
class="recording-cancel"
id="cancelRecording"
>
✕
</button>

<div class="recording-wave">

<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>

</div>

<div
class="recording-timer"
id="recordingTimer"
>
0:00
</div>

<button
class="recording-send"
id="sendRecording"
>
Send
</button>

</div>

</section>

</main>

</div>

<script src="./chat.js"></script>

</body>
</html>
