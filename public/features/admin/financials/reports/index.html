<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="/features/admin/auth/admin-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports - SayBon Financials</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Manrope",-apple-system,sans-serif;background:linear-gradient(165deg,#0c1016 0%,#151b26 50%,#1b2230 100%);color:#e6e1d3;min-height:100vh;padding:60px 24px;}
.fn-stage{max-width:800px;margin:0 auto;}
.fn-corner-icon{position:fixed;top:16px;left:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.05);backdrop-filter:blur(10px);border:1px solid rgba(212,175,106,.32);display:flex;align-items:center;justify-content:center;color:#d4af6a;cursor:pointer;z-index:50;}
.fn-corner-icon svg{width:18px;height:18px;}
.fn-eyebrow{font-size:.76rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#d4af6a;margin-bottom:10px;}
.fn-title{font-family:"Fraunces",serif;font-weight:600;font-size:1.8rem;color:#f6f1e4;margin-bottom:6px;}
.fn-sub{color:#8b92a3;font-size:.88rem;margin-bottom:30px;}
.fn-card{background:rgba(255,255,255,.025);border:1px solid rgba(212,175,106,.14);border-radius:20px;padding:24px;margin-bottom:20px;}
.fn-card h2{font-family:"Fraunces",serif;font-weight:600;font-size:1.1rem;color:#f6f1e4;margin-bottom:16px;}
.fn-field{margin-bottom:14px;}
.fn-field label{display:block;font-size:.78rem;color:#8b92a3;margin-bottom:6px;}
.fn-field input, .fn-field select{width:100%;background:rgba(0,0,0,.2);border:1px solid rgba(212,175,106,.2);border-radius:10px;padding:11px 14px;color:#e6e1d3;font-size:.9rem;font-family:inherit;}
.fn-row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.fn-btn{background:linear-gradient(180deg,#e8c98a,#d4af6a);color:#1c1408;border:none;border-radius:14px;padding:13px 24px;font-weight:800;font-size:.88rem;cursor:pointer;}
.fn-list{display:flex;flex-direction:column;gap:10px;}
.fn-item{background:rgba(255,255,255,.02);border:1px solid rgba(212,175,106,.12);border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.fn-item-left{min-width:0;}
.fn-item-cat{font-size:.68rem;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:#d4af6a;}
.fn-item-note{font-size:.85rem;color:#e6e1d3;margin-top:3px;}
.fn-item-meta{font-size:.72rem;color:#6d7488;margin-top:4px;}
.fn-item-amount{font-weight:800;font-size:1rem;flex-shrink:0;}
.fn-item-amount.income{color:#7cc576;}
.fn-item-amount.expense{color:#e07a7a;}
.fn-item-actions button{background:none;border:1px solid rgba(212,175,106,.25);color:#d4af6a;border-radius:8px;padding:5px 10px;font-size:.7rem;cursor:pointer;margin-left:6px;}
.fn-empty{color:#6d7488;font-size:.85rem;text-align:center;padding:20px;}
.fn-summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;}
.fn-summary-box{text-align:center;}
.fn-summary-label{font-size:.72rem;color:#8b92a3;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
.fn-summary-value{font-family:"Fraunces",serif;font-weight:600;font-size:1.6rem;color:#f6f1e4;}
.fn-summary-value.income{color:#7cc576;} .fn-summary-value.expense{color:#e07a7a;} .fn-summary-value.profit{color:#d4af6a;}
.fn-receipt-link{font-size:.72rem;color:#d4af6a;text-decoration:underline;}</style>
</head>
<body>
<button class="fn-corner-icon" onclick="location.href='../'" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
<div class="fn-stage">
  <p class="fn-eyebrow">Financials</p>
  <p class="fn-title">Reports</p>
  <p class="fn-sub">The full financial picture, all time.</p>

  <div class="fn-card">
    <div class="fn-summary-grid">
      <div class="fn-summary-box"><div class="fn-summary-label">Total Income</div><div class="fn-summary-value income" id="rpIncome">-</div></div>
      <div class="fn-summary-box"><div class="fn-summary-label">Total Expenses</div><div class="fn-summary-value expense" id="rpExpenses">-</div></div>
      <div class="fn-summary-box"><div class="fn-summary-label">Net Profit</div><div class="fn-summary-value profit" id="rpProfit">-</div></div>
      <div class="fn-summary-box"><div class="fn-summary-label">Founder Draws</div><div class="fn-summary-value expense" id="rpDraws">-</div></div>
    </div>
  </div>

  <div class="fn-card">
    <h2>Expenses by Category</h2>
    <div class="fn-list" id="rpCategoryList"><p class="fn-empty">Loading...</p></div>
  </div>
</div>

<script>
const API_BASE = "https://saybonapp-server.onrender.com";

fetch(API_BASE + "/api/financeReportsSummary").then(r=>r.json()).then(function(data){
  document.getElementById("rpIncome").textContent = "USD " + Number(data.totalIncome).toFixed(2);
  document.getElementById("rpExpenses").textContent = "USD " + Number(data.totalExpenses).toFixed(2);
  document.getElementById("rpProfit").textContent = "USD " + Number(data.netProfit).toFixed(2);
  document.getElementById("rpDraws").textContent = "USD " + Number(data.totalDraws).toFixed(2);

  const catList = document.getElementById("rpCategoryList");
  const cats = Object.keys(data.byCategory || {});
  if(!cats.length){ catList.innerHTML = '<p class="fn-empty">No expense data yet</p>'; return; }
  catList.innerHTML = cats.map(function(cat){
    return '<div class="fn-item"><div class="fn-item-left"><div class="fn-item-note">'+cat+'</div></div><div class="fn-item-amount expense">USD '+Number(data.byCategory[cat]).toFixed(2)+'</div></div>';
  }).join("");
}).catch(function(){
  document.getElementById("rpCategoryList").innerHTML = '<p class="fn-empty">Could not load report</p>';
});
</script>
</body>
</html>
