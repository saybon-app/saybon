<!DOCTYPE html><html lang="en"><head>
<script type="module" src="/features/admin/auth/admin-guard.js"></script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IP — SayBon Assets</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Manrope",-apple-system,sans-serif;background:linear-gradient(165deg,#0c1016 0%,#151b26 50%,#1b2230 100%);color:#e6e1d3;min-height:100vh;padding:60px 24px;}
.as-stage{max-width:760px;margin:0 auto;}
.as-corner-icon{position:fixed;top:16px;left:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.05);backdrop-filter:blur(10px);border:1px solid rgba(212,175,106,.32);display:flex;align-items:center;justify-content:center;color:#d4af6a;cursor:pointer;z-index:50;}
.as-corner-icon svg{width:18px;height:18px;}
.as-eyebrow{font-size:.76rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#d4af6a;margin-bottom:10px;}
.as-title{font-family:"Fraunces",serif;font-weight:600;font-size:1.8rem;color:#f6f1e4;margin-bottom:6px;}
.as-sub{color:#8b92a3;font-size:.88rem;margin-bottom:30px;}
.as-card{background:rgba(255,255,255,.025);border:1px solid rgba(212,175,106,.14);border-radius:20px;padding:24px;margin-bottom:20px;}
.as-card h2{font-family:"Fraunces",serif;font-weight:600;font-size:1.1rem;color:#f6f1e4;margin-bottom:16px;}
.as-field{margin-bottom:14px;}
.as-field label{display:block;font-size:.78rem;color:#8b92a3;margin-bottom:6px;}
.as-field input, .as-field select{width:100%;background:rgba(0,0,0,.2);border:1px solid rgba(212,175,106,.2);border-radius:10px;padding:11px 14px;color:#e6e1d3;font-size:.9rem;font-family:inherit;}
.as-row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.as-btn{background:linear-gradient(180deg,#e8c98a,#d4af6a);color:#1c1408;border:none;border-radius:14px;padding:13px 24px;font-weight:800;font-size:.88rem;cursor:pointer;}
.as-list{display:flex;flex-direction:column;gap:10px;}
.as-item{background:rgba(255,255,255,.02);border:1px solid rgba(212,175,106,.12);border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.as-item-title{font-weight:700;font-size:.92rem;color:#f6f1e4;}
.as-item-meta{font-size:.75rem;color:#8b92a3;margin-top:4px;}
.as-item-actions button{background:none;border:1px solid rgba(212,175,106,.25);color:#d4af6a;border-radius:8px;padding:5px 10px;font-size:.7rem;cursor:pointer;}
.as-empty{color:#6d7488;font-size:.85rem;text-align:center;padding:20px;}</style></head><body>
<button class="as-corner-icon" onclick="location.href='../'" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
<div class="as-stage">
<p class="as-eyebrow">Company Assets</p><p class="as-title">Intellectual Property</p><p class="as-sub">Trademarks, copyrights, and other IP the business holds.</p>
<div class="as-card"><h2>Add IP Record</h2>
<div class="as-field"><label>Name / Description</label><input type="text" id="ipName" placeholder="e.g. SayBon Logo Trademark"></div>
<div class="as-row2">
<div class="as-field"><label>Type</label><select id="ipType"><option>Trademark</option><option>Copyright</option><option>Patent</option><option>Trade Secret</option><option>Other</option></select></div>
<div class="as-field"><label>Status</label><select id="ipStatus"><option>Filed</option><option>Registered</option><option>Pending</option><option>Not Filed</option></select></div>
</div>
<div class="as-field"><label>Filing Date</label><input type="date" id="ipDate"></div>
<button class="as-btn" id="ipAddBtn">Add Record</button></div>
<div class="as-card"><h2>All IP Records</h2><div class="as-list" id="ipList"><p class="as-empty">Loading...</p></div></div>
</div>
<script>
const API_BASE = "https://saybonapp-server.onrender.com";
function loadIp(){
  fetch(API_BASE + "/api/assetIpList").then(r=>r.json()).then(function(items){
    const list = document.getElementById("ipList");
    if(!items || !items.length){ list.innerHTML = '<p class="as-empty">No IP records yet</p>'; return; }
    list.innerHTML = items.map(function(it){
      return '<div class="as-item"><div><div class="as-item-title">'+it.name+'</div><div class="as-item-meta">'+it.type+' - '+it.status+' - '+(it.filingDate||'no date')+'</div></div><div class="as-item-actions"><button onclick="deleteIp(\''+it.id+'\')">Delete</button></div></div>';
    }).join("");
  }).catch(function(){ document.getElementById("ipList").innerHTML = '<p class="as-empty">Could not load</p>'; });
}
window.deleteIp = function(id){
  if(!confirm("Delete this record?")) return;
  fetch(API_BASE + "/api/assetIpDelete", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})}).then(loadIp);
};
document.getElementById("ipAddBtn").addEventListener("click", function(){
  const name = document.getElementById("ipName").value.trim();
  if(!name) return;
  fetch(API_BASE + "/api/assetIpAdd", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
    name, type: document.getElementById("ipType").value, status: document.getElementById("ipStatus").value, filingDate: document.getElementById("ipDate").value
  })}).then(function(){ document.getElementById("ipName").value=""; loadIp(); });
});
loadIp();
</script>
</body></html>
