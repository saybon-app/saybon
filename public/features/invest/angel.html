<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angel Investor - SayBon</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Manrope",-apple-system,sans-serif;background:linear-gradient(165deg,#0c1016 0%,#151b26 50%,#1b2230 100%);color:#e6e1d3;min-height:100vh;padding:60px 24px;}
.iv-stage{max-width:820px;margin:0 auto;}
.iv-corner-icon{position:fixed;top:16px;left:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.05);backdrop-filter:blur(10px);border:1px solid rgba(212,175,106,.32);display:flex;align-items:center;justify-content:center;color:#d4af6a;cursor:pointer;z-index:50;text-decoration:none;}
.iv-corner-icon svg{width:18px;height:18px;}
.iv-eyebrow{font-size:.76rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#d4af6a;margin-bottom:12px;text-align:center;}
.iv-title{font-family:"Fraunces",serif;font-weight:600;font-size:clamp(1.9rem,5vw,2.6rem);color:#f6f1e4;margin-bottom:10px;text-align:center;}
.iv-tagline{color:#8b92a3;font-size:.95rem;text-align:center;margin-bottom:36px;}
.iv-card{background:rgba(255,255,255,.025);border:1px solid rgba(212,175,106,.14);border-radius:22px;padding:28px;margin-bottom:24px;}
.iv-card p{color:#c9c3b4;line-height:1.7;font-size:.92rem;margin-bottom:12px;}
.iv-link-btn{background:none;border:none;color:#d4af6a;cursor:pointer;font-size:.85rem;font-weight:700;padding:0;}
.iv-plan-link{display:inline-flex;align-items:center;gap:6px;margin-top:16px;font-size:.85rem;color:#f6f1e4;text-decoration:none;font-weight:600;}
.iv-hidden{display:none;}
.iv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;}
.iv-tier-card{background:rgba(255,255,255,.025);border:1px solid rgba(212,175,106,.16);border-radius:20px;padding:26px 22px;transition:transform .2s ease, border-color .2s ease;}
.iv-tier-card:hover{transform:translateY(-4px);border-color:rgba(212,175,106,.45);}
.iv-tier-title{font-family:"Fraunces",serif;font-weight:600;font-size:1.2rem;color:#f6f1e4;margin-bottom:6px;}
.iv-tier-desc{font-size:.85rem;color:#8b92a3;margin-bottom:14px;line-height:1.5;}
.iv-tier-amount{font-family:"Fraunces",serif;font-weight:600;font-size:1.1rem;color:#d4af6a;margin-bottom:18px;}
.iv-btn{display:inline-block;background:linear-gradient(180deg,#e8c98a,#d4af6a);color:#1c1408;border:none;border-radius:999px;padding:12px 26px;font-weight:800;font-size:.85rem;cursor:pointer;text-decoration:none;width:100%;text-align:center;}
.iv-form-card{background:rgba(255,255,255,.025);border:1px solid rgba(212,175,106,.14);border-radius:22px;padding:30px;}
.iv-field{margin-bottom:16px;}
.iv-field label{display:block;font-size:.78rem;color:#8b92a3;margin-bottom:6px;}
.iv-field input, .iv-field select, .iv-field textarea{width:100%;background:rgba(0,0,0,.2);border:1px solid rgba(212,175,106,.2);border-radius:12px;padding:13px 15px;color:#e6e1d3;font-size:.9rem;font-family:inherit;}
.iv-field textarea{min-height:100px;resize:vertical;}
.iv-row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media (max-width:480px){.iv-row2{grid-template-columns:1fr;}}</style></head><body>
<a class="iv-corner-icon" href="/support/index.html" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></a>
<div class="iv-stage" style="max-width:560px;">
<p class="iv-eyebrow">SayBon</p>
<p class="iv-title">Angel Investor</p>
<p class="iv-tagline">Early-stage supporters backing SayBon's foundation.</p>
<div class="iv-form-card">
<form id="angelForm">
<div class="iv-row2">
<div class="iv-field"><label>First Name</label><input type="text" required></div>
<div class="iv-field"><label>Last Name</label><input type="text" required></div>
</div>
<div class="iv-field"><label>Email Address</label><input type="email" required></div>
<div class="iv-field"><label>Country</label><input type="text" required></div>
<div class="iv-field"><label>Investment Range</label>
<select required><option value="">Select a range</option><option>$1,000 - $4,999</option><option>$5,000 - $9,999</option><option>$10,000+</option></select>
</div>
<div class="iv-field"><label>Why are you interested in SayBon?</label><textarea required></textarea></div>
<button type="submit" class="iv-btn" style="border:none;cursor:pointer;">Submit</button>
</form>
</div>
</div>
<script src="invest.js"></script>
</body></html>
