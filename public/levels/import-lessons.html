<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Import lessons - SayBon admin</title>
<style>
body{font-family:system-ui,sans-serif;background:#0f141c;color:#e6e1d3;margin:0;padding:24px;}
.w{max-width:680px;margin:0 auto}
h1{font-size:1.4rem}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(212,175,106,.25);border-radius:14px;padding:16px;margin:14px 0}
button{background:#d4af6a;color:#1c1408;border:0;border-radius:12px;padding:12px 20px;font-weight:800;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
select,label{font-size:1rem}
#log{white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:.82rem;max-height:320px;overflow:auto;background:#0a0e14;border-radius:10px;padding:10px}
.bar{height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;width:0;background:#62c46f}
</style>
</head>
<body>
<div class="w">
<h1>Import lessons</h1>
<p>Adds lesson content to the existing lesson pages. Admin sign-in required. No page or design is changed.</p>
<div class="card">
  <label>Level: <select id="lvl"><option value="a0-les-petits">A0 - Les Petits</option><option value="a0-tout-public">A0 - Tout Public</option><option value="a1">A1</option><option value="a2">A2</option><option value="b1">B1</option><option value="b2">B2</option><option value="c1">C1</option></select></label>
  <p><label><input type="checkbox" id="rep" checked> Replace lessons that already have content</label></p>
  <button id="prev">1. Check what will happen</button>
  <button id="go" disabled>2. Import</button>
  <div class="bar"><i id="fill"></i></div>
  <div id="log">Sign in as admin first, then press the first button.</div>
</div>
</div>
<script type="module">
import { auth } from "/js/firebase-init.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
const API = "https://saybonapp-server.onrender.com";
const log = m => { const l = document.getElementById("log"); l.textContent += "\n" + m; l.scrollTop = l.scrollHeight; };
let user = null, plan = null;
onAuthStateChanged(auth, u => { user = u; document.getElementById("log").textContent = u ? "Signed in as " + u.email + ". Press the first button." : "Not signed in. Sign in to SayBon as admin, then reload this page."; });
async function tok() { return user ? await user.getIdToken() : null; }
async function api(path, body) {
  const r = await fetch(API + path, { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + await tok() }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(path + " " + r.status);
  return r.json();
}
document.getElementById("prev").onclick = async () => {
  if (!user) { log("Please sign in as admin first."); return; }
  const level = document.getElementById("lvl").value;
  const blocks = await (await fetch("import-data/" + level + ".json")).json();
  const byLesson = {}; blocks.forEach(b => (byLesson[b.lesson] = byLesson[b.lesson] || []).push(b));
  plan = { level, byLesson, existing: {} };
  log("Checking existing content for " + Object.keys(byLesson).length + " lessons...");
  let withContent = 0;
  for (const n of Object.keys(byLesson)) {
    const ex = await (await fetch(API + "/api/levelAssets?level=" + level + "&lesson=" + n)).json();
    plan.existing[n] = ex; if (ex.length) withContent++;
  }
  log("New blocks to add: " + blocks.length + "\nLessons that already have content: " + withContent +
    (document.getElementById("rep").checked ? " (they will be REPLACED)" : " (they will be SKIPPED)"));
  document.getElementById("go").disabled = false;
};
document.getElementById("go").onclick = async () => {
  document.getElementById("go").disabled = true; document.getElementById("prev").disabled = true;
  const replace = document.getElementById("rep").checked;
  const jobs = []; let skipped = 0, deleted = 0, added = 0, failed = 0;
  for (const n of Object.keys(plan.byLesson)) {
    const ex = plan.existing[n];
    if (ex.length && !replace) { skipped++; continue; }
    ex.forEach(a => jobs.push({ kind: "del", id: a.id }));
    plan.byLesson[n].forEach(b => jobs.push({ kind: "add", b }));
  }
  const dels = jobs.filter(j => j.kind === "del"), adds = jobs.filter(j => j.kind === "add");
  let done = 0; const total = jobs.length;
  async function run(list, fn) {
    let i = 0;
    await Promise.all([1, 2, 3, 4].map(async () => {
      while (i < list.length) { const j = list[i++]; let ok = false;
        for (let t = 0; t < 3 && !ok; t++) { try { await fn(j); ok = true; } catch (e) { await new Promise(r => setTimeout(r, 800)); } }
        if (!ok) failed++; done++; document.getElementById("fill").style.width = (done / total * 100) + "%"; }
    }));
  }
  await run(dels, async j => { await api("/api/levelAdminDeleteAsset", { assetId: j.id }); deleted++; });
  log("Old blocks removed: " + deleted);
  await run(adds, async j => { await api("/api/levelAdminAddAsset", j.b); added++; });
  log("DONE. Added " + added + " blocks, removed " + deleted + ", skipped " + skipped + " lessons, failed " + failed + ".");
  if (failed) log("Some blocks failed. Run the import again with 'Replace' ticked.");
};
</script>
</body>
</html>
