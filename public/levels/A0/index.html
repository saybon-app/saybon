<!DOCTYPE html>
<html lang="en">
<head>
<script type='module' src='/js/auth-guard.js'></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>A0 - SayBon</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="theme.css?v=9" />
<style>body{opacity:0;animation:pageEnter .8s cubic-bezier(.22,1,.36,1) forwards}@keyframes pageEnter{from{opacity:0;transform:translateY(18px) scale(.97);filter:blur(8px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}</style><script src="/js/bg-music.js"></script></head>
<body>

  <button class="a0-corner-icon a0-corner-back" onclick="window.location.href='/levels/'" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>
  <button class="a0-corner-icon a0-corner-dash" onclick="window.location.href='/dashboard/'" aria-label="Dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
      <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
      <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
      <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
    </svg>
  </button>

  <div class="a0-split">

    <button class="a0-half a0-half-kids" onclick="window.location.href='/levels/A0/les-petits/'">
      <div class="a0-bubbles">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="a0-half-content">
        <span class="a0-half-eyebrow">For young explorers</span>
        <h2>Les Petits</h2>
        
        <span class="a0-cta a0-cta-kids">Let's Learn &amp; Play &#127880;</span>
      </div>
    </button>

    <button class="a0-half a0-half-adult" onclick="window.location.href='/levels/A0/tout-public/'">
      <div class="a0-shimmer"></div>
      <div class="a0-half-content">
        <span class="a0-half-eyebrow">For every learner</span>
        <h2>Tout Public</h2>
        
        <span class="a0-cta a0-cta-adult">Begin Journey</span>
      </div>
    </button>

  </div>

</body>
</html>
