<!DOCTYPE html>
<html lang="en">
<head>
<script type='module' src='/js/auth-guard.js'></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>A0 — SayBon</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:ital,wght@0,500;0,600;1,500&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="theme.css?v=4" />
</head>
<body>

  <button class="a0-corner-icon a0-corner-back" onclick="window.location.href='/levels/'" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>
  <button class="a0-corner-icon a0-corner-dash" onclick="window.location.href='/dashboard/'" aria-label="Dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
      <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
      <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
      <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
    </svg>
  </button>

  <div class="a0-stage">

    <div class="a0-hero">
      <p class="a0-eyebrow">Welcome to French</p>
      <h1>Let's Begin!</h1>
    </div>

    <main class="paths">

      <button class="path-btn a0-path-kids" onclick="window.location.href='/levels/A0/les-petits/'">
        <span class="a0-emoji-icon">🎈</span>
        <span class="a0-path-text">
          <span class="a0-path-label">Les Petits</span>
          <span class="a0-path-sub">For young learners, ages 4–10</span>
        </span>
      </button>

      <button class="path-btn" onclick="window.location.href='/levels/A0/tout-public/'">
        <span class="a0-emoji-icon">🌍</span>
        <span class="a0-path-text">
          <span class="a0-path-label">Tout Public</span>
          <span class="a0-path-sub">For teens and adults, every background</span>
        </span>
      </button>

    </main>

  </div>

</body>
</html>
