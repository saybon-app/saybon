<!DOCTYPE html>
<html lang="en">
<head>
<script type='module' src='/js/auth-guard.js'></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>A0 — SayBon</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="theme.css?v=5" />
</head>
<body>

  <button class="a0-corner-icon a0-corner-back" onclick="window.location.href='/levels/'" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>
  <button class="a0-corner-icon a0-corner-dash" onclick="window.location.href='/dashboard/'" aria-label="Dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
      <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
      <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
      <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
    </svg>
  </button>

  <div class="a0-stage">

    <div class="a0-hero">
      <p class="a0-eyebrow">Welcome to French</p>
      <h1>Your Adventure<br>Starts Here</h1>
      <p class="a0-tagline">Every journey begins with a single word. Let's find yours.</p>
    </div>

    <main class="paths">

      <button class="path-btn" onclick="window.location.href='/levels/A0/les-petits/'">
        <span class="a0-path-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M5 21c0-4 3-6 7-6s7 2 7 6"></path>
            <path d="M9 3.5c1-1 5-1 6 0" opacity=".6"></path>
          </svg>
        </span>
        <span class="a0-path-text">
          <span class="a0-path-label">Les Petits</span>
          <span class="a0-path-sub">For young learners, ages 4–10</span>
        </span>
        <span class="a0-path-arrow">→</span>
      </button>

      <button class="path-btn" onclick="window.location.href='/levels/A0/tout-public/'">
        <span class="a0-path-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M3 12h18M12 3c2.5 2.5 4 6 4 9s-1.5 6.5-4 9c-2.5-2.5-4-6-4-9s1.5-6.5 4-9z"></path>
          </svg>
        </span>
        <span class="a0-path-text">
          <span class="a0-path-label">Tout Public</span>
          <span class="a0-path-sub">For teens and adults, every background</span>
        </span>
        <span class="a0-path-arrow">→</span>
      </button>

    </main>

  </div>

</body>
</html>
