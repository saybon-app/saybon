<!DOCTYPE html>
<html lang="en">
<head>
<script type='module' src='/js/auth-guard.js'></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Levels â€” SayBon</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/levels/levels.css?v=5" />
<style>body{opacity:0;animation:pageEnter .8s cubic-bezier(.22,1,.36,1) forwards}@keyframes pageEnter{from{opacity:0;transform:translateY(18px) scale(.97);filter:blur(8px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}</style></head>
<body>

  <div class="lv-bg" style="background-image:url('/assets/levels/levels.webp');"></div>
  <div class="lv-scrim"></div>

  <button class="lv-corner-icon lv-corner-back" onclick="window.location.href='/dashboard/'" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>
  <button class="lv-corner-icon lv-corner-dash" onclick="window.location.href='/dashboard/'" aria-label="Dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
      <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
      <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
      <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
    </svg>
  </button>

  <div class="lv-stage">

    <header class="lv-page-header">
      <p class="lv-eyebrow">SayBon Levels</p>
      <h1>Choose Your Level</h1>
      <p class="lv-subtitle">Each level is its own world â€” pick where your French journey begins.</p>
    </header>

    <main class="levels-grid">

      <button class="level-tile" onclick="goLevel('A0')">
        <span class="lv-tile-accent"></span>
        <span class="lv-tile-label">A0</span>
        <span class="lv-tile-sub">Absolute Beginner</span>
      </button>

      <button class="level-tile" onclick="goLevel('A1')">
        <span class="lv-tile-accent"></span>
        <span class="lv-tile-label">A1</span>
        <span class="lv-tile-sub">Beginner</span>
      </button>

      <button class="level-tile" onclick="goLevel('A2')">
        <span class="lv-tile-accent"></span>
        <span class="lv-tile-label">A2</span>
        <span class="lv-tile-sub">Elementary</span>
      </button>

      <button class="level-tile" onclick="goLevel('B1')">
        <span class="lv-tile-accent"></span>
        <span class="lv-tile-label">B1</span>
        <span class="lv-tile-sub">Intermediate</span>
      </button>

      <button class="level-tile" onclick="goLevel('B2')">
        <span class="lv-tile-accent"></span>
        <span class="lv-tile-label">B2</span>
        <span class="lv-tile-sub">Upper Intermediate</span>
      </button>

      <button class="level-tile" onclick="goLevel('C1')">
        <span class="lv-tile-accent"></span>
        <span class="lv-tile-label">C1</span>
        <span class="lv-tile-sub">Advanced</span>
      </button>

    </main>

  </div>

  <script src="/levels/levels.js"></script>
</body>
</html>
