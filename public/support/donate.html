<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Donate — SayBon</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/support/donate.css?v=20260811" />
</head>
<body class="donate-page">

<button class="support-home-btn" onclick="location.href='/support/'" aria-label="Back to Support">
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 10.5L12 3l9 7.5"/>
    <path d="M5 9.5V21h14V9.5"/>
  </svg>
</button>

<button class="support-dashboard-btn" onclick="location.href='/dashboard/'" aria-label="Go to Dashboard">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="7" height="7" rx="1.5"/>
    <rect x="14" y="3" width="7" height="7" rx="1.5"/>
    <rect x="3" y="14" width="7" height="7" rx="1.5"/>
    <rect x="14" y="14" width="7" height="7" rx="1.5"/>
  </svg>
</button>

<main class="donate-shell">

  <div class="donate-card">

    <h1>Support SayBon</h1>
    <p class="subtitle">Your generosity helps improve the quality, reach, and experience of learning on SayBon.</p>

    <form id="donationForm">

      <div class="row">
        <div class="field">
          <label>First Name</label>
          <input type="text" name="firstName" placeholder="First name" required />
        </div>
        <div class="field">
          <label>Last Name</label>
          <input type="text" name="lastName" placeholder="Last name" required />
        </div>
      </div>

      <div class="field">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="you@example.com" required />
      </div>

      <div class="row">
        <div class="field">
          <label>Currency</label>
          <select name="currency" required>
            <option value="GHS">Ghana Cedis (GHS)</option>
            <option value="USD">US Dollars (USD)</option>
          </select>
        </div>
        <div class="field">
          <label>Amount</label>
          <input type="number" name="amount" placeholder="e.g. 50" required />
        </div>
      </div>

      <div class="field">
        <label>Message (optional)</label>
        <textarea name="message" placeholder="Leave a note for the SayBon team..."></textarea>
      </div>

      <button type="button" class="submit-btn" id="payBtn">Continue to Payment</button>

    </form>

  </div>

</main>

<script src="https://js.paystack.co/v1/inline.js"></script>
<script src="/support/donate.js?v=20260811"></script>
</body>
</html>
