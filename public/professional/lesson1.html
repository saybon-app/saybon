<body class="pro-lesson">
  <button class="tp-corner-icon tp-corner-back" id="proBack" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect></svg>
  </button>

<script src="pro-data.js?v=3"></script>
<script>
(function(){
var q=new URLSearchParams(location.search),F=q.get("f")||"",O=q.get("o")||"",LV=(q.get("lv")||"A0").toUpperCase(),PC=q.get("pc")||"steady";
if(["relaxed","steady","intensive"].indexOf(PC)<0)PC="steady";
var KEY=LV==="A0"?"a0-tout-public":LV.toLowerCase();
var pr=window.proOf&&window.proOf(F),fd=window.proGroup&&window.proGroup(F);
var NAME=pr?pr.name:(fd?fd.name:(O||"your field"));
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
$("proBack").onclick=function(){location.href="/professional/"};
$("proDash").onclick=function(){location.href="/dashboard/"};
/* a different background each time the page loads (never the same one twice in a row) */
var last=-1;try{last=+localStorage.getItem("sbpro_bg")}catch(e){}
var th=Math.floor(Math.random()*3);if(th===last)th=(th+1+Math.floor(Math.random()*2))%3;
try{localStorage.setItem("sbpro_bg",String(th))}catch(e){}
q.set("theme",th);history.replaceState(null,"",location.pathname+"?"+q.toString());
/* the level's own colours, same as that level's lessons */
var tl=document.createElement("link");tl.rel="stylesheet";tl.href=(LV==="A0"?"/levels/A0/tout-public/":"/levels/"+LV+"/")+"theme.css?v=1";document.head.appendChild(tl);
document.body.classList.add("ps-on");
var scene=null,PLAY='<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="10.5" y="2.5" width="11" height="17" rx="5.5" fill="currentColor" stroke="none"/><path d="M11.6 7.2h8.8M11 10.4h10M11 13.6h10M11.6 16.6h8.8" stroke="rgba(40,14,0,.55)" stroke-width="1.15"/><path d="M6.6 14v1.2a9.4 9.4 0 0 0 18.8 0V14"/><path d="M16 24.6v3.4M11.2 28.4h9.6"/></svg>';
var sc=document.createElement("script");sc.src="/levels/scene-paris/scene-paris.js?v=27";
sc.onload=function(){try{scene=ParisScene.mount({mic:false,overlay:true,theme:th,start:Math.floor(Math.random()*3)})}catch(e){console.error(e)}};
document.head.appendChild(sc);
$("lsRoot").innerHTML='<button class="pro-orb pc-teach" id="orb" aria-label="Teacher" style="border:0;cursor:pointer;display:none">'+PLAY+'</button><audio id="au" preload="auto" src="audio/intro-'+LV+'-'+PC+'.mp3"></audio><button class="pro-skip" id="sk">Skip</button>';
var au=$("au"),orb=$("orb"),done=false;
function begin(){
 if(done)return;done=true;
 try{au.pause()}catch(e){}
 if(scene&&scene.destroy)scene.destroy();
 document.body.classList.remove("ps-ready");
 window.__LS_LEVEL=KEY;window.__LS_LESSON=1;
 var m=document.createElement("script");m.type="module";m.src="/levels/lesson-engine-tp.js?v=65";document.body.appendChild(m);
}
au.onplay=function(){orb.style.display="";orb.classList.add("on")};
au.onpause=function(){orb.classList.remove("on")};
au.onended=begin;
au.onerror=begin; /* no audio file yet: go straight into the lesson */
$("sk").onclick=begin;
orb.onclick=function(){au.play().catch(function(){begin()})};
/* try to start the teacher straight away; if the browser wants a tap first, show the orb */
var p=au.play();
if(p&&p.catch)p.catch(function(){orb.style.display="";});
})();
</script></body></html>
