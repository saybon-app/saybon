<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>French for Professionals - SayBon</title>
<script type="module" src="/js/auth-guard.js"></script>
<link rel="preload" as="image" href="bg-desktop.webp" media="(min-width:701px)">
<link rel="preload" as="image" href="bg-mobile.webp" media="(max-width:700px)">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--u:min(1vw,1.7777vh);--mint:#6ef0b0;--deep:#0a3d2e;--ink:#0b3d2c;--gold:#b8893a;--navy:#10382b;--line:#d5eadd;--mut:#5b7568;--ok:#1f8a55;--bad:#c0504d}
html,body{min-height:100%}
body{font-family:"Montserrat",sans-serif;color:#fff;background:#04382a;position:relative}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:#04382a url(bg-desktop.webp) center/cover no-repeat}
@media(max-width:700px){body::before{background-image:url(bg-mobile.webp)}}
.hero{height:100vh;height:100svh;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(var(--u)*7) 4vw calc(var(--u)*2)}
.corner{position:fixed;top:calc(var(--u)*2.9);width:calc(var(--u)*5.4);height:calc(var(--u)*5.4);min-width:42px;min-height:42px;border-radius:50%;border:2px solid rgba(255,255,255,.95);background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:20;transition:background .2s}
.corner:hover{background:rgba(255,255,255,.14)}
.corner.l{left:calc(var(--u)*4.5)}.corner.r{right:calc(var(--u)*4.5)}
.corner svg{width:50%;height:50%}
h1{font-weight:300;font-size:calc(var(--u)*5.2);line-height:1.08;letter-spacing:-.01em;color:#f3fbf6;white-space:nowrap}
h1 b{font-weight:800;display:inline-block}
.bar{width:calc(var(--u)*16.7);height:5px;border-radius:5px;background:var(--mint);margin:calc(var(--u)*2) auto calc(var(--u)*1.7);box-shadow:0 0 14px rgba(110,240,176,.45)}
.tag{font-weight:500;font-size:calc(var(--u)*1.55);line-height:1.5;color:#eefaf2;max-width:calc(var(--u)*70)}
.pills{width:calc(var(--u)*50);margin-top:calc(var(--u)*3.4);display:flex;flex-direction:column;gap:calc(var(--u)*2)}
.pill{display:flex;align-items:center;width:100%;height:calc(var(--u)*7);border-radius:999px;cursor:pointer;font:700 calc(var(--u)*2.2) "Montserrat",sans-serif;text-align:left;padding:0 calc(var(--u)*2.6) 0 calc(var(--u)*3.6);position:relative;border:0}
.pill .ico{flex:none;width:calc(var(--u)*3.6);height:calc(var(--u)*3.6);display:flex;align-items:center;justify-content:center}
.pill .ico svg{width:100%;height:100%}
.pill .div{flex:none;width:2px;align-self:center;height:56%;margin:0 calc(var(--u)*2.4) 0 calc(var(--u)*2.4);opacity:.55}
.pill .lab{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill .chev{flex:none;width:calc(var(--u)*2.2);height:calc(var(--u)*2.2);margin-left:calc(var(--u)*.8)}
.pill.light{background:linear-gradient(180deg,#f4fcf7 0%,#cfeedd 100%);color:var(--ink);box-shadow:0 16px 36px rgba(0,30,20,.45),inset 0 1px 0 #fff}
.pill.light .div{background:var(--ink)}
.pill.dark{background:linear-gradient(180deg,rgba(6,70,52,.78),rgba(3,52,38,.9));color:#fff;border:3px solid var(--mint);box-shadow:0 14px 32px rgba(0,25,16,.45);padding-left:calc(var(--u)*3.6 - 3px)}
.pill.dark .div{background:#fff}
.pill.dim{opacity:.9}
.free{margin-top:calc(var(--u)*1.6);font-weight:600;font-size:calc(var(--u)*1.05);color:rgba(238,250,242,.9)}
.free i{font-style:normal;color:var(--mint)}
@media(max-width:700px){
 :root{--u:1vw}
 .hero{height:auto;min-height:100svh;justify-content:flex-start;padding:max(104px,15svh) 6vw 40px}
 h1{font-size:clamp(2rem,10.6vw,3.6rem);line-height:1.12;white-space:normal}h1 b{display:block}
 .bar{width:clamp(110px,36vw,200px);margin:16px auto}
 .tag{font-size:clamp(.95rem,4.1vw,1.3rem);max-width:84%}
 .pills{width:88vw;margin-top:34px;gap:18px}
 .pill{height:17vw;max-height:84px;min-height:60px;font-size:clamp(1.05rem,5.5vw,1.6rem);padding:0 22px 0 24px}
 .pill.dark{padding-left:21px}
 .pill .ico{width:38px;height:38px}.pill .div{margin:0 20px 0 18px}.pill .chev{width:24px;height:24px}
 .free{font-size:.85rem;margin-top:22px}
 .corner{top:16px;width:46px;height:46px}.corner.l{left:16px}.corner.r{right:16px}
}
/* ---- sheets ---- */
.ov{position:fixed;inset:0;background:rgba(0,12,8,.62);z-index:50;display:none;align-items:center;justify-content:center;padding:18px}
.ov.on{display:flex}
@media(max-width:700px){.ov{align-items:flex-end;padding:0}}
.sheet{width:min(560px,100%);max-height:86vh;overflow:auto;background:linear-gradient(180deg,#0e5340,#06382b);border:1px solid rgba(110,240,176,.4);border-radius:28px;padding:24px 20px 20px;box-shadow:0 30px 80px rgba(0,0,0,.55)}
@media(max-width:700px){.sheet{border-radius:28px 28px 0 0;padding-bottom:30px}}
.sheet h3{font-weight:800;font-size:1.25rem;margin-bottom:4px;color:#fff}
.sheet p.s{font-size:.88rem;color:rgba(238,250,242,.8);margin-bottom:14px;line-height:1.5}
.opt2{display:flex;justify-content:space-between;align-items:center;width:100%;gap:10px;text-align:left;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:16px;padding:15px 16px;margin-top:9px;font:600 1rem Montserrat,sans-serif;cursor:pointer}
.opt2:hover,.opt2.sel{border-color:var(--mint);background:rgba(110,240,176,.14)}
.opt2 small{display:block;font-weight:500;font-size:.78rem;color:rgba(238,250,242,.75);margin-top:3px}
.opt2 svg{width:20px;height:20px;color:var(--mint);flex:none}
.sheet input{width:100%;font:600 1rem Montserrat,sans-serif;color:var(--ink);background:#f4fcf7;border:2px solid transparent;border-radius:999px;padding:15px 20px;margin-top:6px}
.sheet input:focus{outline:none;border-color:var(--mint)}
.sbtn{display:inline-block;margin-top:14px;background:linear-gradient(180deg,#f4fcf7,#cfeedd);color:var(--ink);border:0;border-radius:999px;padding:13px 26px;font:800 .92rem Montserrat,sans-serif;cursor:pointer}
.sbtn.ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.4);margin-left:8px}
.hint{font-size:.78rem;color:rgba(238,250,242,.75);margin-top:10px;line-height:1.5}
/* ---- lessons area ---- */
#learn{width:min(820px,92vw);margin:0 auto;padding:0 0 70px}
.hide{display:none!important}
#learn .eb{font-size:.74rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--mint);margin-bottom:6px}
#learn h2{font-weight:800;font-size:1.5rem;color:#fff;margin-bottom:10px}
#learn .sub,#learn .prog,#learn .note{color:rgba(238,250,242,.85)}
.tabs{display:flex;gap:8px;margin:8px 0 16px;overflow-x:auto}
.tabs button{flex:none;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:999px;padding:10px 20px;font:700 .84rem Montserrat,sans-serif;cursor:pointer}
.tabs button.on{background:linear-gradient(180deg,#f4fcf7,#cfeedd);color:var(--ink);border-color:transparent}
.btn{background:linear-gradient(180deg,#f4fcf7,#cfeedd);color:var(--ink);border:0;border-radius:999px;padding:12px 22px;font:800 .88rem Montserrat,sans-serif;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.4)}
.panel .btn.ghost{color:var(--ink);border-color:var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.panel{background:#fff;color:#1d3a2f;border-radius:22px;padding:22px;margin-bottom:14px;box-shadow:0 14px 34px rgba(0,25,16,.35)}
#learn .panel h2{color:var(--navy);font-size:1.25rem}
#learn .panel .sub,#learn .panel .note,#learn .panel .prog{color:var(--mut)}
#learn .panel .eb{color:#1f8a55}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(min-width:560px){.grid{grid-template-columns:repeat(8,1fr)}}
.les{aspect-ratio:1;border-radius:16px;border:1.5px solid var(--line);background:#f1f8f4;font:800 1.15rem "Montserrat",sans-serif;color:var(--navy);cursor:pointer;display:flex;align-items:center;justify-content:center}
.les.u{background:linear-gradient(180deg,#e6fbef,#a9ecc8);border-color:#6ef0b0;box-shadow:0 6px 14px rgba(20,120,70,.22)}
.les.l{color:#9db3a8;background:#eef4f0;cursor:default}
.les svg{width:18px;height:18px}
.flash{min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;gap:8px}
.flash .fr{font-weight:800;font-size:clamp(1.6rem,6vw,2.2rem);color:var(--navy)}
.flash .en{font-size:1.15rem;color:#1f8a55;font-weight:800}
.flash .ex{font-size:.95rem;color:#2b4a3d;line-height:1.5}.flash .ex em{display:block;font-style:normal;color:var(--mut);font-size:.85rem;margin-top:2px}
.flash .hint{color:var(--mut);margin:0}
.listen{background:#fff;border:1px solid var(--line);color:#1f8a55;border-radius:999px;padding:6px 14px;font:800 .76rem Montserrat,sans-serif;cursor:pointer}
.opt{display:block;width:100%;text-align:left;background:#f6fbf8;border:1.5px solid var(--line);color:#173328;border-radius:14px;padding:14px 16px;font:600 .95rem Montserrat,sans-serif;margin-top:10px;cursor:pointer;line-height:1.4}
.opt.good{border-color:var(--ok);background:#e3f6ea}.opt.wrong{border-color:var(--bad);background:#fbeceb}
.bub{max-width:88%;border-radius:16px;padding:12px 15px;margin:10px 0;line-height:1.45;font-size:.95rem}
.bub.o{background:#fff;color:#1d3a2f;border-top-left-radius:4px}
.bub.y{background:linear-gradient(180deg,#e6fbef,#a9ecc8);color:#0b3d2c;margin-left:auto;border-top-right-radius:4px;font-weight:700}
.bub small{display:block;color:var(--mut);font-size:.78rem;margin-top:4px;font-weight:500}
.bub.y small{color:#2b6a50}
.goal{color:var(--mint);font-weight:800;font-size:.9rem;margin:14px 0 2px}
.pick{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;color:#1d3a2f;border:0;border-radius:16px;padding:16px;margin-bottom:10px;cursor:pointer;font:inherit;width:100%;text-align:left}
.pick b{font-weight:800;color:var(--navy);font-size:1rem}.pick span{display:block;color:var(--mut);font-size:.82rem;margin-top:3px;font-weight:500}
.pick em{font-style:normal;color:var(--ok);font-size:.78rem;font-weight:800;white-space:nowrap}
.note{font-size:.8rem;line-height:1.55;margin-top:14px}
.shake{animation:shk .3s}@keyframes shk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#learn .opt + .goal,#turn .opt{background:#f6fbf8}
</style></head>
<body>
<button class="corner l" id="home" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11L12 3.5 20.5 11"/><path d="M5.5 9.5V20h4.5v-6h4v6h4.5V9.5"/></svg></button>
<button class="corner r" id="dash" aria-label="Dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.8"/></svg></button>

<main class="hero">
 <h1>French for <b>Professionals</b></h1>
 <div class="bar"></div>
 <p class="tag">Build real French fluency for your work, career, and professional goals.</p>
 <div class="pills">
  <button class="pill light" id="pf"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2.2"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7"/><path d="M3 12.5c3 1.5 6 2.2 9 2.2s6-.7 9-2.2"/><rect x="10.6" y="12.6" width="2.8" height="2.6" rx=".6" fill="currentColor" stroke="none"/></svg></span><span class="div"></span><span class="lab" id="pfl">Pick Your Field</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 5 16 12 9 19"/></svg></button>
  <button class="pill dark dim" id="pl"><span class="ico"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="14" width="4.6" height="7" rx="1.3"/><rect x="9.7" y="9" width="4.6" height="12" rx="1.3"/><rect x="16.4" y="3" width="4.6" height="18" rx="1.3"/></svg></span><span class="div"></span><span class="lab" id="pll">Select Your Level</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 5 16 12 9 19"/></svg></button>
 </div>
 <p class="free"><i>Free</i> for everyone. No payment needed.</p>
</main>
<section id="learn" class="hide"></section>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script src="pro-data.js?v=2"></script>
<script type="module">
import { auth } from "/js/firebase-init.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
var API="https://saybonapp-server.onrender.com";
var D=window.PRO_DATA;
var LEVELS=[
 {k:"A0",name:"A0 · Starter",sub:"Complete beginner",key:"a0-tout-public",base:"/levels/A0/tout-public/"},
 {k:"A1",name:"A1 · Beginner",sub:"First conversations",key:"a1",base:"/levels/A1/"},
 {k:"A2",name:"A2 · Elementary",sub:"Everyday situations",key:"a2",base:"/levels/A2/"},
 {k:"B1",name:"B1 · Intermediate",sub:"Handle most work situations",key:"b1",base:"/levels/B1/"},
 {k:"B2",name:"B2 · Upper intermediate",sub:"Discuss and negotiate with ease",key:"b2",base:"/levels/B2/"},
 {k:"C1",name:"C1 · Advanced",sub:"Fluent and precise",key:"c1",base:"/levels/C1/"}
];
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"null");localStorage.setItem(k,JSON.stringify(v))}catch(e){}return null}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function field(id){return D.find(function(x){return x.id===id})}
function $(i){return document.getElementById(i)}
var canSpeak=("speechSynthesis" in window);
function speak(t){if(!canSpeak)return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";u.rate=.92;var v=speechSynthesis.getVoices().filter(function(x){return /^fr/i.test(x.lang)});if(v[0])u.voice=v[0];speechSynthesis.speak(u)}catch(e){}}
function lbtn(t){return canSpeak?' <button class="listen" data-say="'+esc(t)+'">Listen</button>':''}
document.addEventListener("click",function(e){var b=e.target.closest("[data-say]");if(b){e.stopPropagation();speak(b.getAttribute("data-say"))}},true);

var sel=ls("sbpro_sel")||{f:"",other:"",lv:""};
var state={tab:"lessons",card:null,open:false,quiz:null,play:null};
var user=null,progress=null;
function known(f){return ls("sbpro_known_"+f)||[]}
function level(){return LEVELS.find(function(l){return l.k===sel.lv})}
function fieldOk(){return !!sel.f&&(sel.f!=="__other"||(sel.other||"").trim().length>=2)}
function fieldName(){if(sel.f==="__other")return (sel.other||"").trim();var f=field(sel.f);return f?f.name:""}

/* ---------- the two pills and their pick sheets ---------- */
var CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 13 10 18 19 7"/></svg>';
function openSheet(html){$("sheet").innerHTML=html;$("ov").classList.add("on")}
function closeSheet(){$("ov").classList.remove("on")}
$("ov").addEventListener("click",function(e){if(e.target.id==="ov")closeSheet()});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet()});
function updatePills(){
 $("pfl").textContent=fieldOk()?fieldName():"Pick Your Field";
 $("pll").textContent=level()&&fieldOk()?level().name:"Select Your Level";
 $("pl").classList.toggle("dim",!fieldOk());
}
function fieldSheet(){
 openSheet('<h3>Pick your field</h3><p class="s">Choose the profession you want to become proficient in. It is free.</p>'
  +D.map(function(f){return'<button class="opt2'+(sel.f===f.id?" sel":"")+'" data-f="'+f.id+'"><span>'+esc(f.name)+'<small>'+esc(f.blurb)+'</small></span>'+(sel.f===f.id?CHECK:"")+'</button>'}).join("")
  +'<button class="opt2'+(sel.f==="__other"?" sel":"")+'" data-f="__other"><span>My field is not listed<small>Type your own field</small></span></button>');
 document.querySelectorAll("#sheet [data-f]").forEach(function(b){b.onclick=function(){
  var v=b.dataset.f;
  if(v==="__other"){openSheet('<h3>Type your field</h3><p class="s">For example: agriculture, law, education. This helps us decide which professions to add next.</p><input type="text" id="oth" maxlength="60" placeholder="Your field" autocomplete="off" value="'+esc(sel.f==="__other"?sel.other:"")+'"><div><button class="sbtn" id="ok">Continue</button><button class="sbtn ghost" id="bk">Back</button></div><p class="hint" id="oh"></p>');
   setTimeout(function(){var i=$("oth");i&&i.focus()},50);
   $("bk").onclick=fieldSheet;
   var go=function(){var t=$("oth").value.trim();if(t.length<2){$("oh").textContent="Please type at least two letters.";return}pickField("__other",t)};
   $("ok").onclick=go;$("oth").onkeydown=function(e){if(e.key==="Enter")go()};return}
  pickField(v,"")}});
}
function pickField(v,other){
 sel.f=v;sel.other=other;ls("sbpro_sel",sel);state.tab="lessons";state.card=null;state.quiz=null;state.play=null;
 updatePills();closeSheet();
 if(sel.lv){save();renderLearn()}else setTimeout(levelSheet,260);
}
function levelSheet(){
 openSheet('<h3>Select your level</h3><p class="s">Pick the level that fits you. You can change it any time.</p>'
  +LEVELS.map(function(l){return'<button class="opt2'+(sel.lv===l.k?" sel":"")+'" data-l="'+l.k+'"><span>'+esc(l.name)+'<small>'+esc(l.sub)+'</small></span>'+(sel.lv===l.k?CHECK:"")+'</button>'}).join(""));
 document.querySelectorAll("#sheet [data-l]").forEach(function(b){b.onclick=function(){
  sel.lv=b.dataset.l;ls("sbpro_sel",sel);state.tab="lessons";progress=null;updatePills();closeSheet();save();renderLearn();
  setTimeout(function(){$("learn").scrollIntoView({behavior:"smooth",block:"start"})},120)}});
}
$("pf").onclick=fieldSheet;
$("pl").onclick=function(){if(!fieldOk())fieldSheet();else levelSheet()};
$("home").onclick=function(){if(window.stopAppBgMusic){window.stopAppBgMusic()}location.href="/"};
$("dash").onclick=function(){location.href="/dashboard/"};
async function save(){try{if(!user||!fieldOk()||!sel.lv)return;var t=await user.getIdToken();fetch(API+"/api/professionalProfile",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+t},body:JSON.stringify({field:sel.f,other:sel.f==="__other"?(sel.other||"").trim().slice(0,60):"",level:sel.lv}),keepalive:true}).catch(function(){})}catch(e){}}

/* ---------- lessons (same unlock rule as the level hubs) ---------- */
function maxUnlocked(){
 if(sessionStorage.getItem("saybon_admin_unlocked")==="true")return 25;
 if(user&&String(user.email||"").toLowerCase()==="saybon.fr@gmail.com")return 100;
 if(progress==null)return 1;
 return (progress.length?Math.max.apply(null,progress):0)+1;
}
async function loadProgress(){
 var l=level();if(!l||!user){return}
 try{var r=await fetch(API+"/api/levelProgress?uid="+user.uid+"&level="+l.key);var d=await r.json();progress=(d.completedLessons||[]).map(Number)}catch(e){progress=[]}
 if(state.tab==="lessons")drawLessons();
}
var LOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
function drawLessons(){
 var el=$("body");if(!el)return;var l=level(),m=maxUnlocked(),h='<div class="panel"><div class="grid">';
 for(var n=1;n<=25;n++){h+=n<=m?'<button class="les u" data-n="'+n+'">'+n+'</button>':'<div class="les l">'+LOCK+'</div>'}
 h+='</div><p class="note">Lesson 1 is open. Finish each lesson to unlock the next.</p></div>';
 el.innerHTML=h;el.querySelectorAll("[data-n]").forEach(function(b){b.onclick=function(){location.href=l.base+"lesson"+b.dataset.n+".html"}});
}
function renderLearn(){
 var c=$("learn"),l=level();if(!l||!fieldOk()){c.classList.add("hide");return}
 c.classList.remove("hide");
 var f=field(sel.f),tabs=[["lessons","Lessons"]];if(f)tabs.push(["words","Words"],["plays","Role-plays"]);
 if(!f)state.tab="lessons";
 c.innerHTML='<p class="eb">'+esc(fieldName())+' · '+esc(l.k)+'</p><h2>Your lessons</h2><div class="tabs">'+tabs.map(function(t){return'<button data-tab="'+t[0]+'" class="'+(state.tab===t[0]?"on":"")+'">'+t[1]+'</button>'}).join("")+'</div><div id="body"></div>';
 c.querySelectorAll("[data-tab]").forEach(function(b){b.onclick=function(){state.tab=b.dataset.tab;state.card=null;state.quiz=null;state.play=null;renderLearn()}});
 var body=$("body");
 if(state.tab==="lessons"){drawLessons();loadProgress()}
 else if(state.tab==="words")words(f,body);else plays(f,body);
}
function render(){renderLearn()}

/* ---------- words and quiz ---------- */
function words(f,el){
 var K=known(f.id),W=f.words;
 if(state.quiz)return quiz(f,el);
 var pool=W.map(function(w,i){return i}).filter(function(i){return K.indexOf(i)<0});
 el.innerHTML='<p class="prog">Known: '+K.length+' of '+W.length+'</p>';
 if(!pool.length){el.innerHTML+='<div class="panel"><h2>All '+W.length+' words known</h2><p class="sub">Test yourself with the quick quiz, or start again.</p><div class="row"><button class="btn" id="q">Quick quiz</button><button class="btn ghost" id="rs">Start again</button></div></div>';
  $("q").onclick=function(){state.quiz={n:0,s:0,q:null};render()};$("rs").onclick=function(){ls("sbpro_known_"+f.id,[]);render()};return}
 if(state.card==null||pool.indexOf(state.card)<0)state.card=pool[0];
 var w=W[state.card],open=state.open;
 el.innerHTML+='<div class="panel flash" id="fl"><div class="fr">'+esc(w[0])+'</div>'+lbtn(w[0])
  +(open?'<div class="en">'+esc(w[1])+'</div><div class="ex">'+esc(w[2])+'<em>'+esc(w[3])+'</em></div>':'<p class="hint">Tap the card to see the English</p>')+'</div>'
  +'<div class="row">'+(open?'<button class="btn ghost" id="ag">Again later</button><button class="btn" id="gt">I know it</button>':'')+'<button class="btn ghost" id="q">Quick quiz</button></div>';
 $("fl").onclick=function(){state.open=!state.open;render()};
 if(open){$("gt").onclick=function(){var k=known(f.id);k.push(state.card);ls("sbpro_known_"+f.id,k);state.open=false;state.card=null;render()};
  $("ag").onclick=function(){var i=pool.indexOf(state.card);state.card=pool[(i+1)%pool.length];state.open=false;render()}}
 $("q").onclick=function(){state.quiz={n:0,s:0,q:null};render()};
}
function quiz(f,el){
 var q=state.quiz,W=f.words,N=5;
 if(q.n>=N){el.innerHTML='<div class="panel"><h2>'+q.s+' out of '+N+'</h2><p class="sub">'+(q.s===N?"Perfect. Those words are yours.":"Keep going. Missed words come back in the cards.")+'</p><div class="row"><button class="btn" id="a">Quiz again</button><button class="btn ghost" id="b">Back to cards</button></div></div>';
  $("a").onclick=function(){state.quiz={n:0,s:0,q:null};render()};$("b").onclick=function(){state.quiz=null;render()};return}
 if(!q.q){var i=Math.floor(Math.random()*W.length),opts=shuffle([i].concat(shuffle(W.map(function(_,k){return k}).filter(function(k){return k!==i})).slice(0,3)));q.q={i:i,opts:opts,done:false}}
 var cur=q.q;
 el.innerHTML='<p class="prog">Question '+(q.n+1)+' of '+N+'</p><div class="panel"><p class="eb">What does it mean?</p><h2 style="font-size:1.7rem">'+esc(W[cur.i][0])+lbtn(W[cur.i][0])+'</h2>'+cur.opts.map(function(k){return'<button class="opt" data-k="'+k+'">'+esc(W[k][1])+'</button>'}).join("")+'</div>';
 el.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){if(cur.done)return;var k=+b.dataset.k;if(k===cur.i){cur.done=true;b.classList.add("good");q.s++;var K=known(f.id);if(K.indexOf(cur.i)<0){K.push(cur.i);ls("sbpro_known_"+f.id,K)}setTimeout(function(){q.n++;q.q=null;render()},700)}else{b.classList.add("wrong","shake");cur.done=true;el.querySelectorAll(".opt").forEach(function(o){if(+o.dataset.k===cur.i)o.classList.add("good")});setTimeout(function(){q.n++;q.q=null;render()},1200)}}});
}

/* ---------- role-plays ---------- */
function plays(f,el){
 if(state.play==null){
  el.innerHTML=f.plays.map(function(p,i){var d=ls("sbpro_play_"+f.id+"_"+i);return'<button class="pick" data-p="'+i+'"><div><b>'+esc(p.title)+'</b><span>'+esc(p.setting)+'</span></div>'+(d?'<em>Done</em>':'')+'</button>'}).join("")+'<p class="note">Read what the other person says, then choose your reply. If you pick a wrong one, you can try again. "Listen" uses your phone\'s own French voice, so it sounds different on different devices.</p>';
  el.querySelectorAll("[data-p]").forEach(function(b){b.onclick=function(){state.play={i:+b.dataset.p,t:0,miss:0};render()}});return}
 var p=f.plays[state.play.i],S=state.play;
 var h='<h2>'+esc(p.title)+'</h2><p class="sub">'+esc(p.setting)+'</p>';
 for(var k=0;k<S.t;k++){var tn=p.turns[k];h+=tn.o?'<div class="bub o">'+esc(tn.o[0])+lbtn(tn.o[0])+'<small>'+esc(tn.o[1])+'</small></div>':'<div class="bub y">'+esc(tn.y[1])+'</div>'}
 el.innerHTML=h+'<div id="turn"></div>';
 var t=$("turn");
 function step(){
  if(S.t>=p.turns.length){ls("sbpro_play_"+f.id+"_"+S.i,true);t.innerHTML='<div class="panel"><h2>Role-play complete</h2><p class="sub">'+(S.miss?S.miss+' wrong choice'+(S.miss>1?"s":"")+' along the way.':"No wrong choices. Well done.")+'</p><div class="row"><button class="btn" id="ag">Play again</button><button class="btn ghost" id="bk">Back</button></div></div>';
   $("ag").onclick=function(){state.play={i:S.i,t:0,miss:0};render()};$("bk").onclick=function(){state.play=null;render()};return}
  var tn=p.turns[S.t];
  if(tn.o){var d=document.createElement("div");d.className="bub o";d.innerHTML=esc(tn.o[0])+lbtn(tn.o[0])+'<small>'+esc(tn.o[1])+'</small>';t.before(d);if(canSpeak)speak(tn.o[0]);S.t++;return step()}
  var opts=shuffle([tn.y[1],tn.y[2],tn.y[3]]);
  t.innerHTML='<div class="goal">Your turn: '+esc(tn.y[0])+'</div>'+opts.map(function(o){return'<button class="opt" data-o="'+esc(o)+'">'+esc(o)+'</button>'}).join("");
  t.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){if(b.dataset.o===tn.y[1]){b.classList.add("good");var y=document.createElement("div");y.className="bub y";y.textContent=tn.y[1];t.before(y);S.t++;t.innerHTML="";setTimeout(step,450)}else{b.classList.add("wrong","shake");S.miss++;b.disabled=true}}});
 }
 step();
}

onAuthStateChanged(auth,function(u){user=u;if(u){if(sel.lv&&fieldOk()){save();loadProgress()}}else if(sel.lv)drawLessons()});
updatePills();
if(sel.lv&&fieldOk())renderLearn();
</script>
</body></html>
