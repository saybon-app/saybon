<!DOCTYPE html>
<html lang="fr">
<head>
<script type="module" src="/js/auth-guard.js"></script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Scenario lesson - French for Professionals</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/global.css" />
<link rel="stylesheet" href="/levels/scene-paris/scene-paris.css?v=26" />
<link rel="stylesheet" href="../lesson-scene.css?v=1" />
<link rel="stylesheet" href="scen.css?v=1" />
</head>
<body class="pro-lesson">
<div id="pic" class="pic"><img id="pimg" alt=""><div class="shade"></div></div>
<button class="sc-corner" id="bk" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
<div class="sc-top"><div id="goal" class="sc-goal"></div><div id="sec" class="sc-sec"></div><div class="sc-prog"><i id="bar"></i></div></div>
<div class="sc-bottom">
 <button id="tb" class="pc-teach" aria-label="Teacher" tabindex="-1"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="10.5" y="2.5" width="11" height="17" rx="5.5" fill="currentColor" stroke="none"/><path d="M11.6 7.2h8.8M11 10.4h10M11 13.6h10M11.6 16.6h8.8" stroke="rgba(40,14,0,.55)" stroke-width="1.15"/><path d="M6.6 14v1.2a9.4 9.4 0 0 0 18.8 0V14"/><path d="M16 24.6v3.4M11.2 28.4h9.6"/></svg></button>
 <div id="cap" class="sc-cap"><span id="who" class="who"></span><p id="txt"></p></div>
 <canvas id="wv" class="pc-wv" width="560" height="88"></canvas>
 <button id="mic" class="pc-mic hint" aria-label="Record"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="8.5" y="2.8" width="15" height="26.4" rx="4.6"/><path d="M12.4 7.4h7.2M12.4 10.2h7.2M12.4 13h7.2"/><circle cx="16" cy="21.4" r="3.9" fill="#e5543f" stroke="none"/></svg></button>
 <p id="state" class="sc-state"></p>
 <div class="sc-tools"><button id="pz">Pause</button><button id="cc" class="on">Text</button><button id="rs">Restart</button></div>
</div>
<button class="pro-orb pc-teach" id="orb" aria-label="Teacher" style="border:0;cursor:pointer;display:none"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="10.5" y="2.5" width="11" height="17" rx="5.5" fill="currentColor" stroke="none"/><path d="M11.6 7.2h8.8M11 10.4h10M11 13.6h10M11.6 16.6h8.8" stroke="rgba(40,14,0,.55)" stroke-width="1.15"/><path d="M6.6 14v1.2a9.4 9.4 0 0 0 18.8 0V14"/><path d="M16 24.6v3.4M11.2 28.4h9.6"/></svg></button>
<button class="pro-skip" id="sk" style="display:none">Passer</button>
<div id="end" class="sc-end" hidden><div class="card"><h2 id="endT">Bravo !</h2><p id="endP"></p><div class="btns"><button id="endBack">Retour</button><button id="endAgain" class="alt">Refaire</button></div></div></div>
<audio id="au" preload="auto"></audio>
<script src="engine.js?v=1"></script>
<script src="lesson.js?v=1"></script>
</body></html>
