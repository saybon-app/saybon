<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SayBon Placement Test</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="placement.css?v=20260813b" />
<script src="/js/bg-music.js"></script></head>
<body class="placement-page">

<button class="placement-home-btn" id="placementHomeBtn" aria-label="Back to start">
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 10.5L12 3l9 7.5"/>
    <path d="M5 9.5V21h14V9.5"/>
  </svg>
</button>

<main class="placement-shell">

  <div class="progress-wrap">
    <div class="progress-track">
      <div class="progress-fill" id="progressBar"></div>
    </div>
    <span class="progress-label" id="progressLabel">Question 1 of 20</span>
  </div>

  <div class="question-card">
    <h2 id="questionPrompt" class="question-prompt"></h2>
    <div id="mediaArea" class="media-area"></div>
    <div id="options" class="options"></div>
  </div>

</main>

<div id="intervention" class="hidden">

  <svg class="oasis-leaf oasis-leaf-1" viewBox="0 0 64 64" fill="#d4af37" aria-hidden="true">
    <path d="M32 4C18 10 8 24 8 40c0 8 6 14 14 14 12 0 24-12 26-30 1-8-2-16-16-20z"/>
  </svg>
  <svg class="oasis-leaf oasis-leaf-2" viewBox="0 0 64 64" fill="#d4af37" aria-hidden="true">
    <path d="M32 4C18 10 8 24 8 40c0 8 6 14 14 14 12 0 24-12 26-30 1-8-2-16-16-20z"/>
  </svg>
  <svg class="oasis-leaf oasis-leaf-3" viewBox="0 0 64 64" fill="#d4af37" aria-hidden="true">
    <path d="M32 4C18 10 8 24 8 40c0 8 6 14 14 14 12 0 24-12 26-30 1-8-2-16-16-20z"/>
  </svg>

  <div class="teacher-box">
    <div class="teacher-circle">
      <img src="/assets/images/teacher-intervention.png" />
    </div>
  </div>

  <p class="oasis-subtitle">Take a breath. You are doing great.</p>

  <audio
    id="interventionAudio"
    src="/assets/sounds/placement/intervention.mp3"
    preload="auto">
  </audio>

  <div class="intervention-actions">
    <button id="continueBtn" class="glass-btn back">Back to test</button>
    <button id="revealBtn" class="glass-btn reveal">Reveal level</button>
  </div>
</div>

<script src="./placement.js?v=20260813b"></script>
</body>
</html>
