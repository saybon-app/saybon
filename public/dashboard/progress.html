<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="/js/auth-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Progress - SayBon</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/dashboard-fun.css?v=1">
</head>
<body>
<button class="fx-icon fx-back" onclick="location.href='/dashboard/'" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
<button class="fx-icon fx-dash" onclick="location.href='/dashboard/'" aria-label="Dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg></button>

<div class="fx-stage">
  <p class="fx-title">My Progress</p>
  <p class="fx-sub">Every minute you practise counts.</p>

  <div class="fx-hero" id="hero"><div class="fx-mascot sleep">😴</div><div><h2>Waking things up...</h2><p>One moment.</p></div></div>
  <div class="fx-stats" id="stats"></div>

  <div class="fx-label">This week</div>
  <div class="fx-card"><div class="fx-week" id="week"></div></div>
  <div class="fx-card"><p class="fx-note" id="note"></p></div>

  <div class="fx-label">DELF placement</div>
  <div id="delf"><div class="fx-empty">Loading...</div></div>

  <div class="fx-label">Lessons by level</div>
  <div id="levels"><div class="fx-empty">Loading...</div></div>
</div>

<script type="module">
const API = "https://saybonapp-server.onrender.com";
import { auth } from "/js/firebase-init.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const NAMES = { "a0-les-petits":"A0 Les Petits", "a0-tout-public":"A0 Tout Public", a1:"A1", a2:"A2", b1:"B1", b2:"B2", c1:"C1" };
const $ = (i) => document.getElementById(i);
function ld(){ const d=new Date(); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function count(el, to){ if(RM||to<1){ el.textContent=to; return; } const t0=performance.now(); (function s(t){ const p=Math.min((t-t0)/900,1); el.textContent=Math.round(to*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(s); })(t0); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

onAuthStateChanged(auth, async function(user){
  if(!user){ $("hero").innerHTML='<div class="fx-mascot sleep">😴</div><div><h2>Log in to see your progress</h2><p>Your flame is waiting.</p></div>'; return; }
  const tok = await user.getIdToken();
  const H = { headers:{ Authorization:"Bearer "+tok } };
  const [sumR, delfR] = await Promise.all([
    fetch(API+"/api/activity/summary?day="+ld(), H).then(r=>r.ok?r.json():null).catch(()=>null),
    fetch(API+"/api/delf/state", H).then(r=>r.ok?r.json():null).catch(()=>null)
  ]);

  const sum = sumR;
  if(!sum){
    $("hero").innerHTML='<div class="fx-mascot sleep">😴</div><div><h2>Your flame is sleeping</h2><p>Finish a lesson, a game or a song and it wakes up here.</p><a class="fx-btn" href="/levels/">Start a lesson</a></div>';
    $("stats").innerHTML=""; $("week").innerHTML=""; $("note").textContent="Your week fills up as you practise. Even five minutes lights a day.";
    $("levels").innerHTML='<div class="fx-empty">Your first lesson is waiting. Finish it and a bar starts filling here.</div>';
  } else {
    const mins = Math.floor((sum.totalsSeconds.lesson+sum.totalsSeconds.game+sum.totalsSeconds.music+sum.totalsSeconds.exam)/60);
    if(sum.streak>0){
      $("hero").innerHTML='<div class="fx-mascot">🔥</div><div><h2>'+sum.streak+'-day streak!</h2><p>'+(sum.countedToday?"Today is done. See you tomorrow!":"Practise today to keep it burning.")+'</p>'+(sum.countedToday?'':'<a class="fx-btn" href="/levels/">Keep it going</a>')+'</div>';
    } else {
      $("hero").innerHTML='<div class="fx-mascot sleep">😴</div><div><h2>Your flame is sleeping</h2><p>Wake it up with a lesson, a game or a song.</p><a class="fx-btn" href="/levels/">Wake it up</a></div>';
    }
    $("stats").innerHTML='<div class="fx-stat"><b id="s1">0</b><span>Day streak</span></div><div class="fx-stat"><b id="s2">0</b><span>Best streak</span></div><div class="fx-stat"><b id="s3">0</b><span>Minutes</span></div>';
    count($("s1"),sum.streak); count($("s2"),sum.bestStreak); count($("s3"),mins);
    const L=["S","M","T","W","T","F","S"]; const mx=Math.max.apply(null,sum.week.map(w=>w.minutes).concat([sum.goalMinutes]));
    $("week").innerHTML=sum.week.map((w,i)=>{ const h=Math.max(6,Math.round(w.minutes/mx*90)); return '<div class="fx-day'+(w.counted?' on':'')+(i===6?' today':'')+'"><em>'+(w.counted?'⭐':'')+'</em><i style="height:'+h+'px;animation-delay:'+(i*0.07)+'s"></i>'+L[new Date(w.day+"T00:00:00").getDay()]+'</div>'; }).join("");
    const act=sum.week.filter(w=>w.counted).length;
    $("note").textContent = sum.streak>=7 ? "A whole week and more! This steady rhythm is how French starts to feel natural." :
      act>=3 ? "You practised on "+act+" of the last 7 days. Little and often beats long and rare. Keep it up!" :
      act>=1 ? "Nice start! A few minutes a day, any lesson, game or song, adds up fast toward your "+sum.goalMinutes+"-minute goal." :
      "A fresh week, a fresh start. Pick one small thing today and your first star lands here.";
    const keys=Object.keys(sum.levels);
    $("levels").innerHTML = keys.length ? keys.map(k=>{ const c=sum.levels[k],p=Math.min(100,Math.round(c/25*100)); return '<div class="fx-card"><div class="fx-row"><div class="fx-rt">'+esc(NAMES[k]||k)+'</div><div class="fx-rs">'+c+' of 25 lessons</div></div><div class="fx-track"><div class="fx-fill" style="width:'+p+'%"></div></div></div>'; }).join("")
      : '<div class="fx-empty">Your first lesson is waiting. Finish it and a bar starts filling here. 🌱</div>';
  }

  if(delfR && delfR.attempts.length){
    $("delf").innerHTML = delfR.attempts.slice(0,4).map(a=>'<div class="fx-card"><div class="fx-row"><div><div class="fx-rt">'+esc((a.level||"").toUpperCase())+' placement</div><div class="fx-rs">'+(a.passed?"Cleared! 🎉":"Room to grow, you will get there")+'</div></div><div class="fx-score">'+Math.round((a.pct||0)*100)+'%</div></div></div>').join("")+'<div class="fx-empty"><a href="/delf/dashboard.html">Open my DELF dashboard</a></div>';
  } else {
    $("delf").innerHTML='<div class="fx-empty">Take the DELF placement test and your scores pop up right here. 🎯 <a href="/delf/placement.html">Start it</a></div>';
  }
});
</script>
</body>
</html>
