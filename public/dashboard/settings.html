<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="/js/auth-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings - SayBon</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/dashboard-fun.css?v=1">
</head>
<body>
<button class="fx-icon fx-back" onclick="location.href='/dashboard/'" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
<button class="fx-icon fx-dash" onclick="location.href='/dashboard/'" aria-label="Dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg></button>

<div class="fx-stage" style="max-width:480px">
  <p class="fx-title">Settings</p>
  <p class="fx-sub">Make SayBon feel like yours.</p>

  <div class="fx-card fx-prof">
    <button class="fx-avatar" id="avatar" aria-label="Change profile photo">
      <span id="avInner"><svg class="cam" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></span>
      <span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span>
    </button>
    <input type="file" id="file" accept="image/*" hidden>
    <button class="fx-link" id="rmPhoto" style="display:none">Remove photo</button>
    <div class="fx-field">
      <label for="name">Your name</label>
      <input class="fx-input" id="name" maxlength="30" autocomplete="nickname" placeholder="What should we call you?">
      <div class="fx-email" id="email"></div>
    </div>
    <button class="fx-btn teal block" id="saveName" style="max-width:340px;margin-top:6px">Save name</button>
    <div class="fx-msg" id="profMsg"></div>
  </div>

  <div class="fx-card">
    <div class="fx-rt" style="font-size:1.1rem">Daily goal 🎯</div>
    <div class="fx-rs" style="margin-bottom:12px">Minutes of real practice a day. Lessons, games, exams and music all count.</div>
    <div class="fx-goals">
      <button class="fx-goal" data-m="5">5<small>min</small></button>
      <button class="fx-goal" data-m="10">10<small>min</small></button>
      <button class="fx-goal" data-m="15">15<small>min</small></button>
      <button class="fx-goal" data-m="30">30<small>min</small></button>
    </div>
    <div class="fx-msg" id="goalMsg"></div>
  </div>

  <button class="fx-btn red block" id="logout">Log out</button>
</div>

<script type="module">
const API = "https://saybonapp-server.onrender.com";
import { app, auth } from "/js/firebase-init.js";
import { onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";
const $ = (i) => document.getElementById(i);
const CAMSVG = $("avInner").innerHTML;
function ld(){ const d=new Date(); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function nameFromEmail(e){ const l=(e||"").split("@")[0].replace(/[._\-+0-9]+/g," ").trim(); return l ? l.replace(/\b\w/g,c=>c.toUpperCase()).slice(0,30) : "Learner"; }
function showPhoto(url){
  if(url){ $("avInner").innerHTML='<img alt="Your photo">'; $("avInner").firstChild.src=url; $("rmPhoto").style.display="inline"; }
  else { $("avInner").innerHTML=CAMSVG; $("rmPhoto").style.display="none"; }
}
function markGoal(m){ document.querySelectorAll(".fx-goal").forEach(b=>b.classList.toggle("on",Number(b.dataset.m)===m)); }
function sparkle(el){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const r=el.getBoundingClientRect();
  for(let i=0;i<8;i++){ const s=document.createElement("span"); s.className="fx-sparkle"; s.textContent=["✨","⭐","💛"][i%3];
    s.style.left=(r.left+r.width/2)+"px"; s.style.top=(r.top+r.height/2)+"px";
    s.style.setProperty("--dx",(Math.random()*120-60)+"px"); s.style.setProperty("--dy",(Math.random()*-110-10)+"px");
    document.body.appendChild(s); setTimeout(()=>s.remove(),1000); }
}
function squarePhoto(file){
  return new Promise((resolve,reject)=>{
    const img=new Image(), u=URL.createObjectURL(file);
    img.onload=()=>{ const s=Math.min(img.width,img.height), c=document.createElement("canvas"); c.width=c.height=256;
      c.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,256,256);
      URL.revokeObjectURL(u); c.toBlob(b=>b?resolve(b):reject(new Error("blob")),"image/jpeg",0.82); };
    img.onerror=()=>reject(new Error("not an image")); img.src=u;
  });
}

onAuthStateChanged(auth, async function(user){
  if(!user){ $("profMsg").textContent="Log in to personalise your profile."; return; }
  $("email").textContent=user.email||"";
  $("name").value=user.displayName||nameFromEmail(user.email);
  showPhoto(user.photoURL);

  $("saveName").onclick=async()=>{
    const n=$("name").value.trim();
    if(n.length<2){ $("profMsg").textContent="Pick a name with at least 2 letters."; return; }
    $("profMsg").textContent="Saving...";
    try{ await updateProfile(user,{displayName:n}); $("profMsg").textContent="Lovely, "+n+"! Name saved. 🎉"; sparkle($("saveName")); }
    catch(e){ $("profMsg").textContent="That did not save. Please try once more."; }
  };
  $("avatar").onclick=()=>$("file").click();
  $("file").onchange=async()=>{
    const f=$("file").files[0]; if(!f) return;
    $("profMsg").textContent="Polishing your photo...";
    try{
      const blob=await squarePhoto(f);
      const r=ref(getStorage(app),"chatAvatars/"+user.uid+"/profile.jpg");
      await uploadBytes(r,blob,{contentType:"image/jpeg"});
      const url=await getDownloadURL(r);
      await updateProfile(user,{photoURL:url});
      showPhoto(url+"&t="+Date.now()); $("profMsg").textContent="Looking good! Photo saved. 📸"; sparkle($("avatar"));
    }catch(e){ console.error(e); $("profMsg").textContent="The photo did not upload. Try a smaller picture."; }
    $("file").value="";
  };
  $("rmPhoto").onclick=async()=>{ try{ await updateProfile(user,{photoURL:""}); showPhoto(null); $("profMsg").textContent="Photo removed."; }catch(e){} };

  try{
    const tok=await user.getIdToken();
    const r=await fetch(API+"/api/activity/summary?day="+ld(),{headers:{Authorization:"Bearer "+tok}});
    if(r.ok) markGoal((await r.json()).goalMinutes);
  }catch(e){}
  document.querySelectorAll(".fx-goal").forEach(b=>b.onclick=async()=>{
    const m=Number(b.dataset.m); $("goalMsg").textContent="Saving...";
    try{
      const tok=await user.getIdToken();
      const r=await fetch(API+"/api/activity/settings",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+tok},body:JSON.stringify({goalMinutes:m})});
      if(!r.ok) throw 0; markGoal(m); $("goalMsg").textContent="Goal set: "+m+" minutes a day. You've got this! 💪";
    }catch(e){ $("goalMsg").textContent="That did not save. Please try again."; }
  });
});
$("logout").onclick=()=>signOut(auth).then(()=>{ if(window.stopAppBgMusic){window.stopAppBgMusic();} location.href="/"; }).catch(()=>{});
</script>
</body>
</html>
