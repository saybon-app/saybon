<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="/js/auth-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Achievements - SayBon</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/dashboard-fun.css?v=1">
</head>
<body>
<button class="fx-icon fx-back" onclick="location.href='/dashboard/'" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
<button class="fx-icon fx-dash" onclick="location.href='/dashboard/'" aria-label="Dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg></button>

<div class="fx-stage">
  <p class="fx-title">Achievements</p>
  <p class="fx-sub" id="sub">Collect them all, one small win at a time.</p>
  <div class="fx-card" id="count" style="display:none"><div class="fx-row"><div class="fx-rt" id="countTxt"></div><div style="font-size:1.6rem">🏆</div></div><div class="fx-track"><div class="fx-fill" id="countBar" style="background:linear-gradient(90deg,#ffc531,#ff9f1c)"></div></div></div>
  <div class="fx-grid" id="grid"></div>
</div>
<script type="module">
const API = "https://saybonapp-server.onrender.com";
import { auth } from "/js/firebase-init.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
const grid = document.getElementById("grid");
function ld(){ const d=new Date(); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function sparkle(el){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const r=el.getBoundingClientRect();
  for(let i=0;i<8;i++){ const s=document.createElement("span"); s.className="fx-sparkle"; s.textContent=["✨","⭐","💛"][i%3];
    s.style.left=(r.left+r.width/2)+"px"; s.style.top=(r.top+r.height/2)+"px";
    s.style.setProperty("--dx",(Math.random()*120-60)+"px"); s.style.setProperty("--dy",(Math.random()*-110-10)+"px");
    document.body.appendChild(s); setTimeout(()=>s.remove(),1000); }
}
onAuthStateChanged(auth, async function(user){
  if(!user){ grid.innerHTML='<div class="fx-empty" style="grid-column:1/-1">Log in and your badges will be waiting for you.</div>'; return; }
  try{
    const tok=await user.getIdToken();
    const r=await fetch(API+"/api/activity/summary?day="+ld(),{headers:{Authorization:"Bearer "+tok}});
    if(!r.ok) throw 0;
    const list=(await r.json()).achievements;
    const n=list.filter(b=>b.earned).length;
    document.getElementById("count").style.display="block";
    document.getElementById("countTxt").textContent=n+" of "+list.length+" unlocked";
    document.getElementById("countBar").style.width=Math.round(n/list.length*100)+"%";
    grid.innerHTML=list.map(b=>'<div class="fx-badge '+(b.earned?'earned':'locked')+'"><div class="ic">'+b.icon+'</div><div class="bt">'+b.title+'</div><div class="bs">'+b.sub+'</div>'+(b.earned?'':'<div class="bar"><div style="width:'+Math.round(b.value/b.target*100)+'%"></div></div><div class="bs">'+b.value+' / '+b.target+'</div>')+'</div>').join("");
    grid.querySelectorAll(".fx-badge.earned").forEach(el=>el.addEventListener("click",()=>sparkle(el)));
    if(n===0) document.getElementById("sub").textContent="Your first badge is one lesson away. Go get it!";
  }catch(e){
    grid.innerHTML='<div class="fx-empty" style="grid-column:1/-1">Your first badge is one lesson away. Finish one and it pops up here. ✨</div>';
  }
});
</script>
</body>
</html>
