<!DOCTYPE html>
<html lang="en">
<head>
<script type='module' src='/js/auth-guard.js'></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LEARNER DASHBOARD - SayBon</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/dashboard.css?v=20260822152132" />
  <link rel="stylesheet" href="/css/dashboard-live.css?v=1" />
  <link rel="stylesheet" href="/css/dashboard-polish.css?v=1" />
  <link rel="stylesheet" href="/css/dashboard-pro.css?v=1" />
  <link rel="stylesheet" href="/css/dashboard-sharp.css?v=1" />
  <link rel="stylesheet" href="/css/dashboard-christmas-bg.css?v=1" />
</head>
<body>

<div class="dash-shell">

  <aside class="dash-sidebar">

    <div class="dash-logo">
      <span class="dash-logo-text">LEARNER<br><em>DASHBOARD</em></span>
    </div>

    <div class="dash-streak-card">
      <span class="dash-streak-flame">&#128293;</span>
      <div>
        <div class="dash-streak-num js-streak-num">0</div>
        <div class="dash-streak-label">Day streak</div>
      </div>
    </div>

    <div class="dash-profile-card">
      <div class="dash-avatar">A</div>
      <div>
        <div class="dash-profile-name">Learner</div>
        <div class="dash-profile-level js-profile-level">-</div>
      </div>
    </div>

    <nav class="dash-nav">
      <button class="dash-nav-home-btn" onclick="goHome()" aria-label="Home">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10.5L12 3l9 7.5"/>
          <path d="M5 9.5V21h14V9.5"/>
        </svg>
      </button>
      <a href="/dashboard/progress.html" class="dash-nav-link">My Progress</a>
      <a href="/dashboard/achievements.html" class="dash-nav-link">Achievements</a>
      <a href="/dashboard/settings.html" class="dash-nav-link">Settings</a>
      <a href="/feedback/" class="dash-nav-link">Feedback</a>
      <a href="/support/" class="dash-nav-link">Support 💚 SayBon</a>
    </nav>

    <div class="dash-goal-card">
      <div class="dash-goal-title">Daily Goal &#127881;</div>
      <div class="dash-goal-ring-wrap">
        <svg class="dash-goal-ring" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="42" class="ring-track"/>
          <circle cx="50" cy="50" r="42" class="ring-fill js-goal-ring-fill"/>
        </svg>
        <div class="dash-goal-ring-text">
          <span class="js-goal-minutes">0</span><small>/10 min</small>
        </div>
      </div>
      <div class="dash-goal-caption js-goal-caption">Start today's session</div>
    </div>

  </aside>

  <main class="dash-main">

    <header class="dash-mobile-topbar">
      <span class="dash-mobile-topbar-title dash-logo-text">LEARNER<br><em>DASHBOARD</em></span>
      <button onclick="goHome()" class="dash-mobile-topbar-home" aria-label="Home">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10.5L12 3l9 7.5"/>
          <path d="M5 9.5V21h14V9.5"/>
        </svg>
      </button>
    </header>

    <div class="dash-mobile-topbar-spacer"></div>

    <div class="dash-mobile-summary">
      <div class="dash-mobile-summary-streak">
        <span class="dash-streak-flame">&#128293;</span>
        <span class="js-streak-num">0</span>
      </div>
      <div class="dash-mobile-summary-profile">
        <div class="dash-avatar">A</div>
        <div>
          <div class="dash-profile-name">Learner</div>
          <div class="dash-profile-level js-profile-level">-</div>
        </div>
      </div>
    </div>

    <nav class="dash-mobile-nav-icons">
      <a href="/dashboard/progress.html" class="dash-mobile-nav-icon">
        <span class="dash-mobile-nav-icon-circle">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 20V10M12 20V4M18 20V14"/>
          </svg>
        </span>
        <span>My Progress</span>
      </a>
      <a href="/dashboard/achievements.html" class="dash-mobile-nav-icon">
        <span class="dash-mobile-nav-icon-circle">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 4h10v3a5 5 0 0 1-10 0V4z"/>
            <path d="M7 5H4a3 3 0 0 0 3 4"/>
            <path d="M17 5h3a3 3 0 0 1-3 4"/>
            <path d="M12 12v3"/>
            <path d="M9 19h6l-1-3h-4l-1 3z"/>
          </svg>
        </span>
        <span>Achievements</span>
      </a>
      <a href="/dashboard/settings.html" class="dash-mobile-nav-icon">
        <span class="dash-mobile-nav-icon-circle">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>
          </svg>
        </span>
        <span>Settings</span>
      </a>
    </nav>

    <div class="dash-goal-card dash-goal-card-mobile">
      <div class="dash-goal-title">Daily Goal &#127881;</div>
      <div class="dash-goal-ring-wrap">
        <svg class="dash-goal-ring" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="42" class="ring-track"/>
          <circle cx="50" cy="50" r="42" class="ring-fill js-goal-ring-fill"/>
        </svg>
        <div class="dash-goal-ring-text">
          <span class="js-goal-minutes">0</span><small>/10 min</small>
        </div>
      </div>
      <div class="dash-goal-caption js-goal-caption">Start today's session</div>
    </div>

    <div class="dash-grid" aria-label="SayBon learning features">
      <a class="dash-card card-levels" href="/levels/" aria-label="Levels">
        <img src="/assets/dashboard/cards/01-french-levels-path-banner-1.png" alt="Levels — A0–C1 structured path" loading="lazy" decoding="async">
      </a>
      <div class="dash-card card-schools" role="group" aria-label="French for Schools, coming soon"><img src="/assets/dashboard/cards/02-french-for-schools-bus-banner-2.png" alt="French for Schools — Tailor-made school French" loading="lazy" decoding="async"></div>
      <a class="dash-card card-professional" href="/professional/" aria-label="French for Professionals">
        <img src="/assets/dashboard/cards/03-french-for-professionals-career-card-3.png" alt="French for Professionals — For work and career growth" loading="lazy" decoding="async">
      </a>
      <a class="dash-card card-talkletics" href="/talkletics/" aria-label="Talkletics">
        <img src="/assets/dashboard/cards/04-talkletics-fluency-games-card-4.png" alt="Talkletics — Tried-and-tested fluency games" loading="lazy" decoding="async">
      </a>
      <a class="dash-card card-library" href="/library/" aria-label="Library">
        <img src="/assets/dashboard/cards/05-library-fluency-card-5.png" alt="Library — Fluency through reading" loading="lazy" decoding="async">
      </a>
      <a class="dash-card card-music" href="/music/" aria-label="Music">
        <img src="/assets/dashboard/cards/06-music-soak-ui-card-6.png" alt="Music — Soak up the music" loading="lazy" decoding="async">
      </a>
      <a class="dash-card card-delf" href="/delf/" aria-label="DELF Prep">
        <img src="/assets/dashboard/cards/07-delf-prep-certificate-banner-7.png" alt="DELF Prep — Exam preparation at your own pace" loading="lazy" decoding="async">
      </a>
      <a class="dash-card card-translation" href="/translation/" aria-label="Translation">
        <img src="/assets/dashboard/cards/08-affordable-expert-translation-services-8.png" alt="Translation — Affordable, accessible, expert services" loading="lazy" decoding="async">
      </a>
      <a class="dash-card card-chat" href="/chat/" aria-label="Chat Room">
        <img src="/assets/dashboard/cards/09-friendly-french-chat-room-card-9.png" alt="Chat Room — A friendly French community" loading="lazy" decoding="async">
      </a>
    </div>

  </main>

</div>

<script src="/dashboard/dashboard.js?v=20260811f"></script>
<script type="module" src="/dashboard/dashboard-live.js?v=1"></script>
<script src="/dashboard/dashboard-polish.js?v=1"></script>
<script type="module" src="/dashboard/level-sync.js?v=20261102221523"></script>
</body>
</html>
