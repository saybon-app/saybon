<!DOCTYPE html>
<html lang="en">
<head>
<script type='module' src='/js/auth-guard.js'></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LEARNER DASHBOARD — SayBon</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/dashboard.css?v=20260811" />
</head>

<body>

<div class="dash-shell">

  <aside class="dash-sidebar">

    <div class="dash-logo">
      <img src="/assets/dashboard/dashboard-logo.png" alt="Learner Dashboard" />
    </div>

    <div class="dash-streak-card">
      <span class="dash-streak-flame">🔥</span>
      <div>
        <div class="dash-streak-num" id="streakNum">–</div>
        <div class="dash-streak-label">Day streak</div>
      </div>
    </div>

    <div class="dash-profile-card">
      <div class="dash-avatar" id="dashAvatar">A</div>
      <div>
        <div class="dash-profile-name" id="dashName">Learner</div>
        <div class="dash-profile-level" id="dashLevel">–</div>
      </div>
    </div>

    <nav class="dash-nav">
      <a href="#" class="dash-nav-link">My Progress</a>
      <a href="#" class="dash-nav-link">Achievements</a>
      <a href="#" class="dash-nav-link">Settings</a>
    </nav>

    <div class="dash-goal-card">
      <div class="dash-goal-title">Daily Goal</div>
      <div class="dash-goal-ring-wrap">
        <svg class="dash-goal-ring" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="42" class="ring-track"/>
          <circle cx="50" cy="50" r="42" class="ring-fill" id="goalRingFill"/>
        </svg>
        <div class="dash-goal-ring-text">
          <span id="goalMinutes">0</span><small>/30 min</small>
        </div>
      </div>
      <div class="dash-goal-caption" id="goalCaption">Start today's session</div>
    </div>

  </aside>

  <main class="dash-main">

    <div class="dash-grid">

      <div class="dash-card card-levels" onclick="goLevels()">
        <img src="/assets/dashboard/levels.PNG" alt="Levels: A0 to C1 structured path" class="dash-card-icon" />
        <span class="dash-card-label" data-text="Continue learning"></span>
      </div>

      <div class="dash-card card-talkletics" onclick="goTalkletics()">
        <img src="/assets/dashboard/talkletics.PNG" alt="Talkletics: skill building games" class="dash-card-icon" />
        <span class="dash-card-label" data-text="Play games"></span>
      </div>

      <div class="dash-card card-music" onclick="goMusic()">
        <img src="/assets/dashboard/music.PNG" alt="Music: learn with rhythm" class="dash-card-icon" />
        <span class="dash-card-label" data-text="Explore music"></span>
      </div>

      <div class="dash-card card-delf" onclick="goDelf()">
        <img src="/assets/dashboard/delf.PNG" alt="DELF Prep: mock exams" class="dash-card-icon" />
        <span class="dash-card-label" data-text="Start mock exam"></span>
      </div>

      <div class="dash-card card-translation" onclick="goTranslation()">
        <img src="/assets/dashboard/translation.PNG" alt="Translation: clients and translators" class="dash-card-icon" />
        <span class="dash-card-label" data-text="Request translation"></span>
      </div>

      <div class="dash-card card-chat" onclick="goChat()">
        <img src="/assets/dashboard/chatroom.PNG" alt="Chat Room: community space" class="dash-card-icon" />
        <span class="dash-card-label" data-text="Join conversation"></span>
      </div>

      <div class="dash-card card-feedback" onclick="goFeedback()">
        <img src="/assets/dashboard/feedback.PNG" alt="Feedback: enquiries and suggestions" class="dash-card-icon" />
        <span class="dash-card-label" data-text="Give feedback"></span>
      </div>

      <div class="dash-card card-support" onclick="goSupport()">
        <img src="/assets/dashboard/suppport.PNG" alt="Support: we are here for you" class="dash-card-icon" />
        <span class="dash-card-label" data-text="Get support"></span>
      </div>

    </div>

  </main>

  <nav class="dash-mobile-bar">
    <button onclick="goFeedback()" aria-label="Feedback">♥</button>
    <button onclick="goChat()" aria-label="Chat">💬</button>
    <button onclick="goHome()" class="dash-mobile-home" aria-label="Home">Home</button>
  </nav>

</div>

<script src="/dashboard/dashboard.js?v=20260811"></script>
</body>
</html>
