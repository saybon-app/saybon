<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Why learn French? — SayBon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/why.css" />
  <link rel="stylesheet" href="/css/page-transition.css" />
  <script type="module" src="/js/nav-engine.js"></script>
  <script defer src="/js/why.js"></script>
</head>
<body class="why-page">

  <main class="why-shell">

    <!-- HOME BUTTON -->
    <button class="why-home-btn" id="whyHomeBtn" type="button" aria-label="Go home">
      <img src="/assets/why/home-icon.png" alt="Home" />
    </button>

    <!-- HERO -->
    <section class="why-hero" aria-hidden="true">
      <img class="why-globe" src="/assets/why/globe.png" alt="" />
    </section>

    <!-- TITLE -->
    <header class="why-header">
      <h1 class="why-title">Why do you want to learn French?</h1>
    </header>

    <!-- OPTIONS -->
    <section class="why-options" aria-label="Reasons for learning French">

      <button class="why-option option-personal" type="button" data-reason="personal" aria-label="Personal Interest">
        <span class="why-option-art">
          <img src="/assets/why/desktop-1.png" alt="" />
        </span>
        <span class="why-option-label">Personal Interest</span>
      </button>

      <button class="why-option option-school" type="button" data-reason="school" aria-label="School">
        <span class="why-option-art">
          <img src="/assets/why/desktop-2.png" alt="" />
        </span>
        <span class="why-option-label">School</span>
      </button>

      <button class="why-option option-travel" type="button" data-reason="travel" aria-label="Travel">
        <span class="why-option-art">
          <img src="/assets/why/desktop-3.png" alt="" />
        </span>
        <span class="why-option-label">Travel</span>
      </button>

      <button class="why-option option-career" type="button" data-reason="career" aria-label="Career">
        <span class="why-option-art">
          <img src="/assets/why/desktop-4.png" alt="" />
        </span>
        <span class="why-option-label">Career</span>
      </button>

    </section>

  </main>
</body>
</html>
