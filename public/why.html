<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Why learn French? — SayBon</title>

  <link rel="stylesheet" href="/css/why.css" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="why-page">

  <main class="why-shell">

    <!-- HOME BUTTON -->
    <button class="why-home-btn" id="whyHomeBtn" aria-label="Go home">
      <img src="/assets/why/home-icon.png" alt="Home" />
    </button>

    <!-- DESKTOP -->
    <section class="why-desktop" aria-label="Why desktop layout">
      <div class="why-desktop-bg">
        <img src="/assets/why/desktop-background.png" alt="" />
      </div>

      <div class="why-desktop-pills" id="optionsGridDesktop">
        <button class="why-option why-option-desktop travel" data-reason="travel">
          <img src="/assets/why/desktop-1.png" alt="Travel & Culture" />
        </button>

        <button class="why-option why-option-desktop school" data-reason="school">
          <img src="/assets/why/desktop-2.png" alt="School / Exams" />
        </button>

        <button class="why-option why-option-desktop personal" data-reason="personal">
          <img src="/assets/why/desktop-3.png" alt="Personal Interest" />
        </button>

        <button class="why-option why-option-desktop career" data-reason="career">
          <img src="/assets/why/desktop-4.png" alt="Career Growth" />
        </button>
      </div>
    </section>

    <!-- MOBILE -->
    <section class="why-mobile" aria-label="Why mobile layout">
      <div class="why-mobile-bg">
        <img src="/assets/why/mobile-background.png" alt="" />
      </div>

      <div class="why-mobile-pills" id="optionsGridMobile">
        <button class="why-option why-option-mobile travel" data-reason="travel">
          <img src="/assets/why/mobile-1.png" alt="Travel & Culture" />
        </button>

        <button class="why-option why-option-mobile school" data-reason="school">
          <img src="/assets/why/mobile-2.png" alt="School / Exams" />
        </button>

        <button class="why-option why-option-mobile personal" data-reason="personal">
          <img src="/assets/why/mobile-3.png" alt="Personal Interest" />
        </button>

        <button class="why-option why-option-mobile career" data-reason="career">
          <img src="/assets/why/mobile-4.png" alt="Career Growth" />
        </button>
      </div>
    </section>

    <!-- AFFIRMATION -->
    <div id="affirmationBox" class="affirmation hidden"></div>

  </main>

  <script src="/js/why.js"></script>
</body>
</html>
