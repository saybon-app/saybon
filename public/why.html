<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Why Learn French? — SayBon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/css/why.css?v=20260625-why-final-1" />
</head>
<body class="why-page">

  <main class="why-shell">

    <!-- HOME -->
    <button class="why-home-btn" id="whyHomeBtn" type="button" aria-label="Go home">
      <img src="/assets/why/home-icon.png" alt="Home" />
    </button>

    <!-- DESKTOP -->
    <section class="why-stage why-stage-desktop" aria-label="Why learn French desktop">
      <div class="why-bg-wrap why-bg-wrap-desktop">
        <img class="why-bg why-bg-desktop" src="/assets/why/desktop-background.png" alt="Why do you want to learn French?" />
      </div>

      <button class="why-option why-option-desktop why-option-personal" type="button" data-reason="personal" aria-label="Personal Interest"><span class="why-option-frame"><img src="/assets/why/desktop-1.png" alt="Personal Interest"  /></span></button>

      <button class="why-option why-option-desktop why-option-school" type="button" data-reason="school" aria-label="School / Exams"><span class="why-option-frame"><img src="/assets/why/desktop-2.png" alt="School / Exams"  /></span></button>

      <button class="why-option why-option-desktop why-option-travel" type="button" data-reason="travel" aria-label="Travel & Culture"><span class="why-option-frame"><img src="/assets/why/desktop-3.png" alt="Travel & Culture"  /></span></button>

      <button class="why-option why-option-desktop why-option-career" type="button" data-reason="career" aria-label="Career Growth"><span class="why-option-frame"><img src="/assets/why/desktop-4.png" alt="Career Growth"  /></span></button>
    </section>

    <!-- MOBILE -->
    <section class="why-stage why-stage-mobile" aria-label="Why learn French mobile">
      <div class="why-bg-wrap why-bg-wrap-mobile">
        <img class="why-bg why-bg-mobile" src="/assets/why/mobile-background.png" alt="Why do you want to learn French?" />
      </div>

      <button class="why-option why-option-mobile why-option-mobile-1" type="button" data-reason="personal" aria-label="Personal Interest"><span class="why-option-frame"><img src="/assets/why/mobile-1.png" alt="Personal Interest"  /></span></button>

      <button class="why-option why-option-mobile why-option-mobile-2" type="button" data-reason="school" aria-label="School / Exams"><span class="why-option-frame"><img src="/assets/why/mobile-2.png" alt="School / Exams"  /></span></button>

      <button class="why-option why-option-mobile why-option-mobile-3" type="button" data-reason="travel" aria-label="Travel & Culture"><span class="why-option-frame"><img src="/assets/why/mobile-3.png" alt="Travel & Culture"  /></span></button>

      <button class="why-option why-option-mobile why-option-mobile-4" type="button" data-reason="career" aria-label="Career Growth"><span class="why-option-frame"><img src="/assets/why/mobile-4.png" alt="Career Growth"  /></span></button>
    </section>

  </main>

  <script src="/js/why.js?v=20260625-why-final-1"></script>
</body>
</html>
