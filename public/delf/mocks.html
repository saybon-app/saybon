<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="/js/auth-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DELF Mock Exams - SayBon</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mock.css?v=1">
</head>
<body>
<button class="mk-corner mk-back" onclick="location.href='/delf/'" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
<button class="mk-corner mk-dash" onclick="location.href='/dashboard/'" aria-label="Dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect></svg></button>
<main class="mk-wrap">
<p class="mk-eyebrow">SayBon DELF Preparation</p>
<h1 class="mk-title">Mock Exams</h1>
<p class="mk-sub">Full practice exams in the official DELF format: listening, reading, writing and speaking. Ten per level.</p>
<div class="tabs" id="tr"></div><div class="tabs" id="lv"></div>
<div class="mk-lv" id="list"></div>
<p class="mk-small" style="text-align:center;margin-top:18px" id="note"></p>
</main>
<script type="module">
import { auth } from "/js/firebase-init.js";
const API_BASE = "https://saybonapp-server.onrender.com";
const CAT = { tp: ["Tout Public", ["a1", "a2", "b1", "b2", "c1", "c2"]], jr: ["Junior", ["a1", "a2", "b1", "b2"]], pr: ["Prim", ["a11", "a1", "a2"]] };
const LN = { a11: "A1.1", a1: "A1", a2: "A2", b1: "B1", b2: "B2", c1: "C1 DALF", c2: "C2 DALF" };
const st = { tr: new URLSearchParams(location.search).get("t") || "tp", lv: new URLSearchParams(location.search).get("l") || "a1", done: {} };
async function hist() { try { const u = auth.currentUser; if (!u) return; const t = await u.getIdToken(); const r = await fetch(API_BASE + "/api/delfMockHistory", { headers: { Authorization: "Bearer " + t } }); const j = await r.json(); (j.items || []).forEach(x => { const o = st.done[x.mockId]; if (!o || x.total > o) st.done[x.mockId] = x.total; }); } catch (e) { } }
async function avail(tr, lv) { try { const r = await fetch("/delf/mocks/data/" + tr + "-" + lv + ".json?v=1"); if (!r.ok) return null; return await r.json(); } catch (e) { return null; } }
async function draw() {
  document.getElementById("tr").innerHTML = Object.keys(CAT).map(k => '<button class="' + (k === st.tr ? "on" : "") + '" data-t="' + k + '">' + CAT[k][0] + "</button>").join("");
  const lvs = CAT[st.tr][1]; if (lvs.indexOf(st.lv) < 0) st.lv = lvs[0];
  document.getElementById("lv").innerHTML = lvs.map(l => '<button class="' + (l === st.lv ? "on" : "") + '" data-l="' + l + '">' + LN[l] + "</button>").join("");
  const data = await avail(st.tr, st.lv), box = document.getElementById("list"), note = document.getElementById("note");
  if (!data) { box.innerHTML = ""; note.textContent = "These mock exams are coming soon."; return; }
  note.textContent = st.lv === "c2" ? "Pass: 50/100 overall and at least 10/50 in each of the two papers." : "Pass: 50/100 overall and at least 5/25 in each paper.";
  box.innerHTML = data.map(m => '<a href="/delf/mock.html?id=' + m.id + '" class="' + (st.done[m.id] != null ? "done" : "") + '"><b>Mock ' + m.n + "</b>" + m.theme + (st.done[m.id] != null ? '<br><span class="mk-small">Best: ' + st.done[m.id] + " / 100</span>" : "") + "</a>").join("");
}
document.addEventListener("click", e => { const b = e.target.closest("button[data-t],button[data-l]"); if (!b) return; if (b.dataset.t) st.tr = b.dataset.t; if (b.dataset.l) st.lv = b.dataset.l; draw(); });
hist().then(draw); draw();
</script>
</body>
</html>
