<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Your Level</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="reveal.css?v=20260811" />
</head>
<body>

<div class="reveal-container">

  <div class="badge-glow" aria-hidden="true"></div>

  <div class="badge-wrap" id="badgeWrap">
    <svg id="wreathSvg" class="wreath-svg" viewBox="-140 -140 280 280" aria-hidden="true"></svg>

    <div class="badge-shield">
      <div class="badge-shield-highlight"></div>
    </div>
  </div>

  <div class="badge-ribbon" id="ribbon">
    <span id="levelText" class="level-text"></span>
  </div>

  <div id="buttons" class="reveal-buttons">
    <button id="startJourney" class="btn primary slide-left">Start journey</button>
    <button id="backHome" class="btn secondary slide-right">Back to homepage</button>
  </div>

</div>

<script src="reveal.js?v=20260811"></script>
</body>
</html>
