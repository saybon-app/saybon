<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Your Level</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="reveal.css?v=20260811" />
</head>
<body>

<div class="reveal-container">

  <div class="badge-glow" aria-hidden="true"></div>

  <div class="badge-wrap" id="badgeWrap">
    <svg class="trophy-svg" viewBox="0 0 120 140" aria-hidden="true">
      <defs>
        <linearGradient id="trophyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffe9a8"/>
          <stop offset="45%" stop-color="#f0b429"/>
          <stop offset="75%" stop-color="#c9860f"/>
          <stop offset="100%" stop-color="#8f5c05"/>
        </linearGradient>
      </defs>

      <path d="M30,28 C10,28 10,55 30,58" fill="none" stroke="url(#trophyGradient)" stroke-width="6" stroke-linecap="round"/>
      <path d="M90,28 C110,28 110,55 90,58" fill="none" stroke="url(#trophyGradient)" stroke-width="6" stroke-linecap="round"/>

      <path d="M30,20 C30,10 90,10 90,20 L90,50 C90,80 70,85 60,85 C50,85 30,80 30,50 Z" fill="url(#trophyGradient)" stroke="#8f5c05" stroke-width="1.5"/>

      <rect x="55" y="85" width="10" height="18" fill="url(#trophyGradient)"/>
      <rect x="40" y="103" width="40" height="8" rx="2" fill="url(#trophyGradient)"/>
      <rect x="34" y="111" width="52" height="11" rx="2" fill="url(#trophyGradient)"/>

      <path d="M38,20 C38,15 58,13 58,13 L52,55 C43,55 38,44 38,20 Z" fill="rgba(255,255,255,.55)"/>
    </svg>
  </div>

  <div class="badge-ribbon" id="ribbon">
    <span id="levelText" class="level-text"></span>
    <div id="levelFriendlyLabel" style="text-align:center;font-size:13px;font-weight:600;color:#fff;opacity:.9;margin-top:2px;"></div>
  </div>

  <div id="buttons" class="reveal-buttons">
    <button id="startJourney" class="btn primary slide-left">Start journey</button>
    <button id="backHome" class="btn secondary slide-right">Back to homepage</button>
  </div>

</div>

<script src="reveal.js?v=20260818"></script>
</body>
</html>
