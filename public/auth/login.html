<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - SayBon</title>

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./login.css" />
  <link rel="stylesheet" href="/css/page-reveal.css" />
<style id="emailAuthStyle">.email-divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:#9ca3af;font-size:13px}.email-auth-form{display:flex;flex-direction:column;gap:10px;width:100%;max-width:280px}.email-auth-form input{padding:12px 14px;border-radius:12px;border:1px solid rgba(31,41,55,.15);background:rgba(255,255,255,.6);color:#1f2937;font-family:"Nunito",sans-serif;font-size:14px}.email-auth-btn{padding:12px;border-radius:12px;border:none;background:#1f2937;color:#fff;font-weight:700;font-size:14px;cursor:pointer}.email-auth-error{font-size:12.5px;color:#dc2626;min-height:16px;margin:0}.email-auth-toggle{font-size:13px;color:#6b7280;margin:0}.toggle-mode-btn{background:none;border:none;color:#1f2937;font-weight:700;cursor:pointer;text-decoration:underline;padding:0;font-size:13px}</style></head>
<body class="pr-preload">

<main class="login-page">

  <div class="login-card">

    <!-- LEFT SIDE (TEXT + BUTTONS) -->
    <div class="left-panel">
      <h1 class="title">Let&#39;s get back to progress &#128170;</h1>

      <div class="icon-row"><button id="loginBtn" class="google-btn" aria-label="Continue with Google">
        <svg viewBox="0 0 48 48" width="24" height="24" aria-hidden="true">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4c-7.5 0-14 4.1-17.4 10.2l-.3.5z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.1 35.5 26.7 36 24 36c-5.3 0-9.7-3.1-11.3-7.5l-6.5 5C9.9 39.9 16.4 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1 2.8-2.9 5.2-5.5 6.8l6.2 5.2C39.9 37.5 44 31.5 44 24c0-1.3-.1-2.7-.4-3.5z"/>
        </svg>
      </button><button id="emailIconBtn" class="email-icon-btn" aria-label="Sign in with email"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="m4 6 8 7 8-7"/></svg></button><button id="backBtn" class="back-btn" aria-label="Back to home">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 11l9-8 9 8"/>
          <path d="M5 10v10h14V10"/>
        </svg>
      </button>
</div><div class="email-divider"><span>or</span></div><form id="emailAuthForm" class="email-auth-form"><input type="email" id="emailInput" placeholder="Email address" required><input type="password" id="passwordInput" placeholder="Password" required><button type="submit" id="emailAuthBtn" class="email-auth-btn">Sign In</button><p class="email-auth-error" id="emailAuthError"></p><p class="email-auth-toggle"><span id="toggleModeText">New here?</span> <button type="button" id="toggleModeBtn" class="toggle-mode-btn">Create Account</button></p></form>
    </div>

    <!-- RIGHT SIDE (TEACHER + ICON IMAGE) -->
    <div class="right-panel">
      <img 
        src="/assets/images/teacher-holding-logo.png"
        alt="SayBon Teacher"
        class="hero-image"
      />
    </div>

  </div>

</main>

<script type="module" src="./login.js"></script>
<script src="/js/page-reveal.js" defer></script>
</body>
</html>
