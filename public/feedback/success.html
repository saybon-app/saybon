<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You — SayBon</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/feedback/feedback.css?v=20260811" />
</head>
<body class="feedback-page">

<main class="feedback-shell">

  <div class="feedback-card" style="text-align:center;">

    <div style="font-size:40px; margin-bottom:14px;">💚</div>

    <h1 id="successTitle">Thank you</h1>

    <p class="subtitle" style="margin-bottom:8px;">Your feedback has been received.</p>
    <p class="subtitle">It truly helps us improve SayBon for you and for every learner.</p>

    <button class="submit-btn" onclick="location.href='/dashboard/'">Back to dashboard</button>

  </div>

</main>

<script>
  const feedbackName = sessionStorage.getItem("feedbackName");
  document.getElementById("successTitle").textContent =
    feedbackName && feedbackName.trim() !== "" ? "Thank you, " + feedbackName : "Thank you";
</script>

</body>
</html>
