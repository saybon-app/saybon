<!DOCTYPE html>
<html lang="en">

<head>
<script type='module' src='/js/auth-guard.js'></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Application Result - SayBon</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">

<style>

*{ box-sizing:border-box; }

body{
margin:0;
font-family:'Inter', system-ui, sans-serif;
color:#102B2C;
background:linear-gradient(135deg, #EAF3EF 0%, #F7F8F1 50%, #E8F1ED 100%);
padding:60px 20px;
}

.page{ max-width:560px; margin:0 auto; }

.card{
background:rgba(255,255,255,.6); backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.7); border-radius:16px; padding:28px;
box-shadow:0 8px 28px rgba(0,55,57,.06);
}

h1{ text-align:center; font-size:20px; font-weight:700; margin:0 0 20px; color:#00484B; }

.status{ text-align:center; font-size:20px; font-weight:700; margin-bottom:20px; }
.pass{ color:#0A756C; }
.fail{ color:#C94A45; }

table{ width:100%; border-collapse:collapse; margin-bottom:20px; }
th, td{ border-bottom:1px solid rgba(0,72,75,.1); padding:10px; text-align:left; font-size:13px; }
th{ color:#526668; font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.04em; }

.passkey-box{
margin-top:10px; padding:20px; border-radius:12px;
background:rgba(212,175,106,.1); border:2px solid #D4AF6A; text-align:center; display:none;
}
.passkey-code{
display:inline-block; margin-top:10px; padding:12px 20px; border-radius:8px;
background:#00484B; color:#fff; font-family:monospace; font-size:18px; letter-spacing:2px;
cursor:pointer; user-select:all;
}
.passkey-note{ margin-top:10px; font-size:12px; color:#8a5f16; }

.buttons{ margin-top:22px; display:flex; gap:12px; justify-content:center; }
.btn{ padding:12px 20px; border-radius:9px; border:none; font-size:13px; font-weight:600; cursor:pointer; }
.btn-primary{ background:#005C60; color:#fff; display:none; }
.btn-secondary{ background:rgba(0,72,75,.08); color:#00484B; }

</style>
</head>

<body>

<div class="page">
<div class="card">

<h1>Application Result</h1>

<div id="status" class="status">Loading…</div>

<table id="scoreTable" style="display:none;">
<tr><th>Measure</th><th>Score</th></tr>
<tr><td>Content Accuracy (FR → EN)</td><td id="accuracy"></td></tr>
<tr><td>Terminology (EN → FR)</td><td id="terminology"></td></tr>
<tr><td>Completeness Check</td><td id="completeness"></td></tr>
<tr><td><strong>Final Score</strong></td><td id="finalScore"></td></tr>
</table>

<div class="passkey-box" id="passkeyBox">
<div><strong>Your Translator Passkey</strong></div>
<div class="passkey-code" id="passkeyCode"></div>
<div class="passkey-note">This gives you access to SayBon translation jobs. Do not share it with anyone.</div>
</div>

<div class="buttons">
<button id="jobBtn" class="btn btn-primary" onclick="location.href='job-board.html'">Go to Job Board</button>
<button class="btn btn-secondary" onclick="location.href='/dashboard/'">Return to Dashboard</button>
</div>

</div>
</div>

<script>

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

async function load(){

  if(!id){
    document.getElementById("status").innerText = "Result unavailable";
    return;
  }

  try{

    const res = await fetch("https://saybonapp-server.onrender.com/api/applicationResult?id=" + encodeURIComponent(id));
    const data = await res.json();

    if(!res.ok){
      document.getElementById("status").innerText = "Result not found";
      return;
    }

    document.getElementById("scoreTable").style.display = "table";
    document.getElementById("accuracy").innerText = data.accuracy + "%";
    document.getElementById("terminology").innerText = data.terminology + "%";
    document.getElementById("completeness").innerText = data.completenessOk ? "Passed" : "Incomplete";
    document.getElementById("finalScore").innerText = data.finalScore + "%";

    const statusEl = document.getElementById("status");

    if(data.passed){
      statusEl.innerText = "Accepted Into Translator Pool";
      statusEl.className = "status pass";
      document.getElementById("passkeyBox").style.display = "block";
      document.getElementById("passkeyCode").innerText = data.passkey;
      document.getElementById("jobBtn").style.display = "inline-block";
    }else{
      statusEl.innerText = "Application Not Accepted";
      statusEl.className = "status fail";
    }

  }catch(err){
    document.getElementById("status").innerText = "Could not load your result. Please try again.";
  }

}

document.addEventListener("click", (e)=>{
  if(e.target && e.target.id === "passkeyCode"){
    navigator.clipboard.writeText(e.target.innerText);
    const original = e.target.innerText;
    e.target.innerText = "Copied";
    setTimeout(()=>{ e.target.innerText = original; }, 1500);
  }
});

load();

</script>

</body>
</html>
