<!DOCTYPE html>
<html lang="en">

<head>
<script type='module' src='/js/auth-guard.js'></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Application Result - SayBon</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">

<style>

*{ box-sizing:border-box; }

html, body{ margin:0; padding:0; width:100%; }

body{
font-family:'Inter', system-ui, sans-serif;
color:#DCE9E6;
background:linear-gradient(160deg, #075B5F 0%, #033539 60%, #012225 100%);
min-height:100vh;
display:flex;
justify-content:center;
padding:60px 20px;
}

.page{ width:100%; max-width:560px; 
opacity:0; transform:translateY(18px) scale(.97); filter:blur(8px);
animation: pageEnter .8s cubic-bezier(.22,1,.36,1) forwards;
}
@keyframes pageEnter{
from{ opacity:0; transform:translateY(18px) scale(.97); filter:blur(8px); }
to{ opacity:1; transform:translateY(0) scale(1); filter:blur(0); }
}

.progress-strip{ display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:24px; }
.progress-dot{ width:8px; height:8px; border-radius:50%; background:#0C8F96; }

.card{
background:rgba(255,255,255,.05); backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.1); border-radius:18px; padding:32px;
box-shadow:0 8px 28px rgba(0,0,0,.2);
}

h1{ text-align:center; font-size:20px; font-weight:700; margin:0 0 6px; color:#fff; }
.result-sub{ text-align:center; font-size:12.5px; color:#8FA8A3; margin-bottom:22px; }

.status{ text-align:center; font-size:21px; font-weight:700; margin-bottom:24px; }
.pass{ color:#5FD3B8; }
.fail{ color:#e08585; }

.metric-list{ display:flex; flex-direction:column; gap:14px; margin-bottom:24px; }

.metric-row{ display:flex; align-items:center; gap:12px; }
.metric-icon{
width:30px; height:30px; border-radius:9px; flex:0 0 auto;
background:rgba(212,175,106,.14); color:#D4AF6A;
display:flex; align-items:center; justify-content:center;
}
.metric-icon svg{ width:15px; height:15px; }

.metric-body{ flex:1; min-width:0; }
.metric-label{ font-size:12px; color:#A9C9C3; margin-bottom:4px; }
.metric-bar-track{ height:6px; border-radius:999px; background:rgba(255,255,255,.08); overflow:hidden; }
.metric-bar-fill{ height:100%; border-radius:999px; background:#5FD3B8; }
.metric-value{ font-size:13px; font-weight:650; color:#fff; flex:0 0 auto; width:44px; text-align:right; }

.final-row{
display:flex; align-items:center; justify-content:space-between;
padding-top:16px; margin-top:4px; border-top:1px solid rgba(255,255,255,.1);
}
.final-label{ font-size:13px; font-weight:650; color:#fff; }
.final-value{ font-size:19px; font-weight:700; color:#D4AF6A; }

.passkey-box{
margin-top:6px; padding:22px; border-radius:14px;
background:rgba(212,175,106,.08); border:1.5px solid rgba(212,175,106,.35); text-align:center;
display:none;
}
.passkey-title{ font-size:12px; font-weight:650; color:#D4AF6A; text-transform:uppercase; letter-spacing:.05em; margin-bottom:10px; }
.passkey-code{
display:inline-block; padding:13px 22px; border-radius:9px;
background:#012225; color:#fff; font-family:monospace; font-size:17px; letter-spacing:2px;
cursor:pointer; user-select:all; border:1px solid rgba(212,175,106,.3);
}
.passkey-note{ margin-top:10px; font-size:11.5px; color:#8FA8A3; line-height:1.5; }

.buttons{ margin-top:24px; display:flex; gap:12px; justify-content:center; }
.btn{ padding:12px 22px; border-radius:10px; border:none; font-size:13px; font-weight:650; cursor:pointer; }
.btn-primary{ background:#D4AF6A; color:#012225; display:none; }
.btn-primary:hover{ background:#e0bd7c; }
.btn-secondary{ background:rgba(255,255,255,.08); color:#fff; border:1px solid rgba(255,255,255,.15); }
.btn-secondary:hover{ background:rgba(255,255,255,.14); }

</style>
</head>

<body>

<div class="page">

<div class="progress-strip">
<span class="progress-dot"></span>
<span class="progress-dot"></span>
<span class="progress-dot"></span>
</div>

<div class="card">

<h1>Application Result</h1>
<div class="result-sub">Job Code: <span id="jobCodeLabel">-</span></div>

<div id="status" class="status">Loading...</div>

<div class="metric-list" id="metricList" style="display:none;">

<div class="metric-row">
<span class="metric-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 8 6 6M4 14l6-6 2-3M2 5h12M7 2h1M22 22l-5-10-5 10M14 18h6"/></svg></span>
<div class="metric-body">
<div class="metric-label">Content Accuracy (FR to EN)</div>
<div class="metric-bar-track"><div class="metric-bar-fill" id="accuracyBar" style="width:0%"></div></div>
</div>
<div class="metric-value" id="accuracyValue">-</div>
</div>

<div class="metric-row">
<span class="metric-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9.5 12.5 11 14l3.5-3.5"/></svg></span>
<div class="metric-body">
<div class="metric-label">Terminology (EN to FR)</div>
<div class="metric-bar-track"><div class="metric-bar-fill" id="terminologyBar" style="width:0%"></div></div>
</div>
<div class="metric-value" id="terminologyValue">-</div>
</div>

<div class="metric-row">
<span class="metric-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span>
<div class="metric-body">
<div class="metric-label">Completeness Check</div>
</div>
<div class="metric-value" id="completenessValue">-</div>
</div>

<div class="final-row">
<span class="final-label">Final Score</span>
<span class="final-value" id="finalScoreValue">-</span>
</div>

</div>

<div class="passkey-box" id="passkeyBox">
<div class="passkey-title">Your Translator Passkey</div>
<div class="passkey-code" id="passkeyCode"></div>
<div class="passkey-note">This gives you access to SayBon translation jobs. Do not share it with anyone.</div>
</div>

<div class="buttons">
<button id="jobBtn" class="btn btn-primary" onclick="location.href='job-board.html'">Go to Job Board</button>
<button class="btn btn-secondary" onclick="location.href='/dashboard/'">Return to Dashboard</button>
</div>

</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

async function load(){

  if(!id){
    document.getElementById("status").innerText = "Result unavailable";
    return;
  }

  document.getElementById("jobCodeLabel").innerText = id;

  try{

    const res = await fetch("https://saybonapp-server.onrender.com/api/applicationResult?id=" + encodeURIComponent(id));
    const data = await res.json();

    if(!res.ok){
      document.getElementById("status").innerText = "Result not found";
      return;
    }

    document.getElementById("metricList").style.display = "flex";

    document.getElementById("accuracyBar").style.width = data.accuracy + "%";
    document.getElementById("accuracyValue").innerText = data.accuracy + "%";

    document.getElementById("terminologyBar").style.width = data.terminology + "%";
    document.getElementById("terminologyValue").innerText = data.terminology + "%";

    document.getElementById("completenessValue").innerText = data.completenessOk ? "Passed" : "Incomplete";
    document.getElementById("finalScoreValue").innerText = data.finalScore + "%";

    const statusEl = document.getElementById("status");

    if(data.passed){
      statusEl.innerText = "Accepted Into Translator Pool";
      statusEl.className = "status pass";
      document.getElementById("passkeyBox").style.display = "block";
      document.getElementById("passkeyCode").innerText = data.passkey;
      document.getElementById("jobBtn").style.display = "inline-block";
    }else{
      statusEl.innerText = "Application Not Accepted";
      statusEl.className = "status fail";
    }

  }catch(err){
    document.getElementById("status").innerText = "Could not load your result. Please try again.";
  }

}

document.addEventListener("click", (e)=>{
  if(e.target && e.target.id === "passkeyCode"){
    navigator.clipboard.writeText(e.target.innerText);
    const original = e.target.innerText;
    e.target.innerText = "Copied";
    setTimeout(()=>{ e.target.innerText = original; }, 1500);
  }
});

load();

</script>

</body>
</html>
