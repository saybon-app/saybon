<!DOCTYPE html>
<html lang="en">

<head>
<script type='module' src='/js/auth-guard.js'></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>My Profile - SayBon</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">

<style>

*{ box-sizing:border-box; }

body{
margin:0;
font-family:'Inter', system-ui, sans-serif;
color:#DCE9E6;
background:linear-gradient(160deg, #075B5F 0%, #033539 60%, #012225 100%);
padding:90px 20px 60px;
}

.nav-icon-btn{
position:fixed; top:20px; width:44px; height:44px; border:none; border-radius:11px;
background:rgba(255,255,255,.08); backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,.15);
box-shadow:0 8px 22px rgba(0,0,0,.2);
display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.15s; z-index:50;
}
.nav-icon-btn:hover{ background:rgba(255,255,255,.14); }
.back-btn{ left:22px; }
.dashboard-btn{ right:22px; }

.page{ max-width:520px; margin:0 auto; 
opacity:0; transform:translateY(18px) scale(.97); filter:blur(8px);
animation: pageEnter .8s cubic-bezier(.22,1,.36,1) forwards;
}
@keyframes pageEnter{
from{ opacity:0; transform:translateY(18px) scale(.97); filter:blur(8px); }
to{ opacity:1; transform:translateY(0) scale(1); filter:blur(0); }
}

header{ text-align:center; margin-bottom:24px; }
h1{ margin:0 0 8px; font-size:22px; font-weight:700; color:#fff; }
.subtitle{ font-size:13px; color:#A9C9C3; line-height:1.6; }

.card{
background:rgba(255,255,255,.05); backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.1); border-radius:16px; padding:26px;
box-shadow:0 8px 28px rgba(0,0,0,.15);
}

.field{ margin-bottom:18px; }
.field label{ display:block; font-size:11.5px; font-weight:600; color:#DCE9E6; margin-bottom:6px; }
.field input{
width:100%; padding:11px 13px; border-radius:9px; border:1px solid rgba(255,255,255,.15);
font-family:inherit; font-size:13px; background:rgba(255,255,255,.06); color:#fff;
}
.field input::placeholder{ color:rgba(255,255,255,.35); }
.field input:focus{ outline:none; border-color:#D4AF6A; }
.field-hint{ font-size:10.5px; color:#8FA8A3; margin-top:5px; }

.avatar-row{ display:flex; align-items:center; gap:16px; margin-bottom:20px; }

.avatar-preview{
width:64px; height:64px; border-radius:50%; flex:0 0 auto;
background:rgba(212,175,106,.14); border:2px solid rgba(212,175,106,.3);
display:flex; align-items:center; justify-content:center; overflow:hidden;
color:#D4AF6A; font-size:22px; font-weight:700;
}
.avatar-preview img{ width:100%; height:100%; object-fit:cover; }

.avatar-upload{
flex:1; border:1.5px dashed rgba(255,255,255,.2); border-radius:11px; padding:12px 14px;
cursor:pointer; position:relative; font-size:12px; color:#A9C9C3;
}
.avatar-upload:hover{ border-color:#D4AF6A; }
.avatar-upload input[type="file"]{ position:absolute; inset:0; opacity:0; cursor:pointer; }

.save-btn{
width:100%; padding:14px; border-radius:11px; border:none;
background:#D4AF6A; color:#012225; font-weight:650; font-size:13.5px; cursor:pointer;
}
.save-btn:hover:not(:disabled){ background:#e0bd7c; }
.save-btn:disabled{ opacity:.5; cursor:not-allowed; }

.msg{ font-size:12px; margin-top:12px; text-align:center; min-height:16px; }
.msg.error{ color:#e08585; }
.msg.success{ color:#5FD3B8; }

</style>
<script src="/js/bg-music.js"></script></head>

<body>

<button class="nav-icon-btn back-btn" onclick="location.href='job-board.html'" aria-label="Back">
<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:block;"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
</button>

<button class="nav-icon-btn dashboard-btn" onclick="location.href='/dashboard/'" aria-label="Dashboard">
<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:block;"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
</button>

<div class="page">

<header>
<h1>My Profile</h1>
<div class="subtitle">Enter your passkey to view and edit your profile.</div>
</header>

<div class="card" id="lookupCard">
<div class="field">
<label>Your Translator Passkey</label>
<input id="lookupPasskey" placeholder="e.g. SB-XXXXXXXX" />
</div>
<button class="save-btn" onclick="lookupProfile()">View My Profile</button>
<div class="msg" id="lookupMsg"></div>
</div>

<div class="card" id="editCard" style="display:none;">

<div class="avatar-row">
<div class="avatar-preview" id="avatarPreview">?</div>
<div class="avatar-upload">
<input type="file" id="photoUpload" accept="image/*" />
Click to upload a profile photo
</div>
</div>

<div class="field">
<label>Display Name</label>
<input id="displayName" placeholder="Your name" />
<div class="field-hint" id="nameHint"></div>
</div>

<button class="save-btn" id="saveProfileBtn" onclick="saveProfile()">Save Changes</button>
<div class="msg" id="saveMsg"></div>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
apiKey:"AIzaSyB2aKUdE1NSt0kN332BwTYSX52D0lxj1g0",
authDomain:"saybon-3e3c2.firebaseapp.com",
projectId:"saybon-3e3c2",
storageBucket:"saybon-3e3c2.firebasestorage.app",
messagingSenderId:"75085012344",
appId:"1:75085012344:web:0b18581cb0a30c3df47c8d"
};

const app = initializeApp(firebaseConfig);
const storage = getStorage(app);
const auth = getAuth(app);

signInAnonymously(auth).catch(err => console.error("Anonymous sign-in failed:", err));

const API_BASE = "https://saybonapp-server.onrender.com";

let currentPasskey = null;
let selectedPhotoFile = null;
let currentPhotoUrl = "";

window.lookupProfile = async function(){

  const passkey = document.getElementById("lookupPasskey").value.trim();
  const msgEl = document.getElementById("lookupMsg");

  if(!passkey){
    msgEl.className = "msg error";
    msgEl.innerText = "Please enter your passkey.";
    return;
  }

  msgEl.className = "msg";
  msgEl.innerText = "Loading...";

  try{

    const res = await fetch(API_BASE + "/api/translatorProfile?key=" + encodeURIComponent(passkey));
    const data = await res.json();

    if(!res.ok){
      msgEl.className = "msg error";
      msgEl.innerText = data.error || "Could not find that passkey.";
      return;
    }

    currentPasskey = passkey;
    currentPhotoUrl = data.photoUrl || "";

    const displayNameInput = document.getElementById("displayName");
    displayNameInput.value = data.name || data.defaultName || "";

    document.getElementById("nameHint").innerText = data.name
      ? "This is what other pages will greet you by."
      : "This default was derived from your email - feel free to change it.";

    const avatarEl = document.getElementById("avatarPreview");
    if(currentPhotoUrl){
      avatarEl.innerHTML = "<img src=\"" + currentPhotoUrl + "\" />";
    }else{
      const initial = (displayNameInput.value || "?").trim().charAt(0).toUpperCase();
      avatarEl.innerText = initial || "?";
    }

    document.getElementById("lookupCard").style.display = "none";
    document.getElementById("editCard").style.display = "block";

  }catch(err){
    msgEl.className = "msg error";
    msgEl.innerText = "Could not reach the server. Please try again.";
  }

};

document.getElementById("photoUpload").addEventListener("change", (e) => {
  selectedPhotoFile = e.target.files[0] || null;

  if(selectedPhotoFile){
    const reader = new FileReader();
    reader.onload = (ev) => {
      document.getElementById("avatarPreview").innerHTML = "<img src=\"" + ev.target.result + "\" />";
    };
    reader.readAsDataURL(selectedPhotoFile);
  }
});

window.saveProfile = async function(){

  const saveBtn = document.getElementById("saveProfileBtn");
  const msgEl = document.getElementById("saveMsg");

  saveBtn.disabled = true;
  saveBtn.innerText = "Saving...";
  msgEl.innerText = "";

  try{

    let photoUrl = currentPhotoUrl;

    if(selectedPhotoFile){

      if(!auth.currentUser){
        await signInAnonymously(auth);
      }

      const fileRef = ref(storage, "translatorProfiles/" + currentPasskey + "/" + Date.now() + "_" + selectedPhotoFile.name);
      await uploadBytes(fileRef, selectedPhotoFile);
      photoUrl = await getDownloadURL(fileRef);

    }

    const name = document.getElementById("displayName").value.trim();

    const res = await fetch(API_BASE + "/api/updateTranslatorProfile", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ passkey: currentPasskey, name, photoUrl })
    });

    const data = await res.json();

    if(!res.ok){
      msgEl.className = "msg error";
      msgEl.innerText = data.error || "Could not save your profile.";
      saveBtn.disabled = false;
      saveBtn.innerText = "Save Changes";
      return;
    }

    currentPhotoUrl = photoUrl;
    selectedPhotoFile = null;

    msgEl.className = "msg success";
    msgEl.innerText = "Profile updated.";
    saveBtn.disabled = false;
    saveBtn.innerText = "Save Changes";

  }catch(err){
    msgEl.className = "msg error";
    msgEl.innerText = "Something went wrong. Please try again.";
    saveBtn.disabled = false;
    saveBtn.innerText = "Save Changes";
  }

};

</script>

</body>
</html>
