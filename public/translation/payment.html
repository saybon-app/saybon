<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="/js/auth-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirm Translation - SayBon</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Manrope",-apple-system,sans-serif;background:linear-gradient(165deg,#0c1016 0%,#151b26 50%,#1b2230 100%);color:#e6e1d3;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.tp-corner-icon{position:fixed;top:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.05);backdrop-filter:blur(10px);border:1px solid rgba(212,175,106,.32);display:flex;align-items:center;justify-content:center;color:#d4af6a;cursor:pointer;z-index:50;}
.tp-corner-icon svg{width:18px;height:18px;}
.tp-corner-back{left:16px;} .tp-corner-dash{right:16px;}
.tp-card{max-width:440px;width:100%;background:rgba(255,255,255,.025);border:1px solid rgba(212,175,106,.2);border-radius:22px;padding:32px;text-align:center;}
.tp-eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#d4af6a;margin-bottom:16px;}
.tp-job-code{font-size:.75rem;color:#6d7488;margin-bottom:16px;min-height:16px;}
.tp-summary{border-top:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08);padding:16px 0;margin-bottom:20px;}
.tp-row{display:flex;justify-content:space-between;font-size:.88rem;padding:6px 0;}
.tp-row span:first-child{color:#8b92a3;}
.tp-row span:last-child{font-weight:700;color:#f6f1e4;}
.tp-price{font-family:"Fraunces",serif;font-weight:600;font-size:2rem;color:#d4af6a;margin-bottom:22px;}
.tp-provider-row{display:flex;gap:10px;margin-bottom:14px;}
.tp-provider-btn{flex:1;padding:14px 10px;border-radius:14px;border:1.5px solid rgba(255,255,255,.15);background:rgba(255,255,255,.04);color:#e6e1d3;cursor:pointer;font-weight:700;font-size:.82rem;transition:.2s;}
.tp-provider-btn.selected{border-color:#d4af6a;background:rgba(212,175,106,.12);color:#d4af6a;}
.tp-ghs-note{font-size:.76rem;color:#8b92a3;margin-bottom:14px;min-height:16px;}
.tp-btn{width:100%;background:linear-gradient(180deg,#e8c98a,#d4af6a);color:#1c1408;border:none;padding:15px;border-radius:14px;font-weight:800;font-size:.92rem;cursor:pointer;transition:.2s;}
.tp-btn:disabled{opacity:.5;cursor:not-allowed;}
.tp-status{font-size:.8rem;color:#8b92a3;margin-top:12px;}
</style>
</head>
<body>

<button class="tp-corner-icon tp-corner-back" onclick="history.back()" aria-label="Back">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
</button>
<button class="tp-corner-icon tp-corner-dash" onclick="location.href='/dashboard/'" aria-label="Dashboard">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect></svg>
</button>

<div class="tp-card">
<p class="tp-eyebrow">Confirm Translation</p>
<p class="tp-job-code" id="jobCode"></p>

<div class="tp-summary">
<div class="tp-row"><span>Plan</span><span id="plan"></span></div>
<div class="tp-row"><span>Words</span><span id="words"></span></div>
<div class="tp-row"><span>Language</span><span id="language"></span></div>
</div>

<div class="tp-price" id="price"></div>

<div class="tp-provider-row">
<button class="tp-provider-btn selected" id="providerStripeBtn">Stripe</button>
<button class="tp-provider-btn" id="providerPaystackBtn">Paystack</button>
</div>

<div class="tp-field" id="paystackLocationWrap" style="display:none;margin-bottom:14px;">
<label style="display:block;font-size:.78rem;color:#8b92a3;margin-bottom:6px;text-align:left;">Preferred Currency</label>
<select id="paystackLocationSelect" style="width:100%;background:rgba(0,0,0,.2);border:1px solid rgba(212,175,106,.2);border-radius:10px;padding:11px 14px;color:#e6e1d3;font-size:.9rem;font-family:inherit;">
<option value="GHS">Ghana</option>
<option value="NGN">Nigeria</option>
<option value="KES">Kenya</option>
<option value="ZAR">South Africa</option>
</select>
</div>

<p class="tp-ghs-note" id="ghsNote"></p>

<button class="tp-btn" id="payButton">Pay Securely</button>
<p class="tp-status" id="payStatus"></p>
</div>

<script>
const API_BASE = "https://saybonapp-server.onrender.com";
const PAYSTACK_PUBLIC_KEY = "pk_live_adbd997a6cb7382da7c9e3e77c0ca487b93d73ab";

const params = new URLSearchParams(window.location.search);
const plan = params.get("plan");
const words = parseInt(params.get("words")) || 0;
const language = params.get("language");
const email = params.get("email");
const price = params.get("price");

let selectedProvider = "stripe";
let convertedAmount = null;
let selectedCurrency = "GHS";

document.getElementById("plan").innerText = plan;
document.getElementById("words").innerText = words;
document.getElementById("language").innerText = language;

if(price){
  document.getElementById("price").innerText = "$" + Number(price).toFixed(2);
} else {
  document.getElementById("price").innerText = "Price unavailable";
  document.getElementById("payButton").disabled = true;
}

const stripeBtn = document.getElementById("providerStripeBtn");
const paystackBtn = document.getElementById("providerPaystackBtn");
const ghsNote = document.getElementById("ghsNote");
const payButton = document.getElementById("payButton");

const paystackLocationWrap = document.getElementById("paystackLocationWrap");
const paystackLocationSelect = document.getElementById("paystackLocationSelect");

function loadPaystackQuote(){
  if(!price) return;
  selectedCurrency = paystackLocationSelect.value;
  ghsNote.textContent = "Converting price...";
  fetch(API_BASE + "/api/convertUsdToCurrency?amount=" + encodeURIComponent(price) + "&currency=" + encodeURIComponent(selectedCurrency))
    .then(r => r.json())
    .then(function(data){
      if(data.convertedAmount){
        convertedAmount = data.convertedAmount;
        ghsNote.textContent = "You will be charged " + selectedCurrency + " " + convertedAmount.toFixed(2);
      } else {
        ghsNote.textContent = "Could not load exchange rate - try Stripe instead";
      }
    })
    .catch(function(){ ghsNote.textContent = "Could not load exchange rate - try Stripe instead"; });
}

stripeBtn.addEventListener("click", function(){
  selectedProvider = "stripe";
  stripeBtn.classList.add("selected");
  paystackBtn.classList.remove("selected");
  paystackLocationWrap.style.display = "none";
  ghsNote.textContent = "";
});

paystackBtn.addEventListener("click", function(){
  selectedProvider = "paystack";
  paystackBtn.classList.add("selected");
  stripeBtn.classList.remove("selected");
  paystackLocationWrap.style.display = "block";
  loadPaystackQuote();
});

paystackLocationSelect.addEventListener("change", loadPaystackQuote);

payButton.addEventListener("click", function(){
  if(selectedProvider === "stripe"){
    startStripePayment();
  } else {
    startPaystackPayment();
  }
});

async function startStripePayment(){
  payButton.innerText = "Processing...";
  payButton.disabled = true;
  document.getElementById("payStatus").textContent = "";

  try{
    const documentText = sessionStorage.getItem("saybon_doc_text") || "";
    const sourceLanguage = sessionStorage.getItem("saybon_source_language") || "";
    const clientFile = sessionStorage.getItem("saybon_client_file") || "";

    const res = await fetch(API_BASE + "/api/createTranslationRequestCheckout", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email: email, plan: plan, wordCount: words,
        targetLanguage: language, sourceLanguage: sourceLanguage,
        clientFile: clientFile, documentText: documentText, price: price
      })
    });

    const data = await res.json();

    if(!res.ok || !data.url){
      document.getElementById("payStatus").textContent = "Could not start payment. Please try again.";
      payButton.innerText = "Pay Securely";
      payButton.disabled = false;
      return;
    }

    document.getElementById("jobCode").innerText = "Job Code: " + data.jobId;
    window.location = data.url;

  }catch(err){
    document.getElementById("payStatus").textContent = "Could not start payment. Please try again.";
    payButton.innerText = "Pay Securely";
    payButton.disabled = false;
  }
}

async function startPaystackPayment(){
  if(!convertedAmount){
    document.getElementById("payStatus").textContent = "Please wait for the price to load first.";
    return;
  }

  payButton.innerText = "Processing...";
  payButton.disabled = true;
  document.getElementById("payStatus").textContent = "";

  try{
    const documentText = sessionStorage.getItem("saybon_doc_text") || "";
    const sourceLanguage = sessionStorage.getItem("saybon_source_language") || "";
    const clientFile = sessionStorage.getItem("saybon_client_file") || "";

    const jobRes = await fetch(API_BASE + "/api/createTranslationJobForPaystack", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email: email, plan: plan, wordCount: words,
        targetLanguage: language, sourceLanguage: sourceLanguage,
        clientFile: clientFile, documentText: documentText, priceGhs: convertedAmount
      })
    });
    const jobData = await jobRes.json();

    if(!jobRes.ok || !jobData.jobId){
      document.getElementById("payStatus").textContent = "Could not create job. Please try again.";
      payButton.innerText = "Pay Securely";
      payButton.disabled = false;
      return;
    }

    document.getElementById("jobCode").innerText = "Job Code: " + jobData.jobId;

    var handler = PaystackPop.setup({
      key: PAYSTACK_PUBLIC_KEY,
      email: email,
      amount: Math.round(convertedAmount * 100),
      currency: selectedCurrency,
      ref: "SB-PS-" + Date.now(),
      callback: function(response){
        document.getElementById("payStatus").textContent = "Verifying payment...";
        fetch(API_BASE + "/api/verifyPaystackTranslation", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ reference: response.reference, jobId: jobData.jobId })
        }).then(r => r.json()).then(function(verifyData){
          if(verifyData.verified){
            document.getElementById("payStatus").textContent = "Payment confirmed! Your translation job is now open.";
            payButton.style.display = "none";
          } else {
            document.getElementById("payStatus").textContent = "Could not verify payment. Please contact support with your job code.";
            payButton.innerText = "Pay Securely";
            payButton.disabled = false;
          }
        }).catch(function(){
          document.getElementById("payStatus").textContent = "Could not verify payment. Please contact support with your job code.";
          payButton.innerText = "Pay Securely";
          payButton.disabled = false;
        });
      },
      onClose: function(){
        payButton.innerText = "Pay Securely";
        payButton.disabled = false;
      }
    });
    handler.openIframe();

  }catch(err){
    document.getElementById("payStatus").textContent = "Could not start payment. Please try again.";
    payButton.innerText = "Pay Securely";
    payButton.disabled = false;
  }
}
</script>
</body>
</html>
