<!DOCTYPE html>
<html lang="en">

<head>
<script type='module' src='/js/auth-guard.js'></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>SayBon Translation Admin</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>

*{ box-sizing:border-box; }

body{
font-family:'Inter', system-ui, sans-serif;
background:#f5f7fb;
margin:0;
padding:40px 24px;
color:#22303a;
}

.container{
max-width:1200px;
margin:auto;
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

h1{ text-align:center; letter-spacing:1px; font-size:20px; font-weight:700; }

.login{ text-align:center; margin-top:80px; }

input, select{
padding:10px; border:1px solid #ccc; border-radius:6px; font-family:inherit; font-size:13px;
}

button{
padding:9px 16px; border:none; border-radius:6px; cursor:pointer;
background:#1f6feb; color:white; font-weight:600; font-size:12.5px;
}
button:hover{ opacity:.9; }
button:disabled{ opacity:.5; cursor:not-allowed; }

.tabs{ display:flex; gap:8px; margin:24px 0 20px; border-bottom:1px solid #eee; }
.tab-btn{
background:none; color:#526668; padding:10px 16px; border-radius:8px 8px 0 0;
border-bottom:2px solid transparent;
}
.tab-btn.active{ color:#1f6feb; border-bottom-color:#1f6feb; background:none; }

.tab-panel{ display:none; }
.tab-panel.active{ display:block; }

table{ width:100%; border-collapse:collapse; margin-top:10px; }
th, td{ padding:10px; border-bottom:1px solid #eee; text-align:left; font-size:12.5px; vertical-align:top; }
th{ font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:#8a939a; }

.actions button{ margin-right:6px; margin-bottom:4px; }
.btn-complete{ background:#16a34a; }
.btn-pass{ background:#0A756C; }
.btn-fail{ background:#C94A45; }
.btn-paid{ background:#16a34a; }

.rank-select{ width:60px; margin-right:6px; }

.translation-preview{
max-width:260px; max-height:80px; overflow-y:auto; font-size:11.5px; color:#526668;
background:#fafbfc; border:1px solid #eee; border-radius:6px; padding:6px;
}

.badge{
display:inline-block; padding:3px 9px; border-radius:999px; font-size:10.5px; font-weight:600;
}
.badge-pending{ background:#FFF4DF; color:#8a5f16; }
.badge-paid{ background:#DDEFE7; color:#0A756C; }
.badge-reviewed{ background:#EAF3EF; color:#0A756C; }
.badge-unreviewed{ background:#f1f1f1; color:#888; }

.empty-note{ padding:30px; text-align:center; color:#8a939a; font-size:12.5px; }

.pm-details{ font-size:11.5px; color:#526668; }
.pm-missing{ font-size:11.5px; color:#C94A45; font-style:italic; }

</style>

</head>

<body>

<div class="container">

<h1>SAYBON TRANSLATION ADMIN</h1>

<div id="login" class="login">

<p>Enter Admin Passcode</p>

<input id="passcode" type="password">

<br><br>

<button onclick="unlock()">Access Panel</button>

</div>

<div id="panel" style="display:none;">

<div class="tabs">
<button class="tab-btn active" data-tab="jobs">Jobs</button>
<button class="tab-btn" data-tab="submissions">Submissions</button>
<button class="tab-btn" data-tab="payouts">Payouts</button>
</div>

<div class="tab-panel active" id="panel-jobs">
<table>
<tr><th>Job ID</th><th>Words</th><th>Plan</th><th>Status</th><th>Actions</th></tr>
<tbody id="jobs"></tbody>
</table>
</div>

<div class="tab-panel" id="panel-submissions">
<table>
<tr><th>Job</th><th>Translator</th><th>Submitted</th><th>Translation</th><th>Status</th><th>Review</th></tr>
<tbody id="submissions"></tbody>
</table>
</div>

<div class="tab-panel" id="panel-payouts">
<table>
<tr><th>Job</th><th>Translator</th><th>Rank</th><th>Amount</th><th>Payment Details</th><th>Status</th><th>Action</th></tr>
<tbody id="payouts"></tbody>
</table>
</div>

</div>

</div>


<script>

const API_BASE = "https://saybonapp-server.onrender.com";

/* FIREBASE CONFIG (used only for the Jobs tab, unchanged from before) */

const firebaseConfig={
apiKey:"AIzaSyB2aKUdE1NSt0kN332BwTYSX52D0lxj1g0",
authDomain:"saybon-3e3c2.firebaseapp.com",
projectId:"saybon-3e3c2"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.firestore();


/* LOGIN */

function unlock(){

const code=document.getElementById("passcode").value;

if(code==="963281"){

sessionStorage.setItem("saybonAdminVerified","true")

document.getElementById("login").style.display="none";

document.getElementById("panel").style.display="block";

loadAll();

}else{

alert("Incorrect passcode");

}

}

if(sessionStorage.getItem("saybonAdminVerified")==="true"){

document.getElementById("login").style.display="none";

document.getElementById("panel").style.display="block";

loadAll();

}

function loadAll(){
  loadJobs();
  loadSubmissions();
  loadPayouts();
}

/* TAB SWITCHING */

document.querySelectorAll(".tab-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(p=>p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("panel-"+btn.dataset.tab).classList.add("active");
  });
});


/* ===== JOBS TAB (unchanged Firestore-direct read) ===== */

async function loadJobs(){

const snapshot=await db.collection("translationJobs").get();

const table=document.getElementById("jobs");

table.innerHTML="";

snapshot.forEach(doc=>{

const job=doc.data();

const row=document.createElement("tr");

row.innerHTML=`

<td>${doc.id}</td>
<td>${job.wordCount||"-"}</td>
<td>${job.plan||"-"}</td>
<td>${job.status||"-"}</td>

<td class="actions">

<button onclick="viewJob('${doc.id}')">View</button>

<button class="btn-complete" onclick="completeJob('${doc.id}')">Complete</button>

</td>

`;

table.appendChild(row);

});

}

function viewJob(id){

alert("Open job: "+id);

}

async function completeJob(id){

await db.collection("translationJobs")
.doc(id)
.update({
status:"completed"
});

alert("Job marked complete");

loadJobs();

}


/* ===== SUBMISSIONS TAB ===== */

async function loadSubmissions(){

const res = await fetch(API_BASE + "/api/adminSubmissions");
const submissions = await res.json();

const table = document.getElementById("submissions");
table.innerHTML = "";

if(!submissions.length){
  table.innerHTML = "<tr><td colspan='6' class='empty-note'>No submissions yet.</td></tr>";
  return;
}

submissions.forEach(s=>{

const row = document.createElement("tr");

const statusBadge = s.reviewed
  ? "<span class='badge badge-reviewed'>Reviewed - Rank " + s.rank + (s.passed ? " (Passed)" : " (Failed)") + "</span>"
  : "<span class='badge badge-unreviewed'>Awaiting Review</span>";

row.innerHTML =
  "<td>" + (s.jobFile || s.jobId) + "<br><span style='color:#8a939a;font-size:10.5px;'>" + s.jobId + "</span></td>" +
  "<td>" + s.translator + "</td>" +
  "<td>" + (s.submitted ? new Date(s.submitted._seconds ? s.submitted._seconds*1000 : s.submitted).toLocaleString() : "-") + "</td>" +
  "<td><div class='translation-preview'>" + (s.translation || "").replace(/</g,"&lt;") + "</div></td>" +
  "<td>" + statusBadge + "</td>" +
  "<td>" +
    "<select class='rank-select' id='rank-" + s.id + "'>" +
      "<option value='1'" + (s.rank===1?" selected":"") + ">1st</option>" +
      "<option value='2'" + (s.rank===2?" selected":"") + ">2nd</option>" +
      "<option value='3'" + (s.rank===3?" selected":"") + ">3rd</option>" +
    "</select>" +
    "<button class='btn-pass' onclick=\"reviewSubmission('" + s.id + "', true)\">Pass</button>" +
    "<button class='btn-fail' onclick=\"reviewSubmission('" + s.id + "', false)\">Fail</button>" +
  "</td>";

table.appendChild(row);

});

}

async function reviewSubmission(submissionId, passed){

const rank = Number(document.getElementById("rank-" + submissionId).value);

const res = await fetch(API_BASE + "/api/reviewSubmission", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ submissionId, rank, passed })
});

const data = await res.json();

if(!res.ok){
  alert(data.error || "Could not review this submission.");
  return;
}

alert(passed ? ("Marked passed at rank " + rank + ". Payout: $" + data.amountOwed.toFixed(2)) : "Marked failed. No payout owed.");

loadSubmissions();
loadPayouts();

}


/* ===== PAYOUTS TAB ===== */

async function loadPayouts(){

const res = await fetch(API_BASE + "/api/adminPayouts");
const payouts = await res.json();

const table = document.getElementById("payouts");
table.innerHTML = "";

if(!payouts.length){
  table.innerHTML = "<tr><td colspan='7' class='empty-note'>No payouts yet.</td></tr>";
  return;
}

payouts.forEach(p=>{

const row = document.createElement("tr");

let pmHtml = "<span class='pm-missing'>No payment method on file</span>";

if(p.paymentMethod){
  if(p.paymentMethod.method === "bank"){
    pmHtml = "<div class='pm-details'>Bank: " + p.paymentMethod.bankName + "<br>Acct: " + p.paymentMethod.accountNumber + "<br>Name: " + p.paymentMethod.accountName + "</div>";
  } else {
    pmHtml = "<div class='pm-details'>" + p.paymentMethod.momoNetwork + "<br>" + p.paymentMethod.momoNumber + "</div>";
  }
}

const statusBadge = p.status === "paid"
  ? "<span class='badge badge-paid'>Paid</span>"
  : "<span class='badge badge-pending'>Pending</span>";

row.innerHTML =
  "<td>" + p.jobId + "</td>" +
  "<td>" + p.translatorPasskey + "</td>" +
  "<td>" + p.rank + (p.passed ? "" : " (Failed)") + "</td>" +
  "<td>$" + Number(p.amountOwed||0).toFixed(2) + "</td>" +
  "<td>" + pmHtml + "</td>" +
  "<td>" + statusBadge + "</td>" +
  "<td>" + (p.status === "paid" ? "-" : "<button class='btn-paid' onclick=\"markPaid('" + p.id + "')\">Mark as Paid</button>") + "</td>";

table.appendChild(row);

});

}

async function markPaid(payoutId){

const res = await fetch(API_BASE + "/api/markPayoutPaid", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ payoutId })
});

if(!res.ok){
  alert("Could not mark this payout as paid.");
  return;
}

loadPayouts();

}

</script>

</body>

</html>
