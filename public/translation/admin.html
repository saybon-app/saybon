<style>

*{ box-sizing:border-box; }

html{ overflow-x:hidden; }

body{
font-family:'Inter', system-ui, sans-serif;

.nav-icon-btn{

background:rgba(255,255,255,.08); backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,.15);

.container{

margin:auto;

opacity:0; transform:translateY(18px) scale(.97); filter:blur(8px);
animation: containerEnter .8s cubic-bezier(.22,1,.36,1) forwards;

@keyframes containerEnter{

to{ opacity:1; transform:translateY(0) scale(1); filter:blur(0); }
}

h1{ text-align:center; letter-spacing:1px; font-size:22px; font-weight:700; color:#fff; margin-bottom:6px; }

.login{ text-align:center; margin-top:80px; }
.login input{
padding:11px 14px; border:1px solid rgba(255,255,255,.15); border-radius:9px;
background:rgba(255,255,255,.06); color:#fff; font-family:inherit; font-size:13px;
}
.login button{ margin-left:8px; }

input, select{
padding:9px 11px; border:1px solid rgba(255,255,255,.15); border-radius:8px;

button{
padding:9px 16px; border:none; border-radius:8px; cursor:pointer;

}
button:hover{ opacity:.9; }
button:disabled{ opacity:.4; cursor:not-allowed; }

.tabs{ display:flex; gap:6px; margin:24px 0 20px; flex-wrap:wrap; }
.tab-btn{
background:rgba(255,255,255,.05); color:#A9C9C3; padding:10px 16px; border-radius:9px;

}

.tab-panel{ display:none; }
.tab-panel.active{ display:block; }

/* ===== OVERVIEW STAT CARDS ===== */

.stat-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:14px; margin-bottom:10px; }
.stat-card{
background:rgba(255,255,255,.05); backdrop-filter:blur(16px);
border:1px solid rgba(255,255,255,.1); border-radius:14px; padding:18px;
}
.stat-label{ font-size:10px; font-weight:650; text-transform:uppercase; letter-spacing:.05em; color:#8FA8A3; margin-bottom:8px; }
.stat-value{ font-size:24px; font-weight:700; color:#fff; }
.stat-sub{ font-size:11px; color:#8FA8A3; margin-top:4px; }
.stat-gold{ color:#D4AF6A; }
.stat-green{ color:#5FD3B8; }
.stat-red{ color:#e08585; }

/* ===== TABLE ===== */

.table-wrap{ overflow-x:auto; border-radius:14px; }
table{ width:100%; border-collapse:collapse; margin-top:10px; background:rgba(255,255,255,.03); border-radius:14px; overflow:hidden; }
th, td{ padding:12px; border-bottom:1px solid rgba(255,255,255,.06); text-align:left; font-size:12.5px; vertical-align:top; }
th{ font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:#8FA8A3; background:rgba(255,255,255,.03); }

.actions button{ margin-right:6px; margin-bottom:4px; }
.btn-complete{ background:#5FD3B8; color:#012225; }
.btn-pass{ background:#5FD3B8; color:#012225; }
.btn-fail{ background:#e08585; color:#2a0d0d; }
.btn-paid{ background:#5FD3B8; color:#012225; }

.rank-select{ width:60px; margin-right:6px; }

.translation-preview{
max-width:260px; max-height:80px; overflow-y:auto; font-size:11.5px; color:#A9C9C3;
background:rgba(0,0,0,.15); border:1px solid rgba(255,255,255,.08); border-radius:6px; padding:6px;
}

.badge{ display:inline-block; padding:3px 9px; border-radius:999px; font-size:10.5px; font-weight:650; }
.badge-pending{ background:rgba(217,144,36,.16); color:#F0C77E; }
.badge-paid{ background:rgba(95,211,184,.16); color:#5FD3B8; }
.badge-reviewed{ background:rgba(95,211,184,.16); color:#5FD3B8; }
.badge-unreviewed{ background:rgba(255,255,255,.08); color:#A9C9C3; }
.badge-passed{ background:rgba(95,211,184,.16); color:#5FD3B8; }
.badge-failed{ background:rgba(224,133,133,.16); color:#e08585; }

.empty-note{ padding:30px; text-align:center; color:#8FA8A3; font-size:12.5px; }

.pm-details{ font-size:11.5px; color:#A9C9C3; }
.pm-missing{ font-size:11.5px; color:#e08585; font-style:italic; }

.avatar-thumb{ width:32px; height:32px; border-radius:50%; object-fit:cover; background:rgba(212,175,106,.14); }

.doc-link{ color:#D4AF6A; font-size:11.5px; text-decoration:none; display:block; margin-bottom:3px; }
.doc-link:hover{ text-decoration:underline; }

</style>

<body><button onclick="location.href='/admin/panel.html'" style="position:fixed;top:16px;left:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.08);backdrop-filter:blur(10px);border:1px solid rgba(212,175,106,.32);display:flex;align-items:center;justify-content:center;color:#d4af6a;cursor:pointer;z-index:9999;" aria-label="Back to Panel" title="Back to Panel"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect></svg></button>

</button>

<div class="container">

<h1>SAYBON TRANSLATION ADMIN</h1>
<div class="header-sub">Jobs - Submissions - Translators - Payouts, all in one place</div>

<p>Enter Admin Passcode</p>

<input id="passcode" type="password">

</div>

<div id="panel" style="display:none;">

<div class="tabs">
<button class="tab-btn active" data-tab="overview">Overview</button>
<button class="tab-btn" data-tab="jobs">Jobs</button>
<button class="tab-btn" data-tab="submissions">Submissions</button>

<div class="stat-grid" id="statGrid"></div>
</div>

<div class="tab-panel" id="panel-jobs">
<div class="table-wrap">
<table>
<tr><th>Job ID</th><th>Words</th><th>Plan</th><th>Status</th><th>Actions</th></tr>
<tbody id="jobs"></tbody>
</table>
</div>
</div>

<div class="tab-panel" id="panel-submissions">

<table>
<tr><th>Job</th><th>Translator</th><th>Submitted</th><th>Translation</th><th>Flags</th><th>Status</th><th>Review</th></tr>
<tbody id="submissions"></tbody>
</table>
</div>
</div>

<div class="tab-panel" id="panel-translators">
<div class="table-wrap">
<table>
<tr><th>Applicant</th><th>Contact</th><th>Score</th><th>Status</th><th>Passkey</th><th>Documents</th></tr>
<tbody id="translators"></tbody>
</table>
</div>
</div>

</div>

<script type="module" src="/features/admin/auth/admin-guard.js"></script><script>

const API_BASE = "https://saybonapp-server.onrender.com";

const firebaseConfig={
apiKey:"AIzaSyB2aKUdE1NSt0kN332BwTYSX52D0lxj1g0",
authDomain:"saybon-3e3c2.firebaseapp.com",
projectId:"saybon-3e3c2"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.firestore();


function unlock(){

const code=document.getElementById("passcode").value;

if(false){

sessionStorage.setItem("saybonAdminVerified","true")

document.getElementById("login").style.display="none";

document.getElementById("panel").style.display="block";

loadAll();

}else{

alert("Incorrect passcode");

}

}

window.addEventListener("adminAuthorized", function(){ document.getElementById("login").style.display="none"; document.getElementById("panel").style.display="block"; loadAll(); }); if(sessionStorage.getItem("saybonAdminVerified")==="true"){

document.getElementById("login").style.display="none";

document.getElementById("panel").style.display="block";

loadAll();

}

function loadAll(){
  loadOverview();
  loadJobs();
  loadSubmissions();
  loadTranslators();
  loadPayouts();
}

document.querySelectorAll(".tab-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(p=>p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("panel-"+btn.dataset.tab).classList.add("active");
  });
});


/* ===== OVERVIEW TAB ===== */

async function loadOverview(){

  const res = await fetch(API_BASE + "/api/adminOverview");
  const data = await res.json();

  const grid = document.getElementById("statGrid");
  grid.innerHTML = "";

  const cards = [
    { label: "Total Revenue", value: "$" + data.totalRevenue.toFixed(2), cls: "stat-gold" },
    { label: "Open Jobs", value: data.openJobs, sub: data.totalJobs + " total jobs" },
    { label: "Awaiting Review", value: data.awaitingReview, cls: data.awaitingReview > 0 ? "stat-red" : "" },
    { label: "Approved Translators", value: data.approvedTranslators, sub: data.totalTranslators + " total applicants", cls: "stat-green" },
    { label: "Pending Payouts", value: "$" + data.pendingPayoutTotal.toFixed(2), cls: "stat-red" },
    { label: "Paid Out to Date", value: "$" + data.paidPayoutTotal.toFixed(2), cls: "stat-green" }
  ];

  cards.forEach(c=>{
    const card = document.createElement("div");
    card.className = "stat-card";
    card.innerHTML =
      "<div class='stat-label'>" + c.label + "</div>" +
      "<div class='stat-value " + (c.cls||"") + "'>" + c.value + "</div>" +
      (c.sub ? "<div class='stat-sub'>" + c.sub + "</div>" : "");
    grid.appendChild(card);
  });

}


/* ===== JOBS TAB ===== */

async function loadJobs(){

const snapshot=await db.collection("translationJobs").get();

const table=document.getElementById("jobs");

table.innerHTML="";

snapshot.forEach(doc=>{

const job=doc.data();

const row=document.createElement("tr");

row.innerHTML=`

<td>${doc.id}</td>
<td>${job.wordCount||"-"}</td>
<td>${job.plan||"-"}</td>
<td>${job.status||"-"}</td>

<td class="actions">

<button onclick="viewJob('${doc.id}')">View</button>

<button class="btn-complete" onclick="completeJob('${doc.id}')">Complete</button>

</td>

`;

table.appendChild(row);

});

}

function viewJob(id){

alert("Open job: "+id);

}

async function completeJob(id){

await db.collection("translationJobs")
.doc(id)
.update({
status:"completed"
});

alert("Job marked complete");

loadJobs();

}


/* ===== SUBMISSIONS TAB ===== */

async function loadSubmissions(){

const res = await fetch(API_BASE + "/api/adminSubmissions");
const submissions = await res.json();

const table = document.getElementById("submissions");
table.innerHTML = "";

if(!submissions.length){
  table.innerHTML = "<tr><td colspan='7' class='empty-note'>No submissions yet.</td></tr>";
  return;
}

submissions.forEach(s=>{

const row = document.createElement("tr");

const statusBadge = s.reviewed
  ? "<span class='badge badge-reviewed'>Reviewed - Rank " + s.rank + (s.passed ? " (Passed)" : " (Failed)") + "</span>"
  : "<span class='badge badge-unreviewed'>Awaiting Review</span>";

const flags = [];

if(s.keystrokeCount === 0){
  flags.push("<span style='color:#e08585;font-weight:600;'>⚠ No keystrokes detected</span>");
}

if(s.timeTakenSeconds > 0 && s.jobWordCount > 0 && s.timeTakenSeconds < (s.jobWordCount * 0.3)){
  flags.push("<span style='color:#F0C77E;font-weight:600;'>⚠ Completed unusually fast (" + s.timeTakenSeconds + "s for " + s.jobWordCount + " words)</span>");
}

if(s.pasteAttempts > 0){
  flags.push("<span style='color:#F0C77E;font-weight:600;'>⚠ " + s.pasteAttempts + " blocked paste attempt(s)</span>");
}

if(s.tabSwitches > 2){
  flags.push("<span style='color:#8FA8A3;'>Switched tabs " + s.tabSwitches + "x</span>");
}

const flagsHtml = flags.length ? flags.join("<br>") : "<span style='color:#8FA8A3;'>No flags</span>";

row.innerHTML =
  "<td>" + (s.jobFile || s.jobId) + "<br><span style='color:#8FA8A3;font-size:10.5px;'>" + s.jobId + "</span></td>" +
  "<td>" + s.translator + "</td>" +
  "<td>" + (s.submitted ? new Date(s.submitted._seconds ? s.submitted._seconds*1000 : s.submitted).toLocaleString() : "-") + "</td>" +
  "<td><div class='translation-preview'>" + (s.translation || "").replace(/</g,"&lt;") + "</div></td>" +
  "<td style='font-size:11px;line-height:1.6;'>" + flagsHtml + "</td>" +
  "<td>" + statusBadge + "</td>" +
  "<td>" +
    "<select class='rank-select' id='rank-" + s.id + "'>" +
      "<option value='1'" + (s.rank===1?" selected":"") + ">1st</option>" +
      "<option value='2'" + (s.rank===2?" selected":"") + ">2nd</option>" +
      "<option value='3'" + (s.rank===3?" selected":"") + ">3rd</option>" +
    "</select>" +
    "<button class='btn-pass' onclick=\"reviewSubmission('" + s.id + "', true)\">Pass</button>" +
    "<button class='btn-fail' onclick=\"reviewSubmission('" + s.id + "', false)\">Fail</button>" +
  "</td>";

table.appendChild(row);

});

}

async function reviewSubmission(submissionId, passed){

const rank = Number(document.getElementById("rank-" + submissionId).value);

const res = await fetch(API_BASE + "/api/reviewSubmission", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ submissionId, rank, passed })
});

const data = await res.json();

if(!res.ok){
  alert(data.error || "Could not review this submission.");
  return;
}

alert(passed ? ("Marked passed at rank " + rank + ". Payout: $" + data.amountOwed.toFixed(2)) : "Marked failed. No payout owed.");

loadSubmissions();
loadPayouts();
loadOverview();

}


/* ===== TRANSLATORS TAB ===== */

async function loadTranslators(){

const res = await fetch(API_BASE + "/api/adminTranslators");
const translators = await res.json();

const table = document.getElementById("translators");
table.innerHTML = "";

if(!translators.length){
  table.innerHTML = "<tr><td colspan='6' class='empty-note'>No applications yet.</td></tr>";
  return;
}

translators.forEach(t=>{

const row = document.createElement("tr");

const statusBadge = t.passed
  ? "<span class='badge badge-passed'>Approved</span>"
  : "<span class='badge badge-failed'>Not Approved</span>";

const scoreText = t.finalScore !== undefined ? t.finalScore + "%" : "-";

let docsHtml = "<span style='color:#8FA8A3;font-size:11px;'>None on file</span>";

if(t.documents){
  const links = [];
  if(t.documents.id) links.push("<a class='doc-link' href='" + t.documents.id + "' target='_blank'>National ID</a>");
  if(t.documents.cv && t.documents.cv.length) links.push("<a class='doc-link' href='" + t.documents.cv[0] + "' target='_blank'>CV</a>");
  if(t.documents.certifications && t.documents.certifications.length) links.push("<a class='doc-link' href='" + t.documents.certifications[0] + "' target='_blank'>Certification</a>");
  if(links.length) docsHtml = links.join("");
}

row.innerHTML =
  "<td>" + (t.photoUrl ? "<img class='avatar-thumb' src='" + t.photoUrl + "'>" : "") + " " + (t.name || "(no name)") + "</td>" +
  "<td>" + t.email + "<br><span style='color:#8FA8A3;font-size:10.5px;'>" + (t.phone||"-") + " - " + (t.country||"-") + "</span></td>" +
  "<td>" + scoreText + "</td>" +
  "<td>" + statusBadge + "</td>" +
  "<td>" + (t.passkey || "<span style='color:#8FA8A3;'>-</span>") + "</td>" +
  "<td>" + docsHtml + "</td>";

table.appendChild(row);

});

}


/* ===== PAYOUTS TAB ===== */

async function loadPayouts(){

const res = await fetch(API_BASE + "/api/adminPayouts");
const payouts = await res.json();

const table = document.getElementById("payouts");
table.innerHTML = "";

if(!payouts.length){
  table.innerHTML = "<tr><td colspan='7' class='empty-note'>No payouts yet.</td></tr>";
  return;
}

payouts.forEach(p=>{

const row = document.createElement("tr");

let pmHtml = "<span class='pm-missing'>No payment method on file</span>";

if(p.paymentMethod){
  const pm = p.paymentMethod;
  if(pm.method === "bank"){
    let lines = ["Bank: " + pm.bankName];
    if(pm.bankRegion === "us"){
      lines.push("Acct: " + pm.accountNumber);
      lines.push("Routing: " + pm.routingNumber);
    }else if(pm.bankRegion === "uk"){
      lines.push("Acct: " + pm.accountNumber);
      lines.push("Sort Code: " + pm.sortCode);
    }else if(pm.bankRegion === "international"){
      lines.push("IBAN: " + pm.iban);
    }else{
      lines.push("Acct: " + pm.accountNumber);
    }
    if(pm.swiftBic){
      lines.push("SWIFT: " + pm.swiftBic);
    }
    lines.push("Name: " + pm.accountName);
    pmHtml = "<div class='pm-details'>" + lines.join("<br>") + "</div>";
  } else {
    pmHtml = "<div class='pm-details'>" + pm.momoNetwork + "<br>" + pm.momoNumber + "</div>";
  }
}

const statusBadge = p.status === "paid"
  ? "<span class='badge badge-paid'>Paid</span>"
  : "<span class='badge badge-pending'>Pending</span>";

row.innerHTML =
  "<td>" + p.jobId + "</td>" +
  "<td>" + p.translatorPasskey + "</td>" +
  "<td>" + p.rank + (p.passed ? "" : " (Failed)") + "</td>" +
  "<td>$" + Number(p.amountOwed||0).toFixed(2) + "</td>" +
  "<td>" + pmHtml + "</td>" +
  "<td>" + statusBadge + "</td>" +
  "<td>" + (p.status === "paid" ? "-" : "<button class='btn-paid' onclick=\"markPaid('" + p.id + "')\">Mark as Paid</button>") + "</td>";

table.appendChild(row);

});

}

async function markPaid(payoutId){

const res = await fetch(API_BASE + "/api/markPayoutPaid", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ payoutId })
});

if(!res.ok){
  alert("Could not mark this payout as paid.");
  return;
}

loadPayouts();
loadOverview();

}

</script>
