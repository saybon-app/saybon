<!DOCTYPE html>
<html>
<head>
<script type='module' src='/js/auth-guard.js'></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SayBon Formatting Workspace</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<style>
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:#DCE9E6;background:linear-gradient(160deg,#075B5F 0%,#033539 60%,#012225 100%);padding:90px 20px 60px;}
.nav-icon-btn{position:fixed;top:20px;width:44px;height:44px;border:none;border-radius:11px;background:rgba(255,255,255,.08);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:50;}
.back-btn{left:22px;}
.dashboard-btn{right:22px;}
.page{max-width:1300px;margin:0 auto;}
.title{font-size:22px;font-weight:700;color:#fff;margin-bottom:4px;}
.jobmeta{font-size:12.5px;color:#A9C9C3;margin-bottom:20px;}
.split{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media (max-width:900px){.split{grid-template-columns:1fr;}}
.panel{background:rgba(255,255,255,.05);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;}
.panel-title{font-weight:650;font-size:13px;color:#D4AF6A;margin-bottom:12px;}
.orig-preview{max-height:600px;overflow-y:auto;background:#fff;border-radius:8px;}
.orig-preview iframe{width:100%;height:600px;border:none;}
.orig-preview-html{padding:16px;color:#222;font-size:13px;line-height:1.6;}
.orig-preview pre{padding:16px;margin:0;white-space:pre-wrap;color:#222;font-size:12.5px;}
#quillEditor{height:520px;background:#fff;border-radius:8px;color:#111;}
.submit-row{margin-top:20px;text-align:center;}
.submit{padding:14px 34px;font-size:14px;font-weight:650;background:#D4AF6A;color:#012225;border:none;border-radius:12px;cursor:pointer;}
.submit:disabled{opacity:.5;cursor:not-allowed;}
.status-msg{margin-top:14px;font-size:12.5px;color:#A9C9C3;text-align:center;}
</style>
</head>
<body>
<button class="nav-icon-btn back-btn" onclick="history.back()" aria-label="Back"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
<button class="nav-icon-btn dashboard-btn" onclick="location.href='/dashboard/'" aria-label="Dashboard"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
<div class="page">
<div class="title">Formatting Workspace</div>
<div class="jobmeta" id="jobmeta">Loading job...</div>
<div class="split">
<div class="panel">
<div class="panel-title">Original Document (Reference)</div>
<div class="orig-preview" id="origPreview">Loading...</div>
</div>
<div class="panel">
<div class="panel-title">Your Formatted Translation</div>
<div id="quillEditor"></div>
</div>
</div>
<div class="submit-row">
<button class="submit" id="submitFormattingBtn" disabled>Submit Final Document</button>
<div class="status-msg" id="formattingStatus"></div>
</div>
</div>
<script type="module"> import { app } from "/js/firebase-init.js"; import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js"; const storage = getStorage(app, "gs://saybon-3e3c2.firebasestorage.app"); window.uploadFormattedDocToStorage = async function(blob, ext){ const storageRef = ref(storage, "translationFinal/" + Date.now() + "." + ext); const snap = await uploadBytes(storageRef, blob); return await getDownloadURL(snap.ref); }; </script>
<script>
const API_BASE = "https://saybonapp-server.onrender.com";
const params = new URLSearchParams(window.location.search);
const jobId = params.get("job");
const translatorPasskey = sessionStorage.getItem("saybonTranslatorPasskey") || "";
let quill = null; let currentFileType = ""; let currentJobId = "";
async function renderOrigPreview(fileUrl, fileType){
  var body = document.getElementById("origPreview");
  if(!fileUrl){ body.innerHTML = "No original document available."; return; }
  try{
    if(fileType === "pdf"){
      body.innerHTML = "<iframe src=" + JSON.stringify(fileUrl) + "></iframe>";
    } else if(fileType === "docx"){
      var resp = await fetch(fileUrl);
      var buf = await resp.arrayBuffer();
      var result = await mammoth.convertToHtml({arrayBuffer: buf});
      body.innerHTML = "<div class=" + JSON.stringify("orig-preview-html") + ">" + result.value + "</div>";
    } else {
      var resp2 = await fetch(fileUrl);
      var txt = await resp2.text();
      var pre = document.createElement("pre");
      pre.textContent = txt;
      body.innerHTML = "";
      body.appendChild(pre);
    }
  }catch(err){
    console.error("PREVIEW ERROR:", err);
    body.innerHTML = "Could not load preview.";
  }
}
async function init(){
  if(!jobId || !translatorPasskey){
    document.getElementById("jobmeta").innerText = "Access denied - missing job or passkey.";
    return;
  }
  try{
    var res = await fetch(API_BASE + "/api/checkFormattingAccess?jobId=" + encodeURIComponent(jobId) + "&passkey=" + encodeURIComponent(translatorPasskey));
    var data = await res.json();
    if(!data.hasAccess){
      document.getElementById("jobmeta").innerText = "You do not have formatting access for this job.";
      return;
    }
    document.getElementById("jobmeta").innerText = "Job: " + (data.clientFile || jobId) + " - " + data.targetLanguage;
    currentFileType = data.originalFileType; currentJobId = jobId; renderOrigPreview(data.originalFileUrl, data.originalFileType);
    quill = new Quill("#quillEditor", { theme: "snow" });
    quill.setText(data.translation || "");
    document.getElementById("submitFormattingBtn").disabled = false;
  }catch(err){
    console.error("INIT ERROR:", err);
    document.getElementById("jobmeta").innerText = "There was a problem loading this job.";
  }
}
init();
</script>
</body>
</html>
