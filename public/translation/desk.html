<!DOCTYPE html>
<html lang="en">
<head>
<script type='module' src='/js/auth-guard.js'></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SayBon Translation Desk</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Kalam&display=swap" rel="stylesheet">

<style>

*{ box-sizing:border-box; }

body{
margin:0;
font-family:'Quicksand',sans-serif;
color:#e5e5e5;

background:
linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.65)),
url("https://images.unsplash.com/photo-1524758631624-e2822e304c36");

background-size:cover;
background-position:center;
background-attachment:fixed;
min-height:100vh;

display:flex;
flex-direction:column;
align-items:center;
padding:90px 20px 60px;
}

.nav-icon-btn{
position:fixed;
top:20px;
width:46px;
height:46px;
border:none;
border-radius:14px;
background: rgba(255,255,255,.12);
backdrop-filter: blur(16px);
border: 1px solid rgba(255,255,255,.25);
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
transition:.2s;
z-index:50;
}
.nav-icon-btn:active{ transform:scale(.94); }
.back-btn{ left:22px; }
.dashboard-btn{ right:22px; }

.card{
background:rgba(0,0,0,.55);
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,.1);
border-radius:16px;
padding:30px;
max-width:900px;
width:100%;
margin-bottom:22px;
box-shadow:0 20px 40px rgba(0,0,0,.6);
}

.title{
font-size:clamp(28px,5vw,44px);
letter-spacing:.25em;
text-align:center;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:20px;
margin-top:20px;
}

@media (max-width:800px){
  .grid{ grid-template-columns:1fr; }
}

.cell{
border:1px solid #333;
padding:20px;
border-radius:12px;
background:#111;
}

.label{
font-size:11px;
letter-spacing:.1em;
margin-bottom:6px;
opacity:.6;
text-transform:uppercase;
}

.value{
font-size:15px;
margin-bottom:14px;
}

.step-row{
display:flex;
align-items:center;
gap:10px;
margin:8px 0;
font-size:13px;
}

.step-dot{
width:16px; height:16px;
border-radius:50%;
flex:0 0 auto;
display:flex;
align-items:center;
justify-content:center;
font-size:10px;
}

.step-done{ background:#2ecc71; color:#062b12; }
.step-pending{ background:#333; color:#666; }

.notice{
text-align:center;
font-size:13px;
color:#bcbcbc;
margin-top:10px;
}

button.deskBtn{
position:fixed;
bottom:25px;
left:50%;
transform:translateX(-50%);
padding:14px 30px;
background:#2f2f2f;
border:none;
border-radius:10px;
color:#ddd;
font-size:15px;
cursor:pointer;
}
button.deskBtn:hover{ background:#444; }

</style>
</head>

<body>

<button class="nav-icon-btn back-btn" onclick="location.href='/translation/'" aria-label="Back">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:block;"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
</button>

<button class="nav-icon-btn dashboard-btn" onclick="location.href='/dashboard/'" aria-label="Dashboard">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:block;"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
</button>

<div class="card">
<div class="title">SAYBON TRANSLATION DESK</div>
</div>

<div class="card">

<div class="grid">

<div class="cell">
<div class="label">Job Code</div>
<div class="value" id="job">Loading…</div>

<div class="label">Client</div>
<div class="value" id="email">Loading…</div>

<div class="label">Word Count</div>
<div class="value" id="words">Loading…</div>

<div class="label">Target Language</div>
<div class="value" id="language">Loading…</div>

<div class="label">Plan</div>
<div class="value" id="plan">Loading…</div>

<div class="label">Price</div>
<div class="value" id="price">Loading…</div>
</div>

<div class="cell">
<div class="label">Status</div>

<div class="step-row"><span class="step-dot" id="dot1">•</span> Payment received</div>
<div class="step-row"><span class="step-dot" id="dot2">•</span> Posted for translators</div>
<div class="step-row"><span class="step-dot" id="dot3">•</span> Translator assigned</div>
<div class="step-row"><span class="step-dot" id="dot4">•</span> Completed</div>

</div>

<div class="cell">
<div class="label">Note</div>
<div class="notice" id="message"></div>
</div>

</div>

</div>

<button class="deskBtn" onclick="location.href='/dashboard/'">Return to Dashboard</button>

<script type="module">

import { db } from "/js/firebase-init.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const params = new URLSearchParams(window.location.search);
const jobId = params.get("job");

function setStep(dotId, done){
  const el = document.getElementById(dotId);
  el.className = "step-dot " + (done ? "step-done" : "step-pending");
  el.textContent = done ? "✓" : "•";
}

async function loadJob(){

  if(!jobId){
    document.getElementById("message").innerText = "No job code was provided.";
    return;
  }

  try{

    const jobSnap = await getDoc(doc(db, "translationJobs", jobId));

    if(!jobSnap.exists()){
      document.getElementById("message").innerText = "No job found for this code.";
      return;
    }

    const data = jobSnap.data();

    document.getElementById("job").innerText = data.jobId || jobId;
    document.getElementById("email").innerText = data.email || "-";
    document.getElementById("words").innerText = data.wordCount ?? "-";
    document.getElementById("language").innerText = data.targetLanguage || "-";
    document.getElementById("plan").innerText = data.plan || "-";
    document.getElementById("price").innerText = "$" + Number(data.price || 0).toFixed(2);

    const paid = data.paid === true;
    const status = data.status || "";

    setStep("dot1", paid);
    setStep("dot2", status === "open" || status === "claimed" || status === "completed");
    setStep("dot3", status === "claimed" || status === "completed");
    setStep("dot4", status === "completed");

    if(status === "completed"){
      document.getElementById("message").innerText = "Your translation is complete.";
    }else if(status === "claimed"){
      document.getElementById("message").innerText = "A translator is working on your document.";
    }else if(status === "open"){
      document.getElementById("message").innerText = "Your document is posted and waiting for a translator.";
    }else if(paid){
      document.getElementById("message").innerText = "Payment confirmed. Your job is being prepared.";
    }else{
      document.getElementById("message").innerText = "Awaiting payment confirmation.";
    }

  }catch(err){
    console.error("DESK LOAD ERROR:", err);
    document.getElementById("message").innerText = "There was a problem loading this job.";
  }

}

loadJob();

</script>

</body>
</html>
