<!DOCTYPE html>
<html lang="en">
<head>
<script type='module' src='/js/auth-guard.js'></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SayBon Translation Desk</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{ box-sizing:border-box; }

body{
margin:0;
font-family:'Nunito', system-ui, sans-serif;
color:#3a2f28;
min-height:100vh;

background-image: url('/assets/images/desk-bg.png');
background-size: cover;
background-position: center;
background-attachment: fixed;

display:flex;
flex-direction:column;
align-items:center;
padding:90px 20px 60px;
}

.nav-icon-btn{
position:fixed;
top:20px;
width:46px;
height:46px;
border:none;
border-radius:14px;
background: rgba(255,255,255,.55);
backdrop-filter: blur(16px);
border: 1px solid rgba(255,255,255,.7);
box-shadow: inset 0 1px 1px rgba(255,255,255,.6), 0 8px 20px rgba(60,40,20,.15);
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
transition:.2s;
z-index:50;
}
.nav-icon-btn:active{ transform:scale(.94); }
.back-btn{ left:22px; }
.dashboard-btn{ right:22px; }

.header-panel{
background: rgba(255,251,246,.72);
backdrop-filter: blur(18px);
border: 1px solid rgba(255,255,255,.7);
border-radius:24px;
padding:26px 30px;
max-width:1000px;
width:100%;
text-align:center;
margin-bottom:20px;
box-shadow: 0 20px 50px rgba(60,40,20,.18);

opacity:0; transform:translateY(18px) scale(.97); filter:blur(8px);
animation: header-panelEnter .8s cubic-bezier(.22,1,.36,1) forwards;
}
@keyframes header-panelEnter{
from{ opacity:0; transform:translateY(18px) scale(.97); filter:blur(8px); }
to{ opacity:1; transform:translateY(0) scale(1); filter:blur(0); }
}

.header-title{
margin:0;
font-size:clamp(22px,4vw,30px);
font-weight:900;
letter-spacing:.3em;
color:#4a3423;
}

.divider{
margin-top:12px;
display:flex;
align-items:center;
justify-content:center;
gap:12px;
}
.divider-line{ width:60px; height:1px; background:#c9714f; }
.divider-dot{ width:6px; height:6px; border-radius:50%; background:#c9714f; }

.grid{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:20px;
max-width:1000px;
width:100%;
}

@media (max-width:900px){
  .grid{ grid-template-columns:1fr; }
}

.panel{
background: rgba(255,251,246,.72);
backdrop-filter: blur(18px);
border: 1px solid rgba(255,255,255,.7);
border-radius:20px;
padding:24px;
box-shadow: 0 20px 50px rgba(60,40,20,.18);
}

.panel-label{
font-size:11px;
font-weight:800;
letter-spacing:.15em;
text-transform:uppercase;
color:#8a7a6d;
margin-bottom:16px;
}

.detail-row{
display:flex;
align-items:flex-start;
gap:12px;
margin-bottom:16px;
}
.detail-row:last-child{ margin-bottom:0; }

.detail-icon{
flex:0 0 auto;
width:20px;
height:20px;
margin-top:1px;
color:#c9714f;
}

.detail-text{ flex:1; min-width:0; }
.detail-label{ font-size:10.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:#a0917f; margin-bottom:2px; }
.detail-value{ font-size:14px; font-weight:700; color:#3a2f28; word-break:break-word; }

.stepper{ position:relative; padding-left:6px; }

.stepper-item{
position:relative;
display:flex;
align-items:flex-start;
gap:14px;
padding-bottom:26px;
}
.stepper-item:last-child{ padding-bottom:0; }

.stepper-item::before{
content:"";
position:absolute;
left:9px;
top:24px;
bottom:0;
width:0;
border-left:2px dashed #d9c7b8;
}
.stepper-item:last-child::before{ display:none; }

.step-dot{
flex:0 0 auto;
width:20px; height:20px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
z-index:1;
}

.step-done{ background:#2f6f68; }
.step-pending{ background:transparent; border:2px solid #d9c7b8; }

.step-label{ font-size:14px; font-weight:700; color:#3a2f28; padding-top:1px; }

.deskBtn{
margin-top:22px;
width:100%;
padding:14px;
border:none;
border-radius:14px;
background: linear-gradient(135deg, #c9714f, #a8593a);
color:#fff;
font-weight:800;
font-size:14px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
gap:8px;
transition:.2s;
}
.deskBtn:hover{ filter:brightness(1.08); transform:translateY(-1px); }

.notice{
font-size:13.5px;
color:#5a4a3f;
line-height:1.6;
}

.job-list-panel{
max-width:1000px;
width:100%;
}

.job-list{
display:flex;
flex-direction:column;
gap:10px;
}

.job-list-item{
background: rgba(255,251,246,.72);
backdrop-filter: blur(18px);
border: 1px solid rgba(255,255,255,.7);
border-radius:16px;
padding:16px 20px;
display:flex;
align-items:center;
justify-content:space-between;
gap:16px;
cursor:pointer;
box-shadow: 0 12px 30px rgba(60,40,20,.14);
transition:.2s;
}
.job-list-item:hover{ transform:translateY(-2px); box-shadow: 0 16px 36px rgba(60,40,20,.2); }

.job-list-left{ min-width:0; }
.job-list-code{ font-size:14px; font-weight:800; color:#3a2f28; }
.job-list-meta{ font-size:12px; color:#8a7a6d; margin-top:2px; }

.job-list-badge{
flex:0 0 auto;
font-size:10.5px;
font-weight:800;
text-transform:uppercase;
letter-spacing:.05em;
padding:5px 10px;
border-radius:999px;
color:#fff;
}

.job-list-empty{
text-align:center;
font-size:13.5px;
color:#5a4a3f;
padding:20px;
}

</style>
<script src="/js/bg-music.js"></script></head>

<body>

<button class="nav-icon-btn back-btn" onclick="location.href='/translation/'" aria-label="Back">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#4a3423" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:block;"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
</button>

<button class="nav-icon-btn dashboard-btn" onclick="location.href='/dashboard/'" aria-label="Dashboard">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#4a3423" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:block;"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
</button>

<div class="header-panel">
<h1 class="header-title">SAYBON TRANSLATION DESK</h1>
<div class="divider"><span class="divider-line"></span><span class="divider-dot"></span><span class="divider-line"></span></div>
</div>

<div class="job-list-panel" id="jobListPanel" style="display:none;">
<div class="job-list" id="jobList"></div>
</div>

<div class="grid" id="deskGrid">

<div class="panel">
<div class="panel-label">Job Details</div>

<div class="detail-row">
<svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
<div class="detail-text"><div class="detail-label">Job Code</div><div class="detail-value" id="job">Loading...</div></div>
</div>

<div class="detail-row">
<svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
<div class="detail-text"><div class="detail-label">Client</div><div class="detail-value" id="email">Loading...</div></div>
</div>

<div class="detail-row">
<svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
<div class="detail-text"><div class="detail-label">Word Count</div><div class="detail-value" id="words">Loading...</div></div>
</div>

<div class="detail-row">
<svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></svg>
<div class="detail-text"><div class="detail-label">Target Language</div><div class="detail-value" id="language">Loading...</div></div>
</div>

<div class="detail-row">
<svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 5-9 5-9-5 9-5z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/></svg>
<div class="detail-text"><div class="detail-label">Plan</div><div class="detail-value" id="plan">Loading...</div></div>
</div>

<div class="detail-row">
<svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
<div class="detail-text"><div class="detail-label">Price</div><div class="detail-value" id="price">Loading...</div></div>
</div>

</div>

<div class="panel">
<div class="panel-label">Status</div>

<div class="stepper">

<div class="stepper-item">
<span class="step-dot" id="dot1"></span>
<span class="step-label">Payment received</span>
</div>

<div class="stepper-item">
<span class="step-dot" id="dot2"></span>
<span class="step-label">Posted for translators</span>
</div>

<div class="stepper-item">
<span class="step-dot" id="dot3"></span>
<span class="step-label">Translator assigned</span>
</div>

<div class="stepper-item">
<span class="step-dot" id="dot4"></span>
<span class="step-label">Completed</span>
</div>

</div>

<button class="deskBtn" onclick="location.href='/dashboard/'">
Return to Dashboard
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
</button>

</div>

<div class="panel">
<div class="panel-label">Note</div>
<div class="notice" id="message"></div>
</div>

</div>

<div class="job-list-panel" id="otherJobsPanel" style="display:none;">
<div class="panel" style="margin-bottom:0;">
<div class="panel-label">Your Other Jobs</div>
<div class="job-list" id="otherJobsList"></div>
</div>
</div>

<script type="module">

import { db, auth } from "/js/firebase-init.js";
import { doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const params = new URLSearchParams(window.location.search);
const jobId = params.get("job");
const adminKey = params.get("admin");

const STATUS_BADGE = {
  awaiting_payment: { label: "Awaiting Payment", color: "#9a8b7d" },
  open: { label: "Open", color: "#2f6f68" },
  claimed: { label: "Claimed", color: "#c9714f" },
  completed: { label: "Completed", color: "#3f8f5f" }
};

async function loadAllJobs(){

  document.getElementById("deskGrid").style.display = "none";
  document.getElementById("jobListPanel").style.display = "block";

  const listEl = document.getElementById("jobList");
  listEl.innerHTML = "";

  try{

    const snapshot = await getDocs(collection(db, "translationJobs"));

    if(snapshot.empty){
      listEl.innerHTML = "<div class=\"job-list-empty\">No jobs found.</div>";
      return;
    }

    const jobs = [];
    snapshot.forEach(docSnap => jobs.push({ id: docSnap.id, data: docSnap.data() }));

    jobs.sort((a, b) => {
      const aTime = a.data.createdAt && a.data.createdAt.toMillis ? a.data.createdAt.toMillis() : 0;
      const bTime = b.data.createdAt && b.data.createdAt.toMillis ? b.data.createdAt.toMillis() : 0;
      return bTime - aTime;
    });

    jobs.forEach(({ id, data }) => {

      const badge = STATUS_BADGE[data.status] || { label: data.status || "Unknown", color: "#9a8b7d" };

      const row = document.createElement("div");
      row.className = "job-list-item";
      row.onclick = () => { window.location.href = "/translation/desk.html?job=" + encodeURIComponent(id); };

      row.innerHTML =
        "<div class=\"job-list-left\">" +
          "<div class=\"job-list-code\">" + (data.jobId || id) + "</div>" +
          "<div class=\"job-list-meta\">" + (data.email || "-") + " · " + (data.wordCount ?? "-") + " words · $" + Number(data.price || 0).toFixed(2) + "</div>" +
        "</div>" +
        "<span class=\"job-list-badge\" style=\"background:" + badge.color + "\">" + badge.label + "</span>";

      listEl.appendChild(row);

    });

  }catch(err){
    console.error("ALL JOBS LOAD ERROR:", err);
    listEl.innerHTML = "<div class=\"job-list-empty\">There was a problem loading jobs.</div>";
  }

}


async function loadOtherJobs(email, currentJobId){
  try{
    const res = await fetch("https://saybonapp-server.onrender.com/api/jobsByEmail?email=" + encodeURIComponent(email) + "&excludeJobId=" + encodeURIComponent(currentJobId));
    const jobs = await res.json();
    if(!jobs || jobs.length === 0) return;

    const panel = document.getElementById("otherJobsPanel");
    const listEl = document.getElementById("otherJobsList");
    listEl.innerHTML = "";

    jobs.forEach(function(job){
      const badge = STATUS_BADGE[job.status] || { label: job.status || "Unknown", color: "#9a8b7d" };
      const row = document.createElement("div");
      row.className = "job-list-item";
      row.onclick = function(){ window.location.href = "/translation/desk.html?job=" + encodeURIComponent(job.jobId); };
      row.innerHTML =
        "<div class=\"job-list-left\">" +
          "<div class=\"job-list-code\">" + job.jobId + "</div>" +
          "<div class=\"job-list-meta\">" + job.plan + " · " + job.wordCount + " words · $" + Number(job.price).toFixed(2) + "</div>" +
        "</div>" +
        "<span class=\"job-list-badge\" style=\"background:" + badge.color + "\">" + badge.label + "</span>";
      listEl.appendChild(row);
    });

    panel.style.display = "block";
  }catch(err){
    console.error("OTHER JOBS LOAD ERROR:", err);
  }
}

function setStep(dotId, done){
  const el = document.getElementById(dotId);
  el.className = "step-dot " + (done ? "step-done" : "step-pending");
  el.innerHTML = done
    ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
    : "";
}

async function loadJob(){

  if(!jobId){
    document.getElementById("message").innerText = "No job code was provided.";
    return;
  }

  try{

    const jobSnap = await getDoc(doc(db, "translationJobs", jobId));

    if(!jobSnap.exists()){
      document.getElementById("message").innerText = "No job found for this code.";
      return;
    }

    const data = jobSnap.data();

    document.getElementById("job").innerText = data.jobId || jobId;
    document.getElementById("email").innerText = data.email || "-";
    document.getElementById("words").innerText = data.wordCount ?? "-";
    document.getElementById("language").innerText = data.targetLanguage || "-";
    document.getElementById("plan").innerText = data.plan || "-";
    document.getElementById("price").innerText = "$" + Number(data.price || 0).toFixed(2);

    const paid = data.paid === true;
    const status = data.status || "";

    setStep("dot1", paid);
    setStep("dot2", status === "open" || status === "claimed" || status === "completed");
    setStep("dot3", status === "claimed" || status === "completed");
    setStep("dot4", status === "completed");

    if(status === "completed"){
      document.getElementById("message").innerText = "Your translation is complete.";
    }else if(status === "claimed"){
      document.getElementById("message").innerText = "A translator is working on your document.";
    }else if(status === "open"){
      document.getElementById("message").innerText = "Your document is posted and waiting for a translator.";
    }else if(paid){
      document.getElementById("message").innerText = "Payment confirmed. Your job is being prepared.";
    }else{
      document.getElementById("message").innerText = "Awaiting payment confirmation.";
    }

    if(data.email){ loadOtherJobs(data.email, jobId); }

  }catch(err){
    console.error("DESK LOAD ERROR:", err);
    document.getElementById("message").innerText = "There was a problem loading this job.";
  }

}

if(adminKey === "true"){
  onAuthStateChanged(auth, async function(user){
    if(!user){ loadJob(); return; }
    try{
      const res = await fetch("https://saybonapp-server.onrender.com/api/accessControlCheck?email=" + encodeURIComponent(user.email || ""));
      const data = await res.json();
      if(data.authorized){ loadAllJobs(); } else { loadJob(); }
    }catch(err){ loadJob(); }
  });
}else{
  loadJob();
}

</script>

</body>
</html>
