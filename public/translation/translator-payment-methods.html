<!DOCTYPE html>
<html lang="en">

<head>
<script type='module' src='/js/auth-guard.js'></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment Methods - SayBon</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">

<style>

*{ box-sizing:border-box; }

body{
margin:0;
font-family:'Inter', system-ui, sans-serif;
color:#102B2C;
background:linear-gradient(135deg, #EAF3EF 0%, #F7F8F1 50%, #E8F1ED 100%);
padding:90px 20px 60px;
}

.nav-icon-btn{
position:fixed; top:20px; width:44px; height:44px; border:none; border-radius:11px;
background:rgba(255,255,255,.55); backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,.7);
box-shadow:0 8px 22px rgba(0,55,57,.08);
display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.15s; z-index:50;
}
.nav-icon-btn:hover{ background:rgba(255,255,255,.8); }
.back-btn{ left:22px; }
.dashboard-btn{ right:22px; }

.page{ max-width:520px; margin:0 auto; 
opacity:0; transform:translateY(18px) scale(.97); filter:blur(8px);
animation: pageEnter .8s cubic-bezier(.22,1,.36,1) forwards;
}
@keyframes pageEnter{
from{ opacity:0; transform:translateY(18px) scale(.97); filter:blur(8px); }
to{ opacity:1; transform:translateY(0) scale(1); filter:blur(0); }
}

header{ text-align:center; margin-bottom:24px; }
h1{ margin:0 0 8px; font-size:22px; font-weight:700; color:#00484B; }
.subtitle{ font-size:13px; color:#526668; line-height:1.6; }

.card{
background:rgba(255,255,255,.6); backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.7); border-radius:16px; padding:24px;
box-shadow:0 8px 28px rgba(0,55,57,.06);
}

.field{ margin-bottom:16px; }
.field label{ display:block; font-size:11.5px; font-weight:600; color:#102B2C; margin-bottom:6px; }
.field input, .field select{
width:100%; padding:11px 13px; border-radius:9px; border:1px solid rgba(0,72,75,.15);
font-family:inherit; font-size:13px; background:#fff; color:#102B2C;
}

.method-toggle{ display:flex; gap:8px; margin-bottom:18px; }
.method-btn{
flex:1; padding:11px; border-radius:9px; border:1px solid rgba(0,72,75,.15);
background:#fff; color:#526668; font-weight:600; font-size:12.5px; cursor:pointer;
}
.method-btn.active{ background:#005C60; color:#fff; border-color:#005C60; }

.hidden{ display:none; }

.save-btn{
width:100%; padding:13px; border:none; border-radius:10px;
background:#005C60; color:#fff; font-weight:600; font-size:13.5px; cursor:pointer; margin-top:6px;
}
.save-btn:hover{ background:#00484B; }
.save-btn:disabled{ opacity:.6; cursor:not-allowed; }

.msg{ font-size:12px; margin-top:12px; min-height:16px; }
.msg.error{ color:#C94A45; }
.msg.success{ color:#0A756C; }

.region-hint{ font-size:10.5px; color:#8a939a; margin-top:-10px; margin-bottom:16px; }

</style>
</head>

<body>

<button class="nav-icon-btn back-btn" onclick="location.href='job-board.html'" aria-label="Back">
<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#00484B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:block;"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
</button>

<button class="nav-icon-btn dashboard-btn" onclick="location.href='/dashboard/'" aria-label="Dashboard">
<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#00484B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:block;"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
</button>

<div class="page">

<header>
<h1>Payment Method</h1>
<div class="subtitle">Add your bank or mobile money details so SayBon can pay you directly once your work is approved.</div>
</header>

<div class="card">

<div class="field">
<label>Your Translator Passkey</label>
<input type="text" id="passkeyInput" placeholder="e.g. SB-XXXXXXXX" />
</div>

<div class="method-toggle">
<button class="method-btn active" id="bankToggle" type="button" onclick="setMethod('bank')">Bank Account</button>
<button class="method-btn" id="momoToggle" type="button" onclick="setMethod('momo')">Mobile Money</button>
</div>

<div id="bankFields">

<div class="field">
<label>Bank Region</label>
<select id="bankRegion" onchange="updateBankRegionFields()">
<option value="ghana">Ghana</option>
<option value="us">United States</option>
<option value="uk">United Kingdom</option>
<option value="international">International (IBAN)</option>
</select>
</div>
<div class="region-hint">This determines which bank details are needed below.</div>

<div class="field"><label>Bank Name</label><input type="text" id="bankName" placeholder="e.g. GCB Bank" /></div>

<div class="field" id="accountNumberField"><label>Account Number</label><input type="text" id="accountNumber" placeholder="Account number" /></div>

<div class="field hidden" id="routingNumberField"><label>Routing Number (ABA)</label><input type="text" id="routingNumber" placeholder="9-digit routing number" /></div>

<div class="field hidden" id="sortCodeField"><label>Sort Code</label><input type="text" id="sortCode" placeholder="e.g. 12-34-56" /></div>

<div class="field hidden" id="ibanField"><label>IBAN</label><input type="text" id="iban" placeholder="International bank account number" /></div>

<div class="field hidden" id="swiftField"><label>SWIFT / BIC Code</label><input type="text" id="swiftBic" placeholder="e.g. ABCDGHAC" /></div>

<div class="field"><label>Account Name</label><input type="text" id="accountName" placeholder="Name on the account" /></div>

</div>

<div id="momoFields" class="hidden">
<div class="field">
<label>Mobile Money Network</label>
<select id="momoNetwork">
<option value="">Select network</option>
<option value="MTN">MTN Mobile Money</option>
<option value="Telecel">Telecel Cash</option>
<option value="AirtelTigo">AirtelTigo Money</option>
</select>
</div>
<div class="field"><label>Mobile Money Number</label><input type="text" id="momoNumber" placeholder="Mobile money number" /></div>
</div>

<button class="save-btn" id="saveBtn" onclick="savePaymentMethod()">Save Payment Method</button>
<div class="msg" id="msg"></div>

</div>

</div>

<script>

let currentMethod = "bank";

function setMethod(method){
  currentMethod = method;
  document.getElementById("bankToggle").classList.toggle("active", method === "bank");
  document.getElementById("momoToggle").classList.toggle("active", method === "momo");
  document.getElementById("bankFields").classList.toggle("hidden", method !== "bank");
  document.getElementById("momoFields").classList.toggle("hidden", method !== "momo");
}

function updateBankRegionFields(){
  const region = document.getElementById("bankRegion").value;

  document.getElementById("accountNumberField").classList.toggle("hidden", region === "international");
  document.getElementById("routingNumberField").classList.toggle("hidden", region !== "us");
  document.getElementById("sortCodeField").classList.toggle("hidden", region !== "uk");
  document.getElementById("ibanField").classList.toggle("hidden", region !== "international");
  document.getElementById("swiftField").classList.toggle("hidden", region === "ghana");
}

async function savePaymentMethod(){

  const passkey = document.getElementById("passkeyInput").value.trim();
  const msgEl = document.getElementById("msg");
  const btn = document.getElementById("saveBtn");

  if(!passkey){
    msgEl.className = "msg error";
    msgEl.innerText = "Please enter your translator passkey.";
    return;
  }

  const body = { passkey, method: currentMethod };

  if(currentMethod === "bank"){
    body.bankRegion = document.getElementById("bankRegion").value;
    body.bankName = document.getElementById("bankName").value.trim();
    body.accountNumber = document.getElementById("accountNumber").value.trim();
    body.routingNumber = document.getElementById("routingNumber").value.trim();
    body.sortCode = document.getElementById("sortCode").value.trim();
    body.iban = document.getElementById("iban").value.trim();
    body.swiftBic = document.getElementById("swiftBic").value.trim();
    body.accountName = document.getElementById("accountName").value.trim();
  } else {
    body.momoNetwork = document.getElementById("momoNetwork").value;
    body.momoNumber = document.getElementById("momoNumber").value.trim();
  }

  btn.disabled = true;
  btn.innerText = "Saving...";
  msgEl.innerText = "";

  try{

    const res = await fetch("https://saybonapp-server.onrender.com/api/savePaymentMethod", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });

    const data = await res.json();

    if(!res.ok){
      msgEl.className = "msg error";
      msgEl.innerText = data.error || "Could not save. Please try again.";
      btn.disabled = false;
      btn.innerText = "Save Payment Method";
      return;
    }

    msgEl.className = "msg success";
    msgEl.innerText = "Saved. This will be used for your future payouts.";
    btn.disabled = false;
    btn.innerText = "Save Payment Method";

  }catch(err){
    msgEl.className = "msg error";
    msgEl.innerText = "Could not reach the server. Please try again.";
    btn.disabled = false;
    btn.innerText = "Save Payment Method";
  }

}

</script>

</body>
</html>
