<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SayBon — Easy Fun French</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/home.css?v=16"><script type="module" src="/js/nav-engine.js"></script></head><body><audio id="introAudio" preload="auto">    <source src="assets/sounds/intro-v2.mp3" type="audio/mpeg"></audio><div class="home-shell">    <picture class="background-layer">        <source media="(max-width:900px)" srcset="assets/home/mobile-background.PNG">        <img src="assets/home/desktop-background.PNG" alt="">    </picture>    <div class="desktop-layout">        <div id="teacher" class="teacher-hitbox">            <img                src="assets/home/teacher.PNG"                class="teacher-img"                alt="Teacher"            >        </div>        <img            src="assets/home/IMG_6479.PNG"            class="tap-icon"            alt=""        >        <img            src="assets/home/saybon-logo.PNG"            class="saybon-logo"            alt=""        >        <button id="startBtn" class="image-btn start-btn">            <img src="assets/home/get-started-button.PNG" alt="Get Started">        </button>        <button id="loginBtn" class="image-btn login-btn">            <img src="assets/home/login-button.PNG" alt="Login">        </button>        <button id="settingsBtn" class="settings-image-btn">            <img src="assets/home/admin-button.PNG" alt="Settings">        </button>    </div></div><!-- OFFER OVERLAY --><div id="offerOverlay" class="overlay hidden" aria-hidden="true">    <picture class="overlay-art">        <source media="(max-width:900px)" srcset="assets/home/overlay-mobile.png">        <img src="assets/home/overlay-desktop.png" alt="What we offer at SayBon">    </picture>    <!-- Pill launch/parking stage -->    <div class="overlay-stage">        <div class="overlay-pill slot-1" id="pill1">            <img src="assets/home/pill-1.png" alt="">        </div>        <div class="overlay-pill slot-2" id="pill2">            <img src="assets/home/pill-2.png" alt="">        </div>        <div class="overlay-pill slot-3" id="pill3">            <img src="assets/home/pill-3.png" alt="">        </div>        <div class="overlay-pill slot-4" id="pill4">            <img src="assets/home/pill-4.png" alt="">        </div>    </div></div><script src="js/home.js"></script></body></html>
