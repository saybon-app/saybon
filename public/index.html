<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SayBon — Easy Fun French</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/home.css?v=26">

<script type="module" src="/js/nav-engine.js"></script>
</head>

<body>

<audio id="introAudio" preload="auto">
    <source src="assets/sounds/intro-v2.mp3" type="audio/mpeg">
</audio>

<div class="home-shell">

    <picture class="background-layer">
        <source media="(max-width:900px)" srcset="assets/home/mobile-background.webp">
        <img src="assets/home/desktop-background.webp" alt="">
    </picture>

    <div class="desktop-layout">

        <div id="teacher" class="teacher-hitbox">
            <img
                src="assets/home/teacher.webp"
                class="teacher-img"
                alt="Teacher"
            >
            <div class="teacher-click-label">
                <svg class="click-label-arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
                <span>Click</span>
            </div>
        </div>

        <img
            src="assets/home/saybon-logo.webp"
            class="saybon-logo"
            alt=""
        >

        <button id="startBtn" class="image-btn start-btn">
            <img src="assets/home/get-started-button.webp" alt="Get Started">
        </button>

        <button id="loginBtn" class="image-btn login-btn">
            <img src="assets/home/login-button.webp" alt="Login">
        </button>

        <button id="settingsBtn" class="settings-image-btn">
            <img src="assets/home/admin-button.webp" alt="Settings">
        </button>

    </div>

</div>

<!-- OFFER OVERLAY -->
<div id="offerOverlay" class="overlay hidden" aria-hidden="true">

    <picture class="overlay-art">
        <source media="(max-width:900px)" srcset="assets/home/overlay-mobile.webp">
        <img src="assets/home/overlay-desktop.webp" alt="What we offer at SayBon">
    </picture>

    <!-- Pill launch/parking stage -->
    <div class="overlay-stage">

        <!-- DESKTOP STATIC OFFER ROW (NEW - desktop/large screens only) -->
        <div class="desktop-pill-row" id="desktopPillRow">
            <div class="desk-pill-card" id="deskPill1">
                <img src="assets/home/desk-pill-1.webp" alt="Speak French from your very first lesson">
            </div>
            <div class="desk-pill-card" id="deskPill2">
                <img src="assets/home/desk-pill-2.webp" alt="Clear, fun CEFR-based learning">
            </div>
            <div class="desk-pill-card" id="deskPill3">
                <img src="assets/home/desk-pill-3.webp" alt="Original music to help French stick naturally">
            </div>
            <div class="desk-pill-card" id="deskPill4">
                <img src="assets/home/desk-pill-4.webp" alt="DELF prep + professional translation by experts">
            </div>
        </div>

        <!-- MOBILE / SMALL SCREEN ANIMATED PILLS (unchanged) -->
        <div class="overlay-pill slot-1" id="pill1">
            <img src="assets/home/pill-1.webp" alt="">
        </div>

        <div class="overlay-pill slot-2" id="pill2">
            <img src="assets/home/pill-2.webp" alt="">
        </div>

        <div class="overlay-pill slot-3" id="pill3">
            <img src="assets/home/pill-3.webp" alt="">
        </div>

        <div class="overlay-pill slot-4" id="pill4">
            <img src="assets/home/pill-4.webp" alt="">
        </div>
    </div>

</div>

<script src="js/home.js"></script>
</body>
</html>
