<!DOCTYPE html>
<html lang="en">

<head>
<script type='module' src='/js/auth-guard.js'></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Watch - SayBon Music</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">

<style>

*{ box-sizing:border-box; }

*::-webkit-scrollbar{ width:10px; height:10px; }
*::-webkit-scrollbar-track{ background:rgba(255,255,255,.04); border-radius:10px; }
*::-webkit-scrollbar-thumb{ background:linear-gradient(180deg, #C9A0A5, #8B5A5F); border-radius:10px; border:2px solid #0A0607; background-clip:padding-box; }

html{ overflow-x:hidden; }

body{
margin:0;
font-family:'Inter', system-ui, sans-serif;
color:#E8DCDA;
background:#0A0607;
overflow-x:hidden;
scrollbar-width:thin;
scrollbar-color:#C9A0A5 rgba(255,255,255,.04);
}

.topbar{
position:fixed; top:0; left:0; right:0; height:60px; z-index:100;
background:rgba(10,6,7,.96); backdrop-filter:blur(16px); border-bottom:1px solid rgba(255,255,255,.08);
display:flex; align-items:center; padding:0 18px; gap:16px;
}
.topbar-logo{ font-size:16px; font-weight:700; color:#fff; display:flex; align-items:center; gap:8px; cursor:pointer; flex:0 0 auto; white-space:nowrap; }
.topbar-logo svg{ color:#C9A0A5; flex:0 0 auto; }
.topbar-right{ margin-left:auto; display:flex; gap:8px; }
.topbar-icon-btn{
width:36px; height:36px; border-radius:50%; border:none; background:rgba(255,255,255,.06);
display:flex; align-items:center; justify-content:center; cursor:pointer; color:#fff;
}
.topbar-icon-btn:hover{ background:rgba(255,255,255,.12); }

.watch-layout{
margin-top:60px; padding:22px 22px 60px;
display:flex; gap:26px; align-items:flex-start; max-width:1500px; margin-left:auto; margin-right:auto;
flex-wrap:wrap;
}

.main-col{ flex:2 1 560px; min-width:0; }
.side-col{ flex:1 1 320px; max-width:400px; }

.player-wrap{ position:relative; width:100%; aspect-ratio:16/9; border-radius:14px; overflow:hidden; background:#000; margin-bottom:16px; }
.player-wrap iframe{ width:100%; height:100%; border:none; }

.title{ font-size:18px; font-weight:700; color:#fff; margin-bottom:10px; line-height:1.3; }

.channel-row{ display:flex; align-items:center; gap:12px; margin-bottom:16px; }
.channel-avatar{
width:40px; height:40px; border-radius:50%; background:rgba(183,110,121,.25);
display:flex; align-items:center; justify-content:center; color:#C9A0A5; flex:0 0 auto;
}
.channel-name{ font-size:13px; font-weight:650; color:#fff; }
.channel-genre{ font-size:11.5px; color:#9C8589; }

.action-row{ display:flex; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap; }

.action-btn{
display:flex; align-items:center; gap:7px; padding:9px 15px; border-radius:20px; border:1px solid rgba(255,255,255,.12);
background:rgba(255,255,255,.05); color:#E8DCDA; cursor:pointer; font-size:12.5px; font-weight:600;
}
.action-btn.liked{ background:rgba(183,110,121,.22); border-color:#B76E79; color:#C9A0A5; }
.action-btn svg{ width:16px; height:16px; }
.views-count{ font-size:12px; color:#786367; margin-left:auto; }

.description{
background:rgba(255,255,255,.04); border-radius:12px; padding:14px 16px; margin-bottom:26px;
font-size:12.5px; color:#B8A5A2; line-height:1.6;
}

.comments-heading{ font-size:14px; font-weight:650; color:#fff; margin-bottom:14px; }

.comment-form{ display:flex; gap:10px; margin-bottom:22px; }
.comment-form textarea{
flex:1; min-height:44px; padding:11px 13px; border-radius:10px; border:1px solid rgba(255,255,255,.12);
background:rgba(255,255,255,.05); color:#fff; font-family:inherit; font-size:12.5px; resize:vertical;
}
.comment-form button{
padding:10px 18px; border:none; border-radius:10px; background:#B76E79; color:#fff; font-weight:650; font-size:12.5px; cursor:pointer;
}

.comment{ display:flex; gap:10px; margin-bottom:16px; }
.comment-avatar{ width:34px; height:34px; border-radius:50%; flex:0 0 auto; background:rgba(183,110,121,.2); object-fit:cover; }
.comment-body{ flex:1; }
.comment-name{ font-size:12.5px; font-weight:650; color:#fff; }
.comment-text{ font-size:12.5px; color:#B8A5A2; margin-top:2px; line-height:1.5; }

.empty-note{ color:#786367; font-size:12.5px; padding:16px 0; }

.side-heading{ font-size:13px; font-weight:650; color:#fff; margin-bottom:12px; }

.up-next-row{ display:flex; gap:10px; margin-bottom:12px; cursor:pointer; }
.un-thumb{ width:120px; aspect-ratio:16/9; object-fit:cover; border-radius:8px; flex:0 0 auto; }
.un-title{ font-size:12px; font-weight:600; color:#fff; line-height:1.35; margin-bottom:3px; }
.un-sub{ font-size:11px; color:#786367; }

.playlist-modal-overlay{
position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.7);
display:none; align-items:center; justify-content:center; z-index:200; padding:20px;
}
.playlist-modal{ width:100%; max-width:360px; background:#150E10; border:1px solid rgba(255,255,255,.1); border-radius:16px; padding:22px; }
.playlist-modal h3{ margin:0 0 14px; font-size:15px; color:#fff; }
.playlist-item{ padding:10px 12px; border-radius:9px; background:rgba(255,255,255,.05); margin-bottom:8px; cursor:pointer; font-size:12.5px; }
.playlist-item:hover{ background:rgba(183,110,121,.15); }
.new-playlist-row{ display:flex; gap:8px; margin-top:14px; }
.new-playlist-row input{ flex:1; padding:9px 11px; border-radius:8px; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.05); color:#fff; font-size:12px; }
.new-playlist-row button{ padding:9px 14px; border:none; border-radius:8px; background:#B76E79; color:#fff; font-weight:650; font-size:12px; cursor:pointer; }
.close-modal{ display:block; margin-top:14px; text-align:center; color:#786367; font-size:11.5px; cursor:pointer; }

</style>
</head>

<body>

<div class="topbar">
<div class="topbar-logo" onclick="location.href='/music/index.html'">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
SayBon Music
</div>
<div class="topbar-right">
<button class="topbar-icon-btn" onclick="location.href='/dashboard/'" aria-label="Dashboard">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
</button>
</div>
</div>

<div class="watch-layout">

<div class="main-col">

<div class="player-wrap" id="playerWrap"></div>

<div class="title" id="videoTitle">Loading…</div>

<div class="channel-row">
<div class="channel-avatar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
<div>
<div class="channel-name" id="videoArtist">SayBon Music</div>
<div class="channel-genre" id="videoGenre"></div>
</div>
</div>

<div class="action-row">
<button class="action-btn" id="likeBtn">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6c-1.8-1.8-4.6-1.8-6.4 0L12 7l-2.4-2.4c-1.8-1.8-4.6-1.8-6.4 0-1.8 1.8-1.8 4.6 0 6.4L12 20l8.8-8.8c1.8-1.8 1.8-4.7 0-6.4z"/></svg>
<span id="likeCount">0</span>
</button>
<button class="action-btn" id="playlistBtn">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
Save
</button>
<span class="views-count" id="viewsCount"></span>
</div>

<div class="description" id="videoDescription" style="display:none;"></div>

<div class="comments-heading">Comments</div>

<div class="comment-form">
<textarea id="commentInput" placeholder="Add a comment..."></textarea>
<button onclick="postComment()">Post</button>
</div>

<div id="commentsList"></div>

</div>

<div class="side-col">
<div class="side-heading">More like this</div>
<div id="upNextList"></div>
</div>

</div>

<div class="playlist-modal-overlay" id="playlistModal">
<div class="playlist-modal">
<h3>Save to Playlist</h3>
<div id="playlistList"></div>
<div class="new-playlist-row">
<input type="text" id="newPlaylistName" placeholder="New playlist name" />
<button onclick="createAndAdd()">Create</button>
</div>
<div class="close-modal" onclick="document.getElementById('playlistModal').style.display='none'">Close</div>
</div>
</div>

<script type="module">

import { auth } from "/js/firebase-init.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const API_BASE = "https://saybonapp-server.onrender.com";
const params = new URLSearchParams(window.location.search);
const videoId = params.get("v");

let currentUser = null;
let currentVideo = null;

onAuthStateChanged(auth, (user) => {
  currentUser = user;
  loadVideo();
  loadComments();
});

async function loadVideo(){

  if(!videoId){
    document.getElementById("videoTitle").innerText = "No video specified.";
    return;
  }

  try{

    const url = API_BASE + "/api/musicVideo?id=" + encodeURIComponent(videoId) + (currentUser ? "&userId=" + encodeURIComponent(currentUser.uid) : "");
    const res = await fetch(url);
    const data = await res.json();

    if(!res.ok){
      document.getElementById("videoTitle").innerText = "Video not found.";
      return;
    }

    currentVideo = data;

    document.getElementById("playerWrap").innerHTML =
      "<iframe src='https://www.youtube.com/embed/" + data.youtubeId + "?modestbranding=1&rel=0' allow='autoplay; encrypted-media' allowfullscreen></iframe>";

    document.getElementById("videoTitle").innerText = data.title;
    document.getElementById("videoArtist").innerText = data.artist || "SayBon Music";
    document.getElementById("videoGenre").innerText = data.genre;
    document.getElementById("viewsCount").innerText = data.views + " views";
    document.getElementById("likeCount").innerText = data.likeCount;

    if(data.userHasLiked){
      document.getElementById("likeBtn").classList.add("liked");
    }

    if(data.description){
      document.getElementById("videoDescription").style.display = "block";
      document.getElementById("videoDescription").innerText = data.description;
    }

    fetch(API_BASE + "/api/musicIncrementView", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ videoId })
    });

    loadUpNext(data.genre);

  }catch(err){
    document.getElementById("videoTitle").innerText = "Could not load this video.";
  }

}

async function loadUpNext(genre){

  const res = await fetch(API_BASE + "/api/musicVideos?genre=" + encodeURIComponent(genre));
  const videos = await res.json();

  const others = videos.filter(v => v.id !== videoId);

  const list = document.getElementById("upNextList");

  if(!others.length){
    list.innerHTML = "<div class='empty-note'>No other videos in this genre yet.</div>";
    return;
  }

  list.innerHTML = "";

  others.forEach(v => {
    const row = document.createElement("div");
    row.className = "up-next-row";
    row.onclick = () => location.href = "/music/watch.html?v=" + v.id;
    row.innerHTML =
      "<img class='un-thumb' src='https://img.youtube.com/vi/" + v.youtubeId + "/hqdefault.jpg'>" +
      "<div><div class='un-title'>" + v.title + "</div><div class='un-sub'>" + (v.artist||"SayBon Music") + " · " + v.views + " views</div></div>";
    list.appendChild(row);
  });

}

document.getElementById("likeBtn").addEventListener("click", async () => {

  if(!currentUser){
    alert("Please sign in to react to videos.");
    return;
  }

  const res = await fetch(API_BASE + "/api/musicToggleReaction", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ videoId, userId: currentUser.uid })
  });

  const data = await res.json();

  const btn = document.getElementById("likeBtn");
  const countEl = document.getElementById("likeCount");
  let count = Number(countEl.innerText);

  if(data.liked){
    btn.classList.add("liked");
    countEl.innerText = count + 1;
  }else{
    btn.classList.remove("liked");
    countEl.innerText = count - 1;
  }

});

async function loadComments(){

  if(!videoId) return;

  const res = await fetch(API_BASE + "/api/musicComments?videoId=" + encodeURIComponent(videoId));
  const comments = await res.json();

  const list = document.getElementById("commentsList");

  if(!comments.length){
    list.innerHTML = "<div class='empty-note'>No comments yet. Be the first to say something.</div>";
    return;
  }

  list.innerHTML = "";

  comments.forEach(c => {
    const div = document.createElement("div");
    div.className = "comment";
    div.innerHTML =
      (c.userPhoto ? "<img class='comment-avatar' src='" + c.userPhoto + "'>" : "<div class='comment-avatar'></div>") +
      "<div class='comment-body'>" +
        "<div class='comment-name'>" + c.userName + "</div>" +
        "<div class='comment-text'>" + c.text.replace(/</g,"&lt;") + "</div>" +
      "</div>";
    list.appendChild(div);
  });

}

window.postComment = async function(){

  if(!currentUser){
    alert("Please sign in to comment.");
    return;
  }

  const text = document.getElementById("commentInput").value.trim();
  if(!text) return;

  const res = await fetch(API_BASE + "/api/musicAddComment", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      videoId,
      userId: currentUser.uid,
      userName: currentUser.displayName || "SayBon User",
      userPhoto: currentUser.photoURL || "",
      text
    })
  });

  if(res.ok){
    document.getElementById("commentInput").value = "";
    loadComments();
  }

}

window.openPlaylistModal = async function(){

  if(!currentUser){
    alert("Please sign in to use playlists.");
    return;
  }

  const res = await fetch(API_BASE + "/api/musicPlaylists?userId=" + encodeURIComponent(currentUser.uid));
  const playlists = await res.json();

  const list = document.getElementById("playlistList");

  if(!playlists.length){
    list.innerHTML = "<div class='empty-note'>You don't have any playlists yet.</div>";
  }else{
    list.innerHTML = "";
    playlists.forEach(p => {
      const item = document.createElement("div");
      item.className = "playlist-item";
      item.innerText = p.name + " (" + p.videoIds.length + ")";
      item.onclick = () => addToPlaylist(p.id);
      list.appendChild(item);
    });
  }

  document.getElementById("playlistModal").style.display = "flex";

}

document.getElementById("playlistBtn").addEventListener("click", () => window.openPlaylistModal());

async function addToPlaylist(playlistId){

  await fetch(API_BASE + "/api/musicAddToPlaylist", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ playlistId, videoId })
  });

  document.getElementById("playlistModal").style.display = "none";
  alert("Added to playlist.");

}

window.createAndAdd = async function(){

  const name = document.getElementById("newPlaylistName").value.trim();
  if(!name) return;

  const res = await fetch(API_BASE + "/api/musicCreatePlaylist", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ userId: currentUser.uid, name })
  });

  const data = await res.json();

  if(res.ok){
    await addToPlaylist(data.id);
    document.getElementById("newPlaylistName").value = "";
  }

}

</script>

</body>
</html>
