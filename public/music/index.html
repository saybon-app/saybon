<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SayBon Music</title>

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: "Nunito", system-ui, sans-serif;
      background: #06070a;
      color: #fff7df;
    }

    body {
      min-height: 100vh;
      background:
        linear-gradient(rgba(5, 7, 12, 0.84), rgba(5, 7, 12, 0.94)),
        url("/assets/images/music-icon.png") center/cover fixed no-repeat;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 28% 18%, rgba(255, 207, 106, 0.14), transparent 28%),
        radial-gradient(circle at 74% 72%, rgba(222, 89, 105, 0.10), transparent 34%),
        rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(12px) saturate(115%);
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      width: 100%;
      padding: clamp(20px, 4vw, 52px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .music-shell {
      width: min(1180px, 100%);
      border-radius: 42px;
      padding: clamp(30px, 5vw, 64px);
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.025));
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        0 40px 120px rgba(0, 0, 0, 0.42),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(24px) saturate(120%);
      overflow: hidden;
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr 280px;
      align-items: center;
      gap: clamp(30px, 6vw, 80px);
    }

    .hero h1 {
      margin: 0;
      max-width: 690px;
      font-size: clamp(50px, 7vw, 92px);
      line-height: 0.94;
      letter-spacing: -0.075em;
      font-weight: 900;
      color: #fff9e9;
      text-shadow: 0 20px 58px rgba(0, 0, 0, 0.42);
    }

    .hero p {
      margin: 28px 0 0;
      max-width: 720px;
      font-size: clamp(16px, 1.8vw, 20px);
      line-height: 1.72;
      color: rgba(255, 247, 223, 0.74);
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .music-toggle {
      width: 260px;
      height: 260px;
      justify-self: end;
      border: 0;
      border-radius: 42px;
      cursor: pointer;
      background:
        radial-gradient(circle at 58% 26%, rgba(255, 255, 255, 0.22), transparent 24%),
        linear-gradient(145deg, rgba(255, 212, 106, 0.30), rgba(222, 89, 105, 0.12), rgba(255, 255, 255, 0.035));
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: grid;
      place-items: center;
      box-shadow:
        0 30px 86px rgba(0, 0, 0, 0.38),
        inset 0 1px 0 rgba(255, 255, 255, 0.16);
      transition: 0.28s ease;
    }

    .music-toggle:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow:
        0 42px 110px rgba(0, 0, 0, 0.5),
        0 0 36px rgba(255, 212, 106, 0.11),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .music-toggle.is-open {
      transform: scale(0.98);
      border-color: rgba(255, 212, 106, 0.28);
    }

    .note-orb {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 35% 20%, rgba(255,255,255,0.28), transparent 34%),
        rgba(255, 255, 255, 0.13);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.32);
      color: #ffd46a;
      font-size: 46px;
      font-weight: 900;
    }

    .folder-drawer {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.8s cubic-bezier(0.2, 0.9, 0.2, 1);
    }

    .folder-drawer.is-open {
      grid-template-rows: 1fr;
    }

    .folder-drawer-inner {
      overflow: hidden;
    }

    .folder-grid {
      padding-top: 54px;
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      gap: clamp(24px, 4vw, 44px);
      opacity: 0;
      transform: translateY(-22px);
      transition:
        opacity 0.55s ease 0.12s,
        transform 0.65s cubic-bezier(0.2, 0.9, 0.2, 1) 0.12s;
    }

    .folder-drawer.is-open .folder-grid {
      opacity: 1;
      transform: translateY(0);
    }

    .folder-link {
      position: relative;
      min-height: 155px;
      display: grid;
      place-items: center;
      text-decoration: none;
      isolation: isolate;
      animation: folderFloat 5.5s ease-in-out infinite;
      animation-delay: var(--delay);
    }

    @keyframes folderFloat {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    .folder-link::before {
      content: "";
      position: absolute;
      width: 72%;
      height: 34%;
      left: 14%;
      bottom: 6px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 196, 73, 0.20), rgba(0,0,0,0) 70%);
      filter: blur(16px);
      opacity: 0.7;
      z-index: -1;
      transition: 0.25s ease;
    }

    .folder-link:hover::before {
      opacity: 1;
      transform: scale(1.12);
    }

    .folder-img {
      width: 180px;
      max-width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      filter:
        drop-shadow(0 30px 28px rgba(0,0,0,0.58))
        drop-shadow(0 0 18px rgba(255,190,65,0.10));
      transition: 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .folder-link:hover .folder-img {
      transform: translateY(-7px) scale(1.05);
      filter:
        drop-shadow(0 42px 38px rgba(0,0,0,0.72))
        drop-shadow(0 0 30px rgba(255,210,105,0.22));
    }

    .folder-link::after {
      content: attr(data-title);
      position: absolute;
      bottom: -16px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.48);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(14px);
      color: rgba(255,247,223,0.92);
      font-size: 13px;
      font-weight: 900;
      opacity: 0;
      pointer-events: none;
      transition: 0.22s ease;
      white-space: nowrap;
      box-shadow: 0 12px 30px rgba(0,0,0,0.28);
    }

    .folder-link:hover::after {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .video-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 34px;
      background: rgba(0,0,0,0.84);
      backdrop-filter: blur(20px);
    }

    .video-overlay.active {
      display: flex;
    }

    .video-shell {
      width: min(100%, 1040px);
      border-radius: 28px;
      padding: 18px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: 0 40px 110px rgba(0,0,0,0.55);
    }

    .video-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 4px 16px;
    }

    .video-head strong {
      font-size: 20px;
      font-weight: 900;
    }

    .close-video {
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.14);
      color: white;
      font-size: 26px;
      cursor: pointer;
    }

    video {
      width: 100%;
      max-height: 72vh;
      display: block;
      border-radius: 20px;
      background: #000;
    }

    @media (max-width: 900px) {
      .page {
        align-items: flex-start;
      }

      .hero {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .hero h1,
      .hero p {
        margin-left: auto;
        margin-right: auto;
      }

      .music-toggle {
        justify-self: center;
        width: 220px;
        height: 220px;
      }

      .folder-grid {
        grid-template-columns: repeat(2, minmax(130px, 1fr));
      }
    }

    @media (max-width: 520px) {
      .music-shell {
        padding: 28px 18px 38px;
        border-radius: 30px;
      }

      .hero h1 {
        font-size: 44px;
      }

      .hero p {
        font-size: 15px;
      }

      .music-toggle {
        width: 180px;
        height: 180px;
        border-radius: 34px;
      }

      .note-orb {
        width: 82px;
        height: 82px;
        font-size: 38px;
      }

      .folder-grid {
        grid-template-columns: 1fr;
        padding-top: 38px;
      }

      .folder-img {
        width: 210px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="music-shell">
      <section class="hero">
        <div>
          <h1>French through music that feels alive.</h1>
          <p>
            SayBon creates original French music to help learners absorb vocabulary,
            pronunciation, sentence rhythm, listening patterns, and cultural expression
            naturally through repetition, melody, and emotional memory.
          </p>
        </div>

        <button class="music-toggle" id="musicToggle" type="button" aria-label="Open SayBon music genres">
          <span class="note-orb">♪</span>
        </button>
      </section>

      <section class="folder-drawer" id="folderDrawer">
        <div class="folder-drawer-inner">
          <section class="folder-grid">
            <a class="folder-link" style="--delay:0s" href="#" data-title="Afrobeats" data-video="">
              <img class="folder-img" src="/assets/images/fa.png" alt="Afrobeats">
            </a>

            <a class="folder-link" style="--delay:.14s" href="#" data-title="Classical" data-video="">
              <img class="folder-img" src="/assets/images/fc.png" alt="Classical">
            </a>

            <a class="folder-link" style="--delay:.28s" href="#" data-title="Country" data-video="/assets/videos/country-1.mp4">
              <img class="folder-img" src="/assets/images/fcntry.png" alt="Country">
            </a>

            <a class="folder-link" style="--delay:.42s" href="#" data-title="Gospel" data-video="">
              <img class="folder-img" src="/assets/images/fg.png" alt="Gospel">
            </a>

            <a class="folder-link" style="--delay:.56s" href="#" data-title="Jazz" data-video="">
              <img class="folder-img" src="/assets/images/fj.png" alt="Jazz">
            </a>

            <a class="folder-link" style="--delay:.70s" href="#" data-title="Latin" data-video="">
              <img class="folder-img" src="/assets/images/fl.png" alt="Latin">
            </a>

            <a class="folder-link" style="--delay:.84s" href="#" data-title="Pop" data-video="/assets/videos/pop-1.mp4">
              <img class="folder-img" src="/assets/images/fp.png" alt="Pop">
            </a>

            <a class="folder-link" style="--delay:.98s" href="#" data-title="Reggaeton" data-video="">
              <img class="folder-img" src="/assets/images/fr.png" alt="Reggaeton">
            </a>
          </section>
        </div>
      </section>
    </section>
  </main>

  <section class="video-overlay" id="videoOverlay">
    <div class="video-shell">
      <div class="video-head">
        <strong id="videoTitle">SayBon Music</strong>
        <button class="close-video" id="closeVideo" type="button">×</button>
      </div>
      <video id="videoPlayer" controls playsinline></video>
    </div>
  </section>

  <script>
    const toggle = document.getElementById("musicToggle");
    const drawer = document.getElementById("folderDrawer");

    toggle.addEventListener("click", () => {
      toggle.classList.toggle("is-open");
      drawer.classList.toggle("is-open");
    });

    const folders = document.querySelectorAll(".folder-link");
    const overlay = document.getElementById("videoOverlay");
    const player = document.getElementById("videoPlayer");
    const title = document.getElementById("videoTitle");
    const closeVideo = document.getElementById("closeVideo");

    folders.forEach(folder => {
      folder.addEventListener("click", event => {
        event.preventDefault();

        const video = folder.dataset.video;
        const name = folder.dataset.title;

        if (!video) {
          alert(name + " songs are coming soon.");
          return;
        }

        title.textContent = name + " — SayBon Music";
        player.src = video;
        overlay.classList.add("active");
        player.play();
      });
    });

    function closeOverlay() {
      player.pause();
      player.removeAttribute("src");
      player.load();
      overlay.classList.remove("active");
    }

    closeVideo.addEventListener("click", closeOverlay);

    overlay.addEventListener("click", event => {
      if (event.target === overlay) closeOverlay();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && overlay.classList.contains("active")) closeOverlay();
    });
  </script>
</body>
</html>
