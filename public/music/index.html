<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SayBon Music</title>

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; }

    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      font-family:"Nunito",system-ui,sans-serif;
      color:#fff7df;
      background:#050507;
    }

    body{
      min-height:100vh;
      overflow:hidden;
      background:
        linear-gradient(rgba(2,2,4,.80),rgba(2,2,4,.94)),
        url("/assets/images/music-icon.png");
      background-size:cover;
      background-position:center;
      background-attachment:fixed;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:0;
      background:
        radial-gradient(circle at 56% 18%, rgba(255,208,120,.12), transparent 30%),
        radial-gradient(circle at 78% 82%, rgba(222,89,105,.10), transparent 34%),
        rgba(0,0,0,.20);
      backdrop-filter:blur(13px) saturate(118%);
    }

    .app{
      position:relative;
      z-index:1;
      width:100vw;
      height:100vh;
      display:grid;
      grid-template-columns:280px 1fr;
      grid-template-rows:1fr 104px;
      overflow:hidden;
    }

    .sidebar{
      grid-row:1 / 3;
      padding:30px 22px 18px;
      background:rgba(0,0,0,.68);
      border-right:1px solid rgba(255,255,255,.10);
      backdrop-filter:blur(22px);
      display:flex;
      flex-direction:column;
      gap:24px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:14px;
      padding-bottom:14px;
    }

    .brand-mark{
      width:54px;
      height:54px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:
        radial-gradient(circle at 50% 50%, #2b1607 0 18%, #d69a36 19% 42%, #090909 43% 100%);
      color:#ffe39a;
      font-size:24px;
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,.22),
        0 16px 34px rgba(0,0,0,.35);
    }

    .brand strong{
      display:block;
      font-size:19px;
      letter-spacing:.23em;
      font-weight:900;
      color:#ffe39a;
    }

    .brand span{
      display:block;
      font-size:12px;
      letter-spacing:.26em;
      color:#ffe39a;
      font-weight:800;
    }

    .search{
      height:44px;
      border-radius:15px;
      padding:0 14px;
      display:flex;
      align-items:center;
      background:rgba(255,255,255,.045);
      border:1px solid rgba(255,255,255,.10);
      color:rgba(255,255,255,.45);
      font-size:14px;
      font-weight:700;
    }

    .nav{
      display:grid;
      gap:4px;
    }

    .nav a{
      min-height:42px;
      display:flex;
      align-items:center;
      gap:12px;
      padding:0 14px;
      border-radius:12px;
      text-decoration:none;
      color:rgba(255,255,255,.74);
      font-size:15px;
      font-weight:760;
      transition:.2s ease;
    }

    .nav a:hover{
      background:rgba(255,255,255,.055);
      color:#fff;
    }

    .nav a.active{
      color:#ff7186;
      background:linear-gradient(90deg,rgba(222,89,105,.18),rgba(255,255,255,.02));
      border-left:3px solid #ff5774;
    }

    .main{
      overflow:auto;
      padding:38px 54px 34px;
    }

    .main::-webkit-scrollbar{ width:8px; }
    .main::-webkit-scrollbar-thumb{
      background:rgba(255,255,255,.16);
      border-radius:999px;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:18px;
    }

    .page-title{
      font-size:15px;
      font-weight:900;
      letter-spacing:.22em;
      text-transform:uppercase;
      color:rgba(255,231,173,.82);
    }

    .top-icons{
      display:flex;
      gap:22px;
      color:rgba(255,255,255,.78);
      font-size:21px;
    }

    .vinyl-grid{
      width:min(100%,1120px);
      margin:0 auto;
      display:grid;
      grid-template-columns:repeat(4,minmax(190px,1fr));
      gap:42px 50px;
      padding:30px 0 84px;
      align-items:center;
    }

    .vinyl-link{
      position:relative;
      min-height:230px;
      display:grid;
      place-items:center;
      text-decoration:none;
      color:#fff7df;
      isolation:isolate;
      animation:floatDisc 5.6s ease-in-out infinite;
      animation-delay:var(--delay);
    }

    @keyframes floatDisc{
      0%,100%{ transform:translateY(0); }
      50%{ transform:translateY(-9px); }
    }

    .vinyl-link::before{
      content:"";
      position:absolute;
      width:78%;
      height:30%;
      left:11%;
      bottom:14px;
      border-radius:50%;
      background:radial-gradient(circle,rgba(255,196,73,.20),rgba(0,0,0,0) 70%);
      filter:blur(18px);
      opacity:.72;
      z-index:-1;
      transition:.25s ease;
    }

    .vinyl-link:hover::before{
      opacity:1;
      transform:scale(1.1);
    }

    .vinyl-disc{
      width:205px;
      height:205px;
      border-radius:50%;
      position:relative;
      overflow:hidden;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,217,143,.95) 0 10%, rgba(180,117,35,.92) 11% 25%, rgba(10,10,10,.76) 26% 34%, rgba(16,16,18,.66) 35% 100%),
        repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,.16) 0 1px, rgba(255,255,255,0) 2px 9px),
        radial-gradient(circle at 30% 18%, rgba(255,255,255,.42), transparent 22%),
        linear-gradient(145deg, rgba(255,255,255,.14), rgba(255,255,255,.03));
      border:1px solid rgba(255,255,255,.24);
      box-shadow:
        inset 0 2px 2px rgba(255,255,255,.20),
        inset 0 -24px 38px rgba(0,0,0,.68),
        inset 18px 0 42px rgba(255,255,255,.04),
        0 32px 42px rgba(0,0,0,.58),
        0 0 30px rgba(255,196,73,.10);
      backdrop-filter:blur(18px) saturate(130%);
      transition:.32s cubic-bezier(.2,.8,.2,1);
    }

    .vinyl-disc::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius:50%;
      background:
        linear-gradient(120deg, rgba(255,255,255,.34), transparent 22%, transparent 62%, rgba(255,255,255,.09)),
        radial-gradient(circle at 34% 26%, rgba(255,255,255,.28), transparent 18%);
      mix-blend-mode:screen;
      opacity:.48;
      pointer-events:none;
    }

    .vinyl-disc::after{
      content:"";
      position:absolute;
      inset:18px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.08);
      box-shadow:
        inset 0 0 0 8px rgba(255,255,255,.018),
        inset 0 0 0 18px rgba(0,0,0,.09),
        inset 0 0 0 32px rgba(255,255,255,.016),
        inset 0 0 0 48px rgba(0,0,0,.10),
        inset 0 0 0 64px rgba(255,255,255,.012);
      pointer-events:none;
    }

    .vinyl-link:hover .vinyl-disc{
      transform:translateY(-7px) scale(1.045) rotate(-4deg);
      box-shadow:
        inset 0 2px 2px rgba(255,255,255,.24),
        inset 0 -24px 38px rgba(0,0,0,.72),
        0 48px 54px rgba(0,0,0,.72),
        0 0 42px rgba(255,210,105,.22);
    }

    .label{
      position:absolute;
      left:50%;
      top:50%;
      width:78px;
      height:78px;
      transform:translate(-50%,-50%);
      border-radius:50%;
      z-index:4;
      display:grid;
      place-items:center;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.95) 0 6%, transparent 7%),
        linear-gradient(145deg,#e8bd75,#9d6420);
      border:1px solid rgba(255,232,171,.42);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,.30),
        inset 0 -10px 18px rgba(80,43,3,.34),
        0 4px 14px rgba(0,0,0,.45);
    }

    .label svg{
      width:38px;
      height:38px;
      stroke:#2a1705;
      stroke-width:2.3;
      fill:none;
      stroke-linecap:round;
      stroke-linejoin:round;
      opacity:.72;
      filter:drop-shadow(0 1px 0 rgba(255,231,166,.18));
    }

    .center-hole{
      position:absolute;
      width:16px;
      height:16px;
      border-radius:50%;
      background:#f9f0df;
      border:1px solid rgba(0,0,0,.26);
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      z-index:6;
      box-shadow:inset 0 2px 4px rgba(0,0,0,.35);
    }

    .vinyl-link::after{
      content:attr(data-title);
      position:absolute;
      bottom:-6px;
      left:50%;
      transform:translateX(-50%) translateY(8px);
      padding:8px 14px;
      border-radius:999px;
      background:rgba(0,0,0,.44);
      border:1px solid rgba(255,255,255,.12);
      backdrop-filter:blur(14px);
      color:rgba(255,247,223,.9);
      font-size:13px;
      font-weight:900;
      opacity:0;
      pointer-events:none;
      transition:.22s ease;
      white-space:nowrap;
      box-shadow:0 12px 30px rgba(0,0,0,.28);
    }

    .vinyl-link:hover::after{
      opacity:1;
      transform:translateX(-50%) translateY(0);
    }

    .bottom-player{
      grid-column:2;
      display:grid;
      grid-template-columns:290px 1fr 220px;
      align-items:center;
      gap:28px;
      padding:14px 36px;
      background:rgba(5,6,9,.80);
      border-top:1px solid rgba(255,255,255,.10);
      backdrop-filter:blur(24px);
    }

    .now{
      display:flex;
      align-items:center;
      gap:14px;
      min-width:0;
    }

    .now-art{
      width:58px;
      height:58px;
      border-radius:50%;
      background:
        radial-gradient(circle at 50% 50%, #ffd46a 0 18%, #101010 19% 100%),
        repeating-radial-gradient(circle, rgba(255,255,255,.15) 0 1px, transparent 2px 6px);
      display:grid;
      place-items:center;
      color:#ffc84f;
      font-size:20px;
    }

    .now strong{
      display:block;
      font-size:15px;
    }

    .now span{
      display:block;
      color:rgba(255,247,223,.62);
      font-size:12px;
      margin-top:3px;
    }

    .controls{
      display:grid;
      justify-items:center;
      gap:10px;
    }

    .buttons{
      display:flex;
      align-items:center;
      gap:28px;
      color:rgba(255,255,255,.82);
      font-size:19px;
    }

    .play-main{
      width:46px;
      height:46px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.18);
    }

    .timeline{
      width:min(100%,560px);
      display:grid;
      grid-template-columns:48px 1fr 48px;
      gap:12px;
      align-items:center;
      color:rgba(255,255,255,.68);
      font-size:12px;
      font-weight:800;
    }

    .line{
      height:4px;
      border-radius:999px;
      background:rgba(255,255,255,.15);
      overflow:hidden;
    }

    .line span{
      display:block;
      width:58%;
      height:100%;
      background:linear-gradient(90deg,#de5969,#ffd46a);
    }

    .tools{
      justify-self:end;
      display:flex;
      gap:18px;
      color:rgba(255,255,255,.80);
    }

    .video-overlay{
      position:fixed;
      inset:0;
      z-index:50;
      display:none;
      align-items:center;
      justify-content:center;
      padding:34px;
      background:rgba(0,0,0,.84);
      backdrop-filter:blur(20px);
    }

    .video-overlay.active{
      display:flex;
    }

    .video-shell{
      width:min(100%,1040px);
      border-radius:28px;
      padding:18px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.14);
      box-shadow:0 40px 110px rgba(0,0,0,.55);
    }

    .video-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:4px 4px 16px;
    }

    .video-head strong{
      font-size:20px;
      font-weight:900;
    }

    .close-video{
      width:46px;
      height:46px;
      border:0;
      border-radius:50%;
      background:rgba(255,255,255,.14);
      color:white;
      font-size:26px;
      cursor:pointer;
    }

    video{
      width:100%;
      max-height:72vh;
      display:block;
      border-radius:20px;
      background:#000;
    }

    @media(max-width:1120px){
      body{ overflow:auto; }

      .app{
        grid-template-columns:1fr;
        grid-template-rows:auto 1fr auto;
        height:auto;
        min-height:100vh;
      }

      .sidebar{
        grid-row:auto;
        flex-direction:row;
        overflow-x:auto;
        border-right:0;
        border-bottom:1px solid rgba(255,255,255,.10);
      }

      .brand,.search,.nav{ flex:0 0 auto; }
      .nav{ display:flex; }

      .main{
        padding:30px 24px;
      }

      .vinyl-grid{
        grid-template-columns:repeat(3,minmax(170px,1fr));
        gap:34px 28px;
      }

      .bottom-player{
        grid-column:auto;
        grid-template-columns:1fr;
      }

      .tools{
        justify-self:center;
      }
    }

    @media(max-width:720px){
      .vinyl-grid{
        grid-template-columns:repeat(2,minmax(140px,1fr));
        gap:26px 18px;
      }

      .vinyl-link{
        min-height:185px;
      }

      .vinyl-disc{
        width:165px;
        height:165px;
      }

      .label{
        width:64px;
        height:64px;
      }

      .label svg{
        width:31px;
        height:31px;
      }
    }

    @media(max-width:460px){
      .vinyl-grid{
        grid-template-columns:1fr;
      }

      .vinyl-disc{
        width:210px;
        height:210px;
      }

      .topbar{
        justify-content:center;
        gap:20px;
        flex-direction:column;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">♪</div>
        <div>
          <strong>SAYBON</strong>
          <span>MUSIC</span>
        </div>
      </div>

      <div class="search">Search lyric videos...</div>

      <nav class="nav">
        <a class="active" href="#">▣ Browse</a>
        <a href="#">▢ Your Library</a>
        <a href="#">◷ Recently Played</a>
        <a href="#">♡ Liked Songs</a>
        <a href="#">▱ Playlists</a>
      </nav>
    </aside>

    <section class="main">
      <header class="topbar">
        <div class="page-title">Featured Vinyl Vaults</div>
        <div class="top-icons">
          <span>⌕</span>
          <span>♢</span>
          <span>☰</span>
        </div>
      </header>

      <section class="vinyl-grid">
        <a class="vinyl-link" style="--delay:0s" href="#" data-title="Afrobeats" data-video="">
          <div class="vinyl-disc">
            <div class="label">
              <svg viewBox="0 0 64 64"><ellipse cx="32" cy="16" rx="13" ry="5"/><path d="M19 16v28c0 7 26 7 26 0V16"/><path d="M19 30c0 7 26 7 26 0"/></svg>
            </div>
            <div class="center-hole"></div>
          </div>
        </a>

        <a class="vinyl-link" style="--delay:.14s" href="#" data-title="Classical" data-video="">
          <div class="vinyl-disc">
            <div class="label">
              <svg viewBox="0 0 64 64"><path d="M24 12v34"/><path d="M24 12l20 10"/><path d="M24 28l18 8"/><circle cx="21" cy="49" r="6"/><circle cx="39" cy="51" r="5"/></svg>
            </div>
            <div class="center-hole"></div>
          </div>
        </a>

        <a class="vinyl-link" style="--delay:.28s" href="#" data-title="Country" data-video="/assets/videos/country-1.mp4">
          <div class="vinyl-disc">
            <div class="label">
              <svg viewBox="0 0 64 64"><path d="M26 20c0-8 9-11 14-4l10 14c4 7-2 14-11 13H28"/><circle cx="22" cy="34" r="10"/><path d="M31 31l17-17"/></svg>
            </div>
            <div class="center-hole"></div>
          </div>
        </a>

        <a class="vinyl-link" style="--delay:.42s" href="#" data-title="Gospel" data-video="">
          <div class="vinyl-disc">
            <div class="label">
              <svg viewBox="0 0 64 64"><path d="M32 10v44"/><path d="M18 24h28"/></svg>
            </div>
            <div class="center-hole"></div>
          </div>
        </a>

        <a class="vinyl-link" style="--delay:.56s" href="#" data-title="Jazz" data-video="">
          <div class="vinyl-disc">
            <div class="label">
              <svg viewBox="0 0 64 64"><path d="M22 10c19 10 18 34 0 44"/><path d="M43 15c-13 7-13 28 2 36"/><circle cx="22" cy="54" r="4"/><circle cx="45" cy="51" r="4"/></svg>
            </div>
            <div class="center-hole"></div>
          </div>
        </a>

        <a class="vinyl-link" style="--delay:.70s" href="#" data-title="Latin" data-video="">
          <div class="vinyl-disc">
            <div class="label">
              <svg viewBox="0 0 64 64"><circle cx="23" cy="18" r="5"/><circle cx="43" cy="18" r="5"/><path d="M24 25l-8 14 10 14"/><path d="M42 25l8 14-10 14"/><path d="M28 32h8"/></svg>
            </div>
            <div class="center-hole"></div>
          </div>
        </a>

        <a class="vinyl-link" style="--delay:.84s" href="#" data-title="Pop" data-video="/assets/videos/pop-1.mp4">
          <div class="vinyl-disc">
            <div class="label">
              <svg viewBox="0 0 64 64"><path d="M18 31c0-12 8-19 14-19s14 7 14 19"/><path d="M18 31v8"/><path d="M46 31v8"/><rect x="13" y="38" width="11" height="13" rx="4"/><rect x="40" y="38" width="11" height="13" rx="4"/></svg>
            </div>
            <div class="center-hole"></div>
          </div>
        </a>

        <a class="vinyl-link" style="--delay:.98s" href="#" data-title="Reggaeton" data-video="">
          <div class="vinyl-disc">
            <div class="label">
              <svg viewBox="0 0 64 64"><circle cx="32" cy="15" r="5"/><path d="M32 22l-9 16 9 15 9-15-9-16z"/><path d="M19 28l9 7"/><path d="M45 28l-9 7"/></svg>
            </div>
            <div class="center-hole"></div>
          </div>
        </a>
      </section>
    </section>

    <section class="bottom-player">
      <div class="now">
        <div class="now-art">♪</div>
        <div>
          <strong>SayBon Lyric Videos</strong>
          <span>Select a vinyl vault</span>
        </div>
      </div>

      <div class="controls">
        <div class="buttons">
          <span>⤨</span>
          <span>‹</span>
          <span class="play-main">▶</span>
          <span>›</span>
          <span>↻</span>
        </div>

        <div class="timeline">
          <span>00:00</span>
          <div class="line"><span></span></div>
          <span>--:--</span>
        </div>
      </div>

      <div class="tools">
        <span>▣</span>
        <span>🔊</span>
        <span>☰</span>
      </div>
    </section>
  </main>

  <section class="video-overlay" id="videoOverlay">
    <div class="video-shell">
      <div class="video-head">
        <strong id="videoTitle">SayBon Lyric Video</strong>
        <button class="close-video" id="closeVideo">×</button>
      </div>
      <video id="videoPlayer" controls playsinline></video>
    </div>
  </section>

  <script>
    const discs = document.querySelectorAll(".vinyl-link");
    const overlay = document.getElementById("videoOverlay");
    const player = document.getElementById("videoPlayer");
    const title = document.getElementById("videoTitle");
    const closeVideo = document.getElementById("closeVideo");

    discs.forEach(disc => {
      disc.addEventListener("click", event => {
        event.preventDefault();

        const video = disc.dataset.video;
        const name = disc.dataset.title;

        if (!video) {
          alert(name + " lyric videos are coming soon.");
          return;
        }

        title.textContent = name + " Lyric Video";
        player.src = video;
        overlay.classList.add("active");
        player.play();
      });
    });

    function closeOverlay(){
      player.pause();
      player.removeAttribute("src");
      player.load();
      overlay.classList.remove("active");
    }

    closeVideo.addEventListener("click", closeOverlay);

    overlay.addEventListener("click", event => {
      if (event.target === overlay) closeOverlay();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && overlay.classList.contains("active")) closeOverlay();
    });
  </script>
</body>
</html>
