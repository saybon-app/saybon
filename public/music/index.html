<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SayBon Music</title>

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; }

    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      font-family:"Nunito",system-ui,sans-serif;
      color:#fff7df;
      background:#050507;
    }

    body{
      min-height:100vh;
      overflow:hidden;
      background:
        linear-gradient(rgba(2,2,4,.80),rgba(2,2,4,.92)),
        url("/assets/images/music-icon.png");
      background-size:cover;
      background-position:center;
      background-attachment:fixed;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:rgba(0,0,0,.24);
      backdrop-filter:blur(10px) saturate(120%);
      z-index:0;
    }

    .app{
      position:relative;
      z-index:1;
      width:100vw;
      height:100vh;
      display:grid;
      grid-template-columns:280px 1fr;
      grid-template-rows:1fr 104px;
      overflow:hidden;
    }

    .sidebar{
      grid-row:1 / 3;
      padding:30px 22px 18px;
      background:rgba(0,0,0,.66);
      border-right:1px solid rgba(255,255,255,.10);
      backdrop-filter:blur(22px);
      display:flex;
      flex-direction:column;
      gap:24px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:14px;
      padding-bottom:14px;
    }

    .brand-mark{
      width:54px;
      height:54px;
      border-radius:18px;
      display:grid;
      place-items:center;
      background:linear-gradient(145deg,#ffd46a,#c88419);
      color:#211300;
      font-size:26px;
      box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 16px 34px rgba(0,0,0,.35);
    }

    .brand strong{
      display:block;
      font-size:19px;
      letter-spacing:.23em;
      font-weight:900;
      color:#ffe39a;
    }

    .brand span{
      display:block;
      font-size:12px;
      letter-spacing:.26em;
      color:#ffe39a;
      font-weight:800;
    }

    .search{
      height:44px;
      border-radius:15px;
      padding:0 14px;
      display:flex;
      align-items:center;
      background:rgba(255,255,255,.045);
      border:1px solid rgba(255,255,255,.10);
      color:rgba(255,255,255,.45);
      font-size:14px;
      font-weight:700;
    }

    .nav{
      display:grid;
      gap:4px;
    }

    .nav a{
      min-height:42px;
      display:flex;
      align-items:center;
      gap:12px;
      padding:0 14px;
      border-radius:12px;
      text-decoration:none;
      color:rgba(255,255,255,.74);
      font-size:15px;
      font-weight:760;
    }

    .nav a.active{
      color:#ff7186;
      background:linear-gradient(90deg,rgba(222,89,105,.18),rgba(255,255,255,.02));
      border-left:3px solid #ff5774;
    }

    .main{
      overflow:auto;
      padding:38px 54px 34px;
    }

    .main::-webkit-scrollbar{ width:8px; }
    .main::-webkit-scrollbar-thumb{
      background:rgba(255,255,255,.16);
      border-radius:999px;
    }

    .topbar{
      display:flex;
      justify-content:flex-end;
      gap:22px;
      margin-bottom:34px;
      color:rgba(255,255,255,.78);
      font-size:22px;
    }

    .folder-grid{
      width:min(100%,1050px);
      margin:0 auto;
      display:grid;
      grid-template-columns:repeat(4,minmax(180px,1fr));
      gap:62px 58px;
      padding:30px 0 80px;
    }

    .folder-link{
      display:grid;
      place-items:center;
      text-decoration:none;
      color:#fff7df;
      animation:floatFolder 5.4s ease-in-out infinite;
      animation-delay:var(--delay);
    }

    @keyframes floatFolder{
      0%,100%{ transform:translateY(0); }
      50%{ transform:translateY(-8px); }
    }

    .folder-img{
      width:230px;
      max-width:100%;
      height:auto;
      display:block;
      filter:drop-shadow(0 30px 28px rgba(0,0,0,.50));
      transition:.25s ease;
    }

    .folder-link:hover .folder-img{
      transform:translateY(-6px) scale(1.03);
      filter:drop-shadow(0 42px 38px rgba(0,0,0,.62));
    }

    .folder-name{
      margin-top:12px;
      font-size:15px;
      font-weight:900;
      color:rgba(255,247,223,.86);
      text-shadow:0 8px 20px rgba(0,0,0,.55);
    }

    .bottom-player{
      grid-column:2;
      display:grid;
      grid-template-columns:290px 1fr 220px;
      align-items:center;
      gap:28px;
      padding:14px 36px;
      background:rgba(5,6,9,.78);
      border-top:1px solid rgba(255,255,255,.10);
      backdrop-filter:blur(24px);
    }

    .now{
      display:flex;
      align-items:center;
      gap:14px;
      min-width:0;
    }

    .now-art{
      width:58px;
      height:58px;
      border-radius:12px;
      background:linear-gradient(135deg,#150c05,#351807);
      display:grid;
      place-items:center;
      color:#ffc84f;
    }

    .now strong{
      display:block;
      font-size:15px;
    }

    .now span{
      display:block;
      color:rgba(255,247,223,.62);
      font-size:12px;
      margin-top:3px;
    }

    .controls{
      display:grid;
      justify-items:center;
      gap:10px;
    }

    .buttons{
      display:flex;
      align-items:center;
      gap:28px;
      color:rgba(255,255,255,.82);
      font-size:19px;
    }

    .play-main{
      width:46px;
      height:46px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.18);
    }

    .timeline{
      width:min(100%,560px);
      display:grid;
      grid-template-columns:48px 1fr 48px;
      gap:12px;
      align-items:center;
      color:rgba(255,255,255,.68);
      font-size:12px;
      font-weight:800;
    }

    .line{
      height:4px;
      border-radius:999px;
      background:rgba(255,255,255,.15);
      overflow:hidden;
    }

    .line span{
      display:block;
      width:58%;
      height:100%;
      background:linear-gradient(90deg,#de5969,#ffd46a);
    }

    .tools{
      justify-self:end;
      display:flex;
      gap:18px;
      color:rgba(255,255,255,.80);
    }

    .video-overlay{
      position:fixed;
      inset:0;
      z-index:50;
      display:none;
      align-items:center;
      justify-content:center;
      padding:34px;
      background:rgba(0,0,0,.82);
      backdrop-filter:blur(20px);
    }

    .video-overlay.active{
      display:flex;
    }

    .video-shell{
      width:min(100%,1040px);
      border-radius:28px;
      padding:18px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.14);
      box-shadow:0 40px 110px rgba(0,0,0,.55);
    }

    .video-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:4px 4px 16px;
    }

    .video-head strong{
      font-size:20px;
      font-weight:900;
    }

    .close-video{
      width:46px;
      height:46px;
      border:0;
      border-radius:50%;
      background:rgba(255,255,255,.14);
      color:white;
      font-size:26px;
      cursor:pointer;
    }

    video{
      width:100%;
      max-height:72vh;
      display:block;
      border-radius:20px;
      background:#000;
    }

    @media(max-width:1120px){
      body{ overflow:auto; }

      .app{
        grid-template-columns:1fr;
        grid-template-rows:auto 1fr auto;
        height:auto;
        min-height:100vh;
      }

      .sidebar{
        grid-row:auto;
        flex-direction:row;
        overflow-x:auto;
        border-right:0;
        border-bottom:1px solid rgba(255,255,255,.10);
      }

      .brand,.search,.nav{ flex:0 0 auto; }
      .nav{ display:flex; }

      .main{
        padding:30px 24px;
      }

      .folder-grid{
        grid-template-columns:repeat(3,minmax(160px,1fr));
        gap:48px 28px;
      }

      .bottom-player{
        grid-column:auto;
        grid-template-columns:1fr;
      }

      .tools{
        justify-self:center;
      }
    }

    @media(max-width:720px){
      .folder-grid{
        grid-template-columns:repeat(2,minmax(140px,1fr));
        gap:36px 18px;
      }

      .folder-img{
        width:180px;
      }
    }

    @media(max-width:460px){
      .folder-grid{
        grid-template-columns:1fr;
      }
    }
  </style>

<style id="saybon-glass-folder-override">
/* ==========================================
   SAYBON MUSIC — TRANSPARENT GLASS FOLDER EFFECT
   Keeps existing PNG folder shape/images
========================================== */

.folder-link{
  position:relative !important;
  isolation:isolate !important;
}

.folder-img{
  position:relative !important;
  z-index:2 !important;

  /* glass transformation */
  opacity:.72 !important;
  filter:
    brightness(1.22)
    contrast(.82)
    saturate(.58)
    drop-shadow(0 26px 32px rgba(0,0,0,.62))
    drop-shadow(0 0 18px rgba(255,255,255,.14)) !important;

  mix-blend-mode:screen !important;
  transform:translateZ(0) !important;
}

/* soft glass glow behind each folder */
.folder-link::before{
  content:"" !important;
  position:absolute !important;
  z-index:0 !important;
  width:82% !important;
  height:72% !important;
  top:8% !important;
  left:9% !important;
  border-radius:28px !important;
  background:
    radial-gradient(circle at 28% 18%, rgba(255,255,255,.36), transparent 28%),
    radial-gradient(circle at 80% 80%, rgba(255,214,140,.18), transparent 34%),
    rgba(255,255,255,.045) !important;
  border:1px solid rgba(255,255,255,.18) !important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.28),
    inset 0 -18px 35px rgba(0,0,0,.18),
    0 20px 48px rgba(0,0,0,.36) !important;
  backdrop-filter:blur(16px) saturate(125%) !important;
  opacity:.82 !important;
  pointer-events:none !important;
}

/* diagonal highlight sweep */
.folder-link::after{
  content:"" !important;
  position:absolute !important;
  z-index:3 !important;
  width:62% !important;
  height:42% !important;
  top:10% !important;
  left:6% !important;
  border-radius:28px !important;
  background:linear-gradient(
    135deg,
    rgba(255,255,255,.38) 0%,
    rgba(255,255,255,.14) 26%,
    rgba(255,255,255,0) 58%
  ) !important;
  filter:blur(.4px) !important;
  opacity:.55 !important;
  pointer-events:none !important;
  transform:rotate(-4deg) !important;
}

/* hover should feel like floating glass */
.folder-link:hover .folder-img{
  opacity:.84 !important;
  filter:
    brightness(1.35)
    contrast(.88)
    saturate(.72)
    drop-shadow(0 38px 42px rgba(0,0,0,.70))
    drop-shadow(0 0 26px rgba(255,226,160,.26)) !important;
}

.folder-link:hover::before{
  opacity:1 !important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.36),
    inset 0 -20px 38px rgba(0,0,0,.20),
    0 30px 64px rgba(0,0,0,.45),
    0 0 28px rgba(255,226,160,.12) !important;
}

.folder-name{
  color:rgba(255,247,223,.92) !important;
  text-shadow:0 10px 24px rgba(0,0,0,.70) !important;
}
</style>

  <script>
    const folders = document.querySelectorAll(".folder-link");
    const overlay = document.getElementById("videoOverlay");
    const player = document.getElementById("videoPlayer");
    const title = document.getElementById("videoTitle");
    const closeVideo = document.getElementById("closeVideo");

    folders.forEach(folder => {
      folder.addEventListener("click", event => {
        event.preventDefault();

        const video = folder.dataset.video;
        const name = folder.dataset.title;

        if (!video) {
          alert(name + " lyric videos are coming soon.");
          return;
        }

        title.textContent = name + " Lyric Video";
        player.src = video;
        overlay.classList.add("active");
        player.play();
      });
    });

    closeVideo.addEventListener("click", () => {
      player.pause();
      player.removeAttribute("src");
      player.load();
      overlay.classList.remove("active");
    });

    overlay.addEventListener("click", event => {
      if (event.target === overlay) {
        player.pause();
        player.removeAttribute("src");
        player.load();
        overlay.classList.remove("active");
      }
    });
  </script>
</body>
</html>
