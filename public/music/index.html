<!DOCTYPE html>
<html lang="en">

<head>
<script type='module' src='/js/auth-guard.js'></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SayBon Music</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">

<style>

*{ box-sizing:border-box; }

*::-webkit-scrollbar{ width:10px; height:10px; }
*::-webkit-scrollbar-track{ background:rgba(255,255,255,.04); border-radius:10px; }
*::-webkit-scrollbar-thumb{ background:linear-gradient(180deg, #C9A0A5, #8B5A5F); border-radius:10px; border:2px solid #0A0607; background-clip:padding-box; }

html{ overflow-x:hidden; }

body{
margin:0;
font-family:'Inter', system-ui, sans-serif;
color:#E8DCDA;
background:#0A0607;
overflow-x:hidden;
scrollbar-width:thin;
scrollbar-color:#C9A0A5 rgba(255,255,255,.04);
}

.topbar{
position:fixed; top:0; left:0; right:0; height:60px; z-index:100;
background:rgba(10,6,7,.96); backdrop-filter:blur(16px); border-bottom:1px solid rgba(255,255,255,.08);
display:flex; align-items:center; padding:0 18px; gap:16px;
}
.topbar-logo{ font-size:16px; font-weight:700; color:#fff; display:flex; align-items:center; gap:8px; cursor:pointer; flex:0 0 auto; white-space:nowrap; }
.topbar-logo svg{ color:#C9A0A5; flex:0 0 auto; }
.search-wrap{ flex:1; max-width:560px; margin:0 auto; display:flex; }
.search-wrap input{
flex:1; padding:9px 16px; border-radius:20px 0 0 20px; border:1px solid rgba(255,255,255,.15); border-right:none;
background:rgba(255,255,255,.05); color:#fff; font-size:12.5px; font-family:inherit; min-width:0;
}
.search-wrap input:focus{ outline:none; }
.search-wrap button{
padding:9px 16px; border-radius:0 20px 20px 0; border:1px solid rgba(255,255,255,.15);
background:rgba(255,255,255,.08); color:#C9A0A5; cursor:pointer; flex:0 0 auto;
}
.topbar-right{ display:flex; gap:8px; flex:0 0 auto; }
.topbar-icon-btn{
width:36px; height:36px; border-radius:50%; border:none; background:rgba(255,255,255,.06);
display:flex; align-items:center; justify-content:center; cursor:pointer; color:#fff;
}
.topbar-icon-btn:hover{ background:rgba(255,255,255,.12); }

.sidebar{
position:fixed; top:60px; left:0; bottom:0; width:220px; overflow-y:auto;
background:#0A0607; border-right:1px solid rgba(255,255,255,.06); padding:14px 0; z-index:90;
}
.sb-item{
display:flex; align-items:center; gap:14px; padding:11px 20px; cursor:pointer; font-size:13px; color:#C9A0A5;
}
.sb-item:hover{ background:rgba(255,255,255,.05); }
.sb-item.active{ background:rgba(183,110,121,.15); color:#fff; font-weight:600; }
.sb-item svg{ width:17px; height:17px; flex:0 0 auto; }
.sb-section-label{ font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:#5c4b4e; padding:16px 20px 8px; }
.sb-divider{ height:1px; background:rgba(255,255,255,.06); margin:10px 0; }

.main-content{ margin-left:220px; margin-top:60px; padding:22px 26px 60px; }

@media (max-width:860px){
  .sidebar{ display:none; }
  .main-content{ margin-left:0; }
  .search-wrap{ max-width:220px; }
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
gap:18px 16px;
}

.video-card{ cursor:pointer; }
.thumb{ width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:12px; background:rgba(255,255,255,.05); }

.card-info{ display:flex; gap:10px; margin-top:9px; }
.channel-avatar{
width:34px; height:34px; border-radius:50%; flex:0 0 auto; background:rgba(183,110,121,.25);
display:flex; align-items:center; justify-content:center; color:#C9A0A5;
}
.channel-avatar svg{ width:17px; height:17px; }
.card-title{ font-size:13px; font-weight:650; color:#fff; line-height:1.35; margin-bottom:3px; }
.card-channel{ font-size:11.5px; color:#9C8589; }
.card-meta{ font-size:11px; color:#786367; }

.empty-state{ text-align:center; padding:60px 20px; color:#786367; font-size:13px; grid-column:1/-1; }

.section-title{ font-size:16px; font-weight:700; color:#fff; margin-bottom:16px; }

</style>
</head>

<body>

<div class="topbar">
<div class="topbar-logo" onclick="location.href='/music/index.html'">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
SayBon Music
</div>
<div class="search-wrap">
<input type="text" id="searchInput" placeholder="Search titles or artists" />
<button onclick="searchVideos()">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
</button>
</div>
<div class="topbar-right">
<button class="topbar-icon-btn" onclick="location.href='/dashboard/'" aria-label="Dashboard">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
</button>
</div>
</div>

<div class="sidebar" id="sidebar">
<div class="sb-item active" id="sb-home" onclick="selectGenre(''All'')">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 12 9-9 9 9M5 10v10h14V10"/></svg>
Home
</div>
<div class="sb-item" onclick="location.href=''/music/playlists.html''">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15V6M18.5 18a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0zM12.5 20.5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0zM9.5 6.5v14M21 6l-11.5.5"/></svg>
My Playlists
</div>
<div class="sb-divider"></div>
<div class="sb-section-label">Genres</div>
<div id="genreItems"></div>
</div>

<div class="main-content">

<div class="section-title" id="sectionTitle">Recommended</div>

<div class="grid" id="videoGrid"></div>

</div>

<script>

const API_BASE = "https://saybonapp-server.onrender.com";
const genres = ["Afro","Latin","Soul","Pop","Jazz","Country","Reggae","Classical"];

let currentGenre = "All";
let allVideos = [];

const genreItemsEl = document.getElementById("genreItems");

genres.forEach(g => {
  const item = document.createElement("div");
  item.className = "sb-item";
  item.id = "sb-genre-" + g;
  item.innerHTML =
    "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><path d='M9 18V5l12-2v13'/><circle cx='6' cy='18' r='3'/><circle cx='18' cy='16' r='3'/></svg>" + g;
  item.onclick = () => selectGenre(g);
  genreItemsEl.appendChild(item);
});

function selectGenre(genre){
  currentGenre = genre;
  document.querySelectorAll(".sb-item").forEach(i => i.classList.remove("active"));
  if(genre === "All"){
    document.getElementById("sb-home").classList.add("active");
    document.getElementById("sectionTitle").innerText = "Recommended";
  }else{
    document.getElementById("sb-genre-" + genre).classList.add("active");
    document.getElementById("sectionTitle").innerText = genre;
  }
  loadVideos();
}
window.selectGenre = selectGenre;

function renderGrid(videos){

  const grid = document.getElementById("videoGrid");

  if(!videos.length){
    grid.innerHTML = "<div class='empty-state'>No videos here yet — check back soon.</div>";
    return;
  }

  grid.innerHTML = "";

  videos.forEach(v => {
    const card = document.createElement("div");
    card.className = "video-card";
    card.onclick = () => location.href = "/music/watch.html?v=" + v.id;
    card.innerHTML =
      "<img class='thumb' src='https://img.youtube.com/vi/" + v.youtubeId + "/hqdefault.jpg' loading='lazy'>" +
      "<div class='card-info'>" +
        "<div class='channel-avatar'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><path d='M9 18V5l12-2v13'/><circle cx='6' cy='18' r='3'/><circle cx='18' cy='16' r='3'/></svg></div>" +
        "<div>" +
          "<div class='card-title'>" + v.title + "</div>" +
          "<div class='card-channel'>" + (v.artist || "SayBon Music") + "</div>" +
          "<div class='card-meta'>" + v.views + " views · " + v.genre + "</div>" +
        "</div>" +
      "</div>";
    grid.appendChild(card);
  });

}

async function loadVideos(){

  document.getElementById("videoGrid").innerHTML = "<div class='empty-state'>Loading…</div>";

  try{
    const url = API_BASE + "/api/musicVideos" + (currentGenre !== "All" ? "?genre=" + encodeURIComponent(currentGenre) : "");
    const res = await fetch(url);
    allVideos = await res.json();
    renderGrid(allVideos);
  }catch(err){
    document.getElementById("videoGrid").innerHTML = "<div class='empty-state'>Could not load videos.</div>";
  }

}

window.searchVideos = function(){

  const q = document.getElementById("searchInput").value.trim().toLowerCase();

  if(!q){
    renderGrid(allVideos);
    document.getElementById("sectionTitle").innerText = currentGenre === "All" ? "Recommended" : currentGenre;
    return;
  }

  document.getElementById("sectionTitle").innerText = "Search results";
  const filtered = allVideos.filter(v =>
    v.title.toLowerCase().includes(q) || (v.artist||"").toLowerCase().includes(q)
  );
  renderGrid(filtered);

}

document.getElementById("searchInput").addEventListener("keydown", (e) => {
  if(e.key === "Enter") searchVideos();
});

loadVideos();

</script>

</body>
</html>
