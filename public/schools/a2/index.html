<script type="module">
import { schoolsReady } from "/schools/schools-guard.js";
const API_BASE = "https://saybonapp-server.onrender.com";
const LEVEL = "schools-a2";

function applyUnlocks(max){
  document.querySelectorAll(".sc-lesson").forEach(function(btn){
    var num = parseInt(btn.querySelector(".sc-num").textContent);
    if (num <= max){
      btn.classList.remove("locked"); btn.classList.add("unlocked");
      var lock = btn.querySelector(".sc-lock"); if (lock) lock.style.display = "none";
      btn.onclick = function(){ window.location.href = "lesson" + num + ".html"; };
    }
  });
}

schoolsReady.then(function(s){
  if (s.admin){ applyUnlocks(25); return; }
  fetch(API_BASE + "/api/levelProgress?uid=" + s.user.uid + "&level=" + LEVEL)
    .then(function(r){ return r.json(); })
    .then(function(d){ var c = d.completedLessons || []; applyUnlocks((c.length ? Math.max.apply(null, c) : 0) + 1); })
    .catch(function(){ applyUnlocks(1); });
});
</script>
