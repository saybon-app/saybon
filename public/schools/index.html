<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>French for Schools - SayBon</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=optional" rel="stylesheet">
<style>
  html,body{margin:0;min-height:100%;background:#10303e;font-family:"Nunito",system-ui,sans-serif;color:#fff}
  main{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
  .box{max-width:460px;padding:36px 28px;border-radius:30px;background:linear-gradient(135deg,#90674a,#82593e);border:1.5px solid rgba(255,255,255,.3);box-shadow:0 18px 40px rgba(0,0,0,.35)}
  img{width:150px;height:auto;margin-bottom:8px}
  h1{margin:0 0 8px;font-size:30px;font-weight:900}
  p{margin:0 0 22px;font-weight:600;line-height:1.4;opacity:.92}
  a{display:inline-block;padding:12px 22px;border-radius:999px;background:#fff;color:#2a3a32;font-weight:800;text-decoration:none}
</style>
</head>
<body>
<main>
  <div class="box">
    <img src="/assets/dashboard/icons/icon-schools.png" alt="">
    <h1>French for Schools</h1>
    <p>Tailor made for Preschools, and primary and junior high schools. This area is coming soon.</p>
    <a href="/dashboard/">Back to dashboard</a>
  </div>
</main>
</body>
</html>
