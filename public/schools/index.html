<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>C'est bon for Schools - SayBon</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/schools/schools.css?v=1" />
  <script type="module">
    import { schoolsReady } from "/schools/schools-guard.js";
    schoolsReady.then(function(s){ if (s.admin) document.getElementById("scAdmin").hidden = false; });
  </script>
</head>
<body>
  <button class="sc-corner sc-back" onclick="window.location.href='/dashboard/'" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
  <button class="sc-corner sc-dash" onclick="window.location.href='/dashboard/'" aria-label="Dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect></svg></button>
  <div class="sc-stage">
    <header class="sc-head">
      <p class="sc-eyebrow">C'est bon for Schools</p>
      <h1>Choose a Level</h1>
      <p class="sc-sub">French for preschools and primary schools, one level at a time.</p>
      <span class="sc-admin" id="scAdmin" hidden>ADMIN ACCESS &middot; EVERYTHING OPEN</span>
    </header>
    <main class="sc-levels">
    <a class="sc-tile" style="--c:#CF3A59" href="/schools/a0/"><b>A0</b><span>Absolute Beginner</span><small>25 lessons</small></a>
    <a class="sc-tile" style="--c:#09847D" href="/schools/a1/"><b>A1</b><span>Beginner</span><small>25 lessons</small></a>
    <a class="sc-tile" style="--c:#D14E36" href="/schools/a2/"><b>A2</b><span>Elementary</span><small>25 lessons</small></a>
    <a class="sc-tile" style="--c:#12805A" href="/schools/b1/"><b>B1</b><span>Intermediate</span><small>25 lessons</small></a>
    <a class="sc-tile" style="--c:#923A7A" href="/schools/b2/"><b>B2</b><span>Upper Intermediate</span><small>25 lessons</small></a>
    </main>
  </div>
</body>
</html>
